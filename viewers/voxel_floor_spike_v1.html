<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>복셀 바닥 스파이크 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#e0c070; color:#f5e6c0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="voxBtn">복셀 크기: 0.31</button>
  <button class="btn" id="lvlBtn">단수: 6</button>
  <button class="btn" id="refBtn">참조 물체</button>
  <button class="btn" id="nrmBtn">노멀 버퍼</button>
  <button class="btn" id="actBtn">스튜디오</button>
    <button class="btn" id="gridBtn">그리드</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  복셀 바닥 스파이크 — 던전 바닥을 프래그먼트 레이마칭으로 복셀 디스플레이스먼트한다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);

}
function vxNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = vxHash(ix, iz), b = vxHash(ix + 1, iz);
  const c = vxHash(ix, iz + 1), d = vxHash(ix + 1, iz + 1);
  return (a * (1 - ux) + b * ux) * (1 - uz) + (c * (1 - ux) + d * ux) * uz;
}
let voxTex = null, voxHeights = null, voxGW = 0, voxOX = 0, voxCell = 0, voxStep = 0, voxMaxH = 0;
function buildHeightField() {
  const cell = VOX_CELLS[voxCellIdx], levels = VOX_LEVELS[voxLevelIdx];
  const gw = Math.round(VOX_EXTENT / cell);
  const data = new Uint8Array(gw * gw * 4);
  const hs = new Float32Array(gw * gw);
  const ox = -gw * cell / 2;
  for (let j = 0; j < gw; j++) for (let i = 0; i < gw; i++) {
    const wx = ox + (i + 0.5) * cell, wz = ox + (j + 0.5) * cell;
    let n = 0.55 * vxNoise(wx / 9.0, wz / 9.0)
          + 0.30 * vxNoise(wx / 3.6, wz / 3.6)
          + 0.15 * vxNoise(wx / 1.4, wz / 1.4);
    // 한가운데는 평평하게 — 참조 물체가 설 자리이자 '평지 대비 굴곡'을 보는 기준이다
    const r = Math.hypot(wx, wz);
    const flat = 1 - Math.min(1, Math.max(0, (r - 3.0) / 3.0));
    n = n * (1 - flat) + 0.42 * flat;
    // 단수: 1 이상으로 둔다. 0 을 허용하면 그 칸에 기둥이 없어 바닥에 구멍이 뚫린다.
    const lv = Math.max(1, Math.min(levels, 1 + Math.floor(n * levels)));
    const k = j * gw + i;
    data[k * 4] = lv;
    hs[k] = lv * cell;
  }
  if (voxTex) voxTex.dispose();
  voxTex = new THREE.DataTexture(data, gw, gw, THREE.RGBAFormat);
  voxTex.magFilter = THREE.NearestFilter; voxTex.minFilter = THREE.NearestFilter;
  voxTex.wrapS = voxTex.wrapT = THREE.ClampToEdgeWrapping;
  voxTex.generateMipmaps = false; voxTex.needsUpdate = true;
  voxHeights = hs; voxGW = gw; voxOX = ox; voxCell = cell;
  voxStep = cell;                 // 정육면체 복셀 — 칸 크기와 단 높이가 같다
  voxMaxH = levels * cell;

// 참조 물체를 앉히는 데 쓴다(게임의 groundHeightAt 과 같은 역할)
function voxGroundAt(wx, wz) {
  const i = Math.max(0, Math.min(voxGW - 1, Math.floor((wx - voxOX) / voxCell)));
  const j = Math.max(0, Math.min(voxGW - 1, Math.floor((wz - voxOX) / voxCell)));
  return voxHeights[j * voxGW + i];
}

// ---------- 공용 GLSL: 높이장 DDA ----------
// Amanatides & Woo 의 2D DDA 를 XZ 격자에 돌린다. 기둥은 전부 y=0 에서 시작하므로
// 셀마다 '진입 시점의 y 가 기둥 높이 이하인가'(옆면) → '내려가다 윗면을 지나는가'(윗면) 두 가지만 본다.
// 슬래브가 얇아서(단수×칸) 시선이 몇 칸 안에 반드시 무언가를 맞는다 — 그래서 반복 수가 적다.
const VOX_GLSL = `
uniform sampler2D tVoxH;
uniform vec2 uVoxGrid;
uniform vec2 uVoxOrigin;
uniform float uVoxCell;
uniform float uVoxStep;
uniform float uVoxMaxH;
uniform float uVoxSideDim;
uniform vec3 uVoxPal0;
uniform vec3 uVoxPal1;
uniform vec3 uVoxPal2;
uniform mat4 projectionMatrix;
varying vec3 vVoxWorld;
vec3 vxView, vxNormal, vxWorldHit, vxWorldNrm, vxColor;

float vxColH(ivec2 c) {
  return floor(texture2D(tVoxH, (vec2(c) + 0.5) / uVoxGrid).r * 255.0 + 0.5) * uVoxStep;
}
bool vxOut(ivec2 c) {
  return c.x < 0 || c.y < 0 || float(c.x) >= uVoxGrid.x || float(c.y) >= uVoxGrid.y;
}
bool vxTrace(vec3 ro, vec3 rd, out vec3 hp, out vec3 hn, out ivec2 hc, out float hh) {
  vec3 bmin = vec3(uVoxOrigin.x, 0.0, uVoxOrigin.y);
  vec3 bmax = vec3(uVoxOrigin.x + uVoxGrid.x * uVoxCell, uVoxMaxH, uVoxOrigin.y + uVoxGrid.y * uVoxCell);
  // 0 으로 나누면 0*inf 가 NaN 이 된다 — 축에 정확히 평행한 시선에서 실제로 걸린다
  vec3 rs = vec3(abs(rd.x) < 1e-6 ? 1e-6 : rd.x, abs(rd.y) < 1e-6 ? 1e-6 : rd.y, abs(rd.z) < 1e-6 ? 1e-6 : rd.z);
  vec3 ta = (bmin - ro) / rs, tb = (bmax - ro) / rs;
  vec3 tn = min(ta, tb), tf = max(ta, tb);
  float t0 = max(max(tn.x, tn.y), tn.z);
  float tE = min(min(tf.x, tf.y), tf.z);
  if (tE < max(t0, 0.0)) return false;
  vec3 nEnter;
  if (t0 > 0.0) {
    if (tn.x > tn.y && tn.x > tn.z) nEnter = vec3(-sign(rs.x), 0.0, 0.0);
    else if (tn.y > tn.z) nEnter = vec3(0.0, -sign(rs.y), 0.0);
    else nEnter = vec3(0.0, 0.0, -sign(rs.z));
  } else { t0 = 0.0; nEnter = -rd; }
  float tCur = t0 + 1e-4;
  vec2 pxz = ro.xz + rs.xz * tCur;
  ivec2 c = ivec2(floor((pxz - uVoxOrigin) / uVoxCell));
  if (vxOut(c)) return false;
  vec2 sgn = vec2(rs.x >= 0.0 ? 1.0 : -1.0, rs.z >= 0.0 ? 1.0 : -1.0);
  vec2 cellMin = uVoxOrigin + vec2(c) * uVoxCell;
  vec2 tMax = (cellMin + max(sgn, vec2(0.0)) * uVoxCell - ro.xz) / rs.xz;
  vec2 tDel = abs(vec2(uVoxCell) / rs.xz);
  for (int k = 0; k < 160; k++) {
    float h = vxColH(c);
    float yIn = ro.y + rs.y * tCur;
    float tOut = min(min(tMax.x, tMax.y), tE);
    if (yIn <= h + 1e-4) { hp = ro + rs * tCur; hn = nEnter; hc = c; hh = h; return true; }
    if (rs.y < 0.0) {
      float th = (h - ro.y) / rs.y;
      if (th <= tOut) { hp = ro + rs * th; hp.y = h; hn = vec3(0.0, 1.0, 0.0); hc = c; hh = h; return true; }
    }
    if (tOut >= tE - 1e-6) return false;
    if (tMax.x < tMax.y) { tCur = tMax.x; tMax.x += tDel.x; c.x += int(sgn.x); nEnter = vec3(-sgn.x, 0.0, 0.0); }
    else                 { tCur = tMax.y; tMax.y += tDel.y; c.y += int(sgn.y); nEnter = vec3(0.0, 0.0, -sgn.y); }
    if (vxOut(c)) return false;
  }
  return false;
}
// 칸마다 색을 흔든다. 평평한 판은 음영이 한 톤이라 종이처럼 보인다(v762 에서 같은 이유로 넣었다).
// 게임 바닥은 3색 팔레트 × 석판 텍스처로 반복감을 없애는데, 여기서는 칸이 텍셀만큼 작아서
// 칸 단위 팔레트 추첨만으로 같은 역할을 한다(화면에서 칸 하나가 7픽셀 남짓이다).
// 옆면은 반드시 눌러야 단이 읽힌다 — 이 조명은 위에서 와서 그냥 두면 윗면과 구분이 안 된다.
vec3 vxShade(ivec2 c, float h, vec3 n) {
  float hs = fract(sin(float(c.x) * 127.1 + float(c.y) * 311.7) * 43758.5453);
  vec3 base = hs < 0.34 ? uVoxPal0 : (hs < 0.67 ? uVoxPal1 : uVoxPal2);
  float t = 0.88 + fract(hs * 17.0) * 0.24;
  t *= 0.92 + 0.04 * (h / uVoxStep);
  if (n.y < 0.5) t *= uVoxSideDim;
  return base * t;
}
`;

// 레이마칭 결과를 표준 파이프라인에 얹는 머리말.
// vViewPosition·fogDepth 는 varying 이라 프래그먼트에서 못 고친다 — 그래서 아래 patchStandard 가
// 그 varying 을 쓰는 청크만 인라인해서 vxView 로 갈아 끼운다.
const VOX_MAIN = `
  vec3 vxRd = normalize(vVoxWorld - cameraPosition);
  vec3 vxHP, vxHN; ivec2 vxHC; float vxHH;
  if (!vxTrace(cameraPosition, vxRd, vxHP, vxHN, vxHC, vxHH)) discard;
  vec4 vxClip = projectionMatrix * viewMatrix * vec4(vxHP, 1.0);
  gl_FragDepthEXT = vxClip.z / vxClip.w * 0.5 + 0.5;
  vxWorldHit = vxHP; vxWorldNrm = vxHN;
  vxView = -(viewMatrix * vec4(vxHP, 1.0)).xyz;
  vxNormal = normalize(mat3(viewMatrix) * vxHN);
  vxColor = vxShade(vxHC, vxHH, vxHN);
`;

// ---------- 색 패스: MeshStandardMaterial 을 그대로 쓴다 ----------
// 조명·톤매핑·안개·그림자·ShaderChunk 개조(?dspec/?drough/?spec)를 전부 물려받으려면
// 셰이더를 새로 짜는 게 아니라 표준 재질에 얹어야 한다. 새로 짜면 그 순간 뷰어가 거짓말을 한다.
function vxInline(src, name, fn) {
  return src.replace('#include <' + name + '>', fn(THREE.ShaderChunk[name]));
}
function patchStandard(shader) {
  Object.assign(shader.uniforms, voxUniforms);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vVoxWorld;')
    .replace('#include <project_vertex>', '#include <project_vertex>\n\tvVoxWorld = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
  let f = shader.fragmentShader;
  f = f.replace('#include <common>', '#include <common>\n' + VOX_GLSL);
  // 노멀은 지오메트리(프록시 상자)가 아니라 맞은 면의 것을 쓴다
  f = vxInline(f, 'normal_fragment_begin', () => 'vec3 normal = vxNormal;\nvec3 geometryNormal = normal;');
  // 그림자 좌표도 정점에서 넘어온 것(프록시 상자 표면)이 아니라 맞은 지점에서 다시 만든다.
  // 안 그러면 참조 물체 그림자가 몇 유닛 어긋나 찍힌다.
  f = vxInline(f, 'lights_fragment_begin', s => s
    .replace(/vViewPosition/g, 'vxView')
    .replace(/vDirectionalShadowCoord\[ i \]/g, '( directionalShadowMatrix[ i ] * vec4( vxWorldHit + vxWorldNrm * directionalLightShadows[ i ].shadowNormalBias, 1.0 ) )')
    .replace(/vSpotShadowCoord\[ i \]/g, '( spotShadowMatrix[ i ] * vec4( vxWorldHit + vxWorldNrm * spotLightShadows[ i ].shadowNormalBias, 1.0 ) )')
    .replace(/vPointShadowCoord\[ i \]/g, '( pointShadowMatrix[ i ] * vec4( vxWorldHit + vxWorldNrm * pointLightShadows[ i ].shadowNormalBias, 1.0 ) )'));
  f = vxInline(f, 'lights_fragment_end', s => s.replace(/vViewPosition/g, 'vxView'));
  f = vxInline(f, 'fog_fragment', s => s.replace(/fogDepth/g, 'vxView.z'));
  // 그림자 행렬은 원래 정점 셰이더에만 선언돼 있다. 유니폼은 프로그램 공용이라 여기 다시 선언해도 된다.
  f = f.replace('#include <shadowmap_pars_fragment>', `#include <shadowmap_pars_fragment>
#ifdef USE_SHADOWMAP
  #if NUM_DIR_LIGHT_SHADOWS > 0
    uniform mat4 directionalShadowMatrix[ NUM_DIR_LIGHT_SHADOWS ];
  #endif
  #if NUM_SPOT_LIGHT_SHADOWS > 0
    uniform mat4 spotShadowMatrix[ NUM_SPOT_LIGHT_SHADOWS ];
  #endif
  #if NUM_POINT_LIGHT_SHADOWS > 0
    uniform mat4 pointShadowMatrix[ NUM_POINT_LIGHT_SHADOWS ];
  #endif
#endif`);
  f = f.replace('void main() {', 'void main() {\n' + VOX_MAIN);
  f = f.replace('#include <color_fragment>', '#include <color_fragment>\n\tdiffuseColor.rgb *= vxColor;');
  shader.fragmentShader = f;
}

const voxUniforms = {
  tVoxH: { value: voxTex },
  uVoxGrid: { value: new THREE.Vector2(voxGW, voxGW) },
  uVoxOrigin: { value: new THREE.Vector2(voxOX, voxOX) },
  uVoxCell: { value: voxCell },
  uVoxStep: { value: voxStep },
  uVoxMaxH: { value: voxMaxH },
  uVoxSideDim: { value: VOX_SIDE_DIM },
  uVoxPal0: { value: new THREE.Color(0x2a2417) },
  uVoxPal1: { value: new THREE.Color(0x322b1a) },
  uVoxPal2: { value: new THREE.Color(0x262112) },
};
// 게임 index.html 의 막별 바닥 재질 색 그대로.
// 1막 흙바닥(floorMat/floorMat2) · 2막 CAS.floor 3색 · 3막 COR.floor 3색 × COR_LIT(0.62).
// 뷰어 원판(discMat)의 어두운 색을 그대로 쓰면 안 된다 — 그건 캐릭터 뒤 배경으로 쓰려고
// 텍스처·AO 가 없는 원판에 맞춰 역산한 값이라, 바닥 자체를 판단하는 이 스파이크에서는 거짓말이 된다.
const VOX_PALETTES = [
  [0x2a2417, 0x322b1a, 0x262112],                       // 스튜디오 — 1막과 같게
  [0x2a2417, 0x322b1a, 0x262112],                       // 1막 흙바닥
  [0x30343b, 0x2a2e34, 0x232730],                       // 2막 성 석판
  [0x726c59, 0x686151, 0x565245],                       // 3막 아이보리 석판 × COR_LIT(0.62)
];
function applyVoxPalette(i) {
  const p = VOX_PALETTES[i] || VOX_PALETTES[0];
  voxUniforms.uVoxPal0.value.setHex(p[0]);
  voxUniforms.uVoxPal1.value.setHex(p[1]);
  voxUniforms.uVoxPal2.value.setHex(p[2]);
}

const voxColorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, metalness: 0.0 });
voxColorMat.onBeforeCompile = patchStandard;
// 프로그램 캐시 키에 onBeforeCompile 결과가 안 들어간다 — 같은 파라미터의 표준 재질과
// 프로그램을 공유하지 않도록 키를 따로 준다(three 가 customProgramCacheKey 를 본다).
voxColorMat.customProgramCacheKey = () => 'voxfloor';

// ---------- 노멀 패스용 재질 ----------
// 게임 노멀 버퍼 규약: RGB = 뷰 공간 노멀(0.5 중심), 알파 = 검은 외곽선 스위치(0.5 이상이면 그린다).
// MeshNormalMaterial 로 그리면 프록시 상자의 면 노멀만 찍혀 외곽선이 복셀 형상과 어긋난다.
const voxNormalMat = new THREE.ShaderMaterial({
  uniforms: voxUniforms,
  vertexShader: `
    varying vec3 vVoxWorld;
    void main() {
      vVoxWorld = ( modelMatrix * vec4( position, 1.0 ) ).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }`,
  fragmentShader: VOX_GLSL.replace('varying vec3 vVoxWorld;', 'varying vec3 vVoxWorld;') + `
    void main() {
      vec3 rd = normalize(vVoxWorld - cameraPosition);
      vec3 hp, hn; ivec2 hc; float hh;
      if (!vxTrace(cameraPosition, rd, hp, hn, hc, hh)) discard;
      vec4 clip = projectionMatrix * viewMatrix * vec4(hp, 1.0);
      gl_FragDepthEXT = clip.z / clip.w * 0.5 + 0.5;
      vec3 n = normalize(mat3(viewMatrix) * hn);
      gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
    }`,
  side: THREE.DoubleSide,
});

// ---------- 프록시 상자 ----------
const VOX_LAYER = 2;   // 노멀 패스에서 복셀만 따로 그리기 위한 레이어(피부 표식 패스와 같은 요령)
let voxMesh = null;
function buildVoxMesh() {
  if (voxMesh) { scene.remove(voxMesh); voxMesh.geometry.dispose(); }
  const w = voxGW * voxCell;
  const geo = new THREE.BoxGeometry(w, voxMaxH, w);
  voxMesh = new THREE.Mesh(geo, voxColorMat);
  voxMesh.position.y = voxMaxH / 2;
  voxMesh.receiveShadow = true; voxMesh.castShadow = false;
  voxMesh.frustumCulled = false;
  voxMesh.material.side = THREE.DoubleSide;
  voxMesh.layers.enable(VOX_LAYER);          // 레이어 0 은 그대로 — 색 패스에 남는다
  voxMesh.userData.fx = true;                // 1패스(overrideMaterial)에서는 빼고 전용 패스로 그린다
  scene.add(voxMesh);
}
buildVoxMesh();
applyVoxPalette(actIdx);

// 노멀 패스 훅 — renderNormalPass 가 1패스 뒤에 부른다(위 정의 참고)
function voxNormalPass(sceneToRender) {
  if (!voxMesh || !voxMesh.visible) return;
  const prevOverride = sceneToRender.overrideMaterial;
  const prevBg = sceneToRender.background;
  const prevAuto = renderer.autoClear;
  const prevMask = camera.layers.mask;
  // scene.background 가 Color 면 three 가 autoClear 와 무관하게 강제 clear 한다 — 1패스 결과가 통째로 날아간다
  sceneToRender.overrideMaterial = null;
  sceneToRender.background = null;
  renderer.autoClear = false;
  camera.layers.set(VOX_LAYER);
  voxMesh.material = voxNormalMat;
  renderer.render(sceneToRender, camera);
  voxMesh.material = voxColorMat;
  camera.layers.mask = prevMask;
  renderer.autoClear = prevAuto;
  sceneToRender.background = prevBg;
  sceneToRender.overrideMaterial = prevOverride;
}

function rebuildVoxels() {
  buildHeightField();
  voxUniforms.tVoxH.value = voxTex;
  voxUniforms.uVoxGrid.value.set(voxGW, voxGW);
  voxUniforms.uVoxOrigin.value.set(voxOX, voxOX);
  voxUniforms.uVoxCell.value = voxCell;
  voxUniforms.uVoxStep.value = voxStep;
  voxUniforms.uVoxMaxH.value = voxMaxH;
  buildVoxMesh();
  placeRefs();
  updateVer();
}

// ---------- 참조 물체 ----------
// 깊이가 제대로 맞물리는지 보려면 바닥을 뚫고 들어가는 것, 위에 서는 것, 앞을 가리는 것이 다 필요하다.
const refGroup = new THREE.Group(); scene.add(refGroup);
const refItems = [];
function addRef(mesh, x, z, yOff) {
  mesh.castShadow = true; mesh.receiveShadow = true;
  refGroup.add(mesh); refItems.push({ mesh, x, z, yOff });
  return mesh;
}
// 플레이어 대역: 게임 캐릭터는 진짜 그림자를 안 지고 발밑 블롭을 쓴다 — 그 규칙대로 둔다
const dummy = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.30, 1.15, 8), getLowPolyMat(0x4a5a72));
  body.position.y = 0.58; dummy.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 1), getLowPolyMat(0xa88a72));
  head.position.y = 1.36; dummy.add(head);
  dummy.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = true; } });
  if (BLOB_ON) { const b = makeBlobShadow(1.1); dummy.add(b); }
}
refGroup.add(dummy);
refItems.push({ mesh: dummy, x: 0, z: 0, yOff: 0 });

addRef(new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.7, 1.3), getLowPolyMat(0x6b6250)), -2.6, 1.4, 0.85);
addRef(new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), getLowPolyMat(0x7a5f4a)), 2.4, -1.6, 0.0);   // 반쯤 파묻힌 바위 — 깊이 맞물림 확인용
addRef(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 3.2, 8), getLowPolyMat(0x5c5a54)), 1.2, 2.9, 1.6);
// 앞을 가리는 벽 — 복셀 바닥이 벽 뒤로 정상적으로 잘리는지 본다
addRef(new THREE.Mesh(new THREE.BoxGeometry(5.0, 3.0, 0.8), getLowPolyMat(0x585044)), 0.0, 4.6, 1.5);

function placeRefs() {
  for (const it of refItems) {
    const g = voxGroundAt(it.x, it.z);
    it.mesh.position.set(it.x, g + it.yOff, it.z);
  }
}
placeRefs();

// ---------- 노멀 버퍼 디버그 뷰 ----------
const dbgScene = new THREE.Scene();
const dbgMat = new THREE.MeshBasicMaterial({ map: rtNormal.texture });
dbgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), dbgMat));

// ===== 인터랙션 =====
let autoSpin = true, showNormal = false;
let frameMs = 0;

const verEl = document.getElementById('ver');
function updateVer() {
  const real = Math.abs(camZoom - 1) < 0.02;
  verEl.innerHTML = 'voxel_floor_spike ' + VIEWER_VERSION + (PX_MODE ? ' · px' + PX_FIXED_H : ' · px=0')
    + '<br>' + ACTS[actIdx].name + ' · 거리 ' + camDist.toFixed(1) + ' (게임과 동일)'
    + '<br>복셀 ' + voxCell.toFixed(3) + ' (타일 1/' + Math.round(TILE / voxCell) + ') · '
    + VOX_LEVELS[voxLevelIdx] + '단 · 최대 ' + voxMaxH.toFixed(2)
    + '<br>격자 ' + voxGW + '×' + voxGW + ' · 드로우콜 ' + renderer.info.render.calls
    + ' · 삼각형 ' + renderer.info.render.triangles
    + '<br>' + frameMs.toFixed(1) + 'ms/프레임'
    + '<br>' + camZoom.toFixed(1) + '× '
    + (real ? '<span style="color:#8ad08a">게임 실제 크기</span>' : '<span style="color:#d08a84">확대</span>');
}

let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 0.6, ZOOM_MAX = 12.0;   // 1.0 = 게임에서 실제로 보이는 픽셀 크기
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.01;
  camPitch = Math.max(0.15, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01));
  lastX = e.clientX; lastY = e.clientY; updateCam();
});
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015)));
  applyAdaptiveFOV(); updateVer();
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinching && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD))));
    pinchD = d; applyAdaptiveFOV(); updateVer();
  } else if (dragging && e.touches.length === 1) {
    const t = e.touches[0];
    camYaw -= (t.clientX - lastX) * 0.01;
    camPitch = Math.max(0.15, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01));
    lastX = t.clientX; lastY = t.clientY; updateCam();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });

// 버튼에 포커스가 남으면 브라우저가 그걸 보이게 하려고 문서를 스크롤해 캔버스가 밀린다.
for (const el of document.querySelectorAll('.btn')) {
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('click', () => { el.blur(); if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
}
document.getElementById('spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.target.textContent = '자동회전: ' + (autoSpin ? '켬' : '끔'); });
document.getElementById('voxBtn').addEventListener('click', e => {
  voxCellIdx = (voxCellIdx + 1) % VOX_CELLS.length; rebuildVoxels();
  e.target.textContent = '복셀 크기: ' + voxCell.toFixed(2);
});
document.getElementById('lvlBtn').addEventListener('click', e => {
  voxLevelIdx = (voxLevelIdx + 1) % VOX_LEVELS.length; rebuildVoxels();
  e.target.textContent = '단수: ' + VOX_LEVELS[voxLevelIdx];
});
document.getElementById('refBtn').addEventListener('click', e => {
  refGroup.visible = !refGroup.visible; e.target.classList.toggle('on', refGroup.visible);
});
document.getElementById('nrmBtn').addEventListener('click', e => {
  showNormal = !showNormal; e.target.classList.toggle('on', showNormal);
});
document.getElementById('actBtn').addEventListener('click', e => {
  actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); applyVoxPalette(actIdx); e.target.textContent = ACTS[actIdx].name; updateVer();
});
document.getElementById('gridBtn').addEventListener('click', e => { gridGroup.visible = !gridGroup.visible; e.target.classList.toggle('on', gridGroup.visible); });
document.getElementById('resetBtn').addEventListener('click', () => {
  camZoom = 1.0; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer();
});

function onResize() {
  applyAdaptiveFOV();
  renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH());
  lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH);
  // r128의 setSize는 depthTexture를 안 줄인다 — 손으로 맞추지 않으면 리사이즈 후 외곽선이 깨진다.
  rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH);
  bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH);
  quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  window.visualViewport.addEventListener('scroll', onResize);
}
if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
  document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
}

// 기본은 1막 · 게임 실제 크기(1.0×). 스튜디오 조명으로 보면 굴곡이 실제보다 잘 읽혀 오판한다.
camZoom = 1.0; applyAdaptiveFOV();
actIdx = 1; applyAct(actIdx); applyVoxPalette(actIdx); document.getElementById('actBtn').textContent = ACTS[actIdx].name;
document.getElementById('refBtn').classList.add('on');
document.getElementById('voxBtn').textContent = '복셀 크기: ' + voxCell.toFixed(2);
updateCam(); updateVer();

renderer.info.autoReset = false;   // 패스마다 리셋되면 합성 쿼드(콜 1·삼각형 2)만 남는다
const clock = new THREE.Clock();
const _msPx = new Uint8Array(4);
let verTick = 0;
function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  if (autoSpin) { camYaw += dt * 0.25; updateCam(); }
  const t0 = performance.now();
  renderer.info.reset();
  // 게임과 같은 렌더 경로: 픽셀 스냅 → 저해상도 색·깊이 → 노멀 패스 → 블룸 → 합성
  renderWithPost(scene);
  if (showNormal) { renderer.setRenderTarget(null); renderer.clear(); renderer.render(dbgScene, quadCam); }
  // WebGL 은 비동기라 여기서 그냥 시간을 재면 1~2ms 같은 거짓말이 나온다(gl.finish 도 안 막힌다).
  // 1픽셀만 읽어 GPU 를 강제로 동기화한다 — CLAUDE.md 의 포스트 비용 측정 규칙과 같은 방법이다.
  { const g = renderer.getContext(); g.readPixels(0, 0, 1, 1, g.RGBA, g.UNSIGNED_BYTE, _msPx); }
  frameMs += ((performance.now() - t0) - frameMs) * 0.1;
  verTick += dt;
  if (verTick > 0.5) { verTick = 0; updateVer(); }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
