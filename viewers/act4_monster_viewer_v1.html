<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4막 몬스터 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="typeBtn">고블린</button>
  <button class="btn" id="varBtn" style="display:none">일반</button>
  <button class="btn" id="cmpBtn">나란히(예전 · 새)</button>
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="atkBtn">공격</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  용병 — 마을 여관에서 고용하는 동료(v879). 몸은 게임과 같은 buildMercBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);

// ---------- 화염술사 ----------

    bodyGrp.position.y = -0.13 * crouchK + Math.sin(t * 55) * 0.012 * crouchK;
    bodyGrp.rotation.x = -0.1 * crouchK;
    fRx += 0.55 * crouchK; fLx += 0.55 * crouchK;
    if (dashK > 0.01) {
      const g = Math.sin(t * 26);
      fRx = fRx * (1 - dashK) + (0.6 + g * 0.7) * dashK; fLx = fLx * (1 - dashK) + (0.6 + Math.sin(t * 26 + 0.5) * 0.7) * dashK;
      hR = hR * (1 - dashK) + (-0.5 - g * 0.6) * dashK; hL = hL * (1 - dashK) + (-0.5 - Math.sin(t * 26 + 0.5) * 0.6) * dashK;
      bodyGrp.rotation.x += Math.sin(t * 26) * 0.06 * dashK;
    }
    hR -= 0.35 * crouchK; hL -= 0.35 * crouchK;
    offR = hR - bR; offL = hL - bL; legR.rotation.x = hR; legL.rotation.x = hL; lastR = legR.rotation.x; lastL = legL.rotation.x;
    fR.rotation.x = fRx; fL.rotation.x = fLx;
    tailGrp.rotation.y = 0.35 * Math.sin(t * 2.3) * (1 - dashK); tailGrp.rotation.x = 0.12 * Math.sin(t * 3.1) - 0.3 * crouchK + 0.35 * dashK;
  };
}

// ---------- 용암 골렘 ----------
// 손잡이: armR armL legR legL bodyGrp head · _lgCharge(0..1) · _lgUpdate(t, dt)
// 설정화: 온몸이 푸른 회색 육각 현무암 기둥 다발 — 다발 속 용암 심이 기둥 틈으로 비친다 · 가슴 V 자 용암 핵 · 어깨에 큰 흑요석 결정 무리 ·
// 어깨 뒤 불길 · 어깨 사이에 파묻힌 네모난 머리(눈 틈) · 땅에 닿을 듯 긴 기둥 팔 끝 바위 주먹(주먹 틈이 달아오른다).
function a4LavaGolem(P) {
  const { grp, bodyGrp, headGrp, limbs } = P;
  a4Reset(grp, bodyGrp, headGrp, limbs);
  const K = a4Kit(P.seed);
  const B = K.mat(0x181c22), BL = K.mat(0x232830), BD = K.mat(0x0e1014), OB = K.mat(0x09080c), OBL = K.mat(0x141218);
  const LAVA = K.mat(A4_PAL.lava, 'lava'), LAVAY = K.mat(A4_PAL.lavaY, 'lava');
  const FR = K.mat(A4_PAL.flameR, 'flame'), FA = K.mat(A4_PAL.flameO, 'flame'), FB = K.mat(A4_PAL.flameY, 'flame');
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffa040, toneMapped: false, fog: false }); coreMat._glowMat = true;
  const fistMat = new THREE.MeshBasicMaterial({ color: 0xff5a18, toneMapped: false, fog: false }); fistMat._glowMat = true;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffc040, toneMapped: false, fog: false }); eyeMat._glowMat = true;
  // 육각 기둥 한 토막(위아래 반지름을 살짝 다르게 · 윗면이 조금 기운다)
  const hexc = (parent, x, y, z, r, h, m, rx, rz) => { const o = K.cyl(parent, r, r * (0.88 + K.rr() * 0.1), h, m, 6, x, y, z, rx || (K.rr() - 0.5) * 0.08, K.rr() * 1.05, rz || (K.rr() - 0.5) * 0.08); return o; };
  // 기둥 다발: 가운데 하나 + 둘레 n 개 · 속에 용암 심(틈으로 비친다)
  const bundle = (parent, x, y, z, len, R, n, mats, lava) => {
    K.cyl(parent, R * 0.72, R * 0.72, len * 0.92, lava || LAVA, 6, x, y, z);
    hexc(parent, x, y + (K.rr() - 0.5) * 0.06, z, R * 0.5, len * (0.96 + K.rr() * 0.08), mats[0]);
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + K.rr() * 0.3; hexc(parent, x + Math.sin(a) * R * 0.62, y + (K.rr() - 0.5) * len * 0.12, z + Math.cos(a) * R * 0.62, R * (0.36 + K.rr() * 0.08), len * (0.82 + K.rr() * 0.22), mats[i % mats.length]); }
  };

  // ---- 골반·몸통: 기둥 다발(아래 좁고 어깨가 넓다) ----
  bundle(bodyGrp, 0, 1.05, 0.02, 0.36, 0.42, 6, [BD, B]);
  const TC = [[0, 0.06, 0.26, 0.98, BL], [-0.3, 0.08, 0.22, 0.86, B], [0.3, 0.08, 0.22, 0.88, B], [-0.17, 0.3, 0.2, 0.9, BL], [0.17, 0.3, 0.2, 0.86, B],
    [-0.2, -0.2, 0.2, 0.74, B], [0.2, -0.2, 0.2, 0.76, BL], [-0.44, -0.04, 0.17, 0.66, BD], [0.44, -0.04, 0.17, 0.68, BD], [0, 0.32, 0.18, 0.8, B]];
  K.cyl(bodyGrp, 0.42, 0.34, 0.8, LAVA, 7, 0, 1.6, 0.04);                                  // 몸통 속 용암 심
  TC.forEach(([x, z, r, h, m]) => hexc(bodyGrp, x, 1.2 + h / 2, z, r, h, m));
  // 가슴 V 자 용암 핵(앞 기둥 사이) — 따로 둔다(맥박)
  const coreG = new THREE.Group(); coreG.position.set(0, 1.62, -0.3); bodyGrp.add(coreG);
  K.ico(coreG, 0.11, coreMat, 0, 0.02, 0, 1.0, 1.25, 0.5, 1);
  [-1, 1].forEach(sg => { K.seg(bodyGrp, [sg * 0.05, 1.56, -0.34], [sg * 0.32, 1.95, -0.28], 0.05, 0.035, LAVAY, 4); K.seg(bodyGrp, [sg * 0.32, 1.95, -0.28], [sg * 0.5, 2.0, -0.2], 0.035, 0.02, LAVA, 4); });
  K.seg(bodyGrp, [0, 1.48, -0.31], [0, 1.18, -0.24], 0.04, 0.02, LAVA, 4);
  // 어깨: 바위 덩이 + 큰 흑요석 결정 무리(위로·바깥으로 솟는다)
  [-1, 1].forEach(sg => {
    K.ico(bodyGrp, 0.3, BL, sg * 0.58, 2.02, 0.02, 1.15, 0.85, 1.0, 0, 0.03);
    for (let k = 0; k < 5; k++) {
      const h = 0.3 + K.rr() * 0.28, r = 0.08 + K.rr() * 0.05;
      K.cone(bodyGrp, r, h, k % 2 ? OB : OBL, 5, sg * (0.5 + (k % 3) * 0.12), 2.2 + h / 2 - 0.06, -0.12 + Math.floor(k / 2) * 0.13, (K.rr() - 0.5) * 0.6, K.rr(), sg * (0.2 + K.rr() * 0.45));
    }
    K.seg(bodyGrp, [sg * 0.4, 2.14, -0.16], [sg * 0.7, 2.2, -0.12], 0.025, 0.02, LAVA, 4);
  });
  // 어깨 뒤 불길 둘 + 가운데(따로 — 일렁인다)
  const flameG = new THREE.Group(); flameG.position.set(0, 2.1, 0.14); bodyGrp.add(flameG);
  [[-0.32, 0.1, 0.38], [0.32, 0.1, 0.4], [0, 0.07, 0.28]].forEach(([x, r, h]) => {
    K.flameTongue(flameG, x, 0, 0, r, h, FR, -0.1, x * 0.4); K.flameTongue(flameG, x, 0.01, -0.03, r * 0.7, h * 0.72, FA, -0.1, x * 0.4); K.flameTongue(flameG, x, 0.02, -0.05, r * 0.4, h * 0.45, FB, -0.1, x * 0.4);
  });

  // ---- 머리: 어깨 사이 네모난 돌머리 · 눈 틈 ----
  headGrp.position.set(0, 2.18, -0.22); bodyGrp.add(headGrp); limbs.head = headGrp;
  hexc(headGrp, 0, 0.02, 0, 0.17, 0.3, B, 0, 0);
  K.box(headGrp, 0.3, 0.07, 0.12, BL, 0, 0.07, -0.13, 0.2, 0, 0);
  K.box(headGrp, 0.22, 0.032, 0.04, eyeMat, 0, 0.0, -0.18);
  K.box(headGrp, 0.13, 0.12, 0.08, BD, 0, -0.1, -0.12);
  K.cyl(headGrp, 0.06, 0.05, 0.08, BL, 6, 0, 0.21, 0.02);

  // ---- 팔: 기둥 다발 위팔·아래팔 + 바위 주먹(손마디 틈이 달아오른다) ----
  const fists = [];
  const mkArm = (sg) => {
    const a = new THREE.Group(); a.position.set(sg * 0.66, 1.98, 0.0); bodyGrp.add(a);
    bundle(a, sg * 0.04, -0.3, 0, 0.56, 0.26, 5, [B, BL]);
    bundle(a, sg * 0.06, -0.8, -0.03, 0.48, 0.24, 5, [BD, B]);
    const fistG = new THREE.Group(); fistG.position.set(sg * 0.07, -1.18, -0.06); a.add(fistG);
    K.ico(fistG, 0.2, fistMat, 0, 0, 0, 1, 0.9, 1.1, 1);                                   // 주먹 속 불(틈으로 비친다)
    for (let k = 0; k < 7; k++) { const an = k / 7 * Math.PI * 2; hexc(fistG, Math.sin(an) * 0.15, (K.rr() - 0.5) * 0.08, Math.cos(an) * 0.17, 0.11 + K.rr() * 0.03, 0.34, k % 2 ? BL : B, (K.rr() - 0.5) * 0.4, (K.rr() - 0.5) * 0.4); }
    for (let k = 0; k < 4; k++) hexc(fistG, (k - 1.5) * 0.1, -0.02 - Math.abs(k - 1.5) * 0.03, -0.24, 0.06, 0.12, BL, Math.PI / 2, 0);
    fists.push(fistG);
    return a;
  };
  const armR = mkArm(1), armL = mkArm(-1);
  // ---- 다리: 짧고 굵은 기둥 다발 + 넓은 발 ----
  const mkLeg = (sg) => {
    const l = new THREE.Group(); l.position.set(sg * 0.3, 0.98, 0.04); bodyGrp.add(l);
    bundle(l, 0, -0.26, 0, 0.52, 0.3, 5, [B, BL]);
    bundle(l, 0, -0.68, -0.02, 0.44, 0.27, 5, [BD, B]);
    for (let k = 0; k < 4; k++) hexc(l, (k - 1.5) * 0.12, -0.93, -0.1 + (k % 2) * 0.1, 0.1, 0.12, BD, 0, 0);
    return l;
  };
  const legR = mkLeg(1), legL = mkLeg(-1);

  c3MergeStatic(flameG); K.fx(flameG);
  c3MergeStatic(headGrp); c3MergeStatic(coreG);
  fists.forEach(g => c3MergeStatic(g));
  [armR, armL].forEach((g, i) => c3MergeStatic(g, [fists[i]]));
  [legR, legL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bodyGrp, [headGrp, coreG, flameG, armR, armL, legR, legL]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp; limbs._lgCharge = 0;
  limbs._lgUpdate = function (t, dt) {
    const k = limbs._lgCharge || 0;
    flameG.scale.set(0.85 + 0.15 * Math.sin(t * 13), (0.75 + 0.35 * Math.abs(Math.sin(t * 9.3))) * (1 + k * 0.8), 0.85 + 0.15 * Math.cos(t * 11));
    const p = 0.5 + 0.5 * Math.sin(t * 2.42);
    K.lava.color.setScalar(0.78 + 0.22 * p + k * 0.5);
    coreMat.color.setRGB(1, 0.63 + 0.25 * k, 0.25 + 0.4 * k).multiplyScalar(0.9 + 0.15 * p + k * 0.3); coreG.scale.setScalar(1 + 0.06 * p + k * 0.25);
    fistMat.color.setRGB(1, 0.35 + 0.45 * k, 0.09 + 0.45 * k).multiplyScalar(0.55 + k * 0.7);
    eyeMat.color.setRGB(1, 0.75, 0.25).multiplyScalar(0.9 + 0.15 * Math.sin(t * 3.1) + k * 0.3);
  };
}

// ---------- 100층 용암 거수 ----------
// 손잡이: armR armL(빈 — 들이받기) legR legL fR fL jaw head bodyGrp · _rear _charge _roar · _lbUpdate(t, dt) · _lbBreak() · _lbVents()
// 리그·동작은 v860 그대로 — 몸만 설정화대로: 용암 그물에 박힌 둥근 바위 덩이 몸 · 등줄기를 따라 높이 솟는 육각 기둥 능선(가운데가 가장 높다) ·
// 앞으로 휘었다 위로 서는 뼈빛 초승달 뿔 · 비늘 판 머리 · 크게 벌어진 용암 입 · 뼈빛 큰 발톱 · 마디 꼬리 끝 빛나는 용암 결정.
function a4LavaBeast(P) {
  const { grp, bodyGrp, headGrp, limbs } = P;
  a4Reset(grp, bodyGrp, headGrp, limbs);
  const K = a4Kit(P.seed, 0.78, 0.03);
  const H = K.mat(0x1c1413, 'crust'), HD = K.mat(0x0e0909, 'crust'), HL = K.mat(0x2a1e1c, 'crust');
  const RK = K.mat(0x241c1a), RKL = K.mat(0x332826);                  // 바위 덩이
  const B = K.mat(0x1c2027), BL = K.mat(0x2a2f38), BD = K.mat(0x0f1216);
  const BONE = K.mat(0x6c5634), BONED = K.mat(0x4a3a24), TOOTH = K.mat(0x5e4e38);
  const LAVA = K.mat(A4_PAL.lava, 'lava'), LAVAY = K.mat(A4_PAL.lavaY, 'lava'), MAW = K.mat(0xff7a22, 'lava');
  const FR = K.mat(A4_PAL.flameR, 'flame'), FA = K.mat(A4_PAL.flameO, 'flame'), FB = K.mat(A4_PAL.flameY, 'flame');
  const ventMat = new THREE.MeshBasicMaterial({ color: 0x1a0804, toneMapped: false, fog: false }); ventMat._glowMat = true;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffb030, toneMapped: false, fog: false }); eyeMat._glowMat = true;
  const crystMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a, toneMapped: false, fog: false }); crystMat._glowMat = true;
  // 바위 덩이(몸 표면에 박힌다) — 면 방향 d 로 반쯤 묻는다
  const lump = (parent, r, m, x, y, z, d) => { const o = K.ico(parent, r, m, x, y, z, 1.0, 1.0, 0.62, 0, r * 0.08); o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(d[0], d[1], d[2]).normalize()); return o; };

  // ---- 몸통 · 가슴 · 배 + 바위 덩이 ----
  K.ico(bodyGrp, 1.3, H, 0, 2.0, 0.25, 1.25, 0.82, 1.7, 1, 0.07);
  K.ico(bodyGrp, 1.0, HL, 0, 2.05, -1.25, 1.2, 0.95, 1.0, 1, 0.06);
  K.ico(bodyGrp, 1.05, HD, 0, 1.45, 0.25, 1.1, 0.6, 1.5, 1);
  [-1, 1].forEach(sg => {
    [[1.45, 2.05, -0.3, 0.42], [1.4, 1.75, 0.55, 0.38], [1.3, 2.25, 1.15, 0.36], [1.2, 1.9, -1.2, 0.4], [1.45, 1.55, -0.6, 0.3], [1.2, 1.5, 1.3, 0.3], [0.95, 2.5, -1.45, 0.34]]
      .forEach(([x, y, z, r], i) => lump(bodyGrp, r, i % 2 ? RK : RKL, sg * x, y, z, [sg, (y - 2.0) * 0.8, 0.1]));
  });
  // 등 기둥 사이로 비치는 용암 바탕 + 껍질(멀쩡한 것 · 깨진 것)
  const shellBase = K.ico(bodyGrp, 1.15, LAVA, 0, 2.55, 0.3, 0.9, 0.45, 1.55, 1);
  const shellA = new THREE.Group(), shellB = new THREE.Group(); shellB.visible = false; bodyGrp.add(shellA, shellB);
  const HEXR = 0.3, colP = [];
  for (let iz = -5; iz <= 5; iz++) for (let ix = -3; ix <= 3; ix++) {
    const x = (ix + (iz & 1 ? 0.5 : 0)) * HEXR * 1.75, z = 0.3 + iz * HEXR * 1.5;
    const ex = x / 1.05, ez = (z - 0.3) / 1.85; const q = 1 - ex * ex - ez * ez; if (q < 0.06) continue;
    const spine = Math.max(0, 1 - Math.abs(ex) * 1.25) * (1 - Math.abs(ez + 0.15) * 0.55);   // 등줄기 가운데·앞쪽이 가장 높다
    colP.push({ x, z, ex, ez, top: 2.35 + Math.sqrt(q) * 0.7, h: 0.25 + spine * spine * 1.55 + K.rr() * 0.22, r0: 0.84 + K.rr() * 0.1, lt: (ix + iz) % 3 === 0, tl: 0.6 + 0.4 * K.rr(), hot: K.rr() < 0.18 });
  }
  const buildShell = (G, broken) => colP.forEach((c, i) => {
    if (broken && i % 3 === 1) return;
    const g = new THREE.Group(); g.position.set(c.x, c.top - 0.12, c.z); G.add(g);
    K.cyl(g, HEXR * 0.9, HEXR * c.r0, c.h, c.lt ? BL : B, 6, 0, c.h / 2, 0, 0, 0.52, 0);
    K.cyl(g, HEXR * 0.82, HEXR * 0.78, 0.05, c.hot ? LAVAY : BL, 6, 0, c.h + 0.01, 0, 0, 0.52, 0);   // 윗면 테(어떤 기둥은 꼭대기가 달아올랐다)
    const k = broken ? 0.5 + 0.6 * c.tl : 0.35;
    g.rotation.set(c.ez * k, 0, -c.ex * k);
    if (broken && i % 4 === 0) K.box(g, 0.05, c.h * 0.8, 0.06, LAVA, HEXR * 0.6, c.h * 0.45, 0);
  });
  buildShell(shellA, false); buildShell(shellB, true);
  const vents = [];
  [[-0.55, -0.3], [0.6, 0.1], [-0.3, 0.9], [0.4, 1.3]].forEach(([x, z]) => {
    K.ico(bodyGrp, 0.3, ventMat, x, 3.15, z, 1, 0.45, 1, 0);
    const fg = new THREE.Group(); fg.position.set(x, 3.25, z); fg.visible = false; bodyGrp.add(fg);
    K.flameTongue(fg, 0, 0, 0, 0.18, 0.75, FR); K.flameTongue(fg, 0, 0.01, -0.04, 0.12, 0.5, FA); K.flameTongue(fg, 0, 0.02, -0.07, 0.07, 0.3, FB);

  });

  // ---- 머리: 비늘 판 · 뼈빛 초승달 뿔 · 용암 입 ----
  K.seg(bodyGrp, [0, 2.05, -1.6], [0, 1.85, -2.25], 0.78, 0.64, H, 7);
  headGrp.position.set(0, 1.85, -2.45); bodyGrp.add(headGrp); limbs.head = headGrp;
  K.ico(headGrp, 0.68, H, 0, 0, 0, 1.15, 0.78, 1.2, 1, 0.04);
  for (let i = 0; i < 6; i++) { const r = i % 2, z = -0.75 + Math.floor(i / 2) * 0.35; lump(headGrp, 0.22 - z * 0.03, r ? RKL : RK, (r ? 1 : -1) * 0.16, 0.42 - z * 0.06, z + 0.15, [(r ? 0.3 : -0.3), 1, -0.4]); }
  lump(headGrp, 0.3, RKL, 0, 0.45, -0.1, [0, 1, -0.3]);
  K.cyl(headGrp, 0.56, 0.36, 0.8, H, 6, 0, -0.08, -0.75, -Math.PI / 2, 0, 0);
  K.box(headGrp, 0.55, 0.06, 0.75, MAW, 0, -0.32, -0.7);
  [-1, 1].forEach(sg => {
    K.chain(headGrp, [[sg * 0.5, 0.25, -0.2], [sg * 0.95, 0.35, -0.45], [sg * 1.22, 0.7, -0.75], [sg * 1.2, 1.15, -0.95], [sg * 0.98, 1.5, -1.0]], [0.24, 0.19, 0.13, 0.07, 0.01], [BONED, BONE], 7);
    const e = K.put(headGrp, new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.07, 0.08), eyeMat), sg * 0.38, 0.14, -0.6); e.rotation.set(0, sg * 0.4, -sg * 0.32);
    K.box(headGrp, 0.04, 0.05, 0.5, LAVA, sg * 0.6, -0.05, -0.2, 0, sg * 0.3, 0);
    K.cone(headGrp, 0.07, 0.35, TOOTH, 4, sg * 0.32, -0.45, -1.05, Math.PI + 0.3, 0, 0);
    for (let i = 0; i < 3; i++) K.cone(headGrp, 0.04, 0.16, TOOTH, 4, sg * (0.22 - i * 0.02), -0.4, -0.75 + i * 0.18, Math.PI, 0, 0);
    K.cone(headGrp, 0.12, 0.42, RK, 4, sg * 0.62, 0.05, 0.1, 0.5, 0, -sg * 1.0);       // 뺨 가시
  });
  const jaw = new THREE.Group(); jaw.position.set(0, -0.3, -0.2); headGrp.add(jaw);

  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });
  // 색만 다른 단단한 재질은 한 재질(정점색)로 묶는다 — 드로우콜은 (병합 그룹 × 재질)이다(3막 c3MergeStatic 의 mergeInto 규칙).
  // 날개 막은 양면이라, 발광 재질은 emissive 가 제각각이라 못 묶는다.
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  [crust, crustDk, crustLt, hornMat, toothMat, clawMat].forEach(m => { m.userData.mergeInto = hardShared; });

  grp.add(bodyGrp);

  // ---------- 몸통: 앞으로 굽은 가슴 + 볼록한 배 ----------
  const chest = ico(0.22, crust); chest.scale.set(1.15, 1.0, 0.92); chest.position.set(0, 0.80, 0.02); jit(chest.geometry, 0.025); bodyGrp.add(chest);
  const back = ico(0.17, crustLt); back.scale.set(1.2, 0.8, 0.9); back.position.set(0, 0.90, 0.10); jit(back.geometry, 0.02); bodyGrp.add(back);
  const belly = ico(0.17, crustDk); belly.scale.set(1.05, 1.0, 1.0); belly.position.set(0, 0.60, -0.03); jit(belly.geometry, 0.02); bodyGrp.add(belly);
  const hips = ico(0.15, crust, 0); hips.scale.set(1.25, 0.7, 0.95); hips.position.set(0, 0.50, 0.03); bodyGrp.add(hips);
  // 배 속 용암 핵 — 배 앞으로 살짝 튀어나오고 껍질 조각 넷이 덮는다(조각 사이로 빛이 샌다)
  const coreGrp = new THREE.Group(); coreGrp.position.set(0, 0.62, -0.13); bodyGrp.add(coreGrp);
  coreGrp.add(ico(0.11, coreMat));
  [[-0.6, 0.55], [0.62, 0.5], [-0.45, -0.6], [0.5, -0.62]].forEach(([dx, dy]) => {
    const d = new THREE.Vector3(dx, dy, -0.85).normalize();
    const pl = ico(0.065, crustDk, 0); pl.scale.set(1.0, 1.0, 0.45); pl.position.copy(d).multiplyScalar(0.105);
    pl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), d); coreGrp.add(pl);
  });
  // 등·어깨를 타는 용암 실금 — 껍질 표면에 붙은 가는 판(두께는 법선 방향)
  const crack = (cx, cy, cz, rx, ry, rz, n) => {
    for (let i = 0; i < n; i++) {
      const th = rr() * 6.283, ph = 0.25 + rr() * 2.4;
      const d = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
      if (d.z < -0.55) continue;   // 배 앞쪽은 핵이 맡는다
      const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.07 + rr() * 0.08, 0.016, 0.03), lavaMat));
      m.position.set(cx + d.x * rx, cy + d.y * ry, cz + d.z * rz);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), d);
      m.rotateZ(rr() * 3.14); bodyGrp.add(m);
    }
  };
  crack(0, 0.80, 0.02, 0.245, 0.21, 0.195, 10);
  crack(0, 0.90, 0.10, 0.19, 0.13, 0.15, 6);
  // 등 한가운데 갈라진 틈 — 위에서 내려다보는 카메라에 가장 잘 보이는 면이라 여기가 '속불'을 보여 준다(배 핵은 머리에 가린다)
  for (let i = 0; i < 4; i++) { const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.03 - i * 0.004, 0.02, 0.09), lavaMat)); m.position.set((i % 2 ? 0.02 : -0.02), 1.03 - i * 0.075, 0.08 + i * 0.065); m.rotation.set(-0.7 + i * 0.25, (i % 2 ? 0.4 : -0.4), 0); bodyGrp.add(m); }
  // 어깨 가시
  [-1, 1].forEach(sg => seg(bodyGrp, [sg * 0.2, 0.92, 0.04], [sg * 0.27, 1.06, 0.10], 0.045, 0.006, hornMat));
  // 등뼈 돌기
  for (let i = 0; i < 3; i++) seg(bodyGrp, [0, 0.98 - i * 0.12, 0.2 + i * 0.02], [0, 1.04 - i * 0.12, 0.28 + i * 0.02], 0.03, 0.004, hornMat);

  // ---------- 머리 ----------
  headGrp.position.set(0, 1.0, -0.12); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = ico(0.19, crust); skull.scale.set(1.15, 0.95, 1.05); jit(skull.geometry, 0.018); headGrp.add(skull);
  const snout = ico(0.13, crustDk); snout.scale.set(1.15, 0.7, 0.95); snout.position.set(0, -0.08, -0.11); jit(snout.geometry, 0.012); headGrp.add(snout);
  [-1, 1].forEach(sg => { const b = sh(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.045, 0.07), crustLt)); b.position.set(sg * 0.068, 0.055, -0.165); b.rotation.set(0.35, 0, sg * 0.42); headGrp.add(b); });   // 눈썹뼈 둘 — 안쪽이 내려간 V(성난 얼굴)
  // 찢어진 입 — 속이 용암처럼 빛난다
  for (let i = 0; i < 5; i++) {   // 양끝이 올라간 웃는 입(다섯 조각을 곡선으로 — 한 막대면 그냥 띠로 읽힌다)
    const fx = (i - 2) / 2, m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.03 - Math.abs(fx) * 0.008, 0.05), lavaMat));
    m.position.set(fx * 0.1, -0.115 + fx * fx * 0.035, -0.222 + Math.abs(fx) * 0.03); m.rotation.z = fx * 0.45; m.rotation.y = -fx * 0.4; headGrp.add(m);
  }
  for (let i = 0; i < 6; i++) {
    const fx = (i - 2.5) / 2.5, up = i % 2 === 0;
    const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.05, 3), toothMat));
    t.position.set(fx * 0.09, (up ? -0.088 : -0.138) + fx * fx * 0.035, -0.235 + Math.abs(fx) * 0.03); t.rotation.x = up ? Math.PI : 0; headGrp.add(t);
  }
  // 눈: 치켜 올라간 노란 불빛
  [-1, 1].forEach(sg => {
    const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.028, 0.03), eyeMat);
    e2.position.set(sg * 0.075, 0.015, -0.19); e2.rotation.z = -sg * 0.38; headGrp.add(e2);
    // 뾰족한 귀
    seg(headGrp, [sg * 0.16, 0.02, 0.0], [sg * 0.31, 0.07, 0.05], 0.035, 0.004, crust);
    // 뒤로 휜 뿔(네 마디 — 위로 솟았다 뒤로 넘어간다)
    const P = [[sg * 0.09, 0.12, -0.02], [sg * 0.15, 0.25, 0.03], [sg * 0.19, 0.34, 0.13], [sg * 0.18, 0.37, 0.26]], R = [0.045, 0.034, 0.02, 0.004];
    for (let k = 0; k < 3; k++) seg(headGrp, P[k], P[k + 1], R[k], R[k + 1], hornMat);
  });
  // 정수리 불꽃(따로 둔다 — 매 프레임 일렁이고, 노멀 패스에서 빠져 외곽선이 안 생긴다)
  const flameG = new THREE.Group(); flameG.position.set(0, 0.17, 0.03); headGrp.add(flameG);
  const flames = [{ f: flameG, ph: 0 }];   // 불꽃 넷은 한 덩어리로 일렁인다(재질 둘 = 메시 둘)
  [[0, 0, 0, 0.065, 0.26, flameA], [-0.06, -0.02, 0.04, 0.045, 0.18, flameA], [0.06, -0.02, 0.04, 0.045, 0.19, flameA], [0, 0.01, -0.01, 0.035, 0.17, flameB]].forEach(([x, y, z, r, h, m]) => {
    const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0);
    const f = new THREE.Mesh(g, m); f.position.set(x, y, z); flameG.add(f);
  });

  // ---------- 날개(퇴화한 박쥐 날개 — 뼈대 + 막) ----------
  const wings = [];
  [-1, 1].forEach(sg => {
    const wg = new THREE.Group(); wg.position.set(sg * 0.1, 0.94, 0.15); bodyGrp.add(wg);
    seg(wg, [0, 0, 0], [sg * 0.30, 0.16, 0.10], 0.022, 0.012, hornMat);
    seg(wg, [sg * 0.30, 0.16, 0.10], [sg * 0.40, 0.02, 0.16], 0.012, 0.003, hornMat);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, sg * 0.30, 0.16, 0.10, sg * 0.16, -0.10, 0.12,
                                                                 sg * 0.30, 0.16, 0.10, sg * 0.40, 0.02, 0.16, sg * 0.16, -0.10, 0.12], 3));
    g.computeVertexNormals();
    wg.add(sh(new THREE.Mesh(g, membraneMat)));
    wings.push({ wg, sg });
  });

  // ---------- 꼬리(끝에 불) ----------
  const tailGrp = new THREE.Group(); tailGrp.position.set(0, 0.52, 0.14); bodyGrp.add(tailGrp);
  const TP = [[0, 0, 0], [0, -0.07, 0.17], [0, -0.02, 0.33], [0, 0.10, 0.44], [0, 0.24, 0.47]], TR = [0.045, 0.034, 0.025, 0.016, 0.006];
  for (let k = 0; k < 4; k++) seg(tailGrp, TP[k], TP[k + 1], TR[k], TR[k + 1], k % 2 ? crustDk : crust);
  const tipG = new THREE.Group(); tipG.position.set(0, 0.24, 0.47); tailGrp.add(tipG);
  { const g = new THREE.ConeGeometry(0.04, 0.14, 5); g.translate(0, 0.07, 0); const f = new THREE.Mesh(g, flameA); f.userData.fx = true; tipG.add(f); flames.push({ f: tipG, ph: 4.1 }); }

  // ---------- 팔(가늘고 길다 · 손톱 셋) ----------
  const mkArm = (sg) => {
    const a = new THREE.Group(); a.position.set(sg * 0.26, 0.88, 0.0); bodyGrp.add(a);
    a.add(ico(0.065, crustLt, 0));   // 어깨 관절
    seg(a, [0, 0, 0], [sg * 0.02, -0.25, 0.02], 0.05, 0.04, crust);
    seg(a, [sg * 0.02, -0.25, 0.02], [sg * 0.01, -0.48, -0.06], 0.04, 0.032, crustDk);
    const hand = ico(0.05, crust, 0); hand.position.set(sg * 0.01, -0.51, -0.07); a.add(hand);
    for (let f = 0; f < 3; f++) {
      const fx = (f - 1) * 0.03;
      const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.09, 4), clawMat));
      c.position.set(sg * 0.01 + fx, -0.57, -0.10); c.rotation.x = Math.PI + 0.5; c.rotation.z = fx * 3; a.add(c);
    }
    // 팔뚝 실금 하나
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.09, 0.02), lavaMat)); ck.position.set(sg * 0.035, -0.36, -0.02); a.add(ck);
    a.rotation.z = sg * 0.14; return a;
  };
  const armR = mkArm(1), armL = mkArm(-1);

  // ---------- 다리(짧고 무릎이 앞으로 굽은 짐승 다리) ----------
  const mkLeg = (sg) => {
    const l = new THREE.Group(); l.position.set(sg * 0.12, 0.46, 0.04); bodyGrp.add(l);
    seg(l, [0, 0, 0], [0, -0.19, -0.09], 0.07, 0.05, crust);
    seg(l, [0, -0.19, -0.09], [0, -0.36, 0.05], 0.045, 0.035, crustDk);
    const foot = sh(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.16), crustDk)); foot.position.set(0, -0.425, -0.02); l.add(foot);
    for (let f = 0; f < 3; f++) {
      const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.06, 4), clawMat));
      c.position.set((f - 1) * 0.03, -0.44, -0.12); c.rotation.x = -Math.PI / 2; l.add(c);
    }
    return l;
  };
  const legR = mkLeg(1), legL = mkLeg(-1);

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(flameG); flameG.traverse(o => { if (o.isMesh) o.userData.fx = true; });   // 불꽃은 노멀 패스에서 뺀다(외곽선 없이)
  c3MergeStatic(headGrp, [flameG]);
  c3MergeStatic(coreGrp);
  wings.forEach(w => c3MergeStatic(w.wg));
  c3MergeStatic(tailGrp, [tipG]);
  [armR, armL, legR, legL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bodyGrp, [headGrp, coreGrp, tailGrp, armR, armL, legR, legL, ...wings.map(w => w.wg)]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp;
  // 상시: 불꽃 일렁임 · 눈·실금 맥박 · 날개 파닥 · 꼬리 흔들기
  limbs._fiUpdate = function (t) {
    for (const F of flames) F.f.scale.set(0.85 + 0.15 * Math.sin(t * 13 + F.ph), 0.75 + 0.35 * Math.abs(Math.sin(t * 9.3 + F.ph * 1.3)), 0.85 + 0.15 * Math.cos(t * 11 + F.ph));
    eyeMat.emissiveIntensity = 1.0 + 0.25 * Math.sin(t * 3.1);
    lavaMat.emissiveIntensity = 0.75 + 0.18 * Math.sin(t * 2.42);
    for (const w of wings) { w.wg.rotation.y = w.sg * (0.25 + 0.3 * Math.sin(t * 7.5)); w.wg.rotation.z = w.sg * 0.12 * Math.sin(t * 7.5 + 0.6); }
    tailGrp.rotation.y = 0.35 * Math.sin(t * 2.3); tailGrp.rotation.x = 0.12 * Math.sin(t * 3.1);
  };
  // 죽음 예고: 0 → 1 동안 배 속 핵이 부풀고 하얗게 달아오르며 온몸 실금이 밝아진다
  limbs._fiSwell = function (k) {
    const s = 1 + 1.1 * k * k; coreGrp.scale.setScalar(s);
    coreMat.emissive.setRGB(1, 0.54 + 0.4 * k, 0.16 + 0.6 * k); coreMat.emissiveIntensity = 0.95 + 1.6 * k;
    lavaMat.emissiveIntensity = 0.85 + 1.4 * k; eyeMat.emissiveIntensity = 1.15 + 1.5 * k;
    // 껍질 전체가 안에서부터 달아오른다 — 핵은 머리에 가려 위에서 안 보이므로, 몸 전체가 빛나야 '곧 터진다'가 읽힌다
    const g = k * k * 0.95;
    for (const m of [hardShared, membraneMat]) { m.emissive.setRGB(1, 0.32 + 0.3 * k, 0.06 + 0.2 * k); m.emissiveIntensity = g; }
  };
}

// ============================================================
//  화염술사(pyromancer) — 95층부터 나오는 4막 원거리 캐스터. 3막 농침벌의 자리.
//  재를 뒤집어쓴 화염 숭배자: 바닥까지 끌리는 잿빛 로브(밑단이 타들어 가며 빛난다) · 뾰족한 두건 속 숯이 된 얼굴(눈·입이 불빛) ·
//  어깨를 덮은 너덜너덜한 망토(가장자리가 불씨) · 오른손에 불타는 구슬을 쇠 우리에 가둔 지팡이 · 왼손 바닥 위에 뜬 작은 불꽃.
//  위에서 내려다보는 카메라에 가장 잘 보이는 것은 두건 꼭대기·어깨·지팡이 머리라 불빛을 거기 몰았다(임프 v854 교훈 — 배는 안 보인다).
//  던지는 것은 포물선 화염탄 — 지팡이를 휘두를 때 구슬이 확 타오른다(_pyCast).
//  다리는 로브에 가려 없다 — 공용 애니메이션이 legR/legL 을 돌리므로 빈 그룹을 물린다.
//  뷰어(viewers/pyromancer_viewer_v1.html)와 게임이 이 함수를 글자 그대로 같이 쓴다. 난수는 자체 LCG.
//  정면 -z(게임 규약). 높이 약 2.0(두건 끝) · 지팡이 머리 2.15.
// ============================================================
function buildPyromancerBody(grp, bodyGrp, headGrp, limbs) {
  let _s = 0x5be2a1;
  const rr = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  const jit = (geo, a) => {   // 같은 좌표 같은 오프셋(비인덱스 20면체가 깨진 조각이 되지 않게 — v754)
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
    }
    p.needsUpdate = true; geo.computeVertexNormals(); return geo;
  };
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const ico = (r, mat, d) => sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d), mat));
  const UP = new THREE.Vector3(0, 1, 0);
  const seg = (parent, p, q, r0, r1, mat, sides) => {
    const d = new THREE.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]), len = d.length();
    const g = new THREE.CylinderGeometry(r1, r0, len, sides || 6); g.translate(0, len / 2, 0);
    const m = sh(new THREE.Mesh(g, mat)); m.position.set(p[0], p[1], p[2]);
    m.quaternion.setFromUnitVectors(UP, d.normalize()); parent.add(m); return m;
  };

  // ---------- 팔레트(4막 조명 기준 — 뷰어 '4막' 모드에서 고른다. 베이스를 '보기 좋게' 올리지 말 것) ----------
  const robe   = getLowPolyMat(0x1c1819);   // 잿빛 로브
  const robeDk = getLowPolyMat(0x0e0b0c);   // 로브 안쪽·주름 골
  const robeLt = getLowPolyMat(0x2a2324);   // 빛 받는 망토·어깨
  const ash    = getLowPolyMat(0x3a3330);   // 재가 앉은 두건 꼭대기·망토 윗면
  const charSk = getLowPolyMat(0x120c0b);   // 숯이 된 얼굴·손
  const iron   = getLowPolyMat(0x1f1c1c, true), ironDk = getLowPolyMat(0x121010, true);
  const wood   = getLowPolyMat(0x1a120e);
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  const metalShared = getLowPolyMat(0xffffff, true); metalShared.vertexColors = true;
  [robe, robeDk, robeLt, ash, charSk, wood].forEach(m => { m.userData.mergeInto = hardShared; });
  [iron, ironDk].forEach(m => { m.userData.mergeInto = metalShared; });
  // 불빛 — 바닥 용암 실금과 같은 붉은 주황, 구슬 속은 노랗게
  const emberMat = new THREE.MeshStandardMaterial({ color: 0x4a1606, emissive: 0xff4a12, emissiveIntensity: 0.8, roughness: 0.6, flatShading: true });
  const orbMat   = new THREE.MeshStandardMaterial({ color: 0x5a2a08, emissive: 0xffa040, emissiveIntensity: 1.2, roughness: 0.4, flatShading: true });
  const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x5a3a10, emissive: 0xffc040, emissiveIntensity: 1.3, roughness: 0.4 });
  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });

  grp.add(bodyGrp);

  // ---------- 로브: 바닥까지 퍼지는 8각 원뿔대 두 단 + 밑단 너덜 조각 ----------
  const skirt = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.46, 0.9, 8, 2), robe)); skirt.position.y = 0.45; jit(skirt.geometry, 0.02); bodyGrp.add(skirt);
  const torso = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.27, 0.5, 8), robe)); torso.position.y = 1.13; jit(torso.geometry, 0.015); bodyGrp.add(torso);
  const belt = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.275, 0.275, 0.06, 8), robeDk)); belt.position.y = 0.9; bodyGrp.add(belt);
  // 앞자락 갈라진 틈(어두운 골) · 허리띠에 달린 작은 해골 장식 둘
  // 앞자락 접힌 주름 둘(가는 어두운 골 — 넓으면 로브에 뚫린 구멍처럼 보였다)
  [-1, 1].forEach(sg => { const f = sh(new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.7, 0.03), robeDk)); f.position.set(sg * 0.07, 0.42, -0.355); f.rotation.x = -0.24; bodyGrp.add(f); });
  [-1, 1].forEach(sg => { const sk = ico(0.05, ash, 0); sk.scale.set(1, 1.1, 0.9); sk.position.set(sg * 0.12, 0.84, -0.26); bodyGrp.add(sk); });
  // 타들어 가는 밑단 — 너덜 조각 사이사이로 불씨가 빛난다(카메라 쪽 앞·옆에 몰아서)
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + 0.13, r0 = 0.45;
    const rag = sh(new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.12 + rr() * 0.08, 0.035), i % 3 ? robe : robeDk));
    rag.position.set(Math.sin(a) * r0, 0.06, Math.cos(a) * r0); rag.rotation.y = a; rag.rotation.x = 0.25; bodyGrp.add(rag);
    if (i % 2 === 0) { const em = sh(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.03), emberMat)); em.position.set(Math.sin(a + 0.26) * 0.465, 0.03, Math.cos(a + 0.26) * 0.465); em.rotation.y = a + 0.26; bodyGrp.add(em); }
  }
  // ---------- 어깨 받이(작게) + 등 뒤로 늘어진 너덜너덜한 망토(아랫단이 타들어 간다) ----------
  // 망토 판을 목둘레에 빙 둘렀더니 납작한 주름 깃(러프)이 돼 몸을 다 가렸다 — 등 뒤로만 늘어뜨린다
  [-1, 1].forEach(sg => {
    const pad = ico(0.12, robeLt); pad.scale.set(1.2, 0.6, 1.1); pad.position.set(sg * 0.22, 1.38, 0.02); jit(pad.geometry, 0.012); bodyGrp.add(pad);
    const rim = sh(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.022, 0.03), emberMat)); rim.position.set(sg * 0.25, 1.33, -0.1); rim.rotation.z = -sg * 0.5; bodyGrp.add(rim);
  });
  for (let i = 0; i < 5; i++) {
    const u = (i - 2) / 2, len = 0.62 + rr() * 0.18;
    const cp = sh(new THREE.Mesh(new THREE.BoxGeometry(0.15, len, 0.03), i % 2 ? robeDk : robe));
    cp.position.set(u * 0.15, 1.38 - len / 2, 0.24 + Math.abs(u) * -0.03); cp.rotation.x = 0.16; cp.rotation.z = u * 0.12; bodyGrp.add(cp);
    const tip = sh(new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.025, 0.035), emberMat));
    tip.position.set(u * 0.15 + u * 0.06, 1.38 - len + 0.01, 0.24 + len * 0.16); bodyGrp.add(tip);
  }
  // ---------- 머리: 뾰족한 두건 + 숯이 된 얼굴(눈·입 불빛) ----------
  headGrp.position.set(0, 1.5, -0.02); bodyGrp.add(headGrp); limbs.head = headGrp;
  // 두건: 머리를 통째로 감싼 덩어리 + 뒤로 꺾여 늘어진 뾰족한 끝(재가 앉아 밝다). 얼굴은 두건 앞 구멍 속에 묻힌다
  const hood = ico(0.24, robe); hood.scale.set(1.0, 1.12, 1.08); hood.position.set(0, 0.06, 0.04); jit(hood.geometry, 0.015); headGrp.add(hood);
  const hoodTip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.34, 6), robe)); hoodTip.position.set(0, 0.3, 0.16); hoodTip.rotation.x = 0.9; headGrp.add(hoodTip);
  const hoodTop = ico(0.15, ash, 0); hoodTop.scale.set(1.1, 0.5, 1.2); hoodTop.position.set(0, 0.22, 0.06); headGrp.add(hoodTop);
  const hoodRim = sh(new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.04, 5, 10), robeDk)); hoodRim.position.set(0, 0.0, -0.17); headGrp.add(hoodRim);
  const face = ico(0.14, charSk); face.scale.set(0.9, 1.05, 0.7); face.position.set(0, -0.01, -0.1); jit(face.geometry, 0.012); headGrp.add(face);
  [-1, 1].forEach(sg => { const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.022, 0.03), eyeMat); e2.position.set(sg * 0.05, 0.01, -0.2); e2.rotation.z = -sg * 0.3; headGrp.add(e2); });
  const mouth = sh(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.016, 0.02), emberMat)); mouth.position.set(0, -0.075, -0.195); headGrp.add(mouth);
  // 두건 옆선을 타는 불씨 실금 — 위에서 보면 두건 윤곽이 빛으로 읽힌다
  [-1, 1].forEach(sg => { for (let k = 0; k < 2; k++) { const c = sh(new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, 0.02), emberMat)); c.position.set(sg * (0.22 - k * 0.05), 0.04 + k * 0.14, -0.04 + k * 0.05); c.rotation.z = -sg * 0.35; c.rotation.x = 0.2; headGrp.add(c); } });

  // ---------- 팔: 소매 + 숯 손. 오른손은 지팡이, 왼손은 손바닥 불꽃 ----------
  const mkArm = (sg) => {
    const a = new THREE.Group(); a.position.set(sg * 0.3, 1.3, 0.0); bodyGrp.add(a);
    seg(a, [0, 0, 0], [sg * 0.04, -0.3, -0.02], 0.085, 0.1, robeLt, 7);
    seg(a, [sg * 0.04, -0.3, -0.02], [sg * 0.03, -0.55, -0.1], 0.1, 0.13, robe, 7);   // 넓어지는 소매
    const cuff = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.03, 7), emberMat)); cuff.position.set(sg * 0.03, -0.555, -0.1); cuff.rotation.x = 0.35; a.add(cuff);
    const hand = ico(0.055, charSk, 0); hand.position.set(sg * 0.03, -0.62, -0.13); a.add(hand);
    return a;
  };
  const armR = mkArm(1), armL = mkArm(-1);
  armR.rotation.z = 0.08; armL.rotation.z = -0.25; armL.rotation.x = -0.55;   // 왼팔은 불꽃을 받쳐 든다
  // 지팡이: 숯이 된 나무 자루 + 쇠 고리 + 우리 속 불타는 구슬(손에서 아래로 0.5, 위로 1.1)
  const staffG = new THREE.Group(); staffG.position.set(0.03, -0.62, -0.13); armR.add(staffG);
  seg(staffG, [0, -0.5, 0], [0, 1.0, 0], 0.03, 0.025, wood);
  [0.25, 0.7].forEach(y => { const b = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.04, 6), iron)); b.position.y = y; staffG.add(b); });
  const orbG = new THREE.Group(); orbG.position.y = 1.15; staffG.add(orbG);
  const orb = ico(0.09, orbMat); orbG.add(orb);
  for (let k = 0; k < 4; k++) { const a = k / 4 * Math.PI * 2; seg(orbG, [Math.cos(a) * 0.03, -0.12, Math.sin(a) * 0.03], [Math.cos(a) * 0.12, 0.0, Math.sin(a) * 0.12], 0.012, 0.012, ironDk, 4); seg(orbG, [Math.cos(a) * 0.12, 0.0, Math.sin(a) * 0.12], [0, 0.14, 0], 0.012, 0.008, ironDk, 4); }
  const orbFlame = new THREE.Group(); orbFlame.position.y = 0.06; orbG.add(orbFlame);
  [[0, 0.07, 0.2, flameA], [0.03, 0.05, 0.13, flameB], [-0.03, 0.045, 0.12, flameA]].forEach(([x, r, h, m]) => { const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0); const f = new THREE.Mesh(g, m); f.position.x = x; orbFlame.add(f); });
  // 왼손 바닥 위 작은 불꽃
  const palmFlame = new THREE.Group(); palmFlame.position.set(-0.03, -0.66, -0.2); armL.add(palmFlame);
  [[0, 0.05, 0.16, flameA], [0, 0.03, 0.1, flameB]].forEach(([x, r, h, m]) => { const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0); palmFlame.add(new THREE.Mesh(g, m)); });

  // ---------- 다리(로브에 가려 안 보임 — 공용 애니메이션용 빈 그룹) ----------
  const legR = new THREE.Group(), legL = new THREE.Group(); legR.position.set(0.12, 0.5, 0); legL.position.set(-0.12, 0.5, 0); bodyGrp.add(legR, legL);

  // ---------- 드로우콜 병합(움직이는 그룹 · 불꽃은 제외) ----------
  c3MergeStatic(orbFlame); c3MergeStatic(palmFlame);
  [orbFlame, palmFlame].forEach(g => g.traverse(o => { if (o.isMesh) o.userData.fx = true; }));   // 불꽃은 노멀 패스에서 뺀다
  c3MergeStatic(orbG, [orbFlame, orb]);   // 구슬은 던질 때 부풀어 오르므로 따로 둔다
  c3MergeStatic(staffG, [orbG]);
  c3MergeStatic(armR, [staffG]); c3MergeStatic(armL, [palmFlame]);
  c3MergeStatic(headGrp);
  c3MergeStatic(bodyGrp, [headGrp, armR, armL, legR, legL]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp; limbs.staff = staffG;
  let castK = 0;
  // 상시: 불꽃 일렁임 · 구슬·눈·불씨 맥박 · 로브 밑단 흔들림. 던질 때(_pyCast) 구슬이 확 타오른다
  limbs._pyUpdate = function (t, dt) {
    castK = Math.max(0, castK - (dt || 0.016) * 2.2);
    const fl = (g, ph, k) => g.scale.set(0.85 + 0.15 * Math.sin(t * 13 + ph), (0.75 + 0.35 * Math.abs(Math.sin(t * 9.3 + ph))) * k, 0.85 + 0.15 * Math.cos(t * 11 + ph));
    fl(orbFlame, 0, 1 + castK * 1.6); fl(palmFlame, 2.1, 1);
    orbMat.emissiveIntensity = 1.1 + 0.25 * Math.sin(t * 3.3) + castK * 1.8; orb.scale.setScalar(1 + castK * 0.5);
    eyeMat.emissiveIntensity = 1.15 + 0.3 * Math.sin(t * 2.7) + castK * 0.8;
    emberMat.emissiveIntensity = 0.7 + 0.18 * Math.sin(t * 2.42);
  };
  limbs._pyCast = function () { castK = 1; };
}

// ============================================================
//  용병(mercenary) — v879 동료 1단계. 마을 여관에서 고용하면 한 회차 동안 플레이어를 따라다니며 알아서 싸운다.
//  떠돌이 창잡이: 챙 넓은 철모(위에서 내려다보면 둥근 원판 — 이 카메라에서 가장 먼저 읽히는 실루엣) · 붉은 목도리(등 뒤로 늘어진 두 자락) ·
//  사슬 셔츠 위 가죽 조끼 + 붉은 줄 아마 겉옷 · 등에 말아 묶은 담요 · 수염 · 긴 창(날 밑 붉은 술).
//  비율은 플레이어 기사와 같은 SD(골반 0.55 · 어깨 1.0 · 머리 1.3). 몬스터 리그처럼 legR/legL/armR/armL 을 갖는다.
//  자세는 빌더 안의 limbs._mcUpdate 하나로 낸다 — 게임 AI 와 뷰어가 같은 함수·같은 시간표(limbs.MC_T)를 써서 같은 동작이 된다(처형자 _exPose 요령).
//  뷰어(viewers/mercenary_viewer_v1.html)와 게임이 이 함수를 글자 그대로 같이 쓴다. 난수는 자체 LCG.
//  정면 -z(게임 규약). 키 약 1.65(철모 꼭대기) · 서 있을 때 창끝 2.4.
// ============================================================
function buildHellhoundBody(grp, bodyGrp, headGrp, limbs) {
  let _s = 0x6a17c3;
  const rr = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  const jit = (geo, a) => {   // 같은 좌표 같은 오프셋(비인덱스 20면체가 깨진 조각이 되지 않게 — v754)
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
    }
    p.needsUpdate = true; geo.computeVertexNormals(); return geo;
  };
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const ico = (r, mat, d) => sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d), mat));
  const UP = new THREE.Vector3(0, 1, 0);
  const seg = (parent, p, q, r0, r1, mat, sides) => {
    const d = new THREE.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]), len = d.length();
    const g = new THREE.CylinderGeometry(r1, r0, len, sides || 6); g.translate(0, len / 2, 0);
    const m = sh(new THREE.Mesh(g, mat)); m.position.set(p[0], p[1], p[2]);
    m.quaternion.setFromUnitVectors(UP, d.normalize()); parent.add(m); return m;
  };

  // ---------- 팔레트(4막 조명 기준 — 뷰어 '4막' 모드에서 고른다. 베이스를 '보기 좋게' 올리지 말 것) ----------
  const crust   = getLowPolyMat(0x1c1110);   // 굳은 용암 껍질(숯빛 적갈)
  const crustDk = getLowPolyMat(0x0d0707);   // 배·다리 안쪽
  const crustLt = getLowPolyMat(0x2a1a17);   // 빛 받는 어깨·등·머리 윗면
  const boneMat = getLowPolyMat(0x3a3029);   // 드러난 갈비뼈·이빨(그을린 뼈)
  const hornMat = getLowPolyMat(0x0f0b0b), clawMat = getLowPolyMat(0x0b0909);
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  [crust, crustDk, crustLt, boneMat, hornMat, clawMat].forEach(m => { m.userData.mergeInto = hardShared; });
  // 속불 — 바닥 용암 실금과 같은 붉은 주황. 입 속은 한 단 노랗게
  const lavaMat  = new THREE.MeshStandardMaterial({ color: 0x4a1606, emissive: 0xff4a12, emissiveIntensity: 0.85, roughness: 0.6, flatShading: true });
  const mawMat   = new THREE.MeshStandardMaterial({ color: 0x5a2208, emissive: 0xff8a2a, emissiveIntensity: 1.0, roughness: 0.5, flatShading: true });
  const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x5a4010, emissive: 0xffd24a, emissiveIntensity: 1.2, roughness: 0.4 });
  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });

  grp.add(bodyGrp);

  // ---------- 몸통: 깊은 가슴 → 잘록한 허리 → 엉덩이(굶주린 늑대) ----------
  const chest = ico(0.28, crust); chest.scale.set(0.95, 1.05, 1.15); chest.position.set(0, 0.74, -0.32); jit(chest.geometry, 0.025); bodyGrp.add(chest);
  const shoulder = ico(0.22, crustLt); shoulder.scale.set(1.1, 0.7, 1.1); shoulder.position.set(0, 0.88, -0.28); jit(shoulder.geometry, 0.02); bodyGrp.add(shoulder);
  const waist = ico(0.17, crustDk); waist.scale.set(0.95, 0.9, 1.4); waist.position.set(0, 0.74, 0.08); jit(waist.geometry, 0.015); bodyGrp.add(waist);
  const back = ico(0.15, crustLt, 0); back.scale.set(1.0, 0.55, 1.7); back.position.set(0, 0.86, 0.08); bodyGrp.add(back);
  const hips = ico(0.2, crust); hips.scale.set(1.05, 0.95, 1.05); hips.position.set(0, 0.76, 0.38); jit(hips.geometry, 0.02); bodyGrp.add(hips);
  // 옆구리: 껍질이 갈라져 갈비뼈가 드러나고 그 사이로 속불이 비친다(옆·위에서 보인다)
  [-1, 1].forEach(sg => {
    for (let k = 0; k < 4; k++) {
      seg(bodyGrp, [sg * 0.17, 0.86, -0.22 + k * 0.085], [sg * 0.205, 0.66, -0.19 + k * 0.085], 0.02, 0.012, boneMat, 4);
      if (k < 3) { const gl = sh(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.035), lavaMat)); gl.position.set(sg * 0.185, 0.75, -0.177 + k * 0.085); gl.rotation.z = sg * 0.17; bodyGrp.add(gl); }   // 갈비뼈 사이 속불
    }
  });
  // 등·어깨·엉덩이를 타는 용암 실금 — 껍질 표면에 붙은 가는 판
  const crack = (cx, cy, cz, rx, ry, rz, n) => {
    for (let i = 0; i < n; i++) {
      const th = rr() * 6.283, ph = 0.2 + rr() * 1.5;
      const d = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
      const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.07 + rr() * 0.08, 0.016, 0.03), lavaMat));
      m.position.set(cx + d.x * rx, cy + d.y * ry, cz + d.z * rz);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), d); m.rotateZ(rr() * 3.14); bodyGrp.add(m);
    }
  };
  crack(0, 0.88, -0.28, 0.24, 0.155, 0.24, 7);
  crack(0, 0.76, 0.38, 0.21, 0.19, 0.21, 6);
  // 등줄기 가시(불 갈기 사이로 비치는 돌기)
  for (let i = 0; i < 5; i++) seg(bodyGrp, [0, 0.92 - i * 0.012, -0.32 + i * 0.16], [0, 1.0 - i * 0.02, -0.26 + i * 0.16], 0.035, 0.004, hornMat, 4);

  // ---------- 불 갈기: 목덜미에서 엉덩이까지 등줄기를 따라 타오른다(따로 둔다 — 일렁이고, 웅크리면 치솟는다) ----------
  const maneG = new THREE.Group(); maneG.position.set(0, 0.9, 0); bodyGrp.add(maneG);
  const maneN = 7;
  for (let i = 0; i < maneN; i++) {
    // 한 자리에 혀 둘(좌우로 갈라져 기운다) + 속 노란 불 — 한 줄로 곧게 세우면 등지느러미 가시로 읽힌다
    const u = i / (maneN - 1), z = -0.5 + u * 0.82, h = 0.34 - u * 0.18, r = 0.06 - u * 0.022;
    [[-1, flameA, 1.0 + rr() * 0.25], [1, flameA, 0.7 + rr() * 0.25], [0, flameB, 0.55]].forEach(([sd, m, k]) => {
      const g = new THREE.ConeGeometry(r * (sd ? 1 : 0.9), h * k, 4); g.translate(0, h * k / 2, 0);
      const f = new THREE.Mesh(g, m); f.position.set(sd * 0.03 * (i % 2 ? 1 : -1), 0.0 - u * 0.05 + (i === 0 ? 0.08 : 0), z + sd * 0.02);
      f.rotation.set(0.38 + u * 0.2 + rr() * 0.15, 0, sd * (i % 2 ? 1 : -1) * (0.22 + rr() * 0.15)); maneG.add(f);
    });
  }

  // ---------- 머리: 길쭉한 주둥이 · 벌어지는 아래턱(속이 용암) · 뒤로 젖힌 귀 ----------
  const neck = seg(bodyGrp, [0, 0.82, -0.42], [0, 0.98, -0.62], 0.15, 0.12, crust, 7);
  headGrp.position.set(0, 1.0, -0.66); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = ico(0.16, crust); skull.scale.set(1.05, 0.85, 1.15); jit(skull.geometry, 0.015); headGrp.add(skull);
  const brow = ico(0.12, crustLt, 0); brow.scale.set(1.2, 0.45, 1.0); brow.position.set(0, 0.09, -0.03); headGrp.add(brow);
  // 위턱(주둥이) — 끝이 살짝 들린 쐐기
  const snout = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.11, 0.32, 6), crust)); snout.rotation.x = -Math.PI / 2; snout.position.set(0, -0.02, -0.27); jit(snout.geometry, 0.008); headGrp.add(snout);
  const nose = ico(0.04, hornMat, 0); nose.position.set(0, 0.0, -0.43); headGrp.add(nose);
  // 윗니: 주둥이 아래로 드러난 송곳니 둘 + 잔이빨
  [-1, 1].forEach(sg => { const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.08, 4), boneMat)); t.position.set(sg * 0.045, -0.1, -0.36); t.rotation.x = Math.PI; headGrp.add(t); });
  for (let i = 0; i < 4; i++) { const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.01, 0.04, 3), boneMat)); t.position.set((i < 2 ? -1 : 1) * 0.055, -0.085, -0.3 + (i % 2) * 0.06); t.rotation.x = Math.PI; headGrp.add(t); }
  // 입 속(위턱 아래 면) — 턱이 벌어지면 드러난다
  const mawTop = sh(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.28), mawMat)); mawTop.position.set(0, -0.075, -0.25); headGrp.add(mawTop);
  // 아래턱(경첩 = 머리 뒤쪽 아래)
  const jaw = new THREE.Group(); jaw.position.set(0, -0.08, -0.08); headGrp.add(jaw);
  const jawB = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.075, 0.3, 6), crustDk)); jawB.rotation.x = -Math.PI / 2; jawB.position.set(0, -0.03, -0.17); jaw.add(jawB);
  const tongue = sh(new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.018, 0.24), mawMat)); tongue.position.set(0, 0.008, -0.16); jaw.add(tongue);
  [-1, 1].forEach(sg => { const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.06, 4), boneMat)); t.position.set(sg * 0.035, 0.03, -0.28); jaw.add(t); });
  // 눈: 치켜 올라간 노란 불빛(옆·위에서 보이게 머리 윗면 가장자리에)
  [-1, 1].forEach(sg => {
    const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.025, 0.04), eyeMat); e2.position.set(sg * 0.085, 0.04, -0.13); e2.rotation.set(0, sg * 0.5, -sg * 0.35); headGrp.add(e2);
    // 뒤로 젖힌 뿔 같은 귀(세 마디)
    const P = [[sg * 0.08, 0.1, 0.0], [sg * 0.13, 0.2, 0.1], [sg * 0.15, 0.24, 0.24]], R = [0.04, 0.024, 0.004];
    for (let k = 0; k < 2; k++) seg(headGrp, P[k], P[k + 1], R[k], R[k + 1], k ? hornMat : crust, 5);
    // 볼 실금
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.016, 0.12), lavaMat)); ck.position.set(sg * 0.12, -0.02, -0.08); ck.rotation.y = sg * 0.25; headGrp.add(ck);
  });

  // ---------- 다리: 앞다리 곧고 굵게 · 뒷다리는 발목이 뒤로 꺾인 짐승 다리 ----------
  const mkFront = (sg) => {
    const l = new THREE.Group(); l.position.set(sg * 0.17, 0.8, -0.36); bodyGrp.add(l);
    l.add(ico(0.1, crustLt, 0));
    seg(l, [0, 0, 0], [0, -0.38, 0.03], 0.085, 0.06, crust);
    seg(l, [0, -0.38, 0.03], [0, -0.72, -0.01], 0.055, 0.045, crustDk);
    const paw = ico(0.065, crustDk, 0); paw.scale.set(1.0, 0.6, 1.35); paw.position.set(0, -0.76, -0.05); l.add(paw);
    for (let f = 0; f < 3; f++) { const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.06, 4), clawMat)); c.position.set((f - 1) * 0.035, -0.79, -0.13); c.rotation.x = -Math.PI / 2 - 0.3; l.add(c); }
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.16, 0.02), lavaMat)); ck.position.set(sg * 0.06, -0.2, -0.03); ck.rotation.z = sg * 0.1; l.add(ck);
    return l;
  };
  const mkHind = (sg) => {
    const l = new THREE.Group(); l.position.set(sg * 0.16, 0.78, 0.42); bodyGrp.add(l);
    const thigh = ico(0.13, crust); thigh.scale.set(0.75, 1.15, 1.05); thigh.position.set(0, -0.1, -0.02); jit(thigh.geometry, 0.01); l.add(thigh);
    seg(l, [0, -0.12, -0.03], [0, -0.42, 0.14], 0.075, 0.05, crust);
    seg(l, [0, -0.42, 0.14], [0, -0.73, 0.06], 0.045, 0.038, crustDk);
    const paw = ico(0.06, crustDk, 0); paw.scale.set(1.0, 0.6, 1.35); paw.position.set(0, -0.76, 0.02); l.add(paw);
    for (let f = 0; f < 3; f++) { const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.011, 0.05, 4), clawMat)); c.position.set((f - 1) * 0.032, -0.785, -0.05); c.rotation.x = -Math.PI / 2 - 0.3; l.add(c); }
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.02, 0.14), lavaMat)); ck.position.set(sg * 0.1, -0.06, -0.02); ck.rotation.x = 0.4; l.add(ck);
    return l;
  };
  const fR = mkFront(1), fL = mkFront(-1), legR = mkHind(1), legL = mkHind(-1);

  // ---------- 꼬리: 가늘게 처졌다 끝이 들리고 끝에 불 ----------
  const tailGrp = new THREE.Group(); tailGrp.position.set(0, 0.86, 0.55); bodyGrp.add(tailGrp);
  const TP = [[0, 0, 0], [0, -0.06, 0.18], [0, -0.1, 0.36], [0, -0.06, 0.52], [0, 0.04, 0.62]], TR = [0.05, 0.038, 0.028, 0.018, 0.008];
  for (let k = 0; k < 4; k++) seg(tailGrp, TP[k], TP[k + 1], TR[k], TR[k + 1], k % 2 ? crustDk : crust, 5);
  const tipG = new THREE.Group(); tipG.position.set(0, 0.04, 0.62); tailGrp.add(tipG);
  [[0, 0.05, 0.2, flameA], [0, 0.03, 0.13, flameB]].forEach(([x, r, h, m]) => { const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0); const f = new THREE.Mesh(g, m); f.rotation.x = 0.7; tipG.add(f); });

  // ---------- 공용 애니메이션용 빈 팔 ----------
  const armR = new THREE.Group(), armL = new THREE.Group(); bodyGrp.add(armR, armL);

  // ---------- 드로우콜 병합(움직이는 그룹 · 불꽃은 제외) ----------
  c3MergeStatic(maneG); c3MergeStatic(tipG);
  [maneG, tipG].forEach(g => g.traverse(o => { if (o.isMesh) o.userData.fx = true; }));   // 불꽃은 노멀 패스에서 뺀다
  c3MergeStatic(jaw);
  c3MergeStatic(headGrp, [jaw]);
  c3MergeStatic(tailGrp, [tipG]);
  [fR, fL, legR, legL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bodyGrp, [headGrp, maneG, tailGrp, fR, fL, legR, legL, armR, armL]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp;
  limbs.fR = fR; limbs.fL = fL; limbs.jaw = jaw; limbs._crouch = 0; limbs._dash = false;
  const BITE_TOP = Math.PI * 1.05, BITE_END = Math.PI * 0.5;
  let crouchK = 0, dashK = 0, offR = 0, offL = 0, lastR = 0, lastL = 0;
  // 상시: 불꽃 일렁임 · 눈·실금 맥박 · 꼬리 · 앞다리(뒷다리의 대각선 짝) · 물기 · 웅크림 · 질주 자세
  limbs._hhUpdate = function (t, dt) {
    dt = dt || 0.016;
    crouchK += ((limbs._crouch || 0) - crouchK) * Math.min(1, dt * 18);
    dashK += ((limbs._dash ? 1 : 0) - dashK) * Math.min(1, dt * 16);
    const fl = (g, ph, k) => g.scale.set(0.85 + 0.15 * Math.sin(t * 13 + ph), (0.75 + 0.35 * Math.abs(Math.sin(t * 9.3 + ph))) * k, 0.85 + 0.15 * Math.cos(t * 11 + ph));
    fl(maneG, 0, 1 + crouchK * 0.9 + dashK * 0.3); fl(tipG, 3.1, 1 + dashK * 0.5);
    eyeMat.emissiveIntensity = 1.1 + 0.3 * Math.sin(t * 3.1) + crouchK * 1.4;
    lavaMat.emissiveIntensity = 0.75 + 0.18 * Math.sin(t * 2.42) + crouchK * 0.9;
    // 물기: 공용 휘두름의 armR 각도를 읽는다(올라가는 동안 고개를 젖히며 턱을 벌리고, 내려오는 동안 앞으로 덥석)
    const a = armR.rotation.x, up = Math.max(0, Math.min(1, a / BITE_TOP));
    const open = a > BITE_END ? Math.max(0, Math.min(1, (a - BITE_END) / (BITE_TOP - BITE_END))) : 0;
    jaw.rotation.x = -0.75 * Math.max(open, crouchK * 0.55, dashK * 0.8);
    headGrp.rotation.x = 0.32 * up * open - crouchK * 0.28 - dashK * 0.12;
    headGrp.position.z = -0.66 - (up > 0.05 ? (1 - open) * up * 0.12 : 0) - dashK * 0.05;
    // 걷기: 뒷다리는 공용 걷기가 돌린다 → 앞다리는 대각선 짝(앞왼 = 뒤오른)으로 트롯
    // 뒷다리에 얹은 자세(웅크림·질주)는 지난 프레임 몫을 빼고 다시 얹는다 — 돌진 중엔 공용 걷기가 안 돌아 그대로 쌓인다.
    // 공용 걷기가 그사이 새 값을 썼으면(지난번에 쓴 값과 다르면) 그 값이 바탕이다
    const bR = legR.rotation.x === lastR ? legR.rotation.x - offR : legR.rotation.x, bL = legL.rotation.x === lastL ? legL.rotation.x - offL : legL.rotation.x;
    let fRx = bL * 0.85, fLx = bR * 0.85, hR = bR, hL = bL;
    // 웅크림: 몸을 낮추고 앞다리를 내뻗어 버틴다 · 뒷다리를 접는다 · 떤다
    bodyGrp.position.y = -0.13 * crouchK + Math.sin(t * 55) * 0.012 * crouchK;
    bodyGrp.rotation.x = -0.1 * crouchK;
    fRx += 0.55 * crouchK; fLx += 0.55 * crouchK;
    // 질주: 앞다리는 앞으로, 뒷다리는 뒤로 쭉 뻗고 빠르게 번갈아(갤럽)
    if (dashK > 0.01) {
      const g = Math.sin(t * 26);
      fRx = fRx * (1 - dashK) + (0.6 + g * 0.7) * dashK; fLx = fLx * (1 - dashK) + (0.6 + Math.sin(t * 26 + 0.5) * 0.7) * dashK;
      hR = hR * (1 - dashK) + (-0.5 - g * 0.6) * dashK; hL = hL * (1 - dashK) + (-0.5 - Math.sin(t * 26 + 0.5) * 0.6) * dashK;
      bodyGrp.rotation.x += Math.sin(t * 26) * 0.06 * dashK;
    }
    hR -= 0.35 * crouchK; hL -= 0.35 * crouchK;
    offR = hR - bR; offL = hL - bL; legR.rotation.x = hR; legL.rotation.x = hL; lastR = legR.rotation.x; lastL = legL.rotation.x;
    fR.rotation.x = fRx; fL.rotation.x = fLx;
    tailGrp.rotation.y = 0.35 * Math.sin(t * 2.3) * (1 - dashK); tailGrp.rotation.x = 0.12 * Math.sin(t * 3.1) - 0.3 * crouchK + 0.35 * dashK;
  };
}

// ============================================================
//  용암 골렘(lavagolem) — 108층부터 방당 1~2마리 나오는 4막 느린 거인(살덩이 거인 자리).
//  4막 벽과 같은 푸른 회색 육각 현무암 기둥을 쌓아 만든 거인: 기둥 사이 이음매로 용암이 비치고 가슴 한가운데 녹은 핵이 박혀 있다.
//  어깨에 흑요석 결정이 솟고 머리는 어깨 사이에 파묻힌 작은 돌덩이(눈 틈만 빛난다) · 땅에 닿을 듯 긴 팔 끝에 바위 주먹(손마디가 달아오름).
//  위에서 내려다보는 카메라에 가장 잘 보이는 것은 어깨·등·주먹이라 불빛을 거기 몰았다(임프 v854 교훈 — 배는 안 보인다).
//  사람형 리그(limbs.armR/armL/legR/legL)라 공용 애니메이션이 그대로 돌린다. limbs._lgCharge(0..1) = 내려찍기 직전 주먹·핵이 달아오름.
//  뷰어(viewers/lava_golem_viewer_v1.html)와 게임이 이 함수를 글자 그대로 같이 쓴다. 난수는 자체 LCG. 돌·용암이라 markOrganic 제외.
//  정면 -z(게임 규약). 높이 약 2.5(어깨 결정 끝) — 스케일 1.12 로 쓴다.
// ============================================================
function buildLavaGolemBody(grp, bodyGrp, headGrp, limbs) {
  let _s = 0x3b7a91;
  const rr = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  const jit = (geo, a) => {   // 같은 좌표 같은 오프셋(비인덱스 다면체가 깨진 조각이 되지 않게 — v754)
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
    }
    p.needsUpdate = true; geo.computeVertexNormals(); return geo;
  };
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const ico = (r, mat, d) => sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d), mat));
  const hexc = (parent, x, y, z, r, h, mat, rx, rz) => {   // 육각 기둥 한 토막(위아래 반지름을 살짝 다르게)
    const m = sh(new THREE.Mesh(new THREE.CylinderGeometry(r * (0.9 + rr() * 0.12), r, h, 6), mat));
    m.position.set(x, y, z); m.rotation.set(rx || 0, rr() * 1.05, rz || 0); parent.add(m); return m;
  };

  // ---------- 팔레트(4막 조명 기준 — 4막 벽 기둥색 계열. 베이스를 '보기 좋게' 올리지 말 것) ----------
  const basalt   = getLowPolyMat(0x1d2128);   // 푸른 회색 현무암
  const basaltLt = getLowPolyMat(0x2b3039);   // 빛 받는 윗면·어깨
  const basaltDk = getLowPolyMat(0x101318);   // 이음매 그늘·다리 안쪽
  const obsid    = getLowPolyMat(0x120d1c);   // 흑요석 결정(남보라)
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  [basalt, basaltLt, basaltDk, obsid].forEach(m => { m.userData.mergeInto = hardShared; });
  // 용암 — 바닥 실금과 같은 붉은 주황. 핵은 한 단 노랗게
  const lavaMat = new THREE.MeshStandardMaterial({ color: 0x4a1606, emissive: 0xff4a12, emissiveIntensity: 0.85, roughness: 0.6, flatShading: true });
  const coreMat = new THREE.MeshStandardMaterial({ color: 0x5a2208, emissive: 0xff8a2a, emissiveIntensity: 1.0, roughness: 0.5, flatShading: true });
  const fistMat = new THREE.MeshStandardMaterial({ color: 0x3a1206, emissive: 0xff5a18, emissiveIntensity: 0.55, roughness: 0.6, flatShading: true });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x5a4010, emissive: 0xffc040, emissiveIntensity: 1.3, roughness: 0.4 });
  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });

  grp.add(bodyGrp);

  // ---------- 골반·몸통: 기둥 다발 — 아래 좁고 어깨가 넓은 역삼각 ----------
  const pelvis = ico(0.34, basaltDk, 0); pelvis.scale.set(1.25, 0.6, 0.95); pelvis.position.set(0, 1.0, 0.02); bodyGrp.add(pelvis);
  // 몸통 기둥 다발(세로로 선 육각 기둥 일곱 개, 가운데가 높다)
  const TC = [[0, 0, 0.32, 0.95], [-0.3, 0.06, 0.24, 0.8], [0.3, 0.06, 0.24, 0.82], [-0.18, 0.26, 0.22, 0.86], [0.18, 0.26, 0.22, 0.84], [-0.2, -0.22, 0.2, 0.7], [0.2, -0.22, 0.2, 0.72]];
  TC.forEach(([x, z, r, h], i) => hexc(bodyGrp, x, 1.18 + h / 2, z, r, h, i % 3 === 1 ? basaltLt : basalt));
  // 가슴 핵 — 앞 기둥 둘 사이 틈에 박힌 녹은 덩어리 + 틈을 따라 위아래로 흐르는 용암
  const coreG = new THREE.Group(); coreG.position.set(0, 1.62, -0.3); bodyGrp.add(coreG);
  { const c = ico(0.16, coreMat); jit(c.geometry, 0.02); coreG.add(c); }
  [-1, 1].forEach(sg => { const b = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42, 0.06), lavaMat)); b.position.set(sg * 0.12, 1.58, -0.29); b.rotation.z = sg * 0.12; bodyGrp.add(b); });
  // 이음매 용암: 몸통 기둥 사이 세로 실금 + 윗면 가로 실금(위에서 보이는 면)
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + 0.2, r = 0.42, m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.3 + rr() * 0.3, 0.03), lavaMat));
    m.position.set(Math.sin(a) * r, 1.4 + rr() * 0.4, Math.cos(a) * r * 0.8); m.rotation.z = (rr() - 0.5) * 0.5; bodyGrp.add(m);
  }
  for (let i = 0; i < 5; i++) { const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.22 + rr() * 0.16, 0.025, 0.035), lavaMat)); m.position.set((rr() - 0.5) * 0.6, 2.12 + rr() * 0.06, (rr() - 0.5) * 0.4); m.rotation.y = rr() * 3.14; bodyGrp.add(m); }
  // 어깨: 큰 바위 덩어리 + 흑요석 결정 무리(위로 솟는다 — 위 카메라에서 실루엣)
  [-1, 1].forEach(sg => {
    const sb = ico(0.3, basaltLt); sb.scale.set(1.15, 0.85, 1.0); sb.position.set(sg * 0.58, 2.02, 0.02); jit(sb.geometry, 0.03); bodyGrp.add(sb);
    for (let k = 0; k < 3; k++) {
      const h = 0.28 + rr() * 0.22, cr = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.0, 0.07 + rr() * 0.03, h, 5), obsid));
      cr.position.set(sg * (0.55 + (k - 1) * 0.12), 2.22 + h / 2 - 0.04, 0.06 + (k - 1) * 0.1); cr.rotation.set((k - 1) * 0.3, rr(), sg * (0.25 + rr() * 0.3)); bodyGrp.add(cr);
    }
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.025, 0.035), lavaMat)); ck.position.set(sg * 0.56, 2.26, -0.18); ck.rotation.set(0.3, sg * 0.4, 0); bodyGrp.add(ck);
  });
  // 어깨 사이 불꽃(따로 둔다 — 일렁인다)
  const flameG = new THREE.Group(); flameG.position.set(0, 2.12, 0.12); bodyGrp.add(flameG);
  [[0, 0, 0.09, 0.34, flameA], [-0.12, 0.02, 0.06, 0.24, flameA], [0.12, 0.02, 0.06, 0.26, flameA], [0, 0.02, 0.05, 0.2, flameB]].forEach(([x, z, r, h, m]) => {
    const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0); const f = new THREE.Mesh(g, m); f.position.set(x, 0, z); f.rotation.x = 0.25; flameG.add(f);
  });

  // ---------- 머리: 어깨 사이에 파묻힌 작은 돌덩이 · 눈 틈 ----------
  headGrp.position.set(0, 2.18, -0.22); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = ico(0.2, basalt, 0); skull.scale.set(1.1, 0.8, 1.0); jit(skull.geometry, 0.02); headGrp.add(skull);
  const brow = sh(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.07, 0.1), basaltLt)); brow.position.set(0, 0.06, -0.15); brow.rotation.x = 0.25; headGrp.add(brow);
  const eyes = sh(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.03, 0.04), eyeMat)); eyes.position.set(0, 0.0, -0.19); headGrp.add(eyes);
  const jawL = sh(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.04), lavaMat)); jawL.position.set(0, -0.09, -0.18); headGrp.add(jawL);

  // ---------- 팔: 어깨에서 땅 가까이 늘어진 기둥 팔 + 바위 주먹(손마디가 달아오른다) ----------

    hexc(a, sg * 0.06, -0.78, -0.03, 0.15, 0.5, basaltDk, 0.08, sg * 0.04);
    const elbow = sh(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.03, 0.04), lavaMat)); elbow.position.set(sg * 0.06, -0.55, -0.15); a.add(elbow);
    const fistG = new THREE.Group(); fistG.position.set(sg * 0.07, -1.18, -0.06); a.add(fistG);
    const f = ico(0.27, basaltLt); f.scale.set(1.0, 0.9, 1.1); jit(f.geometry, 0.035); fistG.add(f);
    for (let k = 0; k < 4; k++) { const kn = sh(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.06), fistMat)); kn.position.set((k - 1.5) * 0.1, 0.02 - Math.abs(k - 1.5) * 0.03, -0.25); fistG.add(kn); }

    const kn = sh(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.03), lavaMat)); kn.position.set(sg * 0.16, -0.46, -0.12); l.add(kn);
    const foot = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.27, 0.12, 6), basaltDk)); foot.position.set(0, -0.92, -0.06); l.add(foot);
    return l;
  };

  // ---------- 드로우콜 병합(움직이는 그룹 · 불꽃 · 핵은 제외) ----------
  c3MergeStatic(flameG); flameG.traverse(o => { if (o.isMesh) o.userData.fx = true; });   // 불꽃은 노멀 패스에서 뺀다
  c3MergeStatic(headGrp); c3MergeStatic(coreG);
  fists.forEach(g => c3MergeStatic(g));
  [armR, armL].forEach((g, i) => c3MergeStatic(g, [fists[i]]));
  [legR, legL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bodyGrp, [headGrp, coreG, flameG, armR, armL, legR, legL]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp; limbs._lgCharge = 0;
  // 상시: 핵·실금 맥박 · 어깨 불꽃 · 눈. 내려찍기 직전(_lgCharge) 주먹·핵이 하얗게 달아오른다

    fistMat.emissiveIntensity = 0.5 + k * 2.2; fistMat.emissive.setRGB(1, 0.35 + 0.4 * k, 0.09 + 0.4 * k);

  };
}

// ============================================================
//  용암 거수(lavabeast) — 100층 4막 첫 보스. 장판전.
//  등에 4막 벽과 같은 육각 현무암 기둥이 등껍질처럼 솟은 거대한 네발 짐승. 껍질 기둥 사이로 용암이 비치고,
//  낮게 깔린 머리에 앞으로 휜 뿔 둘 · 벌어지는 턱 속이 용암 · 굵은 기둥 다리 · 짧고 굵은 꼬리 끝이 달아오른다.
//  HP 50% 에서 등껍질이 깨져(_lbBreak) 기둥이 기울고 빠지며 그 자리에 화구 넷이 열린다 — 이후 화산탄을 쏘아 올린다.
//  위에서 내려다보는 카메라에 가장 잘 보이는 것은 등껍질이라 불빛을 거기 몰았다(임프 v854 교훈).
//  리그: 뒷다리 = limbs.legR/legL(공용 걷기) · 앞다리는 _lbUpdate 가 대각선 짝으로(트롯 — 사냥개 v856 과 같은 요령, 지난 몫 빼고 얹기).
//        armR/armL 은 빈 그룹 — 공용 근접 휘두름을 읽어 '머리 들이받기'로 바꾼다.
//        limbs._rear(0..1) 앞발 들기(내려찍기) · limbs._charge 질주 · limbs._roar(0..1) 고개 들고 포효.
//  뷰어(viewers/lava_beast_viewer_v1.html)와 게임이 이 함수를 글자 그대로 같이 쓴다. 난수는 자체 LCG. 돌·용암이라 markOrganic 제외.
//  정면 -z(게임 규약). 스케일 1.0 에서 머리 끝 3.6 · 꼬리 끝 4.0 · 옆구리 1.5 · 높이 4.0(실측). 게임·뷰어 둘 다 1.1 배.
// ============================================================
function buildLavaBeastBody(grp, bodyGrp, headGrp, limbs) {
  let _s = 0x2f8e13;
  const rr = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  const jit = (geo, a) => {   // 같은 좌표 같은 오프셋(비인덱스 다면체가 깨진 조각이 되지 않게 — v754)
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
