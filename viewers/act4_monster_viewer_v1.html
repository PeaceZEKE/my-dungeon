  const ico = (r, mat, d) => sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d), mat));
  const UP = new THREE.Vector3(0, 1, 0);
  const seg = (parent, p, q, r0, r1, mat, sides) => {
    const d = new THREE.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]), len = d.length();
    const g = new THREE.CylinderGeometry(r1, r0, len, sides || 6); g.translate(0, len / 2, 0);
    const m = sh(new THREE.Mesh(g, mat)); m.position.set(p[0], p[1], p[2]);
    m.quaternion.setFromUnitVectors(UP, d.normalize()); parent.add(m); return m;
  };

  // ---------- 팔레트(4막 조명 기준 — 골렘·사냥개와 같은 계열. 베이스를 '보기 좋게' 올리지 말 것) ----------
  const hide   = getLowPolyMat(0x1c1312);   // 굳은 용암 가죽(숯빛 적갈)
  const hideDk = getLowPolyMat(0x0d0808);   // 배·다리 안쪽
  const hideLt = getLowPolyMat(0x2a1c19);   // 빛 받는 어깨·머리 윗면
  const basalt = getLowPolyMat(0x1d2128), basaltLt = getLowPolyMat(0x2b3039), basaltDk = getLowPolyMat(0x101318);   // 등껍질 기둥(4막 벽색)
  const hornMat = getLowPolyMat(0x14100f), toothMat = getLowPolyMat(0x3a3029), clawMat = getLowPolyMat(0x0b0909);
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  [hide, hideDk, hideLt, basalt, basaltLt, basaltDk, hornMat, toothMat, clawMat].forEach(m => { m.userData.mergeInto = hardShared; });
  const lavaMat = new THREE.MeshStandardMaterial({ color: 0x4a1606, emissive: 0xff4a12, emissiveIntensity: 0.85, roughness: 0.6, flatShading: true });
  const mawMat  = new THREE.MeshStandardMaterial({ color: 0x5a2208, emissive: 0xff8a2a, emissiveIntensity: 1.0, roughness: 0.5, flatShading: true });
  const ventMat = new THREE.MeshStandardMaterial({ color: 0x5a2208, emissive: 0xffa040, emissiveIntensity: 0.0, roughness: 0.5, flatShading: true });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x5a4010, emissive: 0xffd24a, emissiveIntensity: 1.3, roughness: 0.4 });
  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });

  grp.add(bodyGrp);

  // ---------- 몸통: 넓고 낮은 짐승 몸 + 배 ----------
  const torso = ico(1.3, hide); torso.scale.set(1.25, 0.82, 1.7); torso.position.set(0, 2.0, 0.25); jit(torso.geometry, 0.07); bodyGrp.add(torso);
  const chest = ico(1.0, hideLt); chest.scale.set(1.2, 0.95, 1.0); chest.position.set(0, 2.05, -1.25); jit(chest.geometry, 0.06); bodyGrp.add(chest);
  const belly = ico(1.05, hideDk); belly.scale.set(1.1, 0.6, 1.5); belly.position.set(0, 1.45, 0.25); bodyGrp.add(belly);
  // 옆구리 용암 실금(옆·위에서 보인다)
  [-1, 1].forEach(sg => {
    for (let k = 0; k < 5; k++) {
      const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.4 + rr() * 0.4, 0.07), lavaMat));
      m.position.set(sg * (1.5 - Math.abs(k - 2) * 0.06), 1.9 + (rr() - 0.5) * 0.4, -0.9 + k * 0.55); m.rotation.set((rr() - 0.5) * 0.6, 0, sg * (0.2 + rr() * 0.3)); bodyGrp.add(m);
    }
  });

  // ---------- 등껍질: 육각 현무암 기둥 무리(4막 벽과 같은 기둥) + 기둥 사이 용암 바탕 ----------
  // 껍질은 두 벌을 미리 지어 둔다 — 멀쩡한 것(shellA)과 깨진 것(shellB: 셋에 하나는 떨어져 나가고 나머지는 바깥으로 크게 기욺).
  // 기둥마다 그룹을 두면 메시가 40개 넘게 늘어난다 — 한 벌씩 통째로 합치고 2페이즈에 갈아 끼운다(_lbBreak)
  const shellBase = ico(1.15, lavaMat, 1); shellBase.scale.set(1.15, 0.45, 1.55); shellBase.position.set(0, 2.55, 0.3); bodyGrp.add(shellBase);   // 기둥 틈으로 비치는 용암
  const shellA = new THREE.Group(), shellB = new THREE.Group(); shellB.visible = false; bodyGrp.add(shellA, shellB);
  const HEXR = 0.3, colP = [];
  for (let iz = -5; iz <= 5; iz++) for (let ix = -4; ix <= 4; ix++) {
    const x = (ix + (iz & 1 ? 0.5 : 0)) * HEXR * 1.75, z = 0.3 + iz * HEXR * 1.5;
    const ex = x / 1.35, ez = (z - 0.3) / 1.85; const q = 1 - ex * ex - ez * ez; if (q < 0.08) continue;   // 등 타원 안만
    colP.push({ x, z, ex, ez, top: 2.4 + Math.sqrt(q) * 0.75, h: 0.22 + Math.sqrt(q) * 0.22 + rr() * 0.16, r0: 0.82 + rr() * 0.1, lt: (ix + iz) % 3 === 0, tl: 0.6 + 0.4 * rr() });
  }
  const buildShell = (G, broken) => colP.forEach((c, i) => {
    if (broken && i % 3 === 1) return;
    const g = new THREE.Group(); g.position.set(c.x, c.top - 0.12, c.z); G.add(g);
    const m = sh(new THREE.Mesh(new THREE.CylinderGeometry(HEXR * c.r0, HEXR * 0.9, c.h, 6), c.lt ? basaltLt : basalt)); m.position.y = c.h / 2; m.rotation.y = 0.52; g.add(m);
    const cap = sh(new THREE.Mesh(new THREE.CylinderGeometry(HEXR * 0.78, HEXR * 0.82, 0.05, 6), basaltLt)); cap.position.y = c.h + 0.01; cap.rotation.y = 0.52; g.add(cap);   // 윗면 테(한 단 밝게)
    const k = broken ? 0.5 + 0.6 * c.tl : 0.5;   // 등 곡면을 따라 바깥으로 기운다(깨지면 더)
    g.rotation.set(c.ez * k, 0, -c.ex * k);
    if (broken && i % 4 === 0) { const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, c.h * 0.8, 0.06), lavaMat)); ck.position.set(HEXR * 0.6, c.h * 0.45, 0); g.add(ck); }   // 깨진 기둥 옆면 실금
  });
  buildShell(shellA, false); buildShell(shellB, true);
  // 화구 넷(2페이즈에 열린다 — 평소엔 어두운 딱지) + 그 위 불꽃(fx)
  const vents = [];
  [[-0.55, -0.3], [0.6, 0.1], [-0.3, 0.9], [0.4, 1.3]].forEach(([x, z]) => {
    const v = ico(0.3, ventMat, 0); v.scale.set(1, 0.45, 1); v.position.set(x, 3.15, z); bodyGrp.add(v);
    const fg = new THREE.Group(); fg.position.set(x, 3.25, z); fg.visible = false; bodyGrp.add(fg);
    [[0, 0.16, 0.7, flameA], [0.05, 0.1, 0.45, flameB]].forEach(([dx, r, h, m]) => { const gg = new THREE.ConeGeometry(r, h, 5); gg.translate(0, h / 2, 0); const f = new THREE.Mesh(gg, m); f.position.x = dx; fg.add(f); });
    vents.push(fg);
  });

  // ---------- 머리: 낮게 깔린 넓은 머리 · 앞으로 휜 뿔 둘 · 벌어지는 턱(속이 용암) ----------
  seg(bodyGrp, [0, 2.05, -1.6], [0, 1.85, -2.25], 0.75, 0.62, hide, 7);   // 굵은 목
  headGrp.position.set(0, 1.85, -2.45); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = ico(0.68, hide); skull.scale.set(1.15, 0.78, 1.2); jit(skull.geometry, 0.04); headGrp.add(skull);
  const brow = ico(0.5, hideLt, 0); brow.scale.set(1.5, 0.5, 0.9); brow.position.set(0, 0.32, -0.15); headGrp.add(brow);
  const snout = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 0.8, 6), hide)); snout.rotation.x = -Math.PI / 2; snout.position.set(0, -0.08, -0.75); jit(snout.geometry, 0.02); headGrp.add(snout);
  const mawTop = sh(new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.06, 0.75), mawMat)); mawTop.position.set(0, -0.32, -0.7); headGrp.add(mawTop);
  [-1, 1].forEach(sg => {
    // 뿔: 이마 옆에서 바깥·앞으로 뻗다 위로 휜다(네 마디)
    const P = [[sg * 0.45, 0.3, -0.25], [sg * 0.85, 0.42, -0.55], [sg * 1.05, 0.7, -0.95], [sg * 0.95, 1.05, -1.2]], R = [0.2, 0.15, 0.09, 0.02];
    for (let k = 0; k < 3; k++) seg(headGrp, P[k], P[k + 1], R[k], R[k + 1], hornMat, 6);
    const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.06, 0.08), eyeMat); e2.position.set(sg * 0.38, 0.12, -0.6); e2.rotation.set(0, sg * 0.4, -sg * 0.3); headGrp.add(e2);
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.5), lavaMat)); ck.position.set(sg * 0.6, -0.05, -0.2); ck.rotation.y = sg * 0.3; headGrp.add(ck);
    const tusk = sh(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.35, 4), toothMat)); tusk.position.set(sg * 0.32, -0.45, -1.05); tusk.rotation.x = Math.PI + 0.3; headGrp.add(tusk);
  });
  const jaw = new THREE.Group(); jaw.position.set(0, -0.3, -0.2); headGrp.add(jaw);
  const jawB = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 0.8, 6), hideDk)); jawB.rotation.x = -Math.PI / 2; jawB.position.set(0, -0.12, -0.5); jaw.add(jawB);
  const tongue = sh(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.65), mawMat)); tongue.position.set(0, 0.03, -0.5); jaw.add(tongue);
  [-1, 1].forEach(sg => { const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.25, 4), toothMat)); t.position.set(sg * 0.25, 0.1, -0.85); jaw.add(t); });

  // ---------- 다리: 굵은 육각 기둥 다리 + 넓은 발(발톱) ----------
  const mkLeg = (x, z, front) => {
    const l = new THREE.Group(); l.position.set(x, 1.95, z); bodyGrp.add(l);
    const top = ico(0.55, hideLt); top.scale.set(0.9, 1.0, 1.0); l.add(top);
    seg(l, [0, -0.1, 0], [0, -1.0, front ? -0.05 : 0.1], 0.5, 0.42, hide, 7);
    seg(l, [0, -1.0, front ? -0.05 : 0.1], [0, -1.78, 0], 0.42, 0.4, hideDk, 7);
    const foot = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.55, 0.22, 6), basaltDk)); foot.position.set(0, -1.84, -0.06); l.add(foot);
    for (let f = 0; f < 3; f++) { const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.24, 4), clawMat)); c.position.set((f - 1) * 0.22, -1.9, -0.55); c.rotation.x = -Math.PI / 2 - 0.4; l.add(c); }
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.06), lavaMat)); ck.position.set(x > 0 ? 0.43 : -0.43, -0.75, -0.1); l.add(ck);
    return l;
  };
  const fR = mkLeg(1.15, -1.15, true), fL = mkLeg(-1.15, -1.15, true), legR = mkLeg(1.1, 1.45, false), legL = mkLeg(-1.1, 1.45, false);

  // ---------- 꼬리: 짧고 굵게 · 끝이 달아오른 바위 덩이 ----------
  const tailGrp = new THREE.Group(); tailGrp.position.set(0, 2.0, 2.2); bodyGrp.add(tailGrp);
  const TP = [[0, 0, 0], [0, -0.2, 0.6], [0, -0.45, 1.15], [0, -0.6, 1.6]], TR = [0.45, 0.33, 0.22, 0.12];
  for (let k = 0; k < 3; k++) seg(tailGrp, TP[k], TP[k + 1], TR[k], TR[k + 1], k % 2 ? hideDk : hide, 6);
  const club = ico(0.3, lavaMat, 0); club.position.set(0, -0.62, 1.7); tailGrp.add(club);

  vents.forEach(g => { c3MergeStatic(g); g.traverse(o => { if (o.isMesh) o.userData.fx = true; }); });
  c3MergeStatic(shellA); c3MergeStatic(shellB);
  c3MergeStatic(jaw); c3MergeStatic(headGrp, [jaw]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp;

// ============================================================
//  화염 처형자(executioner) — 110층 4막 보스. 패턴 읽기(2막 흑기사의 지옥판).

//  처형인의 것은 남겼다 — 왼어깨 쇠 견갑 · 엇갈린 가죽 끈 · 쇠 칼라 · 가죽 앞치마와 해골 버클 · 날끝이 달아오른 초승달 대도끼.

  const leather = getLowPolyMat(0x2b1b13), leatherDk = getLowPolyMat(0x1b110c), wood = getLowPolyMat(0x2c1c12), bone = getLowPolyMat(0x6b5f50);

  const cloth = getLowPolyMat(0x1c1517), clothLt = getLowPolyMat(0x2b2024); cloth.side = clothLt.side = THREE.DoubleSide;   // 복면 천(열린 자락이라 양면)
  const iron = getLowPolyMat(0x30333b), ironLt = getLowPolyMat(0x4c515c), ironDk = getLowPolyMat(0x1a1c22);   // 무광 — 금속 재질이면 횃불 하이라이트에 견갑이 흰 공이 됐다

  bodyGrp.position.y = 0; grp.add(bodyGrp);

    seg(kn, [0, 0, 0], [0, -0.32, 0.22], 0.15, 0.1, skinDk, 6);                   // 정강이(뒤로 — 짐승 다리)

  const hip = new THREE.Group(); hip.position.set(0, 1.04, 0); bodyGrp.add(hip);

  for (let i = 0; i < 6; i++) { const a = -Math.PI * 0.85 + i * Math.PI * 0.34, sp = M(new THREE.ConeGeometry(0.035, 0.16, 4), ironLt); sp.position.set(Math.sin(a) * 0.33, 0.66, -0.04 + Math.cos(a) * 0.33); sp.rotation.set(Math.cos(a) * 0.9, 0, -Math.sin(a) * 0.9); torso.add(sp); }

  // ---------- 머리 — 맨 머리는 뿔 달린 해골이고, 1페이즈엔 그 위에 얼굴을 다 덮는 긴 복면을 사슬로 묶어 고정한다 ----------
  headGrp.position.set(0, 2.0, -0.3); headGrp.rotation.x = 0.08; bodyGrp.add(headGrp);
