<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2막 몬스터 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="typeBtn">고블린</button>
  <button class="btn" id="varBtn" style="display:none">일반</button>
  <button class="btn" id="cmpBtn">나란히(예전 · 새)</button>
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="atkBtn">공격</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  용병 — 마을 여관에서 고용하는 동료(v879). 몸은 게임과 같은 buildMercBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);

function buildGhostKnightBody(grp, bodyGrp, headGrp, limbs) {

  }
  const armR = createArm(true), armL = createArm(false);

  // ---------- 무기: 거대 브로드소드(오른손) ----------
  const swordGrp = new THREE.Group();
  const blade = sh(new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.1, 0.05), gkBlade)); blade.position.y = 0.62; swordGrp.add(blade);
  const bladeTip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 4), gkBlade)); bladeTip.position.y = 1.28; swordGrp.add(bladeTip);

  [[0.0, 0.4, 0.1], [0.03, 0.85, 0.08], [-0.02, 0.6, 0.07]].forEach(([x, y, s]) => {

  limbs._gkLegR = legR; limbs._gkLegL = legL; limbs._gkArmR = armR; limbs._gkArmL = armL;
}

function buildDarkKnightBody(grp, bodyGrp, headGrp, limbs) {
  const dkArmor    = getLowPolyMat(0x3a4250, true);

  const dkBlade    = getLowPolyMat(0x4a5260, true);

  const magmaMat   = new THREE.MeshStandardMaterial({ color: 0xff5522, emissive: 0xff3300, emissiveIntensity: 0.6, roughness: 0.5 });
  const magmaCore  = new THREE.MeshStandardMaterial({ color: 0xffcc55, emissive: 0xff8822, emissiveIntensity: 0.9, roughness: 0.4 });

  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; }; // 그림자 끔(성능)
  function makeRag(w, h, mat, jit = 0.04) {
    const g = new THREE.Group();
    const pg = new THREE.PlaneGeometry(w, h, 3, 2);
    const m = new THREE.Mesh(pg, mat); m.material.side = THREE.DoubleSide; sh(m); g.add(m);
    const n = Math.max(3, Math.round(w / 0.12));
    for (let i = 0; i < n; i++) {
      const tw = w / n, tx = -w / 2 + tw * (i + 0.5), th = tw * (1 + Math.random() * 1.4);
      const t = new THREE.Mesh(new THREE.ConeGeometry(tw * 0.55, th, 3), mat); t.material.side = THREE.DoubleSide;
      t.position.set(tx, -h / 2 - th / 2 + 0.02, 0); t.rotation.x = Math.PI; t.rotation.z = (Math.random() - 0.5) * 0.4; sh(t); g.add(t);
    }
    return g;
  }
  function addCrystals(parent, list, mat) {
    list.forEach(([x, y, z, s, ry = 0]) => {
      const c = sh(new THREE.Mesh(new THREE.TetrahedronGeometry(s, 0), mat));

      c.position.set(x, y, z); c.rotation.set(Math.random() * 3, ry, Math.random() * 3); parent.add(c);
    });
  }
  function addPatches(parent, list, mat) {
    list.forEach(([x, y, z, s]) => {
      const p = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), mat));

      p.position.set(x, y, z); p.scale.set(1.2, 1, 0.5); parent.add(p);
    });
  }
  function addSeam(parent, from, to, w, mat) {
    const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
    const len = a.distanceTo(b);
    const seg = sh(new THREE.Mesh(new THREE.BoxGeometry(w, len, w * 0.8), mat));
    seg.position.copy(a).add(b).multiplyScalar(0.5);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    parent.add(seg);
  }

  bodyGrp.position.y = 0.0; grp.add(bodyGrp);

  // ---------- 다리(굵은 판금 + 마그마 링/틈) ----------
  function createLeg(isRight) {
    const legGrp = new THREE.Group(); const sign = isRight ? 1 : -1;
    const thigh = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.18, 0.36, 8), dkIronDk)); thigh.position.y = -0.18; legGrp.add(thigh);
    const tMagma = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.022, 4, 10), magmaMat); tMagma.position.y = -0.02; tMagma.rotation.x = Math.PI / 2; legGrp.add(tMagma);
    const thighP = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.18, 0), dkArmor)); thighP.scale.set(1, 1.3, 0.8); thighP.position.set(0, -0.16, -0.08); legGrp.add(thighP);
    const kneeGrp = new THREE.Group(); kneeGrp.position.y = -0.38; legGrp.add(kneeGrp);
    const knee = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), dkArmor)); kneeGrp.add(knee);
    const kMagma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), magmaMat); kMagma.position.set(0, 0.04, -0.14); kMagma.scale.set(1.4, 0.7, 0.6); kneeGrp.add(kMagma);
    const shin = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.36, 8), dkArmorDk)); shin.position.y = -0.22; kneeGrp.add(shin);
    const foot = sh(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.46), dkArmor)); foot.position.set(0, -0.46, -0.06); kneeGrp.add(foot);
    const toe = sh(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.14, 0.16), dkArmorDk)); toe.position.set(0, -0.49, -0.28); kneeGrp.add(toe);

    addCrystals(knee, [[sign * 0.12, 0.04, -0.1, 0.06], [0, 0.1, -0.14, 0.05]], dkArmorEdge);
    addSeam(kneeGrp, [sign * 0.07, -0.1, -0.16], [sign * 0.08, -0.38, -0.14], 0.016, magmaMat);
    const fEdge = sh(new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.34), dkArmorEdge)); fEdge.position.set(0, -0.37, -0.08); kneeGrp.add(fEdge);
    legGrp.position.set(sign * 0.24, 0.82, 0.04); bodyGrp.add(legGrp);  // 발바닥이 바닥 근처(다른 몹과 동일하게 살짝 묻힘)

  addPatches(torsoGrp, [[0.14, 0.18, -0.5, 0.07], [-0.12, -0.12, -0.5, 0.06], [0.06, -0.28, -0.46, 0.06], [-0.16, 0.1, -0.48, 0.05]], magmaMat);
  addCrystals(torsoGrp, [[0.34, 0.22, -0.32, 0.1], [-0.3, 0.3, -0.3, 0.09], [0.2, -0.2, -0.46, 0.08], [-0.36, -0.05, -0.24, 0.09], [0.05, 0.36, -0.38, 0.07], [0.3, -0.02, -0.36, 0.07]], dkArmorEdge);
  const sternum = sh(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.46, 0.13), dkGold)); sternum.position.set(0, 0.0, -0.48); sternum.rotation.x = 0.1; torsoGrp.add(sternum);
  addSeam(torsoGrp, [-0.22, 0.34, -0.46], [0.06, -0.12, -0.54], 0.024, dkIronDk);
  addSeam(torsoGrp, [0.28, 0.18, -0.44], [0.36, -0.22, -0.36], 0.02, dkIronDk);
  const waist = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.22, 8), dkIronDk)); waist.position.set(0, -0.4, 0.1); torsoGrp.add(waist);
  const belly = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.4, 0.26, 8), dkArmorDk)); belly.scale.set(1.05, 1, 0.95); belly.position.set(0, -0.54, 0.2); torsoGrp.add(belly);
  const skirtF = makeRag(0.4, 0.5, dkClothDk, 0.05); skirtF.position.set(0, -0.85, -0.04); skirtF.rotation.x = -0.22; torsoGrp.add(skirtF);
  const sash = sh(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.62, 0.04), dkStrap)); sash.position.set(0.02, -0.28, -0.2); sash.rotation.z = 0.55; sash.rotation.x = 0.18; torsoGrp.add(sash);
  const beltRing = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.09, 8), dkStrap)); beltRing.position.set(0, -0.38, 0.1); torsoGrp.add(beltRing);
  const buckle = sh(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.06), dkGold)); buckle.position.set(0, -0.38, -0.22); torsoGrp.add(buckle);
  const bMagma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), magmaMat); bMagma.position.set(0, -0.5, -0.18); bMagma.scale.set(1.6, 0.7, 0.6); torsoGrp.add(bMagma);

  // ---------- 머리(뿔 투구 + 곡선 마그마 바이저) ----------
  headGrp.position.set(0, 1.62, -0.34); headGrp.rotation.x = 0.25; grp.add(headGrp);
  const helm = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 2), dkArmor)); helm.scale.set(1.0, 1.08, 1.05); headGrp.add(helm);
  addCrystals(headGrp, [[0.24, 0.14, -0.18, 0.07], [-0.18, 0.26, -0.1, 0.06], [0.1, -0.05, -0.34, 0.06], [-0.22, 0.05, -0.12, 0.06]], dkArmorEdge);
  addSeam(headGrp, [0.05, 0.34, -0.15], [0.2, 0.0, -0.3], 0.018, dkIronDk);
  for (let i = 0; i < 3; i++) { const sp = sh(new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.16, 4), dkArmorEdge)); sp.position.set(0, 0.38 - i * 0.02, -0.08 + i * 0.1); sp.rotation.x = -0.3 - i * 0.2; headGrp.add(sp); }
  const visor = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), dkArmorDk)); visor.scale.set(1.0, 1.15, 0.65); visor.position.set(0, -0.06, -0.28); headGrp.add(visor);
  const ridge = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.08), dkArmorEdge)); ridge.position.set(0, 0.16, -0.36); ridge.rotation.x = 0.3; headGrp.add(ridge);
  // 곡선 마그마 바이저(아래로 볼록한 ∪ 호)

    slotSeg.position.set(x, y, z); slotSeg.rotation.set(0, yaw, roll); visorGrp.add(slotSeg);

  function createArm(isRight) {

    const pMagma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), magmaMat); pMagma.position.set(-sign * 0.1, -0.06, -0.06); pMagma.scale.set(1, 0.6, 0.8); armGrp.add(pMagma);

    const armMagma = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.022, 4, 10), magmaMat); armMagma.position.y = -0.18; armMagma.rotation.x = Math.PI / 2; armGrp.add(armMagma);
    const elbowGrp = new THREE.Group(); elbowGrp.position.y = -0.5; armGrp.add(elbowGrp);
    const elbow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 0), dkArmor)); elbowGrp.add(elbow);
    addCrystals(elbow, [[sign * 0.13, 0.02, -0.08, 0.07], [sign * 0.06, 0.1, 0.06, 0.05]], dkArmorEdge);
    const eMagma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), magmaMat); eMagma.position.set(0, 0.08, -0.06); elbowGrp.add(eMagma);
    const fore = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.4, 8), dkArmorDk)); fore.position.y = -0.24; elbowGrp.add(fore);

  const armR = createArm(true), armL = createArm(false);

  const swordGrp = new THREE.Group();

  // 검날을 감싸는 마그마 불꽃(분노 시에만 보임) — 검날(y 0.15~1.8)을 따라 양옆·끝에 배치
  const swordFlames = [];
  const flameMatBlade = new THREE.MeshBasicMaterial({ color: 0xff6622, transparent: true, opacity: 0.0, fog: false, depthWrite: false });
  const flameMatBladeC = new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.0, fog: false, depthWrite: false });
  for (let i = 0; i < 7; i++) {
    const yy = 0.2 + i * 0.26;                 // 검날 길이를 따라

      }
    }
  };
}

    for (let i = 0; i < 4; i++) { const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.1, 3), boneMat); tooth.position.set(-0.12 + i * 0.08, -0.12, -0.28); headGrp.add(tooth); }

  const eyeMat = new THREE.MeshStandardMaterial({ color: (type === 'skeleton' ? 0x220000 : type === 'ghoul' ? 0xd8ffe6 : 0xaa0000), emissive: (type === 'skeleton' ? 0x110000 : type === 'ghoul' ? 0x86f0b0 : 0x330000), emissiveIntensity: (type === 'skeleton' ? 0.2 : type === 'ghoul' ? 0.7 : 0.4), roughness: 0.6 });
  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), eyeMat); eyeL.position.set(-0.15, 0.1, -0.3);
  const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), eyeMat); eyeR.position.set(0.15, 0.1, -0.3);
  if (type !== 'skeleton') { eyeL.rotation.z = -0.2; eyeR.rotation.z = 0.2; } 
  headGrp.add(eyeL); headGrp.add(eyeR);

  if (type === 'goblin') {
    const ear = new THREE.ConeGeometry(0.1, 0.4, 4); ear.translate(0, 0.2, 0);
    const eL = new THREE.Mesh(ear, skinMat); eL.position.set(-0.25, 0, 0); eL.rotation.z = Math.PI/3; headGrp.add(eL);
    const eR = new THREE.Mesh(ear, skinMat); eR.position.set(0.25, 0, 0); eR.rotation.z = -Math.PI/3; headGrp.add(eR);
    if(isBoss) { const helm = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 1), darkMetal.clone()); helm.position.y = 0.1; headGrp.add(helm); }
  } else if (type === 'orc') {
    const tusk = new THREE.ConeGeometry(0.04, 0.2, 3);
    const tL = new THREE.Mesh(tusk, matSkelBone); tL.position.set(-0.1, -0.05, -0.33); headGrp.add(tL);
    const tR = new THREE.Mesh(tusk, matSkelBone); tR.position.set(0.1, -0.05, -0.33); headGrp.add(tR);
    if(isBoss) { const helm = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 6), darkMetal.clone()); helm.position.y = 0.2; headGrp.add(helm); }
  } else if (type === 'skeleton' && isBoss) {
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.2, 5), getLowPolyMat(0xf6e05e, true)); crown.position.y = 0.3; headGrp.add(crown);
  }

  headGrp.position.y = isOrc ? 1.15 : 0.9; grp.add(headGrp); limbs.head = headGrp;
  if (type === 'ghoul') {
    // 곱사등: 머리를 앞으로(-Z) 쭉 내밀고 살짝 아래로. 몸통도 앞으로 숙임.
    headGrp.position.set(0, 0.82, -0.34); headGrp.rotation.x = 0.35;
    bodyGrp.rotation.x = 0.28; bodyGrp.position.z = 0.06;
  }

  // 오크는 팔다리가 굵음(특히 팔). 어깨에 큰 패드(견갑) 부착.
  const limbGeoThick = new THREE.BoxGeometry(0.30, 0.5, 0.30);
  const createLimb = (x, y, z, isArm) => {
    const l = new THREE.Group();
    const geo = (isOrc && isArm) ? limbGeoThick : limbGeoBase;
    const m = new THREE.Mesh(geo, skinMat); m.position.y = -0.2; m.castShadow = true; l.add(m);
    if (isOrc && isArm) {
      // 두툼한 어깨 견갑 + 팔뚝 근육 덩어리
      const pad = new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 0), armorMat); pad.position.y = 0.08; pad.castShadow = true; l.add(pad);
      const fore = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.26, 0.34), skinMat); fore.position.y = -0.4; fore.castShadow = true; l.add(fore);
    } else if (isBoss) {
      const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), armorMat); p.position.y = 0.05; l.add(p);
    }
    l.position.set(x, y, z); grp.add(l); return l;
  };

  // 오크는 어깨가 넓어 팔 간격도 넓힘
  const armX = isOrc ? 0.5 : 0.35;
  const armY = isOrc ? 0.85 : 0.7;
  const legX = isOrc ? 0.22 : 0.15;
  const legY = isOrc ? 0.5 : 0.4;
  limbs.armR = createLimb(armX, armY, 0, true); limbs.armL = createLimb(-armX, armY, 0, true);
  limbs.legR = createLimb(legX, legY, 0, false); limbs.legL = createLimb(-legX, legY, 0, false);
  if (type === 'ghoul') {
    // 양팔 끝(손)에 길고 굽은 발톱 3개씩
    const clawMat = getLowPolyMat(0x2c2c28);
    for (const arm of [limbs.armR, limbs.armL]) {
      for (let i = 0; i < 3; i++) {
        const claw = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.26, 4), clawMat);
        claw.position.set(-0.06 + i * 0.06, -0.46, -0.05); claw.rotation.x = -0.5; claw.castShadow = true; arm.add(claw);
      }
    }
    // 팔을 약간 앞으로 늘어뜨림(덮치는 자세)
    limbs.armR.rotation.x = 0.5; limbs.armL.rotation.x = 0.5;
  }

  const wpnGrp = new THREE.Group();
  if (type === 'ghoul') {
    // 구울은 무기 없음 — 발톱 손. wpnGrp는 비워 두고 아래에서 양팔 끝에 발톱을 단다.
  } else if (isRanged) {
    // 마법 지팡이: 긴 막대 + 끝에 빛나는 보주
    const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.1, 5), getLowPolyMat(0x3b2a14, false)); staff.position.y = 0.45; staff.castShadow = true;
    const orbMat = new THREE.MeshBasicMaterial({ color: 0x66ccff });
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 0), orbMat); orb.position.y = 1.05;
    wpnGrp.add(staff); wpnGrp.add(orb);
  } else if (type === 'skeleton' && isBoss) { 
    // 보스 스켈레톤만 뼈 곤봉(던지는 무기). 일반 스켈레톤은 아래 else(고블린 검)를 사용.
    const club = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.13, 1.0, 6), matSkelBone); club.position.y = 0.5; club.castShadow = true; wpnGrp.add(club);
    const knob = new THREE.Mesh(new THREE.IcosahedronGeometry(0.18, 0), matSkelBone); knob.position.y = 1.0; knob.castShadow = true; wpnGrp.add(knob);
  } else if (type === 'orc') { 
    // 굵은 나무 자루 + 강철 도끼머리. 일반=한쪽날, 보스=양날.
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 1.2, 6), getLowPolyMat(0x5a3a1a, false)); handle.position.y = 0.45; handle.castShadow = true; wpnGrp.add(handle);
    const steel = getLowPolyMat(0xc2cad2, true);
    const headY = 0.9; // 도끼머리가 붙는 자루 높이

    // 자루를 감싸는 강철 소켓(머리와 자루를 잇는 부분)
    const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.26, 6), steel); socket.position.y = headY; socket.castShadow = true; wpnGrp.add(socket);

    // 한쪽 도끼날(쐐기): 안쪽이 자루(소켓)에 밀착, 바깥으로 갈수록 넓어지는 반달형 날
    // shape는 X(자루에서 바깥 거리)-Y(높이) 평면. 자루 표면 x=0.09에서 시작.
    function makeBlade(dir) { // dir: +1 또는 -1 (자루 기준 어느 쪽으로 뻗을지)
      const shape = new THREE.Shape();
      shape.moveTo(0.08, 0.16);      // 위쪽 안쪽(자루에 붙음)
      shape.lineTo(0.40, 0.30);      // 위쪽 날끝(바깥, 위로 벌어짐)
      shape.quadraticCurveTo(0.52, 0.0, 0.40, -0.30); // 날의 곡선 모서리(반달)
      shape.lineTo(0.08, -0.16);     // 아래쪽 안쪽
      shape.quadraticCurveTo(0.06, 0.0, 0.08, 0.16);  // 안쪽 살짝 오목
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1 });
      geo.translate(0, 0, -0.035);
      const blade = new THREE.Mesh(geo, steel);
      blade.scale.x = dir;           // -1이면 반대쪽으로 미러
      blade.position.y = headY; blade.castShadow = true;
      return blade;
    }
    wpnGrp.add(makeBlade(1));
    if (isBoss) wpnGrp.add(makeBlade(-1)); // 보스는 양날

    // 자루 끝 강철 스파이크
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 5), steel); cap.position.y = 1.08; wpnGrp.add(cap);
  } else { 
    // 고블린 검: 짧은 단검 대신 길쭉한 검(자루+칼날+칼끝)으로 — 휘두를 때 잘 보이게.
    const steelG = darkMetal.clone();
    // 손잡이(자루)
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.22, 5), getLowPolyMat(0x4a3320, false)); grip.position.y = 0.11; grip.castShadow = true; wpnGrp.add(grip);
    // 코등이(가드)
    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.08), steelG); cross.position.y = 0.23; cross.castShadow = true; wpnGrp.add(cross);
    // 칼날(길게)
    const gblade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.8, 0.05), steelG); gblade.position.y = 0.65; gblade.castShadow = true; wpnGrp.add(gblade);
    // 칼끝
    const gtip = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.22, 4), steelG); gtip.position.y = 1.13; gtip.rotation.y = Math.PI / 4; gtip.castShadow = true; wpnGrp.add(gtip);
  }
  // 원거리 캐스터는 푸른 로브(망토)를 두름
  if (isRanged) {
    const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 0.9, 7), getLowPolyMat(0x2b4c8c));
    robe.position.y = 0.45; robe.castShadow = true; grp.add(robe);
    const hood = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.45, 7), getLowPolyMat(0x21407a));
    hood.position.y = 1.05; hood.castShadow = true; grp.add(hood);
  }
  
  if (isBoss) wpnGrp.scale.setScalar(type === 'skeleton' ? 1.05 : 1.5); // 스켈레톤 보스 곤봉은 0.7배 축소
  wpnGrp.position.set(0, -0.3, 0); wpnGrp.rotation.x = -Math.PI/2; limbs.armR.add(wpnGrp);
  limbs.weapon = wpnGrp; // 무기 참조(스켈레톤 보스 투척 시 숨김/복귀용)
  if (v2 && typeof a2Monster === 'function') a2Monster(type, isBoss, isRanged, grp, bodyGrp, headGrp, limbs);
  grp.scale.setScalar(scale * (isBoss ? 1 : 1.10));
  smoothSkinNormals(grp);
  return { obj: grp, limbs, phase: 0, swing: 0, isRanged, type, isBoss };
}

// ---------- 바닥 ----------
const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.05, 48), getLowPolyMat(0x0d1109));
disc.material.roughness = 1.0; disc.receiveShadow = true; scene.add(disc);
discMat = disc.material; applyAct(actIdx);

const TYPES = ['ghoul', 'ghostknight', 'golem', 'wraith', 'courtmage', 'servantwraith', 'darkknight', 'icequeen'], TYPE_NAME = { ghoul: '구울', ghostknight: '유령 기사', golem: '골렘', wraith: '혼령', courtmage: '궁중 마법사', servantwraith: '40층 시종장의 망령', darkknight: '50층 흑기사', icequeen: '60층 얼음 여왕' };
const VARS = ['일반'];
let typeIdx = 0, varIdx = 0, cmpMode = 0;   // 0 나란히 · 1 예전만 · 2 새것만
{ const q = /[?&]type=(\w+)/.exec(location.search); if (q && TYPES.includes(q[1])) typeIdx = TYPES.indexOf(q[1]); const v = /[?&]var=(\d)/.exec(location.search); if (v) varIdx = +v[1]; const c = /[?&]cmp=(\d)/.exec(location.search); if (c) cmpMode = +c[1]; }
let heroes = [];
function rebuild() {
  for (const h of heroes) scene.remove(h.obj);
  heroes = [];
  const type = TYPES[typeIdx], boss = !!A2_BOSS[type], ranged = (type === 'wraith' || type === 'courtmage');
  const sp = boss ? 2.6 : (type === 'golem' ? 1.4 : 0.95);
  const list = cmpMode === 0 ? [[false, sp], [true, -sp]] : cmpMode === 1 ? [[false, 0]] : [[true, 0]];
  for (const [v2, x] of list) {
    const p = makeMonOld(type, boss, ranged, v2); p.obj.position.x = x; p.v2 = v2;
    if (BLOB_ON) p.obj.add(makeBlobShadow((boss ? 2.3 : 1.4) / p.obj.scale.x));
    scene.add(p.obj); heroes.push(p);
  }
  target.y = boss ? ({ servantwraith: 2.3, darkknight: 2.1, icequeen: 2.6 }[type] || 1.5) : (type === 'golem' ? 1.0 : 0.62);
  { const ty = /[?&]ty=([\d.]+)/.exec(location.search); if (ty) target.y = +ty[1]; }
  document.getElementById('typeBtn').textContent = TYPE_NAME[type];
  document.getElementById('varBtn').textContent = VARS[varIdx];
  document.getElementById('cmpBtn').textContent = ['나란히(예전 · 새)', '예전만', '새것만'][cmpMode];
  applyShadowMode(studioShadow); updateCam();
  updateVer();
}
let autoSpin = !/[?&]spin=0/.test(location.search), walking = false, studioShadow = true;
const verEl = document.getElementById('ver');
function updateVer() {
  const real = Math.abs(camZoom - 1) < 0.02;
  let tri = 0, calls = 0;
  for (const h of heroes) if (h.v2) h.obj.traverse(o => { if (o.isMesh && o.visible) { calls++; tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
  verEl.innerHTML = 'act2_monster_viewer v1' + (PX_MODE ? ' · px' : ' · px=0') + '<br>' + ACTS[actIdx].name
    + '<br>' + camZoom.toFixed(1) + '× ' + (real ? '<span style="color:#8ad08a">게임 실제 크기</span>' : '<span style="color:#d08a84">확대</span>')
    + (cmpMode !== 1 ? '<br>새 모델 메시 ' + calls + ' · 삼각형 ' + Math.round(tri) : '');
}
let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 1.0, ZOOM_MAX = 28.0;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => { if (!dragging) return; camYaw -= (e.clientX - lastX) * 0.01; camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01)); lastX = e.clientX; lastY = e.clientY; updateCam(); });
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015))); applyAdaptiveFOV(); updateVer(); }, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (pinching && e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD)))); pinchD = d; applyAdaptiveFOV(); updateVer(); } else if (dragging && e.touches.length === 1) { const t = e.touches[0]; camYaw -= (t.clientX - lastX) * 0.01; camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01)); lastX = t.clientX; lastY = t.clientY; updateCam(); } }, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });
for (const el of document.querySelectorAll('.btn')) { el.addEventListener('mousedown', e => e.preventDefault()); el.addEventListener('click', () => { el.blur(); if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }); }
function applyShadowMode(on) {
  studioShadow = on;
  for (const h of heroes) h.obj.traverse(o => { if (o.isMesh && o.material !== blobMatShared) o.castShadow = on; });
  const el = document.getElementById('shadowBtn'); el.textContent = '그림자: ' + (on ? '켬' : '끔'); el.classList.toggle('on', on);
}
document.getElementById('typeBtn').addEventListener('click', () => { typeIdx = (typeIdx + 1) % TYPES.length; rebuild(); });
document.getElementById('varBtn').addEventListener('click', () => { varIdx = (varIdx + 1) % VARS.length; rebuild(); });
let atkT = -1;
document.getElementById('atkBtn').addEventListener('click', () => { atkT = 0; });
document.getElementById('cmpBtn').addEventListener('click', () => { cmpMode = (cmpMode + 1) % 3; rebuild(); });
document.getElementById('spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.target.textContent = '자동회전: ' + (autoSpin ? '켬' : '끔'); });
document.getElementById('walkBtn').addEventListener('click', e => { walking = !walking; e.target.classList.toggle('on', walking); });
document.getElementById('actBtn').addEventListener('click', e => { actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); e.target.textContent = ACTS[actIdx].name; applyShadowMode(!!ACTS[actIdx].studio); updateVer(); });
document.getElementById('shadowBtn').addEventListener('click', () => applyShadowMode(!studioShadow));
document.getElementById('resetBtn').addEventListener('click', () => { camZoom = 4.0; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer(); });
function onResize() {
  applyAdaptiveFOV(); renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH()); lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH); rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH); bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH); quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) { window.visualViewport.addEventListener('resize', onResize); window.visualViewport.addEventListener('scroll', onResize); }
if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
camZoom = 4.0; applyAdaptiveFOV();
actIdx = 2; applyAct(2); document.getElementById('actBtn').textContent = '2막';
{ const a = /[?&]act=(\d)/.exec(location.search); if (a) { actIdx = +a[1]; applyAct(actIdx); document.getElementById('actBtn').textContent = ACTS[actIdx].name; } }
rebuild(); applyShadowMode(!!ACTS[actIdx].studio);
const clock = new THREE.Clock();
function step(dt) { if (autoSpin) { camYaw += dt * 0.32; updateCam(); } if (atkT >= 0) atkT += dt;
  const T = performance.now() * 0.001;
  for (const h of heroes) {
    const L = h.limbs; if (walking) h.phase += 3.5 * dt * 2.5; else h.phase *= 0.8;
    const s = Math.sin(h.phase);
    if (L.legR) L.legR.rotation.x = s * 0.8; if (L.legL) L.legL.rotation.x = -s * 0.8;
    let aR = -s * 0.5; const aL = s * 0.5;
    const SW = h.isRanged ? 0.5 : 0.62;
    if (atkT >= 0 && atkT < SW) {
      if (h.isRanged) aR = Math.PI * 0.8 - (atkT / 0.5) * Math.PI * 1.2;
      else if (atkT < 0.4) { const w = atkT / 0.4, eo = 1 - (1 - w) * (1 - w); aR = eo * Math.PI * 1.05; }
      else { const p = Math.min(1, (atkT - 0.4) / 0.22); aR = Math.PI * 1.05 - p * p * p * Math.PI * 0.55; }
    }
    if (L.armR) L.armR.rotation.x = aR; if (L.armL) L.armL.rotation.x = aL;
    if (L._gkUpdate) L._gkUpdate(T, dt); if (L._swUpdate) L._swUpdate(T, dt); if (L._cmUpdate) L._cmUpdate(T, dt);
    if (L._glUpdate) L._glUpdate(T, dt, true); if (L._iqUpdate) L._iqUpdate(T, dt);
    if (L._a2Update) L._a2Update(T, dt, walking);
  }
  if (atkT > 0.9) atkT = -1; renderWithPost(scene); }
window.__step = step;
function animate() { step(Math.min(0.05, clock.getDelta())); requestAnimationFrame(animate); }
animate();
</script>
