<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>화염 임프 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="atkBtn">할퀴기</button>
  <button class="btn" id="deadBtn">죽음(폭발)</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="gridBtn">그리드</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  화염 임프 — 4막 기본 근접 몹(91층~). 몸은 게임과 같은 buildFireImpBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);
        graded = mix(col.rgb, uOutline, clamp(line, 0.0, 1.0));
      }

// 조명·왜곡은 게임 그대로이고 화면에 크게만 보인다.

let camZoom = 8.0;   // 보스보다 2.8배 작으므로 기본 배율도 그만큼 높다(1.0 = 게임 실제 크기)

    const baseHorizontal = 2 * Math.atan(Math.tan(baseVRad / 2) * BASE_ASPECT);
    const newVRad = 2 * Math.atan(Math.tan(baseHorizontal / 2) / aspect);
    baseFov = Math.min(105, newVRad * 180 / Math.PI);

//  난수는 자체 LCG(개체마다 같은 모양 — Math.random 을 안 먹는다. THREE 생성자의 uuid 는 호출하는 쪽이 책임진다).
//  정면 -z(게임 규약). 높이 약 1.32(뿔 끝) · 머리 꼭대기 1.20.
// ============================================================
function buildFireImpBody(grp, bodyGrp, headGrp, limbs) {
  let _s = 0x1f3a5c;
  const rr = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  // 같은 좌표의 정점에 같은 오프셋 — 20면체가 비인덱스라 정점마다 흔들면 껍질이 깨진 결정 조각이 된다(CLAUDE.md v754)
  const jit = (geo, a) => {
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
    }
    p.needsUpdate = true; geo.computeVertexNormals(); return geo;
  };
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const ico = (r, mat, d) => sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d), mat));
  const UP = new THREE.Vector3(0, 1, 0);
  // p → q 를 잇는 가늘어지는 6각 기둥(뿔·꼬리·팔다리)
  const seg = (parent, p, q, r0, r1, mat) => {
    const d = new THREE.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]), len = d.length();
    const g = new THREE.CylinderGeometry(r1, r0, len, 6); g.translate(0, len / 2, 0);
    const m = sh(new THREE.Mesh(g, mat)); m.position.set(p[0], p[1], p[2]);
    m.quaternion.setFromUnitVectors(UP, d.normalize()); parent.add(m); return m;
  };

  // ---------- 팔레트(4막 조명에서 역산 — 뷰어 '4막' 모드. 베이스를 '보기 좋게' 올리지 말 것) ----------
  const crust   = getLowPolyMat(0x1a1010);   // 굳은 용암 껍질(숯빛 적갈)
  const crustDk = getLowPolyMat(0x0c0707);   // 그늘진 아래쪽·배 껍질 조각
  const crustLt = getLowPolyMat(0x261718);   // 빛 받는 어깨·눈썹뼈
  const hornMat = getLowPolyMat(0x100c0c);
  const toothMat = getLowPolyMat(0x6e6048);
  const clawMat = getLowPolyMat(0x0c0a0a);
  const membraneMat = getLowPolyMat(0x260906); membraneMat.side = THREE.DoubleSide;
  // 속불: 바닥 용암 실금과 같은 붉은 주황. 핵은 한 단 노랗게(가장 뜨거운 곳)
  const lavaMat = new THREE.MeshStandardMaterial({ color: 0x4a1606, emissive: 0xff4a12, emissiveIntensity: 0.85, roughness: 0.6, flatShading: true });
  const coreMat = new THREE.MeshStandardMaterial({ color: 0x5a2208, emissive: 0xff8a2a, emissiveIntensity: 0.95, roughness: 0.5, flatShading: true });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x5a4010, emissive: 0xffd24a, emissiveIntensity: 1.15, roughness: 0.4 });
  const flameA = new THREE.MeshBasicMaterial({ color: 0xff6a1e }), flameB = new THREE.MeshBasicMaterial({ color: 0xffc456 });
  // 색만 다른 단단한 재질은 한 재질(정점색)로 묶는다 — 드로우콜은 (병합 그룹 × 재질)이다(3막 c3MergeStatic 의 mergeInto 규칙).
  // 날개 막은 양면이라, 발광 재질은 emissive 가 제각각이라 못 묶는다.
  const hardShared = getLowPolyMat(0xffffff); hardShared.vertexColors = true;
  [crust, crustDk, crustLt, hornMat, toothMat, clawMat].forEach(m => { m.userData.mergeInto = hardShared; });

  grp.add(bodyGrp);

  // ---------- 몸통: 앞으로 굽은 가슴 + 볼록한 배 ----------
  const chest = ico(0.22, crust); chest.scale.set(1.15, 1.0, 0.92); chest.position.set(0, 0.80, 0.02); jit(chest.geometry, 0.025); bodyGrp.add(chest);
  const back = ico(0.17, crustLt); back.scale.set(1.2, 0.8, 0.9); back.position.set(0, 0.90, 0.10); jit(back.geometry, 0.02); bodyGrp.add(back);
  const belly = ico(0.17, crustDk); belly.scale.set(1.05, 1.0, 1.0); belly.position.set(0, 0.60, -0.03); jit(belly.geometry, 0.02); bodyGrp.add(belly);
  const hips = ico(0.15, crust, 0); hips.scale.set(1.25, 0.7, 0.95); hips.position.set(0, 0.50, 0.03); bodyGrp.add(hips);
  // 배 속 용암 핵 — 배 앞으로 살짝 튀어나오고 껍질 조각 넷이 덮는다(조각 사이로 빛이 샌다)
  const coreGrp = new THREE.Group(); coreGrp.position.set(0, 0.62, -0.13); bodyGrp.add(coreGrp);
  coreGrp.add(ico(0.11, coreMat));
  [[-0.6, 0.55], [0.62, 0.5], [-0.45, -0.6], [0.5, -0.62]].forEach(([dx, dy]) => {
    const d = new THREE.Vector3(dx, dy, -0.85).normalize();
    const pl = ico(0.065, crustDk, 0); pl.scale.set(1.0, 1.0, 0.45); pl.position.copy(d).multiplyScalar(0.105);
    pl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), d); coreGrp.add(pl);
  });
  // 등·어깨를 타는 용암 실금 — 껍질 표면에 붙은 가는 판(두께는 법선 방향)
  const crack = (cx, cy, cz, rx, ry, rz, n) => {
    for (let i = 0; i < n; i++) {
      const th = rr() * 6.283, ph = 0.25 + rr() * 2.4;
      const d = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
      if (d.z < -0.55) continue;   // 배 앞쪽은 핵이 맡는다
      const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.07 + rr() * 0.08, 0.016, 0.03), lavaMat));
      m.position.set(cx + d.x * rx, cy + d.y * ry, cz + d.z * rz);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), d);
      m.rotateZ(rr() * 3.14); bodyGrp.add(m);
    }
  };
  crack(0, 0.80, 0.02, 0.245, 0.21, 0.195, 10);
  crack(0, 0.90, 0.10, 0.19, 0.13, 0.15, 6);
  // 등 한가운데 갈라진 틈 — 위에서 내려다보는 카메라에 가장 잘 보이는 면이라 여기가 '속불'을 보여 준다(배 핵은 머리에 가린다)
  for (let i = 0; i < 4; i++) { const m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.03 - i * 0.004, 0.02, 0.09), lavaMat)); m.position.set((i % 2 ? 0.02 : -0.02), 1.03 - i * 0.075, 0.08 + i * 0.065); m.rotation.set(-0.7 + i * 0.25, (i % 2 ? 0.4 : -0.4), 0); bodyGrp.add(m); }
  // 어깨 가시
  [-1, 1].forEach(sg => seg(bodyGrp, [sg * 0.2, 0.92, 0.04], [sg * 0.27, 1.06, 0.10], 0.045, 0.006, hornMat));
  // 등뼈 돌기
  for (let i = 0; i < 3; i++) seg(bodyGrp, [0, 0.98 - i * 0.12, 0.2 + i * 0.02], [0, 1.04 - i * 0.12, 0.28 + i * 0.02], 0.03, 0.004, hornMat);

  // ---------- 머리 ----------
  headGrp.position.set(0, 1.0, -0.12); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = ico(0.19, crust); skull.scale.set(1.15, 0.95, 1.05); jit(skull.geometry, 0.018); headGrp.add(skull);
  const snout = ico(0.13, crustDk); snout.scale.set(1.15, 0.7, 0.95); snout.position.set(0, -0.08, -0.11); jit(snout.geometry, 0.012); headGrp.add(snout);
  [-1, 1].forEach(sg => { const b = sh(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.045, 0.07), crustLt)); b.position.set(sg * 0.068, 0.055, -0.165); b.rotation.set(0.35, 0, sg * 0.42); headGrp.add(b); });   // 눈썹뼈 둘 — 안쪽이 내려간 V(성난 얼굴)
  // 찢어진 입 — 속이 용암처럼 빛난다
  for (let i = 0; i < 5; i++) {   // 양끝이 올라간 웃는 입(다섯 조각을 곡선으로 — 한 막대면 그냥 띠로 읽힌다)
    const fx = (i - 2) / 2, m = sh(new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.03 - Math.abs(fx) * 0.008, 0.05), lavaMat));
    m.position.set(fx * 0.1, -0.115 + fx * fx * 0.035, -0.222 + Math.abs(fx) * 0.03); m.rotation.z = fx * 0.45; m.rotation.y = -fx * 0.4; headGrp.add(m);
  }
  for (let i = 0; i < 6; i++) {
    const fx = (i - 2.5) / 2.5, up = i % 2 === 0;
    const t = sh(new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.05, 3), toothMat));
    t.position.set(fx * 0.09, (up ? -0.088 : -0.138) + fx * fx * 0.035, -0.235 + Math.abs(fx) * 0.03); t.rotation.x = up ? Math.PI : 0; headGrp.add(t);
  }
  // 눈: 치켜 올라간 노란 불빛
  [-1, 1].forEach(sg => {
    const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.028, 0.03), eyeMat);
    e2.position.set(sg * 0.075, 0.015, -0.19); e2.rotation.z = -sg * 0.38; headGrp.add(e2);
    // 뾰족한 귀
    seg(headGrp, [sg * 0.16, 0.02, 0.0], [sg * 0.31, 0.07, 0.05], 0.035, 0.004, crust);
    // 뒤로 휜 뿔(네 마디 — 위로 솟았다 뒤로 넘어간다)
    const P = [[sg * 0.09, 0.12, -0.02], [sg * 0.15, 0.25, 0.03], [sg * 0.19, 0.34, 0.13], [sg * 0.18, 0.37, 0.26]], R = [0.045, 0.034, 0.02, 0.004];
    for (let k = 0; k < 3; k++) seg(headGrp, P[k], P[k + 1], R[k], R[k + 1], hornMat);
  });
  // 정수리 불꽃(따로 둔다 — 매 프레임 일렁이고, 노멀 패스에서 빠져 외곽선이 안 생긴다)
  const flameG = new THREE.Group(); flameG.position.set(0, 0.17, 0.03); headGrp.add(flameG);
  const flames = [{ f: flameG, ph: 0 }];   // 불꽃 넷은 한 덩어리로 일렁인다(재질 둘 = 메시 둘)
  [[0, 0, 0, 0.065, 0.26, flameA], [-0.06, -0.02, 0.04, 0.045, 0.18, flameA], [0.06, -0.02, 0.04, 0.045, 0.19, flameA], [0, 0.01, -0.01, 0.035, 0.17, flameB]].forEach(([x, y, z, r, h, m]) => {
    const g = new THREE.ConeGeometry(r, h, 5); g.translate(0, h / 2, 0);
    const f = new THREE.Mesh(g, m); f.position.set(x, y, z); flameG.add(f);
  });

  // ---------- 날개(퇴화한 박쥐 날개 — 뼈대 + 막) ----------
  const wings = [];
  [-1, 1].forEach(sg => {
    const wg = new THREE.Group(); wg.position.set(sg * 0.1, 0.94, 0.15); bodyGrp.add(wg);
    seg(wg, [0, 0, 0], [sg * 0.30, 0.16, 0.10], 0.022, 0.012, hornMat);
    seg(wg, [sg * 0.30, 0.16, 0.10], [sg * 0.40, 0.02, 0.16], 0.012, 0.003, hornMat);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, sg * 0.30, 0.16, 0.10, sg * 0.16, -0.10, 0.12,
                                                                 sg * 0.30, 0.16, 0.10, sg * 0.40, 0.02, 0.16, sg * 0.16, -0.10, 0.12], 3));
    g.computeVertexNormals();
    wg.add(sh(new THREE.Mesh(g, membraneMat)));
    wings.push({ wg, sg });
  });

  // ---------- 꼬리(끝에 불) ----------
  const tailGrp = new THREE.Group(); tailGrp.position.set(0, 0.52, 0.14); bodyGrp.add(tailGrp);
  const TP = [[0, 0, 0], [0, -0.07, 0.17], [0, -0.02, 0.33], [0, 0.10, 0.44], [0, 0.24, 0.47]], TR = [0.045, 0.034, 0.025, 0.016, 0.006];
  for (let k = 0; k < 4; k++) seg(tailGrp, TP[k], TP[k + 1], TR[k], TR[k + 1], k % 2 ? crustDk : crust);
  const tipG = new THREE.Group(); tipG.position.set(0, 0.24, 0.47); tailGrp.add(tipG);
  { const g = new THREE.ConeGeometry(0.04, 0.14, 5); g.translate(0, 0.07, 0); const f = new THREE.Mesh(g, flameA); f.userData.fx = true; tipG.add(f); flames.push({ f: tipG, ph: 4.1 }); }

  // ---------- 팔(가늘고 길다 · 손톱 셋) ----------
  const mkArm = (sg) => {
    const a = new THREE.Group(); a.position.set(sg * 0.26, 0.88, 0.0); bodyGrp.add(a);
    a.add(ico(0.065, crustLt, 0));   // 어깨 관절
    seg(a, [0, 0, 0], [sg * 0.02, -0.25, 0.02], 0.05, 0.04, crust);
    seg(a, [sg * 0.02, -0.25, 0.02], [sg * 0.01, -0.48, -0.06], 0.04, 0.032, crustDk);
    const hand = ico(0.05, crust, 0); hand.position.set(sg * 0.01, -0.51, -0.07); a.add(hand);
    for (let f = 0; f < 3; f++) {
      const fx = (f - 1) * 0.03;
      const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.09, 4), clawMat));
      c.position.set(sg * 0.01 + fx, -0.57, -0.10); c.rotation.x = Math.PI + 0.5; c.rotation.z = fx * 3; a.add(c);
    }
    // 팔뚝 실금 하나
    const ck = sh(new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.09, 0.02), lavaMat)); ck.position.set(sg * 0.035, -0.36, -0.02); a.add(ck);
    a.rotation.z = sg * 0.14; return a;
  };
  const armR = mkArm(1), armL = mkArm(-1);

  // ---------- 다리(짧고 무릎이 앞으로 굽은 짐승 다리) ----------
  const mkLeg = (sg) => {
    const l = new THREE.Group(); l.position.set(sg * 0.12, 0.46, 0.04); bodyGrp.add(l);
    seg(l, [0, 0, 0], [0, -0.19, -0.09], 0.07, 0.05, crust);
    seg(l, [0, -0.19, -0.09], [0, -0.36, 0.05], 0.045, 0.035, crustDk);
    const foot = sh(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.16), crustDk)); foot.position.set(0, -0.425, -0.02); l.add(foot);
    for (let f = 0; f < 3; f++) {
      const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.06, 4), clawMat));
      c.position.set((f - 1) * 0.03, -0.44, -0.12); c.rotation.x = -Math.PI / 2; l.add(c);
    }
    return l;
  };
  const legR = mkLeg(1), legL = mkLeg(-1);

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(flameG); flameG.traverse(o => { if (o.isMesh) o.userData.fx = true; });   // 불꽃은 노멀 패스에서 뺀다(외곽선 없이)
  c3MergeStatic(headGrp, [flameG]);
  c3MergeStatic(coreGrp);
  wings.forEach(w => c3MergeStatic(w.wg));
  c3MergeStatic(tailGrp, [tipG]);
  [armR, armL, legR, legL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bodyGrp, [headGrp, coreGrp, tailGrp, armR, armL, legR, legL, ...wings.map(w => w.wg)]);

  limbs.armR = armR; limbs.armL = armL; limbs.legR = legR; limbs.legL = legL; limbs.bodyGrp = bodyGrp;
  // 상시: 불꽃 일렁임 · 눈·실금 맥박 · 날개 파닥 · 꼬리 흔들기
  limbs._fiUpdate = function (t) {
    for (const F of flames) F.f.scale.set(0.85 + 0.15 * Math.sin(t * 13 + F.ph), 0.75 + 0.35 * Math.abs(Math.sin(t * 9.3 + F.ph * 1.3)), 0.85 + 0.15 * Math.cos(t * 11 + F.ph));
    eyeMat.emissiveIntensity = 1.0 + 0.25 * Math.sin(t * 3.1);
    lavaMat.emissiveIntensity = 0.75 + 0.18 * Math.sin(t * 2.42);
    for (const w of wings) { w.wg.rotation.y = w.sg * (0.25 + 0.3 * Math.sin(t * 7.5)); w.wg.rotation.z = w.sg * 0.12 * Math.sin(t * 7.5 + 0.6); }
    tailGrp.rotation.y = 0.35 * Math.sin(t * 2.3); tailGrp.rotation.x = 0.12 * Math.sin(t * 3.1);
  };
  // 죽음 예고: 0 → 1 동안 배 속 핵이 부풀고 하얗게 달아오르며 온몸 실금이 밝아진다
  limbs._fiSwell = function (k) {
    const s = 1 + 1.1 * k * k; coreGrp.scale.setScalar(s);
    coreMat.emissive.setRGB(1, 0.54 + 0.4 * k, 0.16 + 0.6 * k); coreMat.emissiveIntensity = 0.95 + 1.6 * k;
    lavaMat.emissiveIntensity = 0.85 + 1.4 * k; eyeMat.emissiveIntensity = 1.15 + 1.5 * k;
    // 껍질 전체가 안에서부터 달아오른다 — 핵은 머리에 가려 위에서 안 보이므로, 몸 전체가 빛나야 '곧 터진다'가 읽힌다
    const g = k * k * 0.95;
    for (const m of [hardShared, membraneMat]) { m.emissive.setRGB(1, 0.32 + 0.3 * k, 0.06 + 0.2 * k); m.emissiveIntensity = g; }
  };
}

const impObj = new THREE.Group(); scene.add(impObj);
const bodyGrp = new THREE.Group(), headGrp = new THREE.Group(), limbs = {};
buildFireImpBody(impObj, bodyGrp, headGrp, limbs);
impObj.traverse(o => { if (o.isMesh && !o.userData.fx) _shadowCasters.push(o); });
// 게임은 스케일 0.95 × 1.10(일반 몬스터 배수)로 쓴다
impObj.scale.setScalar(0.95 * 1.10);
if (BLOB_ON) impObj.add(makeBlobShadow(1.2));
// 폭발 섬광(죽음 연출 확인용 — 게임은 spawnShockwave 링 + 섬광)
const blastMat = new THREE.MeshBasicMaterial({ color: 0xff7a2a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const blast = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), blastMat); blast.userData.fx = true; blast.visible = false; scene.add(blast);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xff7733, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
const ring = new THREE.Mesh(new THREE.RingGeometry(1.6 * 0.85, 1.6, 40), ringMat); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.06; ring.userData.fx = true; scene.add(ring);

// ===== 위치 파악용 그리드 + 좌표 숫자 (토글) =====
const gridGroup = new THREE.Group(); gridGroup.visible = false; scene.add(gridGroup);
const grid = new THREE.GridHelper(3, 12, 0x556070, 0x2e3640); grid.position.y = 0.03; gridGroup.add(grid);
function axisLine(from, to, color) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...from), new THREE.Vector3(...to)]);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color }));
}
gridGroup.add(axisLine([-1.6, 0.04, 0], [1.6, 0.04, 0], 0xc0504a));
gridGroup.add(axisLine([0, 0.04, -1.6], [0, 0.04, 1.6], 0x4a6ac0));
gridGroup.add(axisLine([0, 0, 0], [0, 1.7, 0], 0x4aa05a));
function makeLabel(text, x, y, z, color = '#cfd8e0') {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.position.set(x, y, z); spr.scale.set(0.24, 0.12, 1); gridGroup.add(spr);
}
for (let i = -3; i <= 3; i++) {
  if (i !== 0) { const v = i * 0.5; makeLabel(v.toFixed(1), v, 0.06, 0.11, '#d08a84'); makeLabel(v.toFixed(1), 0.13, 0.06, v, '#8a9ad0'); }
}
for (let i = 1; i <= 6; i++) { const y = i * 0.25; makeLabel(y.toFixed(2), 0.11, y, 0, '#8ad08a'); }
makeLabel('+X', 1.7, 0.10, 0, '#e0a0a0'); makeLabel('+Z', 0, 0.10, 1.7, '#a0b0e0'); makeLabel('+Y', 0.14, 1.8, 0, '#a0e0a0');


// ---------- 바닥 ----------
// 게임 던전 바닥과 같은 무광 돌(?srough 기본 1.0).
const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.05, 48), getLowPolyMat(0x0d1109));
disc.material.roughness = 1.0;
disc.position.y = 0.0; disc.receiveShadow = true; scene.add(disc);
discMat = disc.material; applyAct(actIdx);   // 바닥이 생겼으니 현재 모드 색을 다시 입힌다

// ===== 인터랙션 =====
let autoSpin = true, walking = false, walkPhase = 0;
let atkPhase = -1, deadPhase = -1;
let studioShadow = false;

const verEl = document.getElementById('ver');
function updateVer() {
  const real = Math.abs(camZoom - 1) < 0.02;
  verEl.innerHTML = 'fire_imp_viewer ' + VIEWER_VERSION + (PX_MODE ? ' · px' : ' · px=0')
    + '<br>' + ACTS[actIdx].name + ' · 거리 ' + camDist.toFixed(1) + ' (게임과 동일)'
    + '<br>' + camZoom.toFixed(1) + '× '
    + (real ? '<span style="color:#8ad08a">게임 실제 크기</span>' : '<span style="color:#d08a84">확대</span>');
}

let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 1.0, ZOOM_MAX = 28.0;   // 1.0 = 게임에서 실제로 보이는 픽셀 크기
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.01;
  camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01));
  lastX = e.clientX; lastY = e.clientY; updateCam();
});
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015)));
  applyAdaptiveFOV(); updateVer();
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinching && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD))));
    pinchD = d; applyAdaptiveFOV(); updateVer();
  } else if (dragging && e.touches.length === 1) {
    const t = e.touches[0];
    camYaw -= (t.clientX - lastX) * 0.01;
    camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01));
    lastX = t.clientX; lastY = t.clientY; updateCam();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });

// 버튼에 포커스가 남지 않게 한다. 포커스된 요소가 보이는 영역 밖에 걸쳐 있으면 브라우저가
// 그걸 보이게 하려고 문서를 스크롤해서, 캔버스가 밀리고 캐릭터 윗부분만 남는다.
// mousedown 을 막으면 포커스 자체가 안 잡히고, 그래도 잡히는 경우를 대비해 클릭 뒤 blur 한다.
for (const el of document.querySelectorAll('.btn')) {
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('click', () => { el.blur(); if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
}

document.getElementById('spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.target.textContent = '자동회전: ' + (autoSpin ? '켬' : '끔'); });
document.getElementById('walkBtn').addEventListener('click', e => { walking = !walking; e.target.classList.toggle('on', walking); });
document.getElementById('atkBtn').addEventListener('click', () => { if (atkPhase < 0 && deadPhase < 0) atkPhase = 0; });
// 죽음: 핵이 0.6초 부풀고(바닥 고리 = 폭발 반경 1.6 예고) 터진다. 1.6초 뒤 되살아난다
document.getElementById('deadBtn').addEventListener('click', () => { if (deadPhase < 0) { deadPhase = 0; atkPhase = -1; } });
// 게임은 몬스터 그림자를 끄고 블롭으로 대신한다(성능). 스튜디오에서는 형태가 읽히도록 켠다.
function applyShadowMode(on) {
  studioShadow = on;
  for (const o of _shadowCasters) o.castShadow = on;
  impObj.traverse(o => { if (o.isMesh && o !== disc && o.material !== blobMatShared) o.castShadow = on; });
  const el = document.getElementById('shadowBtn');
  el.textContent = '그림자: ' + (on ? '켬' : '끔');
  el.classList.toggle('on', on);
}
document.getElementById('actBtn').addEventListener('click', e => {
  actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); e.target.textContent = ACTS[actIdx].name;
  applyShadowMode(!!ACTS[actIdx].studio);   // 막으로 넘어가면 게임과 같이 그림자를 끈다
  updateVer();
});
document.getElementById('shadowBtn').addEventListener('click', () => applyShadowMode(!studioShadow));
document.getElementById('gridBtn').addEventListener('click', e => { gridGroup.visible = !gridGroup.visible; e.target.classList.toggle('on', gridGroup.visible); });
document.getElementById('resetBtn').addEventListener('click', () => {
  camZoom = 8.0; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer();
});

function onResize() {
  applyAdaptiveFOV();
  renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH());
  lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH);
  // r128의 setSize는 depthTexture를 안 줄인다 — 손으로 맞추지 않으면 리사이즈 후 외곽선이 깨진다.
  rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH);
  bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH);
  quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  // 어떤 이유로든 확대되어 화면이 잘려 보이면(더블탭 확대 등) 다시 맞춘다.
  window.visualViewport.addEventListener('scroll', onResize);
}

if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
  document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
}
applyShadowMode(true);   // 시작은 스튜디오 모드 — 형태를 보라고 그림자를 켠 채로 연다
updateVer();
const clock = new THREE.Clock();
const lerp = (o, key, tgt, k, dt) => { o[key] += (tgt - o[key]) * Math.min(1, dt * k); };
function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (autoSpin) { camYaw += dt * 0.32; updateCam(); }
  limbs._fiUpdate(t);
  const breath = Math.sin(t * 2.2);
  // ---- 이동: 종종걸음(게임 공용 애니메이션처럼 엉덩이·어깨를 x 축으로 흔든다) ----
  if (walking && deadPhase < 0) walkPhase += dt * 9;
  const sw = walking && deadPhase < 0 ? Math.sin(walkPhase) : 0;
  lerp(limbs.legR.rotation, 'x', sw * 0.7, 14, dt); lerp(limbs.legL.rotation, 'x', -sw * 0.7, 14, dt);
  if (atkPhase < 0) { lerp(limbs.armR.rotation, 'x', -sw * 0.6, 14, dt); lerp(limbs.armL.rotation, 'x', sw * 0.6, 14, dt); }
  bodyGrp.position.y = breath * 0.01 + (walking ? Math.abs(Math.sin(walkPhase)) * 0.03 : 0);
  bodyGrp.rotation.x = walking ? 0.12 : 0.04;
  // ---- 할퀴기: 오른팔을 치켜들었다(예고 0.3초) 내리긋는다 ----
  if (atkPhase >= 0) {
    atkPhase += dt;
    if (atkPhase < 0.3) { const e = atkPhase / 0.3; limbs.armR.rotation.x = -2.4 * e; bodyGrp.rotation.y = 0.25 * e; }
    else if (atkPhase < 0.42) { const e = (atkPhase - 0.3) / 0.12; limbs.armR.rotation.x = -2.4 + 3.2 * e; bodyGrp.rotation.y = 0.25 - 0.55 * e; }
    else if (atkPhase < 0.8) { lerp(limbs.armR.rotation, 'x', 0, 8, dt); lerp(bodyGrp.rotation, 'y', 0, 8, dt); }
    else { atkPhase = -1; bodyGrp.rotation.y = 0; }
  }
  // ---- 죽음: 0.6초 부풀며 달아오름 → 폭발 → 1.6초 뒤 복귀 ----
  if (deadPhase >= 0) {
    deadPhase += dt;
    if (deadPhase < 0.6) {
      const k = deadPhase / 0.6; limbs._fiSwell(k);
      impObj.scale.setScalar(0.95 * 1.10 * (1 + 0.35 * k * k));
      impObj.position.x = Math.sin(t * 70) * 0.02 * k;   // 부르르 떤다
      ringMat.opacity = 0.3 + Math.abs(Math.sin(deadPhase * 14)) * 0.45;
    } else if (deadPhase < 1.0) {
      impObj.visible = false; ringMat.opacity = 0;
      const k = (deadPhase - 0.6) / 0.4; blast.visible = true; blast.scale.setScalar(0.3 + 1.4 * Math.sqrt(k)); blastMat.opacity = 0.8 * (1 - k);
    } else { blast.visible = false; }
    if (deadPhase > 1.6) { deadPhase = -1; impObj.visible = true; impObj.position.x = 0; impObj.scale.setScalar(0.95 * 1.10); limbs._fiSwell(0); }
  }
  renderWithPost(scene);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
