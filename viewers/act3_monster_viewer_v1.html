  bloomLight.position.set(0.90, 3.30, 0.04); bodyGrp.add(bloomLight);

  // ---------- 머리 ----------
  headGrp.position.set(0, 1.42, 0.00); headGrp.scale.setScalar(1.26); torsoGrp.add(headGrp); limbs.head = headGrp;
  const skull = lump(0.28, skin, 1); skull.scale.set(1.0, 1.12, 1.05); headGrp.add(skull);
  // 이마·광대·코
  const brow = lump(0.135, skin, 0); brow.scale.set(1.75, 0.60, 0.75); brow.position.set(0, 0.095, -0.225); headGrp.add(brow);
  [-1, 1].forEach(sg => { const bw = lump(0.055, hairMat, 0); bw.scale.set(1.6, 0.5, 0.5); bw.position.set(sg * 0.125, 0.075, -0.275); bw.rotation.z = sg * 0.22; headGrp.add(bw); });
  [-1, 1].forEach(s => { const c = lump(0.09, skin, 0); c.scale.set(1.0, 0.8, 0.7); c.position.set(s * 0.16, -0.02, -0.21); headGrp.add(c); });
  const nose = lump(0.055, skin, 0); nose.scale.set(1.0, 1.9, 1.9); nose.position.set(0, -0.03, -0.28); headGrp.add(nose);
  const noseTip = lump(0.04, skin, 0); noseTip.scale.set(1.1, 0.8, 1.1); noseTip.position.set(0, -0.10, -0.31); headGrp.add(noseTip);
  // 굳게 다문 입
  const mouth = sh(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.022, 0.05), skinDk));
  mouth.position.set(0, -0.165, -0.275); headGrp.add(mouth);
  // 광대 아래 그늘
  [-1, 1].forEach(sg => { const c = lump(0.06, skinDk, 0); c.scale.set(1.1, 0.7, 0.5); c.position.set(sg * 0.155, -0.09, -0.235); headGrp.add(c); });
  // 눈(움푹 들어간 눈두덩 + 흐릿한 빛)
  const eyes = [];
  [-1, 1].forEach(s => {
    const sock = lump(0.062, skinDk, 0); sock.scale.set(1.4, 0.85, 0.5); sock.position.set(s * 0.118, 0.015, -0.255); headGrp.add(sock);
    const g = new THREE.Mesh(new THREE.IcosahedronGeometry(0.021, 0), eyeMat);
    g.position.set(s * 0.118, 0.015, -0.295); headGrp.add(g); eyes.push(g);
  });
  // 백발(뒤로 넘긴 머리)
  tumorShell(headGrp, { cx: 0, cy: 0.16, cz: 0.10, rx: 0.26, ry: 0.16, rz: 0.24, count: 16, rMin: 0.10, rMax: 0.16, mat: hairMat });
  [[0, 0.10, 0.28, 1.5, 0.7, 1.0], [-0.16, 0.04, 0.26, 0.8, 0.9, 0.9], [0.16, 0.04, 0.26, 0.8, 0.9, 0.9]].forEach(p => {
    const h = lump(0.14, hairMat, 1); h.scale.set(p[3], p[4], p[5]); h.position.set(p[0], p[1], p[2]); headGrp.add(h);
  });
  // 흰 수염
  // 턱선을 감싸는 흰 수염(입은 드러나게)
  [[0, -0.30, -0.14, 1.35, 1.0, 1.05], [0, -0.40, -0.04, 1.15, 0.95, 1.0],
   [-0.19, -0.20, -0.10, 0.95, 1.15, 0.95], [0.19, -0.20, -0.10, 0.95, 1.15, 0.95],
   [-0.13, -0.34, -0.18, 0.8, 0.8, 0.8], [0.13, -0.34, -0.18, 0.8, 0.8, 0.8],
   [0, -0.22, 0.10, 1.2, 1.0, 0.9]].forEach(p => {
    const b = lump(0.125, hairMat, 1); b.scale.set(p[3], p[4], p[5]); b.position.set(p[0], p[1], p[2]); headGrp.add(b);
  });
  // 콧수염
  [-1, 1].forEach(sg => {
    const m = lump(0.062, hairMat, 0); m.scale.set(1.5, 0.65, 0.85);
    m.position.set(sg * 0.062, -0.125, -0.255); m.rotation.z = sg * 0.25; headGrp.add(m);
  });
  // 오른쪽 얼굴로 번진 오염 결정
  [[0.22, 0.14, -0.14, 0.075], [0.26, 0.02, -0.06, 0.065], [0.20, -0.14, -0.12, 0.055]].forEach(p => {
    const m = lump(p[3], crystal2, 0); m.position.set(p[0], p[1], p[2]); headGrp.add(m);
  });

  // 부러진 황금 왕관
  const crownGrp = new THREE.Group(); crownGrp.position.set(0, 0.26, 0.01); crownGrp.rotation.set(0.06, 0, -0.05); headGrp.add(crownGrp);
  const band = sh(new THREE.Mesh(new THREE.TorusGeometry(0.245, 0.045, 4, 14), gold));
  band.rotation.x = Math.PI / 2; band.scale.set(1.06, 1, 0.98); crownGrp.add(band);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const broken = (i === 3 || i === 7);                     // 부러진 뿔 두 개
    const h = broken ? 0.09 : (i % 2 ? 0.26 : 0.17);
    const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.05, h, 4), broken ? goldRot : gold));
    c.position.set(Math.sin(a) * 0.245, h / 2 + 0.02, Math.cos(a) * 0.245);
    c.rotation.set(Math.sin(a) * 0.12, a, -Math.cos(a) * 0.12);
    crownGrp.add(c);
    if (i % 3 === 0 && !broken) {
      const gem = lump(0.035, i === 0 ? muscle : verdi, 0);
      gem.position.set(Math.sin(a) * 0.25, 0.03, Math.cos(a) * 0.25); crownGrp.add(gem);
    }
  }
  // 왕관에 자란 오염 결정
  [[0.18, 0.16, 0.08], [0.10, 0.22, -0.14]].forEach(p => {
    const m = lump(0.06, crystal, 0); m.position.set(p[0], p[1], p[2]); crownGrp.add(m);
  });

  // ---------- 부패한 황금 한손검(오른손) ----------
  const swordGrp = new THREE.Group();
  armR.handGrp.add(swordGrp);
  swordGrp.position.set(0, -0.04, -0.04);
  swordGrp.rotation.set(Math.PI + 0.55, 0, -0.14);   // 아래·앞으로 낮게 겨눈 자세
  (function buildSword(g) {
    bone(g, 0, 0, 0, 0.048, 0.052, 0.26, leather);                 // 손잡이
    const pom = lump(0.075, goldHi, 1); pom.scale.set(1, 0.85, 1); pom.position.y = -0.17; g.add(pom);
    plate(g, 0, 0.16, 0, 0.56, 0.09, 0.13, goldHi);                // 십자 가드
    plate(g, -0.20, 0.16, 0, 0.10, 0.10, 0.13, goldRot, 0, 0, 0.3);
    plate(g, 0.20, 0.16, 0, 0.10, 0.10, 0.13, goldRot, 0, 0, -0.3);
    // 검신(부패해 얼룩진 황금)
    plate(g, 0, 0.62, 0, 0.26, 0.86, 0.07, gold);
    plate(g, 0, 1.30, 0, 0.21, 0.54, 0.06, goldRot);
    const tip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.105, 0.30, 4), gold));
    tip.position.set(0, 1.72, 0); tip.rotation.y = Math.PI / 4; tip.scale.set(1.35, 1.2, 0.55); g.add(tip);
    // 검신을 타고 오르는 오염 결정과 녹청
    [[0.10, 0.42, 0.02, 0.075], [-0.10, 0.58, -0.02, 0.065], [0.11, 0.86, 0.01, 0.058],
     [-0.09, 1.06, 0.0, 0.05], [0.09, 1.28, 0.0, 0.042]].forEach(p => {
      const m = lump(p[3], c3rnd() > 0.5 ? crystal : verdi, 0);
      m.scale.set(1.0, 1.2, 0.7); m.position.set(p[0], p[1], p[2]); g.add(m);
    });
    plate(g, 0, 0.68, 0.001, 0.040, 1.46, 0.078, crackMat);        // 검신 중앙의 발광 균열
  })(swordGrp);

  // ---------- 부패한 황금 방패(왼팔) ----------
  const shieldGrp = new THREE.Group();
  armL.elbowGrp.add(shieldGrp);
  shieldGrp.position.set(0, -0.84, 0);              // 아래팔 끝(주먹보다 바깥)
  shieldGrp.rotation.set(-Math.PI / 2, 0, 0);        // 방패면 ⟂ 아래팔 축
  // 카이트 실드 외곽선(위는 둥글고 아래로 갈수록 뾰족해지는 물방울 형태)
  function kiteGeometry(hw, top, bot, depth) {
    const sp = new THREE.Shape();
    sp.moveTo(0, top);
    sp.bezierCurveTo(hw * 0.90, top, hw * 1.00, top * 0.42, hw * 0.97, top * 0.10);
    sp.bezierCurveTo(hw * 0.93, bot * 0.32, hw * 0.54, bot * 0.70, 0, bot);
    sp.bezierCurveTo(-hw * 0.54, bot * 0.70, -hw * 0.93, bot * 0.32, -hw * 0.97, top * 0.10);
    sp.bezierCurveTo(-hw * 1.00, top * 0.42, -hw * 0.90, top, 0, top);
    const g = new THREE.ExtrudeGeometry(sp, {
      depth: depth, bevelEnabled: true, bevelThickness: depth * 0.4,
      bevelSize: 0.04, bevelSegments: 1, curveSegments: 5
    });
    g.translate(0, 0, -depth / 2);
    return g;
  }
  (function buildShield(g) {
    // 방패 정면은 로컬 -z. 팔은 방패 위쪽 1/3 지점을 잡으므로 내용물을 아래로 내린다
    const inner = new THREE.Group(); inner.position.set(0, -0.45, 0); g.add(inner);
    const HW = 0.86, TOP = 0.95, BOT = -1.33;          // 1.72 x 2.28 (기존 대비 2배)
    // 황금 테두리 — 면보다 크게 뒤에 깔아 가장자리가 금테로 보이게
    const rim = sh(new THREE.Mesh(kiteGeometry(HW, TOP, BOT, 0.17), gold));
    inner.add(rim);
    // 방패면
    const face = sh(new THREE.Mesh(kiteGeometry(HW - 0.09, TOP - 0.09, BOT + 0.15, 0.15), shieldFace));
    face.position.z = -0.035; c3JitterShared(face.geometry, 0.022); inner.add(face);
    // 중앙 보스(방패심)
    const boss = lump(0.20, goldHi, 1); boss.scale.set(1, 1, 0.55); boss.position.set(0, 0.30, -0.16); inner.add(boss);
    // 세로 보강대
    plate(inner, 0, -0.30, -0.13, 0.13, 1.30, 0.07, goldRot, 0, 0, 0);
    plate(inner, 0, 0.30, -0.13, 1.30, 0.12, 0.07, goldRot, 0, 0, 0);
    // 부패한 황금 왕관 문장
    plate(inner, 0, 0.60, -0.14, 0.52, 0.09, 0.06, goldRot);
    [-1, 0, 1].forEach(i2 => plate(inner, i2 * 0.17, 0.72, -0.14, 0.09, 0.22, 0.06, goldRot));
    // 아래 뾰족한 끝에서 번져 올라온 오염
    [[-0.40, -0.72, -0.14, 0.17], [0.30, -0.86, -0.13, 0.15], [-0.06, -1.04, -0.12, 0.14],
     [0.48, -0.40, -0.14, 0.13], [-0.56, -0.30, -0.14, 0.12], [0.16, -0.60, -0.15, 0.11],
     [-0.24, -1.26, -0.10, 0.10], [0.62, -0.10, -0.13, 0.10]].forEach(pt => {
      const m = lump(pt[3], c3rnd() > 0.45 ? crystal : verdi, 0);
      m.scale.set(1.1, 1.0, 0.5); m.position.set(pt[0], pt[1], pt[2]); inner.add(m);
    });
    // 발광 균열
    plate(inner, -0.24, -0.52, -0.16, 0.035, 0.80, 0.04, crackMat, 0, 0, 0.42);
    plate(inner, 0.28, -0.30, -0.16, 0.035, 0.62, 0.04, crackMat, 0, 0, -0.34);
    plate(inner, 0.02, -0.94, -0.15, 0.030, 0.46, 0.04, crackMat, 0, 0, 0.16);
    // 뒷면 가죽 손잡이 끈
    plate(inner, 0, 0.52, 0.11, 0.66, 0.10, 0.09, leather, 0, 0, 0.12);
    plate(inner, 0, 0.24, 0.11, 0.52, 0.09, 0.09, leather, 0, 0, -0.10);
  })(shieldGrp);

  // 발밑 잔해는 넣지 않는다(사용자 지시). 예전에는 납작하게 눌린 덩이 14개를 주변에
  // 흩어 놨는데, 이 파이프라인에서는 바닥에 눌어붙은 점막처럼 보였다.

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(swordGrp);
  c3MergeStatic(shieldGrp);
  c3MergeStatic(crownGrp);
  c3MergeStatic(headGrp, [crownGrp]);
  c3MergeStatic(bloomGrp, [glowMesh]);   // 합쳐 둔 발광 덩어리는 따로 둔다(매 프레임 정점이 바뀐다)
  [armR, armL].forEach(a => {
    c3MergeStatic(a.handGrp, [swordGrp]);
    c3MergeStatic(a.elbowGrp, [a.handGrp, shieldGrp]);
    c3MergeStatic(a.armGrp, [a.elbowGrp]);
  });
  [legR, legL].forEach(l => {
    c3MergeStatic(l.footGrp);
    c3MergeStatic(l.kneeGrp, [l.footGrp]);
    c3MergeStatic(l.hipGrp, [l.kneeGrp]);
  });
  c3MergeStatic(clothGrp);
  c3MergeStatic(torsoGrp, [headGrp, armR.armGrp, armL.armGrp, bloomGrp]);
  c3MergeStatic(bodyGrp, [torsoGrp, clothGrp, legR.hipGrp, legL.hipGrp]);

  // 게임 규약 매핑
  limbs.armR = armR.armGrp; limbs.armL = armL.armGrp;
  limbs.legR = legR.hipGrp; limbs.legL = legL.hipGrp;
  limbs.bodyGrp = bodyGrp;
  // 기본 자세(뷰어 REST) — 공용 애니메이션이 x를 0으로 되돌리므로 z·팔꿈치만 유지한다
  armR.armGrp.rotation.z = 0.22; armR.elbowGrp.rotation.x = -0.30;
  armL.armGrp.rotation.z = -0.22; armL.elbowGrp.rotation.x = 1.15;
  limbs._ckUpdate = function (t, dt) {
    const breath = Math.sin(t * 0.9);
    torsoGrp.scale.set(1 + breath * 0.012, 1 + breath * 0.008, 1 + breath * 0.014);
    const pulse = 1.1 + Math.sin(t * 2.2) * 0.5 + Math.sin(t * 0.7) * 0.25;
    // 발광 세기의 맥동 식에도 뷰어의 배수가 들어 있다 — 생성자 값만 낮추면 첫 프레임에 덮인다.
    glowMat.emissiveIntensity = Math.max(0.42, (pulse + 0.9) * 0.386);
    crackMat.emissiveIntensity = Math.max(0.11, (0.8 + Math.sin(t * 1.7) * 0.4) * 0.325);
    bloomLight.intensity = 0.6 + Math.max(0, pulse) * 0.35;
    eyeMat.emissiveIntensity = 0.29 + Math.sin(t * 2.6) * 0.08;
    setGlowPulse(t);   // 발광 핵 맥동(CPU 정점 갱신 — 모든 패스가 같이 움직인다)
    // 무릎은 엉덩이(legR/legL)를 공용 코드가 돌린 만큼 따라 굽힌다
    legR.kneeGrp.rotation.x = Math.max(0, -legR.hipGrp.rotation.x) * 1.1;
    legL.kneeGrp.rotation.x = Math.max(0, -legL.hipGrp.rotation.x) * 1.1;
    clothGrp.rotation.x = -(legR.hipGrp.rotation.x) * 0.30;
  };
}

// ============================================================
//  부패한 구울(rotghoul) — 71층부터 나오는 3막 근접 몹.
//  80층 보스 탐식 구울과 같은 종의 작은 개체로 읽히게 팔레트·질감을 공유한다:
//  종양처럼 뭉친 살덩이(아래 청회색 → 위 분홍) · 팽팽한 배 · 아래턱이 떨어져 나간 입.
//  2막 구울(청색 곱사등)과는 색이 완전히 달라 같은 '구울'이어도 헷갈리지 않는다.
//  사람형 리그(limbs.armR/armL/legR/legL)를 쓰므로 공용 애니메이션이 그대로 돌린다.
//  정면 -z(게임 규약). 높이 약 1.75.
// ============================================================
function buildRotGhoulBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const band = C3_BAND_COLS.map(c => getLowPolyMat(c));
  const fleshAt = (y) => band[Math.max(0, Math.min(band.length - 1, Math.round((y - 0.2) / 1.5 * (band.length - 1))))];
  const boneMat  = getLowPolyMat(0x6a6047);   // 드러난 뼈·이빨(누런 상아)
  const clawMat  = getLowPolyMat(0x0e1220);
  const mouthMat = getLowPolyMat(0x2e1422);
  const gumMat   = getLowPolyMat(0x4c1c2c);
  const bellyMat = getLowPolyMat(0x4c3c12);   // 팽팽한 누런 배
  const soreMat  = new THREE.MeshStandardMaterial({ color: 0x7a1c2c, emissive: 0xc03048, emissiveIntensity: 0.28, roughness: 0.6, flatShading: true });
  const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x6a5a2a, emissive: 0xffa020, emissiveIntensity: 1.0, roughness: 0.4 });
  [...band, mouthMat, gumMat, bellyMat, soreMat].forEach(markOrganic);

  grp.add(bodyGrp);
  bodyGrp.position.y = 0.0;

  // ---------- 몸통(굽은 등 + 팽팽한 배) ----------
  const torso = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 1), band[3]));
  torso.scale.set(1.0, 1.25, 0.85); torso.position.set(0, 1.02, 0.04);
  c3JitterShared(torso.geometry, 0.05); bodyGrp.add(torso);
  c3TumorShell(bodyGrp, { cx: 0, cy: 1.06, cz: 0.06, rx: 0.34, ry: 0.36, rz: 0.28,
    count: 26, rMin: 0.09, rMax: 0.15, matAt: fleshAt, skip: (x, y, z) => z < -0.16 && y < 1.05 });
  // 등에 솟은 혹(2막 구울의 곱사등을 이 종의 실루엣으로 이어받는다)
  const hump = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 1), band[5]));
  hump.scale.set(1.05, 0.9, 1.1); hump.position.set(0, 1.30, 0.22); c3JitterShared(hump.geometry, 0.06); bodyGrp.add(hump);
  c3TumorShell(bodyGrp, { cx: 0, cy: 1.32, cz: 0.24, rx: 0.28, ry: 0.20, rz: 0.24,
    count: 16, rMin: 0.09, rMax: 0.15, matAt: () => band[6] });
  // 팽팽한 배(앞으로 늘어짐)
  const belly = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 1), bellyMat));
  belly.scale.set(1.05, 0.95, 0.85); belly.position.set(0, 0.86, -0.22);
  c3JitterShared(belly.geometry, 0.05); bodyGrp.add(belly);
  // 드러난 갈비뼈 + 발진
  for (let i = 0; i < 3; i++) {
    const rib = sh(new THREE.Mesh(new THREE.TorusGeometry(0.16 - i * 0.02, 0.018, 4, 8, Math.PI), boneMat));
    rib.position.set(0, 1.24 - i * 0.11, -0.12); rib.rotation.x = Math.PI / 2 + 0.25; bodyGrp.add(rib);
  }
  [[-0.28, 1.24, 0.10], [0.30, 1.06, 0.06], [-0.10, 0.86, 0.26]].forEach(p => {
    const so = c3Lump(0.07, soreMat, 0); so.scale.set(1.3, 1.0, 1.3); so.position.set(p[0], p[1], p[2]); bodyGrp.add(so);
  });
  // 등뼈 가시
  for (let i = 0; i < 4; i++) {
    const t = i / 3;
    const sp = sh(new THREE.Mesh(new THREE.ConeGeometry(0.035 - t * 0.012, 0.16 - t * 0.04, 4), boneMat));
    sp.position.set(0, 1.44 - t * 0.34, 0.18 + t * 0.14); sp.rotation.x = -0.6 + t * 0.4; bodyGrp.add(sp);
  }

  // ---------- 머리(아래턱이 떨어져 나가 목구멍이 드러난다) ----------
  headGrp.position.set(0, 1.52, -0.12); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 1), band[6]));
  skull.scale.set(1.0, 0.95, 1.15); c3JitterShared(skull.geometry, 0.04); headGrp.add(skull);
  c3TumorShell(headGrp, { cx: 0, cy: 0.06, cz: 0.04, rx: 0.20, ry: 0.16, rz: 0.20,
    count: 14, rMin: 0.07, rMax: 0.11, matAt: () => band[7] });
  const throat = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.14, 1), mouthMat));
  throat.scale.set(1.0, 1.1, 0.6); throat.position.set(0, -0.14, -0.16); headGrp.add(throat);
  const gum = c3Lump(0.13, gumMat, 1); gum.scale.set(1.15, 0.4, 0.9); gum.position.set(0, -0.02, -0.20); headGrp.add(gum);
  for (let i = 0; i < 6; i++) {   // 윗니만 남았다(아래턱 없음)
    const fx = (i - 2.5) / 2.5;
    const t2 = sh(new THREE.Mesh(new THREE.ConeGeometry(0.030, 0.13 + (i % 2) * 0.05, 4), boneMat));
    t2.rotation.x = Math.PI + 0.18; t2.rotation.z = fx * 0.3;
    t2.position.set(fx * 0.13, -0.11, -0.21 + fx * fx * 0.05); headGrp.add(t2);
  }
  [-1, 1].forEach(sg => {
    const sock = c3Lump(0.055, band[2], 0); sock.scale.set(1.2, 1.0, 0.8); sock.position.set(sg * 0.10, 0.06, -0.19); headGrp.add(sock);
    const gl = new THREE.Mesh(new THREE.IcosahedronGeometry(0.028, 0), eyeMat);
    gl.position.set(sg * 0.10, 0.06, -0.22); headGrp.add(gl);
  });

  // ---------- 긴 팔(무릎 아래까지 늘어진다) ----------
  const mkArm = (sign) => {
    const armGrp = new THREE.Group(); armGrp.position.set(sign * 0.34, 1.34, 0.02); bodyGrp.add(armGrp);
    const upper = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.085, 0.44, 6), band[4]));
    upper.position.y = -0.22; c3JitterShared(upper.geometry, 0.03); armGrp.add(upper);
    c3TumorShell(armGrp, { cx: 0, cy: -0.22, cz: 0, rx: 0.09, ry: 0.20, rz: 0.09, count: 8, rMin: 0.06, rMax: 0.09, matAt: () => band[4] });
    const elbowGrp = new THREE.Group(); elbowGrp.position.y = -0.46; armGrp.add(elbowGrp);
    elbowGrp.add(c3Lump(0.10, band[3], 1));
    const fore = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.070, 0.44, 6), band[3]));
    fore.position.y = -0.22; c3JitterShared(fore.geometry, 0.03); elbowGrp.add(fore);
    const hand = c3Lump(0.10, band[2], 1); hand.position.y = -0.48; hand.scale.set(1.0, 0.9, 1.1); elbowGrp.add(hand);
    for (let f = 0; f < 3; f++) {
      const fx = (f - 1) * 0.06;
      const cl = sh(new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.20, 4), clawMat));
      cl.rotation.x = 0.2; cl.rotation.z = fx * 2.0; cl.position.set(fx, -0.62, -0.03); elbowGrp.add(cl);
    }
    return { armGrp, elbowGrp };
  };
  const armR = mkArm(1), armL = mkArm(-1);
  armR.armGrp.rotation.z = 0.16; armL.armGrp.rotation.z = -0.16;

  // ---------- 짧고 굽은 다리 ----------
  const mkLeg = (sign) => {
    const legGrp = new THREE.Group(); legGrp.position.set(sign * 0.17, 0.70, 0.0); bodyGrp.add(legGrp);
    const thigh = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.10, 0.40, 6), band[1]));
    thigh.position.y = -0.20; c3JitterShared(thigh.geometry, 0.03); legGrp.add(thigh);
    const shin = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.075, 0.34, 6), band[0]));
    shin.position.y = -0.55; c3JitterShared(shin.geometry, 0.03); legGrp.add(shin);
    const foot = c3Lump(0.11, band[0], 1); foot.scale.set(1.0, 0.55, 1.5); foot.position.set(0, -0.70, -0.06); legGrp.add(foot);
    for (let f = 0; f < 3; f++) {
      const cl = sh(new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.10, 4), clawMat));
      cl.rotation.x = -1.9; cl.position.set((f - 1) * 0.06, -0.72, -0.19); legGrp.add(cl);
    }
    return legGrp;
  };
  const legR = mkLeg(1), legL = mkLeg(-1);

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(headGrp);
  [armR, armL].forEach(a => { c3MergeStatic(a.elbowGrp); c3MergeStatic(a.armGrp, [a.elbowGrp]); });
  c3MergeStatic(legR); c3MergeStatic(legL);
  c3MergeStatic(bodyGrp, [headGrp, armR.armGrp, armL.armGrp, legR, legL]);

  limbs.armR = armR.armGrp; limbs.armL = armL.armGrp;
  limbs.legR = legR; limbs.legL = legL;
  limbs.bodyGrp = bodyGrp;
  limbs._rgUpdate = function (t) { eyeMat.emissiveIntensity = Math.max(0.5, 0.9 + Math.sin(t * 2.7) * 0.25); };
}

// ============================================================
//  살덩이 거인(fleshgiant) — 78층부터 나오는 3막 근접 거인.
//  삼킨 것들이 그대로 굳은 살무더기. 몸 곳곳에 다른 얼굴의 입이 열려 있고(작은 아가리),
//  머리는 어깨 살에 파묻혀 거의 안 보인다. 아주 느리고 아주 단단하며 한 방이 묵직하다.
//  골렘(2막)의 자리를 3막에서 대신하되, 돌이 아니라 살이라 휴면·정면 무적 같은 장치는 없다.
//  정면 -z(게임 규약). 높이 약 2.6 — 스케일 1.15로 쓴다(≈3.0).
// ============================================================
function buildFleshGiantBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const band = C3_BAND_COLS.map(c => getLowPolyMat(c));
  const fleshAt = (y) => band[Math.max(0, Math.min(band.length - 1, Math.round((y - 0.2) / 2.3 * (band.length - 1))))];
  const boneMat  = getLowPolyMat(0x6a6047);
  const clawMat  = getLowPolyMat(0x0e1220);
  const mawMat   = new THREE.MeshStandardMaterial({ color: 0x360d18, emissive: 0x8a1020, emissiveIntensity: 0.35, roughness: 0.6, flatShading: true });
  const soreMat  = new THREE.MeshStandardMaterial({ color: 0x7a1c2c, emissive: 0xc03048, emissiveIntensity: 0.28, roughness: 0.6, flatShading: true });
  const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x6a5a2a, emissive: 0xffa020, emissiveIntensity: 1.0, roughness: 0.4 });
  [...band, mawMat, soreMat].forEach(markOrganic);

  grp.add(bodyGrp);

  // 몸 곳곳에 열린 작은 아가리 — 이 종의 정체(삼킨 것들이 굳었다)를 한눈에 보여 준다
  const maws = [];
  const addMaw = (parent, x, y, z, r, ry) => {
    const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
    const cav = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mawMat));
    cav.scale.set(1.0, 1.2, 0.55); g.add(cav);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const t2 = sh(new THREE.Mesh(new THREE.ConeGeometry(r * 0.16, r * 0.62, 4), boneMat));
      t2.position.set(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.94, -r * 0.30);
      t2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-Math.cos(a), -Math.sin(a), 0.4).normalize());
      g.add(t2);
    }
    const glow = new THREE.Mesh(new THREE.IcosahedronGeometry(r * 0.22, 0), soreMat);
    glow.position.set(0, 0, -r * 0.34); g.add(glow);
    maws.push(g); return g;
  };

  // ---------- 몸통(퍼진 살무더기) ----------
  const torsoGrp = new THREE.Group(); bodyGrp.add(torsoGrp);
  const core = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.72, 2), band[3]));
  core.scale.set(1.05, 1.20, 0.90); core.position.set(0, 1.30, 0.06); c3JitterShared(core.geometry, 0.06); torsoGrp.add(core);
  const hip = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), band[1]));
  hip.scale.set(1.10, 0.75, 0.95); hip.position.set(0, 0.68, 0.04); c3JitterShared(hip.geometry, 0.06); torsoGrp.add(hip);
  const inMaw = (x, y, z) => (Math.abs(x) < 0.34 && y > 1.02 && y < 1.52 && z < -0.30) ||
                             (x > 0.30 && x < 0.86 && y > 1.46 && y < 1.86 && z < -0.10);
  c3TumorShell(torsoGrp, { cx: 0, cy: 0.72, cz: 0.04, rx: 0.72, ry: 0.42, rz: 0.62,
    count: 40, rMin: 0.15, rMax: 0.26, matAt: fleshAt, skip: (x, y, z) => y < 0.30 });
  c3TumorShell(torsoGrp, { cx: 0, cy: 1.28, cz: 0.06, rx: 0.74, ry: 0.48, rz: 0.62,
    count: 44, rMin: 0.15, rMax: 0.26, matAt: fleshAt, skip: inMaw });
  c3TumorShell(torsoGrp, { cx: 0, cy: 1.86, cz: 0.04, rx: 0.82, ry: 0.42, rz: 0.60,
    count: 46, rMin: 0.15, rMax: 0.25, matAt: fleshAt, skip: inMaw });
  // 어깨 위로 솟은 봉우리(머리를 파묻는다)
  [-1, 1].forEach(sg => c3TumorShell(torsoGrp, { cx: sg * 0.52, cy: 2.26, cz: 0.06, rx: 0.32, ry: 0.26, rz: 0.32,
    count: 16, rMin: 0.14, rMax: 0.23, matAt: () => band[7] }));
  // 삼킨 것들의 입 — 가슴 정면과 오른 어깨
  addMaw(torsoGrp, 0, 1.28, -0.56, 0.26, 0);
  addMaw(torsoGrp, 0.58, 1.66, -0.34, 0.19, -0.6);
  // 튀어나온 뼈 조각(삼킨 것의 잔해)
  [[-0.66, 1.54, -0.30, 0.24, -0.4, 0.9], [0.44, 0.96, -0.44, 0.20, -0.7, -0.5], [-0.30, 2.06, 0.34, 0.22, -1.1, 0.3]].forEach(p => {
    const b = sh(new THREE.Mesh(new THREE.ConeGeometry(p[3] * 0.24, p[3], 4), boneMat));
    b.position.set(p[0], p[1], p[2]); b.rotation.set(p[4], c3rnd() * 3, p[5]); torsoGrp.add(b);
  });

  // ---------- 머리(어깨 살에 파묻힌 작은 머리) ----------
  headGrp.position.set(0, 2.24, -0.30); bodyGrp.add(headGrp); limbs.head = headGrp;
  const skull = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 1), band[6]));
  skull.scale.set(1.05, 0.90, 0.95); c3JitterShared(skull.geometry, 0.04); headGrp.add(skull);
  addMaw(headGrp, 0, -0.10, -0.22, 0.16, 0);
  [-1, 1].forEach(sg => {
    const gl = new THREE.Mesh(new THREE.IcosahedronGeometry(0.032, 0), eyeMat);
    gl.position.set(sg * 0.11, 0.08, -0.22); headGrp.add(gl);
  });

  // ---------- 거대한 팔(바닥까지 닿는다) ----------
  const mkArm = (sign) => {
    const armGrp = new THREE.Group(); armGrp.position.set(sign * 0.92, 2.02, -0.04); bodyGrp.add(armGrp);
    const upper = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.23, 0.78, 7), band[3]));
    upper.position.y = -0.39; c3JitterShared(upper.geometry, 0.04); armGrp.add(upper);
    c3TumorShell(armGrp, { cx: 0, cy: -0.38, cz: 0, rx: 0.22, ry: 0.36, rz: 0.22, count: 12, rMin: 0.15, rMax: 0.22, matAt: () => band[4] });
    const elbowGrp = new THREE.Group(); elbowGrp.position.y = -0.78; armGrp.add(elbowGrp);
    elbowGrp.add(c3Lump(0.24, band[2], 1));
    const fore = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.21, 0.72, 7), band[2]));
    fore.position.y = -0.38; c3JitterShared(fore.geometry, 0.04); elbowGrp.add(fore);
    c3TumorShell(elbowGrp, { cx: 0, cy: -0.38, cz: 0, rx: 0.20, ry: 0.32, rz: 0.20, count: 10, rMin: 0.14, rMax: 0.20, matAt: () => band[2] });
    const fist = c3Lump(0.28, band[1], 1); fist.scale.set(1.15, 0.95, 1.1); fist.position.y = -0.86; elbowGrp.add(fist);
    for (let f = 0; f < 3; f++) {
      const cl = sh(new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.28, 4), clawMat));
      cl.rotation.x = -2.6; cl.position.set((f - 1) * 0.15, -1.02, -0.20); elbowGrp.add(cl);
    }
    return { armGrp, elbowGrp };
  };
  const armR = mkArm(1), armL = mkArm(-1);
  armR.armGrp.rotation.z = 0.18; armL.armGrp.rotation.z = -0.18;

  // ---------- 짧고 굵은 다리 ----------
  const mkLeg = (sign) => {
    const legGrp = new THREE.Group(); legGrp.position.set(sign * 0.44, 0.68, -0.02); bodyGrp.add(legGrp);
    const thigh = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 0.44, 7), band[1]));
    thigh.position.y = -0.22; c3JitterShared(thigh.geometry, 0.04); legGrp.add(thigh);
    c3TumorShell(legGrp, { cx: 0, cy: -0.22, cz: 0, rx: 0.24, ry: 0.22, rz: 0.24, count: 12, rMin: 0.12, rMax: 0.19, matAt: () => band[0] });
    const foot = c3Lump(0.26, band[0], 1); foot.scale.set(1.05, 0.55, 1.35); foot.position.set(0, -0.52, -0.06); legGrp.add(foot);
    for (let f = 0; f < 3; f++) {
      const cl = sh(new THREE.Mesh(new THREE.ConeGeometry(0.038, 0.16, 4), clawMat));
      cl.rotation.x = -1.9; cl.position.set((f - 1) * 0.14, -0.56, -0.34); legGrp.add(cl);
    }
    return legGrp;
  };
  const legR = mkLeg(1), legL = mkLeg(-1);

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  maws.forEach(m => c3MergeStatic(m));
  c3MergeStatic(headGrp, maws.filter(m => m.parent === headGrp));
  [armR, armL].forEach(a => { c3MergeStatic(a.elbowGrp); c3MergeStatic(a.armGrp, [a.elbowGrp]); });
  c3MergeStatic(legR); c3MergeStatic(legL);
  c3MergeStatic(torsoGrp, maws.filter(m => m.parent === torsoGrp));
  c3MergeStatic(bodyGrp, [torsoGrp, headGrp, armR.armGrp, armL.armGrp, legR, legL]);

  limbs.armR = armR.armGrp; limbs.armL = armL.armGrp;
  limbs.legR = legR; limbs.legL = legL;
  limbs.bodyGrp = bodyGrp;
  limbs._fgUpdate = function (t) {
    // 몸 곳곳의 입이 제각각 벌렁거린다(위상이 같으면 한 덩어리로 숨쉬는 것처럼 보인다)
    maws.forEach((m, i) => { const k = 1 + Math.sin(t * 1.7 + i * 2.1) * 0.14; m.scale.set(k, 2 - k, 1); });
    soreMat.emissiveIntensity = 0.24 + Math.sin(t * 1.5) * 0.12;
    eyeMat.emissiveIntensity = Math.max(0.5, 0.9 + Math.sin(t * 2.4) * 0.25);
    const breath = Math.sin(t * 0.8);
    torsoGrp.scale.set(1 + breath * 0.010, 1 + breath * 0.008, 1 + breath * 0.010);
  };
}

// 3막 곤충 공용 리그 구동 — 삼각보행 + 몸통 흔들림 + 턱 씹기.
// 사람형(legR/legL을 x축으로 흔드는 것)과 구조가 달라 별도 경로를 탄다.
// 다리 뿌리는 z회전으로 벌어져 있으므로 앞뒤 스윙은 x, 들어올림은 z로 준다.
function updateBugRig(e, dt, moving) {
  const B = e.limbs.bug;
  if (B.fly) {
    // 비행형(농침벌): 날갯짓은 '흐릿한 부채'로 만들어 두고(고정 각도로 겹친 날개 두 장)
    // 그룹만 천천히 흔든다. 초당 수십 회로 실제 회전시키면 60fps에서 앨리어싱이 나
    // 날개가 툭툭 끊겨 보인다 — 어느 프레임레이트에서도 같게 보이는 쪽을 골랐다.
    const T = performance.now() * 0.001;
    for (let i = 0; i < B.wings.length; i++) {
      const w = B.wings[i];
      w.rotation.z = w.userData._bz + Math.sin(T * 7.0 + i * Math.PI) * 0.16;
      w.rotation.y = w.userData._by + Math.sin(T * 5.0 + i) * 0.10;
    }
    e.obj.position.y = e.baseY + B.fly + Math.sin(T * 2.4 + e.phase) * 0.11;
    B.bodyGrp.rotation.x = (moving ? -0.16 : -0.04) + Math.sin(T * 1.9 + e.phase) * 0.05;
    B.bodyGrp.rotation.z = Math.sin(T * 1.3 + e.phase) * 0.05;
    if (B.abGrp) B.abGrp.rotation.x = B.abBase + Math.sin(T * 2.6 + e.phase) * 0.10;  // 배를 말았다 폈다(독침 겨냥)
    return;
  }
  B.walk += (moving ? Math.min(3.2, e.speed) * 3.6 : 0) * dt;
  if (!moving) B.walk += dt * 0.7;   // 멈춰 있어도 더듬거리게(완전 정지는 인형처럼 보인다)
  const w = B.walk, amp = moving ? 1 : 0.22;
  for (const L of B.legs) {
    const s = Math.sin(w + L.phase);
    const lift = Math.max(0, Math.sin(w + L.phase + Math.PI * 0.5));
    L.femurGrp.rotation.x = s * 0.30 * amp;
    L.femurGrp.rotation.z = L.baseFemur + L.side * lift * 0.22 * amp;   // 들어올릴 때 뿌리를 세운다
    L.kneeGrp.rotation.z = L.baseKnee - L.side * lift * 0.34 * amp;     // 무릎은 반대로 접는다
  }
  // 몸통은 다리 두 조가 번갈아 딛는 만큼 좌우로 기울고 위아래로 눌린다
  B.bodyGrp.rotation.z = Math.sin(w) * 0.05 * amp;
  B.bodyGrp.rotation.x = Math.sin(w * 2) * 0.03 * amp;
  e.obj.position.y = e.baseY + Math.abs(Math.sin(w)) * (B.bob || 0.05) * e.scale;
  // 턱: 공격 모션 동안 두 번 씹는다
  if (B.jawGrp) {
    const atk = e.swingTimer > 0 ? 1 : 0;
    B.chomp += (atk - B.chomp) * Math.min(1, dt * 14);
    const c = Math.abs(Math.sin(e.phase * 3.0));
    B.jawGrp.rotation.x = B.chomp * c * 0.55;
  }
  // 배는 늘 숨쉰다(3막 산호와 같은 호흡감)
  const Tw = performance.now() * 0.001;
  if (B.sacGrp) { const b = 1 + Math.sin(Tw * 1.6 + e.phase) * 0.035; B.sacGrp.scale.set(b, 2 - b, b); }
  // 알 무더기는 껍질과 다른 속도로 아주 천천히 돈다 — 알이 안에서 서로 밀리는 것처럼 읽힌다
  if (B.eggGrp) B.eggGrp.rotation.y += dt * 0.12;
  // 늘어진 점액은 뭉치 단위로 흔들린다(뭉치마다 위상이 달라야 한 덩어리로 안 보인다)
  if (B.ooze) for (const o of B.ooze) { o.g.rotation.z = Math.sin(Tw * 1.1 + o.ph) * 0.10; o.g.rotation.x = Math.sin(Tw * 0.9 + o.ph * 1.4) * 0.08; }
}

// ===== 시종장의 망령(servantwraith) 전용 외형: 촛대 든 신사형 영체 보스 =====
// 뷰어(servant_wraith_viewer v17)를 게임 규약(limbs.*.rotation.x 구동)에 맞춰 이식.

const A3_CUSTOM = { sporeling: buildSporelingBody, stingwasp: buildStingwaspBody, rotghoul: buildRotGhoulBody, fleshgiant: buildFleshGiantBody, broodtick: buildBroodTickBody, gluttonghoul: buildGluttonGhoulBody, corruptking: buildCorruptKingBody, rotheart: buildRotHeartBody };
const A3_SCALE = { sporeling: 1.05, stingwasp: 0.95, rotghoul: 1.0, fleshgiant: 1.15, broodtick: 1.0, gluttonghoul: 2.0, corruptking: 1.0, rotheart: 1.0 };
const A3_BOSS = { broodtick: 1, gluttonghoul: 1, corruptking: 1, rotheart: 1 };
function makeMonOld(type, isBoss, isRanged, v2) {
  isBoss = !!A3_BOSS[type]; isRanged = (type === 'stingwasp');
