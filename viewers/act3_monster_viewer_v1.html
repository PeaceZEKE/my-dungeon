<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3막 몬스터 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="typeBtn">고블린</button>
  <button class="btn" id="varBtn" style="display:none">일반</button>
  <button class="btn" id="cmpBtn">나란히(예전 · 새)</button>
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="atkBtn">공격</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  용병 — 마을 여관에서 고용하는 동료(v879). 몸은 게임과 같은 buildMercBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);

    const jit = ao ? 0.9 + 0.16 * (((Math.sin(b.x * 12.9898 + b.z * 78.233 + b.y * 37.719) * 43758.5453) % 1 + 1) % 1) : 1;
    // 노멀은 계산으로 넣는다. 비인덱스 지오메트리라 computeVertexNormals()는 면 노멀만 주고,
    // 그러면 flatShading을 꺼도 각진 그대로다. 알갱이는 눌린 구(타원체)이므로 정확한 노멀은
    // (dx/a², dy/b², dz/c²) 방향이다(a=c=r, b=r·sy).
    const ia = 1 / (b.r * b.r), ib = 1 / (b.r * sy * b.r * sy);
    for (let i = 0; i < vc; i++) {
      const dx = src[i * 3] * b.r, dy = src[i * 3 + 1] * b.r * sy, dz = src[i * 3 + 2] * b.r;
      pos[o] = b.x + dx; pos[o + 1] = b.y + dy; pos[o + 2] = b.z + dz;
      let nx = dx * ia, ny = dy * ib, nz = dz * ia;
      const len = Math.hypot(nx, ny, nz) || 1;
      nrm[o] = nx / len; nrm[o + 1] = ny / len; nrm[o + 2] = nz / len;
      if (ao) {
        const px = pos[o], py = pos[o + 1], pz = pos[o + 2]; let occ = 0;
        for (const q of nb[bi]) { const R = q.r * 1.35, d2 = (px - q.x) ** 2 + (py - q.y) ** 2 + (pz - q.z) ** 2; if (d2 < R * R) occ += 1 - Math.sqrt(d2) / R; }
        const hf = Math.min(1, Math.max(0, (py - ymin) / Math.max(0.6, (ymax - ymin) * 0.45)));
        const k = jit * (1 - 0.62 * Math.min(1, occ * 1.3)) * (0.55 + 0.45 * hf) * 0.86;   // ×0.86: 석재를 0.62 배로 누른 v753 이후 산호만 떠 있었다
        col[o] = c.r * k; col[o + 1] = c.g * k; col[o + 2] = c.b * k;
      } else { col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b; }
      if (uv) { uv[o2] = suv[i * 2]; uv[o2 + 1] = suv[i * 2 + 1]; o2 += 2; }
      o += 3;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  if (uv) g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}
// 산호는 숨을 쉰다(느리게 부풀었다 줄어든다). 스케일로 하려면 지오메트리가 자기 중심에
// 있어야 제자리에서 부푼다 — 벽 산호처럼 원점에서 떨어진 덩어리를 그냥 스케일하면
// 타일 원점 쪽으로 미끄러진다. 그래서 중심을 빼서 굽고 메시를 그 자리에 놓는다.
const corruptBreath = [];   // {m, ph, amp}
function coralMesh(list, mat) {
  let cx = 0, cy = 0, cz = 0;
  for (const b of list) { cx += b.x; cy += b.y; cz += b.z; }
  const n = list.length || 1; cx /= n; cy /= n; cz /= n;
  for (const b of list) { b.x -= cx; b.y -= cy; b.z -= cz; }
  const m = new THREE.Mesh(mergeCoral(list, !mat && COR3W), mat || corMatCoral);
  m.position.set(cx, cy, cz);
  m.castShadow = false; m.receiveShadow = true;
  corruptBreath.push({ m, ph: Math.random() * 10, amp: 0.030 + Math.random() * 0.035 });
  return m;
}
// 알갱이 목록 만들기: 큰 엽(lobe) 몇 개 + 그 표면에 붙은 작은 알갱이들
// s는 덩어리의 대략적인 '지름'이다(TILE=5 기준으로 잡을 것 — 원화의 종양은 타일을 덮을 만큼 크다).
// 알갱이를 잘게 많이 쓰면 삼각형만 늘고 멀리서는 뭉개진다. 크게·적게가 낫다.
function makeTaperedTube(curve, seg, r0, rad, endScale) {
  const geo = new THREE.TubeGeometry(curve, seg, r0, rad, false);
  const pos = geo.attributes.position, ring = rad + 1, c = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    curve.getPoint(i / seg, c);
    const k = 1 - (1 - endScale) * (i / seg);
    for (let j = 0; j <= rad; j++) {
      const id = i * ring + j;
      pos.setXYZ(id, c.x + (pos.getX(id) - c.x) * k,
                     c.y + (pos.getY(id) - c.y) * k,
                     c.z + (pos.getZ(id) - c.z) * k);
    }
  }
  pos.needsUpdate = true; geo.computeVertexNormals();
  return geo;
}
// 기둥을 나선으로 휘감고 오르는 덩굴. g는 기둥 그룹(원점이 기둥 밑동보다 0.25 위),
// h는 기둥 몸통 높이. 축 반지름 0.62에 맞춰 감는다.
const C3_BAND_COLS = [0x161f29, 0x1c2530, 0x2b2a40, 0x3d2f4d, 0x5d325d, 0x85397f, 0x8c458c, 0x8c528c];
// 살덩이용 지터 — **같은 좌표의 정점을 같은 오프셋으로** 흔든다.
// 전역 `jitterGeometry`는 정점을 독립적으로 흔드는데, 20면체는 비인덱스라(정점 60개 =
// 고유 좌표 12개) 삼각형 20장이 제각각 떨어져 나간다. 실측: 지터 뒤 고유 좌표가 12 → 60,
// 이웃 면 노멀 각도가 49.4°. 그래서 살덩이 혹이 깨진 결정 조각처럼 보였다.
// 노멀 스무딩(`smoothSkinNormals`)도 이걸 못 되돌린다 — 좌표가 이미 벌어져서 묶이지 않는다.
// (골렘이 같은 이유로 `jitterGeoShared`를 따로 쓰고, 뷰어의 jitterGeometry도 공유 오프셋 판이다.)
function c3JitterShared(geometry, amount) {
  const pos = geometry.attributes.position;
  const offsets = new Map();
  const key = (x, y, z) => x.toFixed(3) + ',' + y.toFixed(3) + ',' + z.toFixed(3);
  for (let i = 0; i < pos.count; i++) {
    const k = key(pos.getX(i), pos.getY(i), pos.getZ(i));
    let off = offsets.get(k);
    if (!off) { off = [(Math.random() - 0.5) * amount, (Math.random() - 0.5) * amount, (Math.random() - 0.5) * amount]; offsets.set(k, off); }
    pos.setXYZ(i, pos.getX(i) + off[0], pos.getY(i) + off[1], pos.getZ(i) + off[2]);
  }
  geometry.computeVertexNormals(); return geometry;
}
// 울룩불룩한 종양 혹 하나
function c3Lump(r, mat, detail) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail === undefined ? 0 : detail), mat);
  m.castShadow = false; m.receiveShadow = true;
  c3JitterShared(m.geometry, r * 0.30);
  return m;
}
// 타원체 표면을 종양 혹으로 뒤덮는다(원화의 콜리플라워 살덩이 질감).
// o: {cx,cy,cz, rx,ry,rz, count, rMin,rMax, mat|matAt, skip}
function c3TumorShell(parent, o) {
  const out = [], n = o.count;
  for (let i = 0; i < n; i++) {
    const k = i + 0.5;
    const phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k;
    const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi), uz = Math.sin(phi) * Math.sin(th);
    const jr = 0.90 + c3rnd() * 0.18;
    const x = o.cx + ux * o.rx * jr, y = o.cy + uy * o.ry * jr, z = o.cz + uz * o.rz * jr;
    if (o.skip && o.skip(x, y, z)) continue;
    const r = o.rMin + c3rnd() * (o.rMax - o.rMin);
    const m = c3Lump(r, o.mat || o.matAt(y), c3rnd() > 0.72 ? 1 : 0);
    m.position.set(x, y, z);
    m.rotation.set(c3rnd() * 3, c3rnd() * 3, c3rnd() * 3);
    m.scale.set(1 + c3rnd() * 0.35, 0.8 + c3rnd() * 0.4, 1 + c3rnd() * 0.35);
    parent.add(m); out.push(m);
  }
  return out;
}

// ============================================================
//  포자 벌레(sporeling) — 61층부터 나오는 3막 기본 근접 몹.
//  70층 보스 포란충이 뿌린 알에서 깬 유생이다(그래서 보스가 산란으로 이것을 낳는다).
//  같은 종으로 읽히되 한눈에 '아직 어리다'가 보여야 한다:
//   · 배 속에 알이 없다(보스는 알이 비치는 반투명 주머니)
//   · 외골격 판이 등 쪽 6장뿐 — 옆구리·배는 아직 말랑하다
//   · 머리가 몸에 비해 크고 홑눈도 크다(머리/배 반지름 비 0.58, 보스는 0.38)
//   · 무릎이 몸보다 낮다(보스는 장님거미처럼 높이 솟는다)
//  팔레트는 뷰어에서 3막 조명으로 역산한 값이다 — 베이스 색을 '보기 좋게' 고치지 말 것.
//  정면 -z(게임 규약). 높이 약 1.45.
// ============================================================
function buildSporelingBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const chitinMat  = getLowPolyMat(0x1f2129);   // 각진 외골격 판
  const chitinLit  = getLowPolyMat(0x14111a);   // 빛 받는 위쪽 판
  const chitinDk   = getLowPolyMat(0x0c0b12);   // 그늘진 아래쪽 판
  const seamMat    = getLowPolyMat(0x310e09, true);  // 판 이음선의 금빛
  const eyeMat     = getLowPolyMat(0x281c07, true);  // 황금 홑눈
  // 홑눈은 색이 아니라 발광 세기로 맞췄다 — 밝기의 대부분이 emissive라 베이스 색으로는 안 내려간다.
  const eyeGlowMat = new THREE.MeshStandardMaterial({ color: 0x15110b, emissive: 0xffcf60, emissiveIntensity: 0.196, roughness: 0.35, metalness: 0.4 });
  // 속이 찬 말랑한 배. 투명도 0.86이면 막처럼 살짝 비치는 느낌만 남는다.
  const sacMat     = new THREE.MeshStandardMaterial({ color: 0x12070b, roughness: 0.72, flatShading: true, transparent: true, opacity: 0.86 });
  const sacRimMat  = getLowPolyMat(0x0e0506);
  const legMat     = getLowPolyMat(0x12151f);
  const mawMat     = getLowPolyMat(0x090606);
  [sacMat, sacRimMat, mawMat].forEach(markOrganic);   // 살은 유기체(하이라이트 제외)

  grp.add(bodyGrp);

  const _sacPos = new THREE.Vector3(0, 0, 0);
  const PLATE_DIRS = [];
  const SAC_C = { x: 0, y: 0.88, z: 0.14 }, SAC_R = 0.52;
  function shellPlate(dx, dy, dz, r, sx, sz, mat) {
    const d = new THREE.Vector3(dx, dy, dz).normalize();
    PLATE_DIRS.push({ d: d.clone(), r });
    const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat));
    m.scale.set(sx, 0.24, sz);
    m.position.copy(d).multiplyScalar(SAC_R * 0.97).add(_sacPos);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
    jitterGeometry(m.geometry, r * 0.20);
    bodyGrp.add(m); return m;
  }

  // ---------- 배 ----------
  const sacGrp = new THREE.Group(); sacGrp.position.set(SAC_C.x, SAC_C.y, SAC_C.z); bodyGrp.add(sacGrp);
  const sacShell = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R, 2), sacMat));
  sacShell.scale.set(1.0, 0.96, 1.08); jitterGeometry(sacShell.geometry, 0.075); sacGrp.add(sacShell);
  // 앞뒤 마디 — 배가 매끈한 공이 아니라 세 마디로 읽힌다
  [[0.00,  0.00, -0.30, 0.40, 0.96, 0.92, 0.85],
   [0.00, -0.04,  0.40, 0.36, 0.94, 0.90, 0.86]].forEach(pp => {
    const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(pp[3], 1), sacMat));
    m.position.set(pp[0], pp[1], pp[2]); m.scale.set(pp[4], pp[5], pp[6]);
    jitterGeometry(m.geometry, pp[3] * 0.13); sacGrp.add(m);
  });
  const sacLow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R * 0.86, 1), sacRimMat));
  sacLow.scale.set(1.02, 0.52, 1.0); sacLow.position.set(0, -SAC_R * 0.66, 0.01);
  jitterGeometry(sacLow.geometry, 0.06); sacGrp.add(sacLow);

  // ---------- 등을 덮은 외골격 판 6장 ----------
  _sacPos.set(SAC_C.x, SAC_C.y, SAC_C.z);
  shellPlate( 0.04,  1.00,  0.06, 0.34, 1.10, 1.05, chitinLit);
  shellPlate(-0.62,  0.80,  0.08, 0.27, 1.05, 1.00, chitinLit);
  shellPlate( 0.64,  0.78,  0.04, 0.27, 1.05, 1.00, chitinLit);
  shellPlate(-0.18,  0.66,  0.76, 0.27, 1.05, 1.00, chitinMat);
  shellPlate( 0.24,  0.62,  0.80, 0.25, 1.00, 0.95, chitinMat);
  shellPlate( 0.02,  0.34,  1.00, 0.20, 0.95, 0.90, chitinDk);
  // ---------- 판 사이 금빛 이음선(겨우 비칠 정도) ----------
  const SEAM_R = SAC_R * 1.165;
  const seamArc = (A, B, w) => {
    const n = Math.max(2, Math.round(A.angleTo(B) / 0.30));
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const v = A.clone().lerp(B, i / n).normalize().multiplyScalar(SEAM_R).add(_sacPos);
      if (prev) c3Seam(bodyGrp, prev.toArray(), v.toArray(), w, seamMat);
      prev = v;
    }
  };
  for (let i = 0; i < PLATE_DIRS.length; i++) for (let j = i + 1; j < PLATE_DIRS.length; j++) {
    const a = PLATE_DIRS[i], b = PLATE_DIRS[j];
    if (a.d.angleTo(b.d) > 1.02) continue;   // 붙어 있는 판끼리만
    seamArc(a.d, b.d, 0.006 + c3rnd() * 0.004);
  }

  // ---------- 가슴마디 — 머리와 배를 잇는다(없으면 머리가 떠 보인다) ----------
  const thx = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 1), chitinMat));
  thx.scale.set(0.95, 0.80, 1.12); thx.position.set(0, 0.80, -0.40);
  jitterGeometry(thx.geometry, 0.05); bodyGrp.add(thx);
  const collar = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.19, 0), chitinDk));
  collar.scale.set(1.05, 0.85, 0.55); collar.position.set(0, 0.78, -0.56);
  bodyGrp.add(collar);

  // ---------- 머리 — 황금 홑눈 뭉치 ----------
  headGrp.position.set(0, 0.74, -0.62); bodyGrp.add(headGrp); limbs.head = headGrp;
  const headCore = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 1), chitinMat));
  headCore.scale.set(1.08, 0.94, 1.0); jitterGeometry(headCore.geometry, 0.06); headGrp.add(headCore);
  for (let i = 0; i < 12; i++) {
    const k = i + 0.5, n = 12;
    const phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k;
    const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi) * 0.85, uz = Math.sin(phi) * Math.sin(th);
    if (uz > 0.35) continue;                       // 뒤통수에는 안 붙인다
    const r = 0.055 + c3rnd() * 0.052;
    const e2 = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), i % 3 === 0 ? eyeGlowMat : eyeMat));
    e2.position.set(ux * 0.26, uy * 0.23, uz * 0.25 - 0.06);
    headGrp.add(e2);
  }
  const maw = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), mawMat));
  maw.scale.set(1.1, 0.7, 0.7); maw.position.set(0, -0.18, -0.12); headGrp.add(maw);
  const jawGrp = new THREE.Group(); jawGrp.position.set(0, -0.16, -0.06); headGrp.add(jawGrp);
  [-1, 1].forEach(sg => {
    const j = sh(new THREE.Mesh(new THREE.ConeGeometry(0.040, 0.32, 4), legMat));
    j.position.set(sg * 0.11, -0.10, -0.16); j.rotation.set(-0.5, 0, sg * 0.42);
    jawGrp.add(j);
  });

  // ---------- 다리 6개(삼각보행) ----------
  const boneSeg = (len, rBase, rTip, mat) => {
    const g = new THREE.CylinderGeometry(rTip, rBase, len, 5);
    g.translate(0, len / 2, 0);
    return sh(new THREE.Mesh(g, mat));
  };
  const FEMUR = 0.40, TIBIA = 0.812;
  const LEG_SPEC = [[0.30, 0.62, -0.34, 0.66], [0.36, 0.62, 0.04, 0.02], [0.31, 0.62, 0.40, -0.50]];
  const legs = [];
  [1, -1].forEach(side => LEG_SPEC.forEach((L, i) => {
    const root = new THREE.Group();
    root.position.set(side * L[0], L[1], L[2]);
    root.rotation.y = side * L[3];
    bodyGrp.add(root);
    const femurGrp = new THREE.Group();
    femurGrp.rotation.z = -side * 0.75;
    root.add(femurGrp);
    femurGrp.add(boneSeg(FEMUR, 0.052, 0.038, legMat));
    // 밑동 관절은 다리와 함께 안 움직인다 — 몸통에 직접 붙여 드로우콜을 아낀다
    const coxa = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.070, 0), chitinDk));
    coxa.scale.set(1.0, 0.8, 1.0); jitterGeometry(coxa.geometry, 0.02);
    coxa.position.copy(root.position); bodyGrp.add(coxa);
    const kneeGrp = new THREE.Group(); kneeGrp.position.y = FEMUR;
    kneeGrp.rotation.z = -side * 2.189;
    femurGrp.add(kneeGrp);
    kneeGrp.add(boneSeg(TIBIA, 0.036, 0.010, legMat));
    // 발톱은 다리와 같은 재질 — 이 크기에서 어차피 안 보이는데 재질만 늘면 다리마다 콜이 붙는다
    const tip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.019, 0.14, 4), legMat));
    tip.position.y = TIBIA + 0.05; tip.rotation.x = Math.PI; kneeGrp.add(tip);
    // 삼각보행: 오른쪽 1·3번과 왼쪽 2번이 한 조, 나머지가 반대 조(위상 π 차이).
    // 파도보행(위상을 조금씩 어긋냄)으로 하면 여섯 다리가 물결쳐 벌레보다 지네로 읽힌다.
    legs.push({ femurGrp, kneeGrp, side, baseFemur: femurGrp.rotation.z, baseKnee: kneeGrp.rotation.z,
                phase: ((i + (side > 0 ? 0 : 1)) % 2) * Math.PI });
  }));

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(headGrp, [jawGrp]);
  c3MergeStatic(jawGrp);
  c3MergeStatic(sacGrp);
  legs.forEach(L => { c3MergeStatic(L.kneeGrp); c3MergeStatic(L.femurGrp, [L.kneeGrp]); });
  c3MergeStatic(bodyGrp, [sacGrp, headGrp, ...legs.map(L => L.femurGrp.parent)]);

  c3BugLimbs(grp, limbs, { legs, bodyGrp, jawGrp, sacGrp, bob: 0.055 });
}

// 곤충 리그를 게임 규약에 맞춰 마무리한다.
// 공용 애니메이션 코드가 limbs.legR/legL/armR/armL의 rotation을 무조건 건드리므로
// (보스 돌진·근접 윈드업 분기 등) 없으면 거기서 죽는다. 화면에 안 나오는 더미를 물려 둔다.
function c3BugLimbs(grp, limbs, bug) {
  limbs.legR = new THREE.Group(); limbs.legL = new THREE.Group();
  limbs.armR = new THREE.Group(); limbs.armL = new THREE.Group();
  grp.add(limbs.legR, limbs.legL, limbs.armR, limbs.armL);
  bug.walk = 0; bug.chomp = 0;
  limbs.bug = bug;
}

// ============================================================
//  농침벌(stingwasp) — 65층부터 나오는 3막 원거리 몹.
//  공중에 떠서 독침을 쏘는 말벌형. 포자 벌레와 같은 생태로 읽히도록 황금 겹눈·검은 각질을
//  공유하되, 배의 담즙빛 줄무늬로 '독을 가진 쪽'임을 한눈에 구분시킨다.
//  · 날개는 실제로 퍼덕이지 않는다 — 고정 각도로 겹친 반투명 날개 두 장이 '흐릿한 잔상'을
//    만들고 그룹만 천천히 흔든다(updateBugRig의 fly 분기 주석 참고).
//  · 다리는 움직이지 않으므로 몸통에 통째로 병합한다(비행 중엔 늘어뜨린 채라 애니메이션이 필요 없다).
//  정면 -z(게임 규약). 몸길이 약 1.6, 지면에서 baseY + fly 만큼 떠 있다.
// ============================================================
function buildStingwaspBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const chitinMat = getLowPolyMat(0x1b1710);   // 따뜻한 흑갈 각질(포란충의 푸른 흑과 구분)
  const chitinDk  = getLowPolyMat(0x0d0b08);
  const bandMat   = getLowPolyMat(0x6d5410);   // 담즙빛 줄무늬 — 이 색만 밝아 독을 가진 쪽으로 읽힌다
  const bandDk    = getLowPolyMat(0x43290c);
  const legMat    = getLowPolyMat(0x141118);
  const eyeMat    = getLowPolyMat(0x281c07, true);
  // 겹눈은 색이 아니라 발광 세기로 맞춘다(포자 벌레 홑눈과 같은 규칙 — 밝기가 emissive에 있다)
  const eyeGlowMat = new THREE.MeshStandardMaterial({ color: 0x15110b, emissive: 0xffcf60, emissiveIntensity: 0.196, roughness: 0.35, metalness: 0.4 });
  const venomMat  = new THREE.MeshStandardMaterial({ color: 0x18200a, emissive: 0x9fd83a, emissiveIntensity: 0.55, roughness: 0.4 });
  venomMat._glowMat = true;
  // 날개: 투명 재질이라 노멀 패스에서 자동으로 빠진다(외곽선·모서리 하이라이트 없음)
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xc4d8d0, emissive: 0x2a3a36, transparent: true, opacity: 0.40, roughness: 0.25, side: THREE.DoubleSide, depthWrite: false });

  grp.add(bodyGrp);

  // ---------- 가슴 ----------
  const thx = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 1), chitinMat));
  thx.scale.set(1.00, 0.92, 1.15); thx.position.set(0, 0.98, -0.12);
  jitterGeometry(thx.geometry, 0.05); bodyGrp.add(thx);
  const fuzz = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 1), bandDk));   // 어깨 솜털(가슴 앞 띠)
  fuzz.scale.set(1.15, 0.85, 0.55); fuzz.position.set(0, 1.02, -0.30); bodyGrp.add(fuzz);

  // ---------- 머리 ----------
  headGrp.position.set(0, 0.99, -0.50); bodyGrp.add(headGrp); limbs.head = headGrp;
  const hd = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.20, 1), chitinMat));
  hd.scale.set(1.15, 1.00, 0.85); jitterGeometry(hd.geometry, 0.035); headGrp.add(hd);
  [-1, 1].forEach(sg => {
    const ey = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.115, 1), sg > 0 ? eyeGlowMat : eyeMat));
    ey.scale.set(0.80, 1.25, 0.70); ey.position.set(sg * 0.15, 0.02, -0.05); headGrp.add(ey);
    // 더듬이 — 앞위로 뻗었다가 꺾인다
    const a1 = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.012, 0.30, 4), legMat));
    a1.position.set(sg * 0.07, 0.20, -0.14); a1.rotation.set(-0.55, 0, sg * 0.30); headGrp.add(a1);
    const a2 = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.008, 0.22, 4), legMat));
    a2.position.set(sg * 0.13, 0.33, -0.26); a2.rotation.set(-1.15, 0, sg * 0.45); headGrp.add(a2);
    // 큰턱
    const md = sh(new THREE.Mesh(new THREE.ConeGeometry(0.034, 0.20, 4), legMat));
    md.position.set(sg * 0.08, -0.14, -0.14); md.rotation.set(-0.7, 0, sg * 0.5); headGrp.add(md);
  });

  // ---------- 허리(잘록한 자루마디) — 말벌의 실루엣은 여기서 나온다 ----------
  const pet = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.26, 5), chitinDk));
  pet.position.set(0, 0.92, 0.20); pet.rotation.x = Math.PI / 2 - 0.35; bodyGrp.add(pet);

  // ---------- 배 — 담즙빛 줄무늬 마디 + 독침 ----------
  const abGrp = new THREE.Group(); abGrp.position.set(0, 0.88, 0.30); bodyGrp.add(abGrp);
  const AB = [[0.00, 0.26, 0.98], [0.26, 0.25, 0.92], [0.52, 0.21, 0.86], [0.76, 0.15, 0.80], [0.95, 0.09, 0.74]];
  AB.forEach((a, i) => {
    const seg = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(a[1], 1), i % 2 ? bandMat : chitinMat));
    seg.position.set(0, -a[0] * 0.34, a[0]); seg.scale.set(a[2] * 1.05, a[2] * 0.95, 1.06);
    jitterGeometry(seg.geometry, a[1] * 0.10); abGrp.add(seg);
  });
  const sting = sh(new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.44, 5), chitinDk));
  sting.position.set(0, -0.44, 1.16); sting.rotation.x = -2.05; abGrp.add(sting);       // 끝이 뒤아래를 향한다
  const stingTip = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.035, 0), venomMat));
  stingTip.position.set(0, -0.62, 1.24); abGrp.add(stingTip);

  // ---------- 날개 4장(앞·뒤) — 좌우 그룹 하나씩만 움직인다 ----------
  const wingGeo = () => { const g = new THREE.CircleGeometry(0.5, 12); g.scale(1.40, 0.46, 1); g.rotateX(-Math.PI / 2); g.translate(0.70, 0, 0); return g; };
  const wings = [];
  [-1, 1].forEach(sg => {
    const wg = new THREE.Group(); wg.position.set(sg * 0.16, 1.14, -0.10); bodyGrp.add(wg);
    wg.rotation.y = sg > 0 ? 0 : Math.PI;   // +x로 뻗은 지오메트리를 반대쪽에도 쓴다
    wg.rotation.z = 0.34;
    // 흐릿한 잔상: 같은 날개를 각도만 어긋내 두 장 겹친다(불투명도 0.24라 겹쳐야 형태가 보인다)
    [[0.06, 0.10, 1.00], [-0.24, -0.06, 0.88], [-0.02, -0.30, 0.74]].forEach(w => {
      const m = sh(new THREE.Mesh(wingGeo(), wingMat));
      m.rotation.z = w[0]; m.rotation.y = w[1]; m.scale.setScalar(w[2]);
      wg.add(m);
    });
    c3MergeStatic(wg);
    wg.userData._bz = wg.rotation.z; wg.userData._by = wg.rotation.y;
    wings.push(wg);
  });

  // ---------- 다리 6개(늘어뜨린 채 — 움직이지 않으므로 몸통에 병합된다) ----------
  const boneSeg = (len, rBase, rTip) => { const g = new THREE.CylinderGeometry(rTip, rBase, len, 4); g.translate(0, -len / 2, 0); return sh(new THREE.Mesh(g, legMat)); };
  [1, -1].forEach(side => [[0.22, 0.86, -0.28, 0.34], [0.24, 0.84, 0.00, 0.10], [0.22, 0.82, 0.24, -0.22]].forEach(L => {
    const root = new THREE.Group(); root.position.set(side * L[0], L[1], L[2]); root.rotation.z = -side * 0.55; root.rotation.x = L[3];
    bodyGrp.add(root);
    root.add(boneSeg(0.30, 0.030, 0.022));
    const kn = new THREE.Group(); kn.position.y = -0.30; kn.rotation.z = side * 0.95; root.add(kn);
    kn.add(boneSeg(0.34, 0.022, 0.012));
    const tp = sh(new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.11, 4), legMat));
    tp.position.y = -0.39; tp.rotation.x = Math.PI; kn.add(tp);
  }));

  // ---------- 드로우콜 병합(움직이는 그룹만 제외) ----------
  c3MergeStatic(headGrp);
  c3MergeStatic(abGrp);
  c3MergeStatic(bodyGrp, [headGrp, abGrp, wings[0], wings[1]]);

  c3BugLimbs(grp, limbs, { legs: [], bodyGrp, wings, abGrp, abBase: 0, fly: 0.72 });
}

// ============================================================
//  포란충(抱卵蟲, broodtick) — 70층 보스. 뷰어(brood_tick_viewer_v1)를 그대로 옮긴 것.
//  · 실루엣의 절반 이상이 알을 잔뜩 밴 거대한 반투명 배주머니
//  · 몸은 구겨진 종이처럼 각진 창백한 청백색 판들, 이음선에 금빛
//  · 머리는 황금빛 홑눈 뭉치. 그 아래로 점액이 길게 늘어져 바닥에 고인다
//  · 다리는 장님거미처럼 가늘고 아주 긴 6개, 무릎이 몸보다 높이 솟는다
//  팔레트는 뷰어에서 3막 조명으로 역산한 값이다 — '보기 좋게' 고치지 말 것(viewers/README.md).
//  정면 -z(게임 규약). 높이 약 3.8 — 보스 스케일 1.0으로 쓴다.
// ============================================================
function buildBroodTickBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  const chitinMat  = getLowPolyMat(0x2c2732);   // 각진 외골격 판(창백한 청백)
  const chitinLit  = getLowPolyMat(0x40283c);   // 빛 받는 위쪽 판
  const chitinDk   = getLowPolyMat(0x0d0c13);   // 그늘진 아래쪽 판
  const seamMat    = getLowPolyMat(0x540601, true);  // 판 이음선의 금빛(금속)
  const eyeMat     = getLowPolyMat(0x912704, true);  // 황금 홑눈
  const eyeGlowMat = new THREE.MeshStandardMaterial({ color: 0x470d03, emissive: 0xffcf60, emissiveIntensity: 0.55, roughness: 0.35, metalness: 0.4 });
  // 껍질 투명도 0.50은 잰 값이다 — 그 아래로는 알이 더 드러나지 않고 주머니 존재감만 빠진다.
  const sacMat     = new THREE.MeshStandardMaterial({ color: 0x39070e, roughness: 0.72, flatShading: true, transparent: true, opacity: 0.50 });
  const sacRimMat  = getLowPolyMat(0x120102);
  const eggMat     = new THREE.MeshStandardMaterial({ color: 0x1d020b, emissive: 0x3a1020, emissiveIntensity: 0.55, roughness: 0.6, flatShading: true });
  const legMat     = getLowPolyMat(0x171925);
  const legTipMat  = getLowPolyMat(0x06080d);
  const oozeMat    = new THREE.MeshStandardMaterial({ color: 0x25170a, transparent: true, opacity: 0.66, roughness: 0.3, flatShading: true });
  const poolMat    = new THREE.MeshStandardMaterial({ color: 0x100a03, roughness: 0.55, flatShading: true, transparent: true, opacity: 0.85 });
  const mawMat     = getLowPolyMat(0x0c0101);
  [sacMat, sacRimMat, eggMat, mawMat].forEach(markOrganic);   // 살·알은 유기체(하이라이트 제외)

  grp.add(bodyGrp);

  const _sacPos = new THREE.Vector3(0, 0, 0);
  const PLATE_DIRS = [];
  const SAC_C = { x: 0, y: 2.30, z: 0.26 }, SAC_R = 1.46;
  // 껍질 조각을 주머니 표면에 '접하게' 붙인다 — 좌표를 손으로 찍으면 판이 우산처럼 떠서
  // '버섯 쓴 벌레'가 된다. 방향 벡터만 주면 위치·기울기가 따라온다.
  function shellPlate(dx, dy, dz, r, sx, sz, mat) {
    const d = new THREE.Vector3(dx, dy, dz).normalize();
    PLATE_DIRS.push({ d: d.clone(), r });
    const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat));
    m.scale.set(sx, 0.24, sz);
    m.position.copy(d).multiplyScalar(SAC_R * 0.97).add(_sacPos);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
    jitterGeometry(m.geometry, r * 0.20);
    bodyGrp.add(m); return m;
  }

  // ---------- 거대한 알주머니(배) ----------
  const sacGrp = new THREE.Group(); sacGrp.position.set(SAC_C.x, SAC_C.y, SAC_C.z); bodyGrp.add(sacGrp);
  const sacShell = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R, 2), sacMat));
  sacShell.scale.set(1.0, 0.94, 1.06); jitterGeometry(sacShell.geometry, 0.05); sacGrp.add(sacShell);
  // 알 무더기 — 한 그룹에 담아 병합하므로 80개를 넣어도 드로우콜 1개.
  // 여러 겹으로 채워야 '속이 꽉 찬' 느낌이 난다(한 겹이면 껍데기 안쪽 띠로 보인다).
  const eggGrp = new THREE.Group(); sacGrp.add(eggGrp);
  for (let shell = 0; shell < 3; shell++) {
    const n = [34, 28, 18][shell], rBand = [0.86, 0.60, 0.30][shell];
    for (let i = 0; i < n; i++) {
      const k = i + 0.5;
      const phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k + shell * 1.7;
      const rr = SAC_R * rBand * (0.90 + c3rnd() * 0.16);
      const eg = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.13 + c3rnd() * 0.11, 0), eggMat));
      eg.position.set(Math.sin(phi) * Math.cos(th) * rr, Math.cos(phi) * rr * 0.9, Math.sin(phi) * Math.sin(th) * rr);
      eg.rotation.set(c3rnd() * 3, c3rnd() * 3, c3rnd() * 3);
      eg.scale.set(1, 0.86 + c3rnd() * 0.28, 1);
      eggGrp.add(eg);
    }
  }
  c3MergeStatic(eggGrp);

  const sacLow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R * 0.82, 1), sacRimMat));
  sacLow.scale.set(1.02, 0.52, 1.0); sacLow.position.set(0, -SAC_R * 0.72, 0.02);
  jitterGeometry(sacLow.geometry, 0.06); sacGrp.add(sacLow);
  [[-0.52, -1.02, -0.22, 0.40], [0.48, -1.06, 0.14, 0.44], [0.02, -1.14, 0.44, 0.36]].forEach(p => {
    const s = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(p[3], 1), sacRimMat));
    s.position.set(p[0], p[1], p[2]); jitterGeometry(s.geometry, 0.08); sacGrp.add(s);
  });

  // ---------- 주머니를 감싼 각진 외골격 판 ----------
  _sacPos.set(SAC_C.x, SAC_C.y, SAC_C.z);
  shellPlate( 0.05,  1.00,  0.10, 0.86, 1.10, 1.05, chitinLit);
  shellPlate(-0.62,  0.80,  0.05, 0.74, 1.05, 1.00, chitinLit);
  shellPlate( 0.66,  0.78,  0.02, 0.74, 1.05, 1.00, chitinLit);
  shellPlate(-0.20,  0.72,  0.80, 0.78, 1.05, 1.00, chitinMat);
  shellPlate( 0.26,  0.68,  0.84, 0.72, 1.00, 0.95, chitinMat);
  shellPlate(-0.95,  0.24,  0.42, 0.70, 1.00, 0.95, chitinMat);
  shellPlate( 0.98,  0.20,  0.38, 0.70, 1.00, 0.95, chitinMat);
  shellPlate(-0.10,  0.30,  1.00, 0.76, 1.05, 1.00, chitinMat);
  shellPlate(-0.90, -0.28,  0.10, 0.62, 0.95, 0.90, chitinDk);
  shellPlate( 0.92, -0.32,  0.06, 0.62, 0.95, 0.90, chitinDk);
  shellPlate(-0.15, -0.30,  0.94, 0.66, 1.00, 0.95, chitinDk);
  shellPlate(-0.55,  0.86, -0.55, 0.60, 0.95, 0.90, chitinLit);
  shellPlate( 0.58,  0.84, -0.52, 0.60, 0.95, 0.90, chitinLit);
  // ---------- 판 사이를 흐르는 금빛 이음선 ----------
  // 좌표를 손으로 찍지 않고 판 배치에서 인접 쌍을 뽑아 잇는다 — 판을 옮기면 이음선도 따라온다.
  // 직선으로 이으면 선이 구를 가로질러 표면 안으로 파고들므로 큰 원을 따라 잘게 나눈다.
  const SEAM_R = SAC_R * 1.165;   // 1.155면 판에 묻히고 1.225면 철사처럼 뜬다(실측)
  const seamArc = (A, B, w) => {
    const n = Math.max(2, Math.round(A.angleTo(B) / 0.30));
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const v = A.clone().lerp(B, i / n).normalize().multiplyScalar(SEAM_R).add(_sacPos);
      if (prev) c3Seam(bodyGrp, prev.toArray(), v.toArray(), w, seamMat);
      prev = v;
    }
  };
  for (let i = 0; i < PLATE_DIRS.length; i++) for (let j = i + 1; j < PLATE_DIRS.length; j++) {
    const a = PLATE_DIRS[i], b = PLATE_DIRS[j];
    if (a.d.angleTo(b.d) > 0.98) continue;
    seamArc(a.d, b.d, 0.013 + c3rnd() * 0.007);
  }
  [[[0.05, 1.00, 0.10], [0.40, 0.72, 0.55]], [[0.05, 1.00, 0.10], [-0.45, 0.70, -0.50]],
   [[-0.95, 0.24, 0.42], [-0.70, 0.10, 0.90]], [[0.98, 0.20, 0.38], [0.72, 0.06, 0.86]],
   [[-0.20, 0.72, 0.80], [0.30, 0.30, 1.05]], [[-0.62, 0.80, 0.05], [-1.00, 0.55, 0.30]],
   [[0.66, 0.78, 0.02], [1.02, 0.52, 0.26]]].forEach(p => {
    seamArc(new THREE.Vector3(...p[0]).normalize(), new THREE.Vector3(...p[1]).normalize(), 0.012 + c3rnd() * 0.005);
  });

  // ---------- 머리 — 황금 홑눈 뭉치 ----------
  headGrp.position.set(0, 2.02, -1.62); bodyGrp.add(headGrp); limbs.head = headGrp;
  const headCore = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.56, 1), chitinMat));
  headCore.scale.set(1.08, 0.92, 1.0); jitterGeometry(headCore.geometry, 0.10); headGrp.add(headCore);
  for (let i = 0; i < 17; i++) {
    const k = i + 0.5, n = 17;
    const phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k;
    const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi) * 0.85, uz = Math.sin(phi) * Math.sin(th);
    if (uz > 0.35) continue;                       // 뒤통수에는 안 붙인다
    const r = 0.10 + c3rnd() * 0.12;
    const e2 = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), i % 4 === 0 ? eyeGlowMat : eyeMat));
    e2.position.set(ux * 0.52, uy * 0.44, uz * 0.50 - 0.10);
    headGrp.add(e2);
  }
  const maw = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.24, 1), mawMat));
  maw.scale.set(1.1, 0.7, 0.7); maw.position.set(0, -0.34, -0.22); headGrp.add(maw);
  const jawGrp = new THREE.Group(); jawGrp.position.set(0, -0.30, -0.10); headGrp.add(jawGrp);
  [-1, 1].forEach(s => {
    const j = sh(new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.62, 4), legMat));
    j.position.set(s * 0.20, -0.20, -0.30); j.rotation.set(-0.5, 0, s * 0.42);
    jawGrp.add(j);
  });

  // ---------- 늘어지는 점액 ----------
  // 가닥마다 메시를 두지 않고 뭉치 단위로 묶어 병합한다(뭉치 하나가 드로우콜 1개).
  // 대신 흔들림도 뭉치 단위 — 뭉치마다 위상을 달리 줘서 한 덩어리로 안 보이게 한다.
  const oozeStrand = (parent, x, y, z, len) => {
    const r0 = 0.030 + c3rnd() * 0.014;
    const g = new THREE.CylinderGeometry(r0, 0.009, len, 4);
    g.translate(0, -len / 2, 0);
    const m = new THREE.Mesh(g, oozeMat); m.position.set(x, y, z); parent.add(m);
    const bead = new THREE.Mesh(new THREE.IcosahedronGeometry(0.042 + c3rnd() * 0.028, 0), oozeMat);
    bead.scale.set(1, 1.35, 1); bead.position.set(x, y - len - 0.01, z); parent.add(bead);
  };
  const oozeGroups = [];
  const oozeCluster = (ox, oy, oz, list) => {
    const g = new THREE.Group(); g.position.set(ox, oy, oz); bodyGrp.add(g);
    list.forEach(p => oozeStrand(g, p[0], p[1], p[2], p[3]));
    oozeGroups.push({ g, ph: c3rnd() * 6.28 });
  };
  oozeCluster(0, 1.66, -1.50, [
    [-0.30, 0, 0.10, 1.34], [-0.14, 0.04, -0.14, 1.08], [0.02, -0.02, 0.16, 1.46],
    [0.18, 0.03, -0.10, 0.92], [0.34, -0.04, 0.06, 1.20], [-0.42, -0.06, -0.06, 0.78],
    [0.44, 0.02, 0.14, 0.66],
  ]);
  oozeCluster(-0.80, 1.30, -0.36, [[0, 0, 0, 1.02], [-0.16, -0.05, 0.18, 0.74], [0.14, 0.04, -0.14, 0.86], [-0.06, -0.02, -0.24, 0.58]]);
  oozeCluster(0.84, 1.26, -0.28, [[0, 0, 0, 0.90], [0.18, -0.04, 0.16, 0.66], [-0.12, 0.03, -0.16, 1.00], [0.08, -0.02, -0.26, 0.52]]);
  oozeCluster(0.06, 1.20, 0.86, [[0, 0, 0, 0.94], [-0.28, -0.04, 0.14, 0.70], [0.26, 0.02, -0.10, 0.82], [0.04, -0.06, 0.30, 0.56]]);
  // 바닥에 고인 자국 — 몸통이 아니라 루트에 붙여 걸음 출렁임을 안 따라가게 한다
  const poolGrp = new THREE.Group(); grp.add(poolGrp);
  [[-0.5, 0.03, -1.1, 0.5], [0.7, 0.03, -0.6, 0.4], [0.1, 0.03, 1.0, 0.55], [-1.2, 0.03, 0.3, 0.35],
   [0.05, 0.03, -1.5, 0.62], [1.05, 0.03, 0.45, 0.34], [-0.85, 0.03, -0.35, 0.42]].forEach(p => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(p[3], p[3] * 0.9, 0.035, 9), poolMat);
    m.position.set(p[0], p[1], p[2]); m.rotation.y = c3rnd() * 3; poolGrp.add(m);
  });
  c3MergeStatic(poolGrp);

  // ---------- 다리 6개(장님거미형 — 무릎이 몸보다 높다) ----------
  // 넓적다리 각(0.62)이 무릎 높이를 정하고, 무릎 → 착지점 벡터에서 꺾임각·정강이 길이가 따라 나온다.
  const boneSeg = (len, rBase, rTip, mat) => {
    const g = new THREE.CylinderGeometry(rTip, rBase, len, 5); g.translate(0, len / 2, 0);
    return sh(new THREE.Mesh(g, mat));
  };
  const FEMUR = 1.75, TIBIA = 2.81;   // 발끝이 y=0에 닿는 실측값(발톱 원뿔이 0.23 더 나간다)
  const LEG_SPEC = [[0.70, 1.80, -0.86, 0.62], [0.84, 1.80, 0.10, 0.02], [0.72, 1.80, 1.02, -0.54]];
  const legs = [];
  [1, -1].forEach(side => LEG_SPEC.forEach((L, i) => {
    const root = new THREE.Group();
    root.position.set(side * L[0], L[1], L[2]);
    root.rotation.y = side * L[3];
    bodyGrp.add(root);
    const femurGrp = new THREE.Group(); femurGrp.rotation.z = -side * 0.62; root.add(femurGrp);
    femurGrp.add(boneSeg(FEMUR, 0.070, 0.046, legMat));
    const coxa = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.125, 1), chitinDk));
    coxa.scale.set(1.0, 0.8, 1.0); jitterGeometry(coxa.geometry, 0.04); root.add(coxa);
    const kneeGrp = new THREE.Group(); kneeGrp.position.y = FEMUR; kneeGrp.rotation.z = -side * 2.319; femurGrp.add(kneeGrp);
    kneeGrp.add(boneSeg(TIBIA, 0.044, 0.009, legMat));
    const knob = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.066, 1), chitinDk));
    jitterGeometry(knob.geometry, 0.03); kneeGrp.add(knob);
    const tip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.021, 0.26, 4), legTipMat));
    tip.position.y = TIBIA + 0.10; tip.rotation.x = Math.PI; kneeGrp.add(tip);
    legs.push({ femurGrp, kneeGrp, side, baseFemur: femurGrp.rotation.z, baseKnee: kneeGrp.rotation.z,
                phase: ((i + (side > 0 ? 0 : 1)) % 2) * Math.PI });
  }));

  // ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
  c3MergeStatic(headGrp, [jawGrp]);
  c3MergeStatic(jawGrp);
  c3MergeStatic(sacGrp, [eggGrp]);
  legs.forEach(L => { c3MergeStatic(L.kneeGrp); c3MergeStatic(L.femurGrp, [L.kneeGrp]); c3MergeStatic(L.femurGrp.parent, [L.femurGrp]); });
  oozeGroups.forEach(o => c3MergeStatic(o.g));
  c3MergeStatic(bodyGrp, [sacGrp, headGrp, ...legs.map(L => L.femurGrp.parent), ...oozeGroups.map(o => o.g)]);

  c3BugLimbs(grp, limbs, { legs, bodyGrp, jawGrp, sacGrp, ooze: oozeGroups, eggGrp, bob: 0.10 });
}

// ============================================================
//  탐식 구울(gluttonghoul) — 80층 보스. 뷰어(glutton_ghoul_viewer_v4)를 그대로 옮긴 것.
//  · 몸 전체가 종양처럼 뭉친 살덩이, 아래는 청회색 → 위로 갈수록 분홍
//  · 정면 중앙에 알처럼 팽팽한 거대 크림색 배(갈비뼈 같은 이빨 우리가 감싼다)
//  · 머리는 어깨에 파묻힌 채 누런 이빨의 거대한 입을 쩍 벌림(침 흘림)
//  · 굵은 팔이 바닥까지 늘어지고 발톱이 땅에 닿음
//  팔레트는 뷰어에서 역산한 값이다 — 밝게 올리면 그만큼 화면에서 색이 빠진다(viewers/README.md).
//  정면 -z(게임 규약). 높이 약 3.3 — 보스 스케일 1.0으로 쓴다.
//  뷰어의 위액 분사·배 개방(2페이즈)은 아직 안 옮겼다(전용 상태기계가 필요하다).
// ============================================================
function buildGluttonGhoulBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };
  grp.add(bodyGrp);

  // ===== 거대 구울 팔레트 =====
  // 원화 그라데이션: 발밑 청회색 → 자주 → 상부 분홍 → 머리 꼭대기 밝은 분홍
  //
  // 값이 원화보다 훨씬 어두운데, 이건 실수가 아니라 이 게임 조명의 응답 곡선 때문이다.
  // 프로브를 놓고 재 보면 베이스 0x60 위로는 출력이 사실상 평평하다(0x60→116, 0xf0→132).
  // 근접 교전 거리에서 광원이 세서 그 위는 전부 클리핑되기 때문이다.
  // 그래서 예전 팔레트(0x69~0xff)는 8단이 통째로 죽은 구간에 들어가 화면에서 같은 회색으로 뭉갰다
  // (실측: 8단 출력이 #74746c ~ #7e7e72, 채도 0.05~0.20).
  // 지금 값은 목표 '출력색'을 정해 두고 파이프라인을 통과시켜 역산한 것이다 — 오차 3/255 이내.
  // **밝게 고치고 싶어도 올리지 말 것.** 올리는 만큼 화면에서는 그냥 색이 빠진다.
  // 다시 잡아야 하면 감으로 고치지 말고 viewers/README.md 의 역산 절차를 따를 것.
  const bandCols = [0x161f29, 0x1c2530, 0x2b2a40, 0x3d2f4d, 0x5d325d, 0x85397f, 0x8c458c, 0x8c528c];
  const bandMats = bandCols.map(c => getLowPolyMat(c));
  const H_LO = 0.1, H_HI = 3.3;
  function fleshMat(y, vary = 1) {
    let t = (y - H_LO) / (H_HI - H_LO); t = Math.max(0, Math.min(1, t));
    let i = Math.round(t * (bandMats.length - 1)) + Math.round((c3rnd() - 0.5) * 2 * vary);
    i = Math.max(0, Math.min(bandMats.length - 1, i));
    return bandMats[i];
  }
  const bellyMat  = getLowPolyMat(0x685119);   // 팽팽한 크림색 배
  const bellyLit  = getLowPolyMat(0x766626);   // 배 하이라이트
  const bellyDk   = getLowPolyMat(0x302613);   // 배 음영/주름
  const bellyGrn  = getLowPolyMat(0x3b4417);   // 배 아래 변색(누런 초록빛)
  const mouthMat  = getLowPolyMat(0x2e1422);   // 입속
  const gumMat    = getLowPolyMat(0x4c1c2c);   // 잇몸
  const tongueMat = getLowPolyMat(0x7c2543);   // 혀
  const teethMat  = getLowPolyMat(0x453d20);   // 누런 이빨
  const clawMat   = getLowPolyMat(0x0e1220);   // 발톱/손톱
  const spikeMat  = getLowPolyMat(0x100f1f);   // 검은 가시
  const sludgeMat = getLowPolyMat(0x2a2730);   // 바닥 찌꺼기
  const soreMat   = new THREE.MeshStandardMaterial({ color: 0x7a1c2c, emissive: 0xc03048, emissiveIntensity: 0.28, roughness: 0.6, flatShading: true });
  const eyeMat    = new THREE.MeshStandardMaterial({ color: 0x6a5a2a, emissive: 0xffa020, emissiveIntensity: 1.2, roughness: 0.4 });
  const droolMat  = new THREE.MeshStandardMaterial({ color: 0x8e8a70, transparent: true, opacity: 0.55, roughness: 0.3, flatShading: true });
  const mawInner  = new THREE.MeshStandardMaterial({ color: 0x360d18, emissive: 0x8a1020, emissiveIntensity: 0.35, roughness: 0.6, flatShading: true });   // 배 속
  const gutMat    = getLowPolyMat(0x140811);   // 이빨 사이로 비치는 어두운 뱃속
  const fangMat   = getLowPolyMat(0x40392e);   // 배를 감싼 상아빛 이빨
  const fangDk    = getLowPolyMat(0x21201c);

  // 최상위 그룹은 돌리지 않는다 — 게임 몬스터가 rotation.y = 0 일 때와 똑같은 자세로 세워 두어야
  // 뷰어에서 본 것이 게임에서 그대로 나온다(게임은 atan2(dx,dz)+π 로 로컬 -z 를 표적에 맞춘다).
  // 예전에는 여기 π 가 있어서 정면이 +z 로 갔고, 그 바람에 -z 쪽에 놓인 키·언더 라이트가
  // 얼굴과 배가 아니라 뒤통수와 등을 비추고 있었다(정면 평균 휘도 102 → 123).

  // ===== 살덩이 헬퍼 =====
  // 울룩불룩한 종양 혹 하나
  function lump(r, mat, detail) {
    const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail === undefined ? 0 : detail), mat));
    c3JitterShared(m.geometry, r * 0.30);
    return m;
  }
  // 타원체 표면을 종양 혹으로 뒤덮음(원화의 컬리플라워 살덩이 질감)
  function tumorShell(parent, o) {
    const out = [];
    const n = o.count;
    for (let i = 0; i < n; i++) {
      const k = i + 0.5;
      const phi = Math.acos(1 - 2 * k / n);
      const th = Math.PI * (1 + Math.sqrt(5)) * k;
      const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi), uz = Math.sin(phi) * Math.sin(th);
      const jr = 0.90 + c3rnd() * 0.18;
      const x = o.cx + ux * o.rx * jr, y = o.cy + uy * o.ry * jr, z = o.cz + uz * o.rz * jr;
      if (o.skip && o.skip(x, y, z)) continue;
      const r = o.rMin + c3rnd() * (o.rMax - o.rMin);
      const m = lump(r, o.mat || fleshMat((o.yBase || 0) + y), c3rnd() > 0.72 ? 1 : 0);
      m.position.set(x, y, z);
      m.rotation.set(c3rnd() * 3, c3rnd() * 3, c3rnd() * 3);
      m.scale.set(1 + c3rnd() * 0.35, 0.8 + c3rnd() * 0.4, 1 + c3rnd() * 0.35);
      m.userData.bs = m.scale.clone();
      parent.add(m); out.push(m);
    }
    return out;
  }
  // 가는 균열/정맥 라인
  function addSeam(parent, from, to, w, mat) {
    const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
    const len = a.distanceTo(b);
    const seg = sh(new THREE.Mesh(new THREE.BoxGeometry(w, len, w * 0.8), mat));
    seg.position.copy(a).add(b).multiplyScalar(0.5);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    parent.add(seg);
  }
  // 뾰족한 가시(어깨/등)
  function addSpike(parent, x, y, z, h, rx, rz) {
    const s = sh(new THREE.Mesh(new THREE.ConeGeometry(h * 0.22, h, 4), spikeMat));
    s.position.set(x, y, z); s.rotation.set(rx, c3rnd() * 3, rz); parent.add(s); return s;
  }

  // ============================================================
  //  거대 구울(폭식 구울) — 원화 기준
  //  · 몸 전체가 종양처럼 뭉친 살덩이, 아래는 청회색 → 위로 갈수록 분홍
  //  · 정면 중앙에 알처럼 팽팽한 거대 크림색 배
  //  · 머리는 어깨에 파묻힌 채 누런 이빨의 거대한 입을 쩍 벌림(침 흘림)
  //  · 굵은 팔이 바닥까지 늘어지고 발톱이 땅에 닿음
  //  · 짧고 굵은 다리는 배에 가려 거의 보이지 않음
  //  정면은 -z 방향
  // ============================================================

  // 배 부피(이 안쪽에는 살덩이를 배치하지 않음)
  const BELLY_C = { x: 0, y: 1.38, z: -0.52 };
  function inBelly(x, y, z) {
    const a = (x - BELLY_C.x) / 0.86, b = (y - BELLY_C.y) / 0.86, c = (z - BELLY_C.z) / 0.80;
    return a * a + b * b + c * c < 1.0;
  }
  // 얼굴 앞(입) 공간 — 살덩이가 얼굴을 덮지 않도록 비움
  function inFace(x, y, z) {
    const a = x / 0.74, b = (y - 2.84) / 0.64, c = (z + 0.66) / 0.80;
    return a * a + b * b + c * c < 1.0;
  }
  // 팔이 늘어질 통로 — 몸통 옆구리를 비워 팔이 실루엣에서 분리되게
  function inArmLane(x, y, z) { return Math.abs(x) > 0.98 && y < 2.15; }
  const skipAll = (x, y, z) => inBelly(x, y, z) || inFace(x, y, z) || inArmLane(x, y, z);

  // ---------- 몸통 코어(살덩이 속을 메우는 덩어리) ----------
  const torsoGrp = new THREE.Group(); bodyGrp.add(torsoGrp);
  const core = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.92, 2), bandMats[3]));
  core.scale.set(0.95, 1.25, 0.82); core.position.set(0, 1.55, 0.10); c3JitterShared(core.geometry, 0.07); torsoGrp.add(core);
  const coreLow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.80, 1), bandMats[1]));
  coreLow.scale.set(1.0, 0.72, 0.9); coreLow.position.set(0, 0.78, 0.10); c3JitterShared(coreLow.geometry, 0.07); torsoGrp.add(coreLow);

  // ---------- 몸통 전체를 뒤덮는 종양 살덩이(아래 청회색 → 위 분홍) ----------
  const bodyLumps = [];
  // 엉덩이·허리(넓게 퍼진 하단)
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: 0, cy: 0.80, cz: 0.10, rx: 0.92, ry: 0.52, rz: 0.80,
    count: 46, rMin: 0.20, rMax: 0.34, skip: (x, y, z) => skipAll(x, y, z) || y < 0.26
  }));
  // 몸통 중단
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: 0, cy: 1.55, cz: 0.10, rx: 0.90, ry: 0.58, rz: 0.78,
    count: 46, rMin: 0.19, rMax: 0.33, skip: skipAll
  }));
  // 어깨(가장 넓은 부분)
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: 0, cy: 2.26, cz: 0.08, rx: 1.00, ry: 0.54, rz: 0.76,
    count: 52, rMin: 0.19, rMax: 0.32, skip: skipAll
  }));
  // 어깨 위 봉우리(머리 양옆으로 솟은 분홍 살덩이)
  [-1, 1].forEach(s => {
    bodyLumps.push(...tumorShell(torsoGrp, {
      cx: s * 0.64, cy: 2.80, cz: 0.12, rx: 0.36, ry: 0.30, rz: 0.36,
      count: 18, rMin: 0.17, rMax: 0.28, skip: inFace
    }));
  });
  // 가슴(입 아래 ~ 배 위 사이의 분홍 살 띠)
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: 0, cy: 2.22, cz: -0.54, rx: 0.62, ry: 0.28, rz: 0.30,
    count: 16, rMin: 0.17, rMax: 0.27, skip: inFace
  }));
  // 등 상단 혹(뒤로 부풀어 오른 살)
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: 0, cy: 2.10, cz: 0.66, rx: 0.60, ry: 0.44, rz: 0.26,
    count: 18, rMin: 0.18, rMax: 0.30
  }));

  // 감염 정맥/발진
  addSeam(torsoGrp, [-0.70, 2.05, 0.45], [-0.90, 1.45, 0.34], 0.024, bandMats[2]);
  addSeam(torsoGrp, [0.68, 2.10, 0.48], [0.88, 1.52, 0.36], 0.024, bandMats[2]);
  [[-0.88, 1.90, 0.20], [0.90, 1.66, 0.24], [-0.52, 2.92, 0.30], [0.58, 2.86, 0.28], [0, 2.24, 0.82]].forEach(p => {
    const s = lump(0.09, soreMat, 0); s.scale.set(1.3, 1.0, 1.3); s.position.set(p[0], p[1], p[2]); torsoGrp.add(s);
  });
  // 어깨·등의 검은 가시

    const thigh = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.30, 0.50, 7), bandMats[1]));
    thigh.position.y = -0.25; c3JitterShared(thigh.geometry, 0.05); legGrp.add(thigh);

    // 발(넓적한 살덩이 + 발톱)

    const foot = lump(0.30, bandMats[0], 1); foot.scale.set(1.05, 0.55, 1.25); foot.position.set(0, -0.10, -0.06); footGrp.add(foot);
    for (let f = 0; f < 3; f++) {
      const fx = (f - 1) * 0.16;
      const toe = lump(0.10, bandMats[0], 0); toe.scale.set(0.9, 0.6, 1.4); toe.position.set(fx, -0.14, -0.28); footGrp.add(toe);
      const claw = sh(new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.16, 4), clawMat));

  [cageR, cageL].forEach(g => c3MergeStatic(g));
  c3MergeStatic(bellyGrp, [cageR, cageL, bellyMawGrp, bellyLow, cageSeam]);
  c3MergeStatic(torsoGrp);

  [legR, legL].forEach(l => { c3MergeStatic(l.footGrp); c3MergeStatic(l.legGrp, [l.footGrp]); });

  limbs._ggBelly = bellyGrp;   // 계측·확장용 손잡이(부풀기는 아래 _ggFlex가 관리한다)
  limbs._ggFlex = function (o) {
    const arm = (o && o.arm) || 1, head = (o && o.head) || 1;
    const push = (o && o.push) || 0, belly = (o && o.belly) || 1;

    bellyGrp.scale.setScalar(belly);

    bellyGrp.position.set(BELLY_C.x * (1 - belly), BELLY_C.y * (1 - belly), BELLY_C.z * (1 - belly));
  };
  // 매 프레임 연출: 무거운 호흡 · 눈 명멸 · 침 흔들림 · 턱
  const HEAD_BASE = headGrp.position.y;
  limbs._ggUpdate = function (t, dt, swinging) {
    const breath = Math.sin(t * 0.75);
    cageR.scale.setScalar(1 + breath * 0.025); cageL.scale.setScalar(1 + breath * 0.025);
    torsoGrp.position.y = breath * 0.022;
    torsoGrp.scale.set(1 + breath * 0.006, 1 + breath * 0.008, 1 + breath * 0.006);
    headGrp.position.y = HEAD_BASE + breath * 0.026;
    eyeMat.emissiveIntensity = Math.max(0.6, 1.0 + Math.sin(t * 3.1) * 0.2 + Math.sin(t * 1.4) * 0.14);
    soreMat.emissiveIntensity = 0.24 + Math.sin(t * 1.5) * 0.12;
    drools.forEach((d, i) => { d.rotation.z = Math.sin(t * 1.3 + i) * 0.12; });
    // 공격 모션 동안 아래턱을 크게 벌렸다 문다
    const want = swinging ? -0.52 : -0.06;
    jawGrp.rotation.x += (want - jawGrp.rotation.x) * Math.min(1, dt * 10);
  };
}

//  부패한 왕(corruptking) — 90층 보스(3막 최종). 뷰어 corrupted_king_viewer_v14 이식.

// 심장 갱신: 맥동 + 껍질 여닫기. 이동·공격은 없다(호출부에서 일반 AI를 건너뛴다).

  e.heartOpenT = (e.heartOpenT === undefined) ? 0 : e.heartOpenT + ((e.heartOpen ? 1 : 0) - e.heartOpenT) * Math.min(1, dt * 3.0);

  const rate = e.heartOpen ? 1.9 : 1.15;

  if (L._rhGlow) L._rhGlow.emissiveIntensity = (e.heartOpen ? 2.2 : 0.45) + beat * (e.heartOpen ? 1.6 : 0.35);

}
function buildCorruptKingBody(grp, bodyGrp, headGrp, limbs) {
  const sh = (o) => { o.castShadow = false; o.receiveShadow = true; return o; };   // 캐릭터는 진짜 그림자를 안 진다(블롭이 대신)

  // 울룩불룩한 종양 혹 하나
  function lump(r, mat, detail) {

    c3JitterShared(m.geometry, r * 0.30);

      const th = Math.PI * (1 + Math.sqrt(5)) * k;
      const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi), uz = Math.sin(phi) * Math.sin(th);
      const jr = 0.90 + c3rnd() * 0.18;
      const x = o.cx + ux * o.rx * jr, y = o.cy + uy * o.ry * jr, z = o.cz + uz * o.rz * jr;
      if (o.skip && o.skip(x, y, z)) continue;
      const r = o.rMin + c3rnd() * (o.rMax - o.rMin);

      const m = lump(r, o.mat || pick(o.pool), c3rnd() > 0.72 ? 1 : 0);
      m.position.set(x, y, z);
      m.rotation.set(c3rnd() * 3, c3rnd() * 3, c3rnd() * 3);
      m.scale.set(1 + c3rnd() * 0.35, 0.8 + c3rnd() * 0.4, 1 + c3rnd() * 0.35);
      m.userData.bs = m.scale.clone();

  const fCream  = getLowPolyMat(0x4d4437);  // 크림빛 각질

  // t 를 주면 그 시점의 맥동을, null 이면 기준 형태(배율 1)를 만든다.
