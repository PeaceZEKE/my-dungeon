<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영웅 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="clsBtn">기사</button>
  <button class="btn" id="cmpBtn">나란히(예전 · 새)</button>
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  용병 — 마을 여관에서 고용하는 동료(v879). 몸은 게임과 같은 buildMercBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);
        graded = mix(col.rgb, uOutline, clamp(line, 0.0, 1.0));
      }
      float lum = dot(graded, vec3(0.299, 0.587, 0.114));
      graded = mix(vec3(lum), graded, uSat);
      graded = (graded - 0.5) * uCon + 0.5;
      graded += (lum - 0.5) * uSplit;
      graded = clamp(graded, 0.0, 1.0);

      float shMask = 1.0 - smoothstep(0.0, uShadowThresh, lum2);
      if (uShadowSteps > 0.5) shMask = floor(shMask * uShadowSteps + 0.5) / uShadowSteps;
      graded = mix(graded, max(graded, uShadowColor), shMask * uShadowStr);

// 즉 카메라는 몬스터 정면(로컬 -z) 쪽에서 내려다본다. 그 배치를 그대로 재현한다.
const GAME_YAW = Math.PI;

const BASE_FOV = 30, BASE_ASPECT = 16 / 9;
// 확대는 '카메라를 당기는' 게 아니라 'FOV를 좁히는' 방식이어야 한다.

// 원근 왜곡도 게임보다 커진다. FOV만 좁히면 거리·각도가 그대로라 망원 크롭이 되어
// 조명·왜곡은 게임 그대로이고 화면에 크게만 보인다.
// 대신 저해상도 버퍼(360줄)에서 차지하는 픽셀 수는 그만큼 늘어난다 — 즉 배율이 1.0일 때가
// 게임에서 실제로 보이는 픽셀 크기다. 배지에 배율을 항상 띄워 둔다.
let camZoom = 8.0;   // 보스보다 2.8배 작으므로 기본 배율도 그만큼 높다(1.0 = 게임 실제 크기)
let baseFov = BASE_FOV;
function applyAdaptiveFOV() {
  const aspect = viewW() / viewH();
  camera.aspect = aspect;
  if (aspect >= BASE_ASPECT) baseFov = BASE_FOV;
  else {
    const baseVRad = BASE_FOV * Math.PI / 180;
    const baseHorizontal = 2 * Math.atan(Math.tan(baseVRad / 2) * BASE_ASPECT);
    const newVRad = 2 * Math.atan(Math.tan(baseHorizontal / 2) / aspect);
    baseFov = Math.min(105, newVRad * 180 / Math.PI);
  }
  // 배율은 화면에 비치는 크기 배수 = tan(fov/2) 비율
  camera.fov = 2 * Math.atan(Math.tan(baseFov * Math.PI / 360) / camZoom) * 180 / Math.PI;
  camera.updateProjectionMatrix();

  }
  quiverGrp.position.set(0.04, 1.0, 0.24);
  quiverGrp.rotation.z = 0.5; quiverGrp.rotation.x = 0.25;
  root.add(quiverGrp);
  const strapBand = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.03), strapMat)); strapBand.position.set(0.0, 1.02, 0.1); strapBand.rotation.z = 0.5; strapBand.rotation.x = 0.1; root.add(strapBand);

  bodyGrp.add(root);
  player.archerRig = root;
  player.archerLimbs = { armR, armL, legR, legL, arrowGrp, ponySegs, ponyBase };
}

function applyArcherLook() {
  // 기사 메쉬 숨김
  headGrp.children.forEach(m => m.visible = false);
  torsoGrp.children.forEach(m => m.visible = false);
  armR.children.forEach(m => { if (m !== swordGrp) m.visible = false; });
  armL.children.forEach(m => { if (m !== shieldGrp) m.visible = false; });
  swordGrp.children.forEach(m => m.visible = false);
  shieldGrp.children.forEach(m => m.visible = false);
  legR.children.forEach(m => m.visible = false);
  legL.children.forEach(m => m.visible = false);
  setMageVisible(false); // 마법사 메쉬 숨김
  if (!player.archerRig) buildArcherRig();
  player.archerRig.visible = true;
  appliedCharLook = 'archer';
}

// 궁수 사지 애니메이션(idle/걷기) — 자기 골격(armGrp/elbowGrp, legGrp/kneeGrp)을 구동. 2단계에서 활쏘기/회피 추가.
function updateArcherAnim(dt, moveSpeed) {
  const L = player.archerLimbs; if (!L) return;
  const k = Math.min(1, dt * 12);
  const lp = (o, key, tgt) => { o[key] += (tgt - o[key]) * k; };
  const arrow = L.arrowGrp;

  // ── 포니테일 흔들림 (걷기/회피/대기 공통) : 끝으로 갈수록 크게, 위상 지연으로 채찍처럼 따라옴 ──
  if (L.ponySegs) {
    const segs = L.ponySegs, base = L.ponyBase, n = segs.length;
    let phase, amp;
    if (!inTown && !inRest && player.dodgeT > 0) {            // 회피: 크고 빠르게 휘청
      player.ponyDodgeP = (player.ponyDodgeP || 0) + dt * 17;
      phase = player.ponyDodgeP; amp = 0.5;
    } else if (moveSpeed > 0.1) {                  // 걷기: 발걸음(walkPhase)에 맞춰 출렁
      phase = player.walkPhase; amp = 0.13 + Math.min(0.16, moveSpeed * 0.025);
    } else {                                       // 대기: 살랑
      player.ponyIdleP = (player.ponyIdleP || 0) + dt * 2.2;
      phase = player.ponyIdleP; amp = 0.04;
    }
    const sk = Math.min(1, dt * 14);
    for (let i = 0; i < n; i++) {
      const w = i / (n - 1);                       // 0(뿌리)→1(끝)
      const wob = Math.sin(phase - i * 0.55) * amp * (0.25 + w);
      segs[i].rotation.x += (base[i] + wob - segs[i].rotation.x) * sk;
    }
  }

  // ── 회피(대시): 활 조준 자세를 유지한 채 낮게 굴러 피함 ── (마을에서는 표시 안 함)
  if (!inTown && !inRest && player.dodgeT > 0) {
    // 다리: 무릎 굽혀 낮은 자세
    lp(L.legR.kneeGrp.rotation, 'x', -0.6); lp(L.legL.kneeGrp.rotation, 'x', -0.6);
    lp(L.legR.legGrp.rotation, 'x', 0.2); lp(L.legL.legGrp.rotation, 'x', 0.2);
    // 팔: 활 든 오른팔 정면으로 + 왼손 시위 당김(조준 유지)
    lp(L.armR.armGrp.rotation, 'x', 1.5); lp(L.armR.armGrp.rotation, 'z', 0);
    lp(L.armR.elbowGrp.rotation, 'x', 0.1);
    lp(L.armL.armGrp.rotation, 'x', 1.3); lp(L.armL.armGrp.rotation, 'z', 0.5);
    lp(L.armL.elbowGrp.rotation, 'x', 1.0);
    // 메긴 화살 표시(활 앞)
    if (arrow) { arrow.visible = true; arrow.position.set(0.16, 1.12, -0.42); arrow.rotation.set(0, 0, 0); }
    return;
  }

  // ── 활쏘기(차지=시위 당김 / 발사=릴리스) ── (마을에서는 표시 안 함)
  if (!inTown && !inRest && (isCharging || swingTimer > 0)) {
    // 오른팔: 활을 앞으로 듦
    lp(L.armR.armGrp.rotation, 'x', 1.5); lp(L.armR.armGrp.rotation, 'z', 0);
    lp(L.armR.elbowGrp.rotation, 'x', 0.1);
    // 다리: 이동 중이면 걷기 유지(발 안 멈춤), 정지 중이면 선 자세
    if (moveSpeed > 0.1) {
      const ws = Math.sin(player.walkPhase);
      lp(L.legR.legGrp.rotation, 'x', ws * 0.55);
      lp(L.legL.legGrp.rotation, 'x', -ws * 0.55);
      lp(L.legR.kneeGrp.rotation, 'x', -Math.max(0, -ws) * 0.7);
      lp(L.legL.kneeGrp.rotation, 'x', -Math.max(0, ws) * 0.7);
    } else {
      lp(L.legR.legGrp.rotation, 'x', 0); lp(L.legL.legGrp.rotation, 'x', 0);
      lp(L.legR.kneeGrp.rotation, 'x', 0); lp(L.legL.kneeGrp.rotation, 'x', 0);
    }
    if (isCharging) {
      // 시위 당김: 차지할수록 왼손을 더 뒤로, 화살 표시
      const w = Math.min(1, chargeTime / 1.0);
      lp(L.armL.armGrp.rotation, 'x', 1.4); lp(L.armL.armGrp.rotation, 'z', 0.5);
      lp(L.armL.elbowGrp.rotation, 'x', 0.8 + w * 0.6);
      if (arrow) { arrow.visible = true; arrow.position.set(0.16, 1.12, -0.42 + w * 0.18); arrow.rotation.set(0, 0, 0); }
    } else {
      // 발사 직후 릴리스 스냅(화살은 날아갔으므로 숨김)
      lp(L.armL.armGrp.rotation, 'x', 1.1); lp(L.armL.armGrp.rotation, 'z', 0.0);
      lp(L.armL.elbowGrp.rotation, 'x', 0.35);
      if (arrow) arrow.visible = false;
    }
    return;
  }

  if (arrow) arrow.visible = false;
  const moving = moveSpeed > 0.1;
  const ws = Math.sin(player.walkPhase);
  // 팔 기본 모음각(z) 복귀
  lp(L.armR.armGrp.rotation, 'z', 0.16);
  lp(L.armL.armGrp.rotation, 'z', -0.16);
  if (moving) {
    lp(L.legR.legGrp.rotation, 'x', ws * 0.55);
    lp(L.legL.legGrp.rotation, 'x', -ws * 0.55);
    lp(L.legR.kneeGrp.rotation, 'x', -Math.max(0, -ws) * 0.7);
    lp(L.legL.kneeGrp.rotation, 'x', -Math.max(0, ws) * 0.7);
    lp(L.armR.armGrp.rotation, 'x', -0.08 - ws * 0.55);
    lp(L.armL.armGrp.rotation, 'x', -0.08 + ws * 0.55);
    lp(L.armR.elbowGrp.rotation, 'x', 0.2 + Math.max(0, ws) * 0.4);
    lp(L.armL.elbowGrp.rotation, 'x', 0.2 + Math.max(0, -ws) * 0.4);
  } else {
    lp(L.legR.legGrp.rotation, 'x', 0);
    lp(L.legL.legGrp.rotation, 'x', 0);
    lp(L.legR.kneeGrp.rotation, 'x', 0);
    lp(L.legL.kneeGrp.rotation, 'x', 0);
    lp(L.armR.armGrp.rotation, 'x', -0.08);
    lp(L.armL.armGrp.rotation, 'x', -0.08);
    lp(L.armR.elbowGrp.rotation, 'x', 0.2);
    lp(L.armL.elbowGrp.rotation, 'x', 0.2);
  }
}
  const K = { bodyGrp, headGrp, torsoGrp, armR, armL, legR, legL, swordGrp, shieldGrp, blade, sPoint, bladeMat, bladeLight };
  if (v2 && cls !== 'archer' && typeof hero2Knight === 'function') hero2Knight(K);
  if (cls === 'knight') { applyKnightLook(); if (v2) hero2Pose(K, 'knight'); }
  else if (cls === 'mage') { applyMageLook(); if (v2 && typeof hero2Mage === 'function') { hero2Mage(K, player); hero2Pose(K, 'mage'); } }
  else { if (v2 && typeof hero2Archer === 'function') { applyArcherLook(); hero2Archer(K, player); } else applyArcherLook(); }
  // 대기 자세(게임 update 의 평상시 목표값)
  armL.rotation.x = cls === 'mage' ? Math.PI * 0.08 : Math.PI * 0.32; armL.rotation.z = cls === 'mage' ? 0 : 10 * Math.PI / 180;
  if (cls === 'mage') { shieldGrp.rotation.set(0, 0, -Math.PI / 2); if (player.bookGrp) player.bookGrp.rotation.z = Math.PI / 2; }
  player.anim = (dt, mv) => {
    if (mv) player.walkPhase += 6.5 * dt * 2.5; else player.walkPhase *= 0.8;
    const wSin = Math.sin(player.walkPhase);
    legR.rotation.x = wSin * 0.7; legL.rotation.x = -wSin * 0.7;
    bodyGrp.position.y = Math.abs(wSin) * 0.15;
    armR.rotation.x = -wSin * 0.5;
    if (cls === 'archer') updateArcherAnim(dt, mv ? 6.5 : 0);
  };
  return player;
}

// ---------- 바닥 ----------
const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.05, 48), getLowPolyMat(0x0d1109));
disc.material.roughness = 1.0; disc.receiveShadow = true; scene.add(disc);
discMat = disc.material; applyAct(actIdx);

const CLS = ['knight', 'mage', 'archer'], CLS_NAME = { knight: '기사', mage: '마법사', archer: '궁수' };
let clsIdx = 0, cmpMode = 0;   // 0 나란히 · 1 예전만 · 2 새것만
{ const q = /[?&]cls=(\w+)/.exec(location.search); if (q && CLS.includes(q[1])) clsIdx = CLS.indexOf(q[1]); const c = /[?&]cmp=(\d)/.exec(location.search); if (c) cmpMode = +c[1]; }
let heroes = [];
function rebuild() {
  for (const h of heroes) scene.remove(h.obj);
  heroes = [];
  const cls = CLS[clsIdx];
  const list = cmpMode === 0 ? [[false, 0.8], [true, -0.8]] : cmpMode === 1 ? [[false, 0]] : [[true, 0]];
  for (const [v2, x] of list) {
    const p = makeHero(cls, v2); p.obj.position.x = x; p.v2 = v2;
    if (BLOB_ON) p.obj.add(makeBlobShadow(1.4));
    scene.add(p.obj); heroes.push(p);
  }
  document.getElementById('clsBtn').textContent = CLS_NAME[cls];
  document.getElementById('cmpBtn').textContent = ['나란히(예전 · 새)', '예전만', '새것만'][cmpMode];
  applyShadowMode(studioShadow);
  updateVer();
}
let autoSpin = !/[?&]spin=0/.test(location.search), walking = false, studioShadow = true;
const verEl = document.getElementById('ver');
function updateVer() {
  const real = Math.abs(camZoom - 1) < 0.02;
  let tri = 0, calls = 0;
  for (const h of heroes) if (h.v2) h.obj.traverse(o => { if (o.isMesh && o.visible) { calls++; tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
  verEl.innerHTML = 'hero_viewer v1' + (PX_MODE ? ' · px' : ' · px=0') + '<br>' + ACTS[actIdx].name
    + '<br>' + camZoom.toFixed(1) + '× ' + (real ? '<span style="color:#8ad08a">게임 실제 크기</span>' : '<span style="color:#d08a84">확대</span>')
    + (cmpMode !== 1 ? '<br>새 모델 메시 ' + calls + ' · 삼각형 ' + Math.round(tri) : '');
}
let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 1.0, ZOOM_MAX = 28.0;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => { if (!dragging) return; camYaw -= (e.clientX - lastX) * 0.01; camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01)); lastX = e.clientX; lastY = e.clientY; updateCam(); });
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015))); applyAdaptiveFOV(); updateVer(); }, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (pinching && e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD)))); pinchD = d; applyAdaptiveFOV(); updateVer(); } else if (dragging && e.touches.length === 1) { const t = e.touches[0]; camYaw -= (t.clientX - lastX) * 0.01; camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01)); lastX = t.clientX; lastY = t.clientY; updateCam(); } }, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });
for (const el of document.querySelectorAll('.btn')) { el.addEventListener('mousedown', e => e.preventDefault()); el.addEventListener('click', () => { el.blur(); if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }); }
function applyShadowMode(on) {
  studioShadow = on;
  for (const h of heroes) h.obj.traverse(o => { if (o.isMesh && o.material !== blobMatShared) o.castShadow = on; });
  const el = document.getElementById('shadowBtn'); el.textContent = '그림자: ' + (on ? '켬' : '끔'); el.classList.toggle('on', on);
}
document.getElementById('clsBtn').addEventListener('click', () => { clsIdx = (clsIdx + 1) % CLS.length; rebuild(); });
document.getElementById('cmpBtn').addEventListener('click', () => { cmpMode = (cmpMode + 1) % 3; rebuild(); });
document.getElementById('spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.target.textContent = '자동회전: ' + (autoSpin ? '켬' : '끔'); });
document.getElementById('walkBtn').addEventListener('click', e => { walking = !walking; e.target.classList.toggle('on', walking); });
document.getElementById('actBtn').addEventListener('click', e => { actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); e.target.textContent = ACTS[actIdx].name; applyShadowMode(!!ACTS[actIdx].studio); updateVer(); });
document.getElementById('shadowBtn').addEventListener('click', () => applyShadowMode(!studioShadow));
document.getElementById('resetBtn').addEventListener('click', () => { camZoom = 4.0; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer(); });
function onResize() {
  applyAdaptiveFOV(); renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH()); lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH); rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH); bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH); quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) { window.visualViewport.addEventListener('resize', onResize); window.visualViewport.addEventListener('scroll', onResize); }
if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
camZoom = 4.0; applyAdaptiveFOV();
{ const a = /[?&]act=(\d)/.exec(location.search); if (a) { actIdx = +a[1]; applyAct(actIdx); document.getElementById('actBtn').textContent = ACTS[actIdx].name; } }
rebuild(); applyShadowMode(!!ACTS[actIdx].studio);
const clock = new THREE.Clock();
function step(dt) { if (autoSpin) { camYaw += dt * 0.32; updateCam(); } for (const h of heroes) h.anim(dt, walking); renderWithPost(scene); }
window.__step = step;
function animate() { step(Math.min(0.05, clock.getDelta())); requestAnimationFrame(animate); }
animate();
</script>
