<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>새끼 포란충 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="biteBtn">물기</button>
  <button class="btn" id="spewBtn">분비물</button>
  <button class="btn" id="deadBtn">죽음</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="gridBtn">그리드</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  새끼 포란충 — 3막 일반 몹(보스 포란충의 유생).
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);
        graded = mix(col.rgb, uOutline, clamp(line, 0.0, 1.0));
      }

const poolMat    = new THREE.MeshStandardMaterial({ color: 0x100a03, roughness: 0.55, flatShading: true, transparent: true, opacity: 0.85 });

[sacMat, sacRimMat, mawMat].forEach(markOrganic);   // 살은 유기체(하이라이트 제외)

const bugObj = new THREE.Group(); scene.add(bugObj);

// 껍질 조각 하나를 주머니 표면에 '접하게' 붙인다(보스와 같은 방식).
const _sacPos = new THREE.Vector3(0, 0, 0);
const PLATE_DIRS = [];   // 이음선 그물을 여기서 뽑는다
function shellPlate(dx, dy, dz, r, sx, sz, mat, jit) {
  const d = new THREE.Vector3(dx, dy, dz).normalize();
  PLATE_DIRS.push({ d: d.clone(), r });
  const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat));
  m.scale.set(sx, 0.24, sz);
  m.position.copy(d).multiplyScalar(SAC_R * 0.97).add(_sacPos);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  jitterGeometry(m.geometry, r * (jit === undefined ? 0.20 : jit));
  bodyGrp.add(m); return m;
}

// ---------- 배 ----------
const SAC_C = { x: 0, y: 0.88, z: 0.14 }, SAC_R = 0.52;
const sacGrp = new THREE.Group(); sacGrp.position.set(SAC_C.x, SAC_C.y, SAC_C.z); bodyGrp.add(sacGrp);
// 살갗 — 반투명이라 노멀 패스에서 자동으로 빠진다(외곽선이 안 생긴다).
// 속이 안 비치므로 표면이 형태의 전부다 — 지터를 키워 말랑하게 눌린 살로 읽히게 한다.
const sacShell = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R, 2), sacMat));
sacShell.scale.set(1.0, 0.96, 1.08); jitterGeometry(sacShell.geometry, 0.075); sacGrp.add(sacShell);
// 앞뒤로 작은 마디 하나씩 — 배가 매끈한 공이 아니라 세 마디로 읽힌다.
// 알을 빼면 속이 안 비쳐서 표면 굴곡 말고는 볼 것이 없다. 유충의 마디는 그 자리를 메우면서
// '아직 덜 자란 몸'을 같이 말해 준다. 재질이 살갗과 같아 병합 뒤에도 드로우콜은 안 는다.
[[0.00,  0.00, -0.30, 0.40, 0.96, 0.92, 0.85],
 [0.00, -0.04,  0.40, 0.36, 0.94, 0.90, 0.86]].forEach(p => {
  const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(p[3], 1), sacMat));
  m.position.set(p[0], p[1], p[2]); m.scale.set(p[4], p[5], p[6]);
  jitterGeometry(m.geometry, p[3] * 0.13); sacGrp.add(m);
});
// 아래로 처진 짙은 살 — 배 밑을 무겁게 눌러 준다(옆·뒤 실루엣에서 보인다)
const sacLow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(SAC_R * 0.86, 1), sacRimMat));
sacLow.scale.set(1.02, 0.52, 1.0); sacLow.position.set(0, -SAC_R * 0.66, 0.01);
jitterGeometry(sacLow.geometry, 0.06); sacGrp.add(sacLow);

// ---------- 주머니를 감싼 각진 외골격 판 ----------
// 보스는 13장이 주머니를 거의 다 감싸지만, 새끼는 등 쪽 6장뿐이다 — 옆구리·배가 말랑하게
// 드러나 있어야 '아직 굳지 않은 껍질'로 읽힌다(삼각형도 그만큼 싸다).
_sacPos.set(SAC_C.x, SAC_C.y, SAC_C.z);
shellPlate( 0.04,  1.00,  0.06, 0.34, 1.10, 1.05, chitinLit);
shellPlate(-0.62,  0.80,  0.08, 0.27, 1.05, 1.00, chitinLit);
shellPlate( 0.64,  0.78,  0.04, 0.27, 1.05, 1.00, chitinLit);
shellPlate(-0.18,  0.66,  0.76, 0.27, 1.05, 1.00, chitinMat);
shellPlate( 0.24,  0.62,  0.80, 0.25, 1.00, 0.95, chitinMat);
shellPlate( 0.02,  0.34,  1.00, 0.20, 0.95, 0.90, chitinDk);
// ---------- 판 사이를 흐르는 금빛 이음선 ----------
// 보스와 같은 방식(판 인접쌍을 큰 원으로 잇는다)이되 실이 훨씬 가늘다 —
// 금빛은 껍질이 굳으면서 짙어지는 것이라, 새끼는 겨우 비칠 정도여야 한다.
const SEAM_R = SAC_R * 1.165;
function seamArc(A, B, w) {
  const n = Math.max(2, Math.round(A.angleTo(B) / 0.30));
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const v = A.clone().lerp(B, i / n).normalize().multiplyScalar(SEAM_R).add(_sacPos);
    if (prev) addSeam(bodyGrp, prev.toArray(), v.toArray(), w, seamMat);
    prev = v;
  }
}
let _seamCount = 0;
for (let i = 0; i < PLATE_DIRS.length; i++) {
  for (let j = i + 1; j < PLATE_DIRS.length; j++) {
    const a = PLATE_DIRS[i], b = PLATE_DIRS[j];
    if (a.d.angleTo(b.d) > 1.02) continue;              // 붙어 있는 판끼리만 잇는다
    seamArc(a.d, b.d, 0.006 + rnd() * 0.004);
    _seamCount++;
  }
}

// ---------- 가슴마디 — 머리와 배를 잇는다 ----------
// 없으면 옆에서 봤을 때 머리가 몸에서 떨어져 떠 보인다. 앞다리 밑동(z=-0.34)이
// 붙을 자리이기도 하다. 정적이라 bodyGrp 에 넣어 그대로 병합된다.
{
  const thx = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 1), chitinMat));
  thx.scale.set(0.95, 0.80, 1.12); thx.position.set(0, 0.80, -0.40);
  jitterGeometry(thx.geometry, 0.05); bodyGrp.add(thx);
  const collar = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.19, 0), chitinDk));
  collar.scale.set(1.05, 0.85, 0.55); collar.position.set(0, 0.78, -0.56);

}

// ---------- 머리 — 황금 홑눈 뭉치 ----------
// 새끼는 머리가 몸에 비해 크고 홑눈도 크다. 대신 개수는 적다(홑눈은 자라면서 늘어난다).
const HEAD = { x: 0, y: 0.74, z: -0.62 };
const headGrp = new THREE.Group(); headGrp.position.set(HEAD.x, HEAD.y, HEAD.z); bodyGrp.add(headGrp);
const headCore = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 1), chitinMat));
headCore.scale.set(1.08, 0.94, 1.0); jitterGeometry(headCore.geometry, 0.06); headGrp.add(headCore);
const eyeBalls = [];
for (let i = 0; i < 12; i++) {
  const k = i + 0.5, n = 12;
  const phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k;
  const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi) * 0.85, uz = Math.sin(phi) * Math.sin(th);
  if (uz > 0.35) continue;                       // 뒤통수에는 안 붙인다
  // 크기 폭이 넓으면 제일 큰 놈이 머리 밖으로 튀어나와 포도송이처럼 보인다(실측: 0.145 = 머리 반지름의 절반)
  const r = 0.055 + rnd() * 0.052;
  const e = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), i % 3 === 0 ? eyeGlowMat : eyeMat));
  e.position.set(ux * 0.26, uy * 0.23, uz * 0.25 - 0.06);
  headGrp.add(e); eyeBalls.push(e);
}
// 입(아래쪽 어두운 구멍) + 좌우 턱
const maw = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), mawMat));
maw.scale.set(1.1, 0.7, 0.7); maw.position.set(0, -0.18, -0.12); headGrp.add(maw);
const jawGrp = new THREE.Group(); jawGrp.position.set(0, -0.16, -0.06); headGrp.add(jawGrp);
[-1, 1].forEach(s => {
  const j = sh(new THREE.Mesh(new THREE.ConeGeometry(0.040, 0.32, 4), legMat));
  j.position.set(s * 0.11, -0.10, -0.16); j.rotation.set(-0.5, 0, s * 0.42);
  jawGrp.add(j);
});

// 늘어지는 점액과 바닥에 고인 자국은 넣지 않는다(사용자 지시).
// 보스는 네 뭉치가 바닥까지 늘어지고 그 밑에 자국이 고여 있지만, 새끼는 흘리지 않는다.
// 자국까지 같이 뺀 이유: 흘리는 것이 없는데 바닥 자국만 남으면 앞뒤가 안 맞는다.
// oozeMat/poolMat 은 그대로 둔다 — '분비물' 공격의 방울과 그 방울이 바닥에 만드는
// 임시 자국이 쓰는 재질이다(그쪽은 시간이 지나면 사라진다).

// ---------- 다리 6개 ----------
function boneSeg(len, rBase, rTip, mat) {
  const g = new THREE.CylinderGeometry(rTip, rBase, len, 5);
  g.translate(0, len / 2, 0);
  return sh(new THREE.Mesh(g, mat));
}
// 보스와 같은 방식으로 푼다. 다만 무릎각(0.75)이 커서 무릎이 몸보다 **낮게** 선다 —
// 여기가 성체와 갈리는 지점이다(보스는 0.62로 무릎이 배보다 높이 솟는다).
//   무릎 높이 = ATTACH_Y + FEMUR·cos(0.75) = 0.62 + 0.40·0.7317 = 0.913  (배 위쪽은 1.40)
//   발끝 높이 = 무릎 높이 − (TIBIA + 발톱 0.12)·cos(0.75+2.189) = 0  ← 여기서 TIBIA가 나온다
const FEMUR = 0.40, TIBIA = 0.812;
// [부착 x, y, z, 다리 평면 요(앞뒤로 벌리는 각)]
const LEG_SPEC = [
  [0.30, 0.62, -0.34,  0.66],
  [0.36, 0.62,  0.04,  0.02],
  [0.31, 0.62,  0.40, -0.50],
];
const legs = [];
[1, -1].forEach(side => LEG_SPEC.forEach((L, i) => {
  const root = new THREE.Group();
  root.position.set(side * L[0], L[1], L[2]);
  root.rotation.y = side * L[3];              // 다리 평면을 앞/뒤로 돌린다
  bodyGrp.add(root);
  const femurGrp = new THREE.Group();
  femurGrp.rotation.z = -side * 0.75;
  root.add(femurGrp);
  femurGrp.add(boneSeg(FEMUR, 0.052, 0.038, legMat));
  // 밑동 관절은 다리와 함께 움직이지 않는다 — 몸통에 직접 붙여 드로우콜을 아낀다
  const coxa = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.070, 0), chitinDk));
  coxa.scale.set(1.0, 0.8, 1.0); jitterGeometry(coxa.geometry, 0.02);
  coxa.position.copy(root.position); bodyGrp.add(coxa);
  // 무릎에서 꺾여 바닥으로 내려간다
  const kneeGrp = new THREE.Group(); kneeGrp.position.y = FEMUR;
  kneeGrp.rotation.z = -side * 2.189;
  femurGrp.add(kneeGrp);
  kneeGrp.add(boneSeg(TIBIA, 0.036, 0.010, legMat));
  // 발톱 — 보스처럼 따로 어두운 재질을 쓰지 않는다. 이 크기에서는 안 보이는데
  // 재질만 하나 더 늘어 다리마다 드로우콜이 붙는다.
  const tip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.019, 0.14, 4), legMat));
  tip.position.y = TIBIA + 0.05; tip.rotation.x = Math.PI; kneeGrp.add(tip);
  legs.push({ root, femurGrp, kneeGrp, side, idx: i,
              baseFemur: femurGrp.rotation.z, baseKnee: kneeGrp.rotation.z,
              phase: (i + (side > 0 ? 0 : 1.5)) * (Math.PI / 1.5) });   // 삼각보행 위상
}));

// ---------- 드로우콜 병합(움직이는 그룹은 제외) ----------
mergeStatic(headGrp, [jawGrp]);
mergeStatic(jawGrp);
mergeStatic(sacGrp);
legs.forEach(L => { mergeStatic(L.kneeGrp); mergeStatic(L.femurGrp, [L.kneeGrp]); });
mergeStatic(bodyGrp, [sacGrp, headGrp, ...legs.map(L => L.root)]);
// 게임의 일반 몬스터는 진짜 그림자 대신 발밑 블롭 한 장을 깐다(보스 2.3 / 이 크기는 1.5)

const gridGroup = new THREE.Group(); gridGroup.visible = false; scene.add(gridGroup);

function axisLine(from, to, color) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...from), new THREE.Vector3(...to)]);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color }));
}
gridGroup.add(axisLine([-1.6, 0.04, 0], [1.6, 0.04, 0], 0xc0504a));
gridGroup.add(axisLine([0, 0.04, -1.6], [0, 0.04, 1.6], 0x4a6ac0));
gridGroup.add(axisLine([0, 0, 0], [0, 1.7, 0], 0x4aa05a));
function makeLabel(text, x, y, z, color = '#cfd8e0') {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.position.set(x, y, z); spr.scale.set(0.24, 0.12, 1); gridGroup.add(spr);
}
for (let i = -3; i <= 3; i++) {
  if (i !== 0) { const v = i * 0.5; makeLabel(v.toFixed(1), v, 0.06, 0.11, '#d08a84'); makeLabel(v.toFixed(1), 0.13, 0.06, v, '#8a9ad0'); }
}
for (let i = 1; i <= 6; i++) { const y = i * 0.25; makeLabel(y.toFixed(2), 0.11, y, 0, '#8ad08a'); }
makeLabel('+X', 1.7, 0.10, 0, '#e0a0a0'); makeLabel('+Z', 0, 0.10, 1.7, '#a0b0e0'); makeLabel('+Y', 0.14, 1.8, 0, '#a0e0a0');

let autoSpin = true, walking = false, walkPhase = 0;
let bitePhase = -1, spewPhase = -1, deadPhase = -1, sacSwell = 1;
let studioShadow = false;

const verEl = document.getElementById('ver');
function updateVer() {
  const real = Math.abs(camZoom - 1) < 0.02;
  verEl.innerHTML = 'brood_tick_larva_viewer ' + VIEWER_VERSION + (PX_MODE ? ' · px' : ' · px=0')
    + '<br>' + ACTS[actIdx].name + ' · 거리 ' + camDist.toFixed(1) + ' (게임과 동일)'
    + '<br>' + camZoom.toFixed(1) + '× '

}

let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 1.0, ZOOM_MAX = 28.0;   // 1.0 = 게임에서 실제로 보이는 픽셀 크기
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.01;
  camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01));
  lastX = e.clientX; lastY = e.clientY; updateCam();
});
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015)));
  applyAdaptiveFOV(); updateVer();
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinching && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD))));
    pinchD = d; applyAdaptiveFOV(); updateVer();
  } else if (dragging && e.touches.length === 1) {
    const t = e.touches[0];
    camYaw -= (t.clientX - lastX) * 0.01;
    camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01));
    lastX = t.clientX; lastY = t.clientY; updateCam();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });

// 버튼에 포커스가 남지 않게 한다. 포커스된 요소가 보이는 영역 밖에 걸쳐 있으면 브라우저가

// mousedown 을 막으면 포커스 자체가 안 잡히고, 그래도 잡히는 경우를 대비해 클릭 뒤 blur 한다.

document.getElementById('spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.target.textContent = '자동회전: ' + (autoSpin ? '켬' : '끔'); });
document.getElementById('walkBtn').addEventListener('click', e => { walking = !walking; e.target.classList.toggle('on', walking); });
const idleAtk = () => bitePhase < 0 && spewPhase < 0 && deadPhase < 0;
document.getElementById('biteBtn').addEventListener('click', () => { if (idleAtk()) bitePhase = 0; });
document.getElementById('spewBtn').addEventListener('click', () => { if (idleAtk()) spewPhase = 0; });
// 죽음은 토글이다 — 누르면 쓰러지고 한 번 더 누르면 원래 자세로 돌아온다(형태 확인용)
document.getElementById('deadBtn').addEventListener('click', e => {
  if (deadPhase >= 0) {
    deadPhase = -1;
    bodyGrp.rotation.set(0, 0, 0); bodyGrp.position.x = 0; headGrp.rotation.x = 0; jawGrp.rotation.x = 0; sacSwell = 1;
    eyeGlowMat.emissiveIntensity = 0.196;
    for (const L of legs) { L.femurGrp.rotation.z = L.baseFemur; L.kneeGrp.rotation.z = L.baseKnee; }
  } else {
    deadPhase = 0; bitePhase = -1; spewPhase = -1;
    bugObj.position.z = 0;
  }
  e.target.classList.toggle('on', deadPhase >= 0);
});
// 게임은 몬스터 그림자를 끄고 블롭으로 대신한다(성능). 스튜디오에서는 형태가 읽히도록 켠다.
function applyShadowMode(on) {
  studioShadow = on;
  for (const o of _shadowCasters) o.castShadow = on;
  bugObj.traverse(o => { if (o.isMesh && o !== disc && o.material !== blobMatShared) o.castShadow = on; });
  const el = document.getElementById('shadowBtn');
  el.textContent = '그림자: ' + (on ? '켬' : '끔');
  el.classList.toggle('on', on);
}
document.getElementById('actBtn').addEventListener('click', e => {
  actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); e.target.textContent = ACTS[actIdx].name;
  applyShadowMode(!!ACTS[actIdx].studio);   // 막으로 넘어가면 게임과 같이 그림자를 끈다
  updateVer();
});
document.getElementById('shadowBtn').addEventListener('click', () => applyShadowMode(!studioShadow));
document.getElementById('gridBtn').addEventListener('click', e => { gridGroup.visible = !gridGroup.visible; e.target.classList.toggle('on', gridGroup.visible); });
document.getElementById('resetBtn').addEventListener('click', () => {
  camZoom = 8.0; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer();
});

function onResize() {
  applyAdaptiveFOV();
  renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH());
  lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH);
  // r128의 setSize는 depthTexture를 안 줄인다 — 손으로 맞추지 않으면 리사이즈 후 외곽선이 깨진다.
  rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH);
  bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH);
  quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  // 어떤 이유로든 확대되어 화면이 잘려 보이면(더블탭 확대 등) 다시 맞춘다.
  window.visualViewport.addEventListener('scroll', onResize);
}

if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
  document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
}
applyShadowMode(true);   // 시작은 스튜디오 모드 — 형태를 보라고 그림자를 켠 채로 연다
updateVer();
// ---------- 분비물 방울 (미리 만들어 두고 재사용) ----------
// 보스는 18방울을 넓게 뿜지만 새끼는 6방울을 짧게 뱉는다.
const spit = [];
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.040 + rnd() * 0.022, 0), oozeMat);
  m.visible = false; scene.add(m);
  spit.push({ m, st: 0, v: new THREE.Vector3(), life: 0, base: 1, delay: (i / 6) * 0.26 + rnd() * 0.03 });
}
const _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function launchSpit(d) {
  headGrp.getWorldPosition(d.m.position); d.m.position.y -= 0.14;
  headGrp.getWorldQuaternion(_q);
  const fwd = _v.set(0, 0, -1).applyQuaternion(_q); fwd.y = 0; fwd.normalize();
  const dir = fwd.clone().applyAxisAngle(_up, (rnd() - 0.5) * 0.7);
  const sp = 1.5 + rnd() * 0.9;
  d.v.set(dir.x * sp, 0.9 + rnd() * 0.4, dir.z * sp);
  d.m.material = oozeMat; d.m.scale.setScalar(1); d.m.visible = true; d.st = 1;
}
function updateBits(dt) {
  for (const d of spit) {
    if (d.st === 1) {
      d.v.y -= 9.2 * dt; d.m.position.addScaledVector(d.v, dt);
      d.m.rotation.x += dt * 7;
      if (d.m.position.y <= 0.04) {
        d.m.position.y = 0.035; d.m.material = poolMat;
        d.base = 0.9 + rnd() * 0.5; d.m.scale.set(d.base, 0.16, d.base);
        d.st = 2; d.life = 2.0 + rnd() * 0.9;
      }
    } else if (d.st === 2) {
      d.life -= dt;
      if (d.life < 0.8) { const k = Math.max(0, d.life / 0.8);
        d.m.scale.set(d.base * (0.35 + 0.65 * k), 0.16 * k, d.base * (0.35 + 0.65 * k)); }
      if (d.life <= 0) { d.m.visible = false; d.st = 0; }
    }
  }
}

const clock = new THREE.Clock();
const lerp = (o, key, tgt, k, dt) => { o[key] += (tgt - o[key]) * Math.min(1, dt * k); };

function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (autoSpin) { camYaw += dt * 0.32; updateCam(); }

  // ---- 상시: 노른자 주머니가 숨 쉬듯 부풀고, 속의 덩이가 출렁이고, 점액이 흔들린다 ----
  // 새끼는 보스보다 호흡이 빠르고 폭이 크다(작은 몸일수록 대사가 빠르다).
  const breath = Math.sin(t * 1.05);
  const ss = (1 + breath * 0.045) * sacSwell;
  // 호흡과 다른 주기로 가로/세로가 번갈아 눌린다 — 속이 안 비치므로 말랑함은 이걸로 낸다.
  // 반드시 sacGrp 에 걸 것: sacShell 은 mergeStatic(sacGrp) 에서 병합돼 참조가 끊긴다.
  const ew = 1 + Math.sin(t * 1.30 + 1.2) * 0.030;
  sacGrp.scale.set(ss * ew, ss * (1 - breath * 0.020), ss / ew);
  bodyGrp.position.y = breath * 0.016;
  eyeGlowMat.emissiveIntensity = 0.160 + Math.sin(t * 2.6) * 0.050 + Math.sin(t * 0.9) * 0.028;

  // ---- 이동: 삼각보행. 보스보다 보폭이 짧고 빠르다(종종거린다) ----
  if (walking && deadPhase < 0) walkPhase += dt * 4.2;
  if (deadPhase < 0) for (const L of legs) {
    let lift = 0, swing = 0;
    if (walking) {
      const s = Math.sin(walkPhase + L.phase);
      lift = Math.max(0, s) * 0.34;
      swing = Math.cos(walkPhase + L.phase) * 0.20;
    }
    // 발끝이 y=0 에 딱 닿게 풀어 놨으므로, 떨림은 '드는 쪽'으로만 준다(양쪽이면 바닥을 뚫는다)
    const tremble = -Math.abs(Math.sin(t * 9.1 + L.phase * 2.1)) * 0.012;
    lerp(L.femurGrp.rotation, 'z', L.baseFemur - L.side * (swing + tremble), 11, dt);
    lerp(L.kneeGrp.rotation, 'z', L.baseKnee + L.side * lift, 11, dt);
  }
  if (walking && deadPhase < 0) {
    lerp(bodyGrp.rotation, 'z', Math.sin(walkPhase) * 0.045, 8, dt);
    lerp(bodyGrp.rotation, 'x', Math.sin(walkPhase * 2) * 0.030, 8, dt);
    bodyGrp.position.y = breath * 0.016 + Math.abs(Math.sin(walkPhase)) * 0.030;
  } else if (deadPhase < 0 && bitePhase < 0) {
    lerp(bodyGrp.rotation, 'z', 0, 6, dt);
    lerp(bodyGrp.rotation, 'x', 0, 6, dt);
  }

  // ---- 물기: 뒷다리로 버티며 몸을 앞으로 던져 턱을 박는다 ----
  // 일반 몹의 주 공격이라 사이클이 짧아야 한다(전체 0.95초).
  if (bitePhase >= 0) {
    bitePhase += dt;
    if (bitePhase < 0.28) {                     // 1) 뒤로 웅크린다(예비 동작)
      const w = bitePhase / 0.28, e = w * w * (3 - 2 * w);
      bugObj.position.z = 0.16 * e;
      bodyGrp.rotation.x = -0.16 * e;
      headGrp.rotation.x = 0.30 * e;
      jawGrp.rotation.x = -0.55 * e;            // 턱을 벌린다
      for (const L of legs) L.kneeGrp.rotation.z = L.baseKnee + L.side * 0.20 * e;
    } else if (bitePhase < 0.42) {              // 2) 앞으로 튀어나가 문다
      const w = (bitePhase - 0.28) / 0.14, e = w * w;
      bugObj.position.z = 0.16 - 0.52 * e;
      bodyGrp.rotation.x = -0.16 + 0.42 * e;
      headGrp.rotation.x = 0.30 - 0.58 * e;
      jawGrp.rotation.x = -0.55 + 0.75 * e;     // 턱이 닫히며 물린다
    } else if (bitePhase < 0.95) {              // 3) 물고 흔든 뒤 제자리로
      const w = (bitePhase - 0.42) / 0.53;
      bodyGrp.rotation.y = Math.sin(w * 26) * 0.075 * (1 - w);   // 문 채로 도리질
      lerp(bugObj.position, 'z', 0, 6, dt);
      lerp(bodyGrp.rotation, 'x', 0, 6, dt);
      lerp(headGrp.rotation, 'x', 0, 6, dt);
      lerp(jawGrp.rotation, 'x', 0, 6, dt);
      for (const L of legs) lerp(L.kneeGrp.rotation, 'z', L.baseKnee, 6, dt);
    } else {
      bitePhase = -1; bugObj.position.z = 0;
      bodyGrp.rotation.x = 0; bodyGrp.rotation.y = 0;
      headGrp.rotation.x = 0; jawGrp.rotation.x = 0;
    }
  }

  // ---- 분비: 머리를 젖혔다 짧게 뱉는다 ----
  if (spewPhase >= 0) {
    spewPhase += dt;
    if (spewPhase < 0.30) {                     // 1) 머리를 젖혀 모은다
      const w = spewPhase / 0.30, e = w * w * (3 - 2 * w);
      headGrp.rotation.x = 0.34 * e;
      jawGrp.rotation.x = -0.5 * e;
      sacSwell = 1 + 0.09 * e;
    } else if (spewPhase < 0.72) {              // 2) 분출
      lerp(headGrp.rotation, 'x', -0.28, 14, dt);
      lerp(jawGrp.rotation, 'x', -0.85, 14, dt);
      sacSwell = 0.94;
      bodyGrp.rotation.x += Math.sin(t * 30) * 0.005;
      const sp = spewPhase - 0.30;
      for (const d of spit) if (d.st === 0 && sp >= d.delay) launchSpit(d);
    } else if (spewPhase < 1.25) {              // 3) 복귀
      sacSwell = 1;
      lerp(headGrp.rotation, 'x', 0, 6, dt);
      lerp(jawGrp.rotation, 'x', 0, 6, dt);
    } else { spewPhase = -1; headGrp.rotation.x = 0; jawGrp.rotation.x = 0; sacSwell = 1; }
  } else if (bitePhase < 0 && deadPhase < 0) {
    lerp(headGrp.rotation, 'x', Math.sin(t * 1.1) * 0.05, 4, dt);
    lerp(jawGrp.rotation, 'x', Math.sin(t * 1.9) * 0.09, 4, dt);
  }
  updateBits(dt);

  // ---- 죽음: 다리를 안으로 오그리고 옆으로 넘어진다 ----
  // 벌레의 죽음은 '쓰러진다'가 아니라 '다리가 접힌다'로 읽힌다 — 다리를 먼저 오그린다.
  if (deadPhase >= 0) {
    deadPhase += dt;
    const w = Math.min(1, deadPhase / 0.75), e = w * w * (3 - 2 * w);
    for (const L of legs) {
      // 넓적다리를 몸 쪽으로 눕히고 무릎을 최대로 접는다(뒤집힌 벌레 다리)
      lerp(L.femurGrp.rotation, 'z', L.baseFemur + L.side * 0.70, 6, dt);
      lerp(L.kneeGrp.rotation, 'z', L.baseKnee - L.side * 1.05, 6, dt);
    }
    // 옆으로 넘어간다. bodyGrp 의 원점은 바닥(y=0)이라 그냥 돌리면 몸이 제 발 밖으로
    // 미끄러진다(실측: 73° 에서 0.86 만큼 옆으로 날아갔다). 다리 밑동 높이(0.62)를
    // 축으로 삼도록 위치를 함께 보정해야 '그 자리에서 옆으로 넘어가는' 그림이 된다.
    const th = 1.30 * e, PIV = 0.62;
    bodyGrp.rotation.z = th;
    bodyGrp.rotation.x = -0.22 * e;
    bodyGrp.position.x = PIV * Math.sin(th);
    bodyGrp.position.y = breath * 0.016 + PIV * (1 - Math.cos(th)) - 0.16 * e;
    headGrp.rotation.x = 0.42 * e;
    jawGrp.rotation.x = -0.30 * e;
    sacSwell = 1 - 0.16 * e;                     // 주머니가 쭈그러든다
    eyeGlowMat.emissiveIntensity = 0.196 * (1 - e);   // 눈빛이 서서히 꺼진다
    if (deadPhase > 0.75) {                      // 다 넘어간 뒤에도 다리가 가끔 경련한다
      const tw = Math.max(0, 1 - (deadPhase - 0.75) / 2.2);
      const L = legs[(Math.floor(deadPhase * 3.1) % legs.length)];
      L.kneeGrp.rotation.z += Math.sin(deadPhase * 41) * 0.05 * tw;
    }
  }

  // 게임과 같은 렌더 경로: 픽셀 스냅 → 저해상도 색·깊이 → 노멀 패스(피부 표식) → 블룸 → 합성
  renderWithPost(scene);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
