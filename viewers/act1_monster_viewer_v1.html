<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1막 몬스터 뷰어 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="typeBtn">고블린</button>
  <button class="btn" id="varBtn">일반</button>
  <button class="btn" id="cmpBtn">나란히(예전 · 새)</button>
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="atkBtn">공격</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  용병 — 마을 여관에서 고용하는 동료(v879). 몸은 게임과 같은 buildMercBody 를 그대로 쓴다.
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v1';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);

//  limbs.armR/armL/legR/legL · limbs.weapon)에 새 부품을 붙인다 — 공용 걷기·휘두르기·보스 패턴이 그대로 돈다.
//  짓는 동안 Math.random 을 자체 LCG 로 바꿔 끼운다(uuid) — 예전 몸이 먹은 난수는 그대로라 층 생성 흐름이 같다.
// ============================================================
function a1Lcg(seed, fn) {
  const R = Math.random; let s = seed >>> 0;
  Math.random = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  try { return fn(); } finally { Math.random = R; }
}
// 부품 도구 — 재질은 개체마다 새로(히트 플래시가 개체마다 돈다). 색만 다른 재질은 mergeInto 로 한 재질(정점색)에 묶는다.
function a1Kit(seed) {
  let s = seed >>> 0;
  const rr = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const shared = {};
  const sharedOf = (kind) => {
    if (shared[kind]) return shared[kind];
    let m;
    if (kind === 'skin') { m = getLowPolyMat(0xffffff); m.vertexColors = true; markOrganic(m); }
    else if (kind === 'metal') { m = getLowPolyMat(0xffffff, true); m.vertexColors = true; }
    else if (kind === 'cloth') { m = getLowPolyMat(0xffffff); m.vertexColors = true; m.side = THREE.DoubleSide; }
    else { m = getLowPolyMat(0xffffff); m.vertexColors = true; }
    return (shared[kind] = m);
  };
  const mats = {};
  const mat = (hex, kind) => {
    const k = (kind || 'hard') + hex;
    if (mats[k]) return mats[k];
    let m;
    if (kind === 'glow') m = new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: 1.0, roughness: 0.5, flatShading: true });
    else {
      m = (kind === 'metal') ? getLowPolyMat(hex, true) : getLowPolyMat(hex);
      if (kind === 'skin') markOrganic(m);
      if (kind === 'cloth') m.side = THREE.DoubleSide;
      m.userData.mergeInto = sharedOf(kind || 'hard');
    }
    return (mats[k] = m);
  };
  const UP = new THREE.Vector3(0, 1, 0);
  const put = (parent, m, x, y, z, rx, ry, rz) => {
    m.position.set(x || 0, y || 0, z || 0); m.rotation.set(rx || 0, ry || 0, rz || 0);
    m.castShadow = false; m.receiveShadow = true; parent.add(m); return m;
  };
  // 같은 좌표의 정점에 같은 오프셋 — 비인덱스 20면체를 정점마다 흔들면 껍질이 깨진 결정 조각이 된다(CLAUDE.md v754)
  const jit = (geo, a) => {
    const p = geo.attributes.position, seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let o = seen.get(k); if (!o) { o = [(rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a, (rr() - 0.5) * 2 * a]; seen.set(k, o); }
      p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
    }
    p.needsUpdate = true; geo.computeVertexNormals(); return geo;
  };
  const K = {
    rr, mat, put, jit, UP,
    box: (parent, w, h, d, m, x, y, z, rx, ry, rz) => put(parent, new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), x, y, z, rx, ry, rz),
    ico: (parent, r, m, x, y, z, sx, sy, sz, det, j) => {
      const g = new THREE.IcosahedronGeometry(r, det === undefined ? 1 : det); if (j) jit(g, j);
      const o = put(parent, new THREE.Mesh(g, m), x, y, z); o.scale.set(sx || 1, sy || sx || 1, sz || sx || 1); return o;
    },
    cyl: (parent, r0, r1, h, m, n, x, y, z, rx, ry, rz) => put(parent, new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, h, n || 6), m), x, y, z, rx, ry, rz),
    cone: (parent, r, h, m, n, x, y, z, rx, ry, rz) => put(parent, new THREE.Mesh(new THREE.ConeGeometry(r, h, n || 4), m), x, y, z, rx, ry, rz),
    // p → q 를 잇는 가늘어지는 기둥(뼈·팔다리·뿔)
    seg: (parent, p, q, r0, r1, m, n) => {
      const d = new THREE.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]), len = d.length();
      const g = new THREE.CylinderGeometry(r1, r0, len, n || 6); g.translate(0, len / 2, 0);
      const o = put(parent, new THREE.Mesh(g, m), p[0], p[1], p[2]);
      o.quaternion.setFromUnitVectors(UP, d.normalize()); return o;
    },
    // 납작한 판(평면 모양 [x,y] 점들 → 두께 d). 귀·칼날·천 조각
    plate: (parent, pts, d, m, x, y, z, rx, ry, rz) => {
      const sh = new THREE.Shape(); sh.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
      const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: false }); g.translate(0, 0, -d / 2);
      return put(parent, new THREE.Mesh(g, m), x, y, z, rx, ry, rz);
    },
    // 원뿔대 고리 띠(손목·발목 감개, 벨트) — 위아래 반지름이 같으면 통
    // 판 모양 좌우 뒤집기 — scale.x = -1 로 뒤집으면 감기가 바뀌어 뒷면이 그려진다(ExtrudeGeometry 가 점 순서는 스스로 맞춘다)
    mir: (pts, sx) => sx < 0 ? pts.map(p => [-p[0], p[1]]) : pts,
    band: (parent, r, h, m, x, y, z, n) => put(parent, new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.04, h, n || 7, 1, true), m), x, y, z),
  };
  return K;
}
// 예전 메시를 걷어 낸다 — 그룹(관절)은 남긴다
function a1Clear(g) { g.children.slice().forEach(c => { if (c.isMesh) g.remove(c); }); }

function a1Monster(type, isBoss, isRanged, grp, bodyGrp, headGrp, limbs) {
  return a1Lcg(type === 'goblin' ? 9011 : type === 'skeleton' ? 9012 : 9013, () => {
    const W = limbs.weapon;
    [grp, bodyGrp, headGrp, limbs.armR, limbs.armL, limbs.legR, limbs.legL, W].forEach(a1Clear);
    const K = a1Kit(type === 'goblin' ? 0x51 : type === 'skeleton' ? 0x52 : 0x53);
    const P = { K, grp, bodyGrp, headGrp, limbs, W, isBoss, isRanged };
    if (type === 'goblin') a1Goblin(P);
    else if (type === 'skeleton') a1Skeleton(P);
    else a1Orc(P);
    // 관절 그룹마다 따로 합친다 — 무기는 팔과 따로(스켈레톤 보스가 던질 때 숨긴다)
    c3MergeStatic(bodyGrp); c3MergeStatic(headGrp);
    c3MergeStatic(limbs.armR, [W]); c3MergeStatic(limbs.armL); c3MergeStatic(limbs.legR); c3MergeStatic(limbs.legL);
    c3MergeStatic(W);
  });
}

// ---------- 고블린 ----------
function a1Goblin(P) {
  const { K, bodyGrp, headGrp, limbs, W, isBoss, isRanged } = P;
  const SKIN = K.mat(0x4a6222, 'skin'), SKIN_D = K.mat(0x34481a, 'skin'), SKIN_L = K.mat(0x5a7228, 'skin');
  const EAR_IN = K.mat(0x6a3a26, 'skin');
  const LEA = K.mat(0x3e2414), LEA_D = K.mat(0x2a180e), ROPE = K.mat(0x7a6a46), WRAP = K.mat(0x4a2c18);
  const CLAW = K.mat(0xb8a882), TOOTH = K.mat(0xd8cca8);
  const IRON = K.mat(0x5a5650, 'metal'), IRON_D = K.mat(0x34322e, 'metal'), RUST = K.mat(0x5a3220, 'metal'), GRIP = K.mat(0x2e1c10);
  const EYE = K.mat(0xffc830, 'glow'); EYE.emissiveIntensity = 1.2;
  const ROBE = K.mat(0x142a52, 'cloth'), ROBE_D = K.mat(0x0e1e3e, 'cloth');

  // 몸통 — 앞으로 굽은 가슴, 볼록한 배
  bodyGrp.position.set(0, 0.46, 0.02);
  K.ico(bodyGrp, 0.22, SKIN, 0, 0.26, 0.0, 1.3, 1.0, 0.95, 1, 0.012).rotation.x = 0.3;
  K.ico(bodyGrp, 0.17, SKIN_L, 0, 0.12, -0.05, 1.05, 0.95, 1.0, 1, 0.01);
  K.ico(bodyGrp, 0.15, SKIN_D, 0, 0.36, 0.1, 1.3, 0.8, 0.9, 0);   // 굽은 등
  // 가죽 조끼 — 몸통을 감싼 앞이 트인 통(양면) + 해진 아랫단 술
  const vg = new THREE.Group(); vg.position.set(0, 0.26, 0.0); vg.rotation.x = 0.3; bodyGrp.add(vg);
  const vest = K.put(vg, new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.235, 0.34, 10, 1, true, Math.PI + 0.62, Math.PI * 2 - 1.24), K.mat(0x3e2414, 'cloth')), 0, 0, 0);
  vest.scale.set(1.32, 1, 1.0);
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + 0.75 + i * ((Math.PI * 2 - 1.5) / 8);
    K.cone(vg, 0.035, 0.08 + (i % 3) * 0.03, LEA, 3, Math.sin(a) * 0.27, -0.2 - (i % 3) * 0.015, Math.cos(a) * 0.23, Math.PI, 0, 0);
  }
  // 밧줄 허리띠 + 매듭
  K.band(bodyGrp, 0.2, 0.05, ROPE, 0, 0.02, 0.0, 8);
  K.ico(bodyGrp, 0.035, ROPE, -0.08, 0.0, -0.2, 1, 1, 1, 0);
  K.seg(bodyGrp, [-0.08, -0.01, -0.2], [-0.1, -0.14, -0.21], 0.016, 0.012, ROPE, 4);
  // 해진 허리 천(앞·뒤)
  K.plate(bodyGrp, [[-0.13, 0], [0.13, 0], [0.12, -0.2], [0.07, -0.27], [0.02, -0.21], [-0.04, -0.29], [-0.1, -0.22], [-0.14, -0.18]], 0.025, LEA, 0, 0.0, -0.19, 0.12, 0, 0);
  K.plate(bodyGrp, [[-0.12, 0], [0.12, 0], [0.11, -0.15], [0.05, -0.2], [0.0, -0.16], [-0.06, -0.2], [-0.11, -0.15]], 0.025, LEA_D, 0, 0.0, 0.16, -0.15, 0, 0);
  // 이빨 목걸이
  for (let i = 0; i < 5; i++) {
    const a = (i - 2) * 0.32;
    K.cone(bodyGrp, 0.018, 0.07, TOOTH, 4, Math.sin(a) * 0.15, 0.4 - Math.abs(i - 2) * 0.015, -0.17 - Math.cos(a) * 0.03, Math.PI, 0, 0);
  }

  // 머리 — 몸통보다 앞·아래(굽은 목). 큰 대머리 · 무거운 눈썹 · 갈고리 코 · 넓은 입 · 큰 귀
  headGrp.position.set(0, 0.86, -0.1);
  const skull = K.ico(headGrp, 0.27, SKIN, 0, 0.04, 0.03, 1.05, 0.98, 1.0, 1, 0.012);
  K.ico(headGrp, 0.2, SKIN_D, 0, -0.1, -0.07, 1.15, 0.6, 0.95, 1);              // 턱·뺨
  // 눈썹뼈(안쪽이 내려온 화난 눈) · 눈
  [-1, 1].forEach(sx => {
    K.box(headGrp, 0.15, 0.06, 0.09, SKIN_L, sx * 0.1, 0.06, -0.22, 0.3, 0, sx * 0.32);
    K.box(headGrp, 0.095, 0.05, 0.03, EYE, sx * 0.1, 0.0, -0.245, 0, sx * 0.2, sx * 0.2);
  });
  // 갈고리 코 — 콧등에서 아래로 휘어 내려온다
  K.seg(headGrp, [0, 0.01, -0.24], [0, -0.06, -0.37], 0.05, 0.035, SKIN_L, 5);
  K.seg(headGrp, [0, -0.06, -0.37], [0, -0.14, -0.36], 0.035, 0.012, SKIN_L, 5);
  // 입 — 어두운 틈 + 작은 이빨
  K.box(headGrp, 0.2, 0.035, 0.03, K.mat(0x1a0c08), 0, -0.13, -0.245, 0, 0, 0);
  for (let i = 0; i < 6; i++) K.cone(headGrp, 0.012, 0.035, TOOTH, 3, -0.08 + i * 0.032, -0.118, -0.255, Math.PI, 0, 0);
  // 귀 — 옆으로 크게 뻗어 끝이 살짝 처진다(바깥 피부 + 안쪽 붉은 갈색)
  const earPts = [[0, -0.09], [0.22, -0.1], [0.42, -0.06], [0.56, -0.02], [0.42, 0.05], [0.2, 0.08], [0, 0.1]];
  const earIn = [[0.03, -0.06], [0.2, -0.065], [0.38, -0.035], [0.2, 0.05], [0.03, 0.065]];
  [-1, 1].forEach(sx => {
    const eg = new THREE.Group(); eg.position.set(sx * 0.24, 0.05, 0.02); eg.rotation.set(0.05, sx * -0.35, sx * -0.12); headGrp.add(eg);

  if (isBoss) {
    // 뿔 달린 찌그러진 쇠 투구 · 정수리 띠 리벳
    K.ico(headGrp, 0.29, IRON_D, 0, 0.1, 0.03, 1.07, 0.78, 1.04, 1, 0.01);
    K.box(headGrp, 0.06, 0.05, 0.6, RUST, 0, 0.3, 0.03, 0, 0, 0);
    K.band(headGrp, 0.3, 0.06, RUST, 0, -0.02, 0.03, 9);
    [-1, 1].forEach(sx => {
      K.seg(headGrp, [sx * 0.24, 0.14, 0.03], [sx * 0.4, 0.3, 0.02], 0.06, 0.045, CLAW, 5);
      K.seg(headGrp, [sx * 0.4, 0.3, 0.02], [sx * 0.42, 0.5, 0.06], 0.045, 0.008, CLAW, 5);
    });
  } else if (isRanged) {
    // 주술사 두건(귀는 옆으로 빠져나온다)
    K.ico(headGrp, 0.31, ROBE, 0, 0.08, 0.06, 0.95, 0.95, 1.05, 1, 0.01);
    K.cone(headGrp, 0.17, 0.3, ROBE_D, 5, 0, 0.3, 0.2, -0.9, 0, 0);
  }

  // 팔 — 가는 위팔 · 감개 감은 팔뚝 · 큰 손과 발톱
  const arm = (L, sx) => {
    L.position.set(sx * 0.33, 0.72, 0.02);
    K.ico(L, 0.075, SKIN_D, 0, -0.02, 0, 1, 1, 1, 0);   // 어깨
    K.seg(L, [0, -0.02, 0], [0, -0.2, 0.0], 0.055, 0.045, SKIN, 6);
    K.seg(L, [0, -0.2, 0.0], [0, -0.36, -0.01], 0.048, 0.055, SKIN, 6);
    K.band(L, 0.06, 0.1, WRAP, 0, -0.3, -0.005, 6);
    K.ico(L, 0.07, SKIN_L, 0, -0.42, -0.01, 1.0, 0.9, 1.05, 0);   // 손
    for (let i = 0; i < 3; i++) K.cone(L, 0.012, 0.05, CLAW, 3, (i - 1) * 0.035, -0.48, -0.04, -0.5, 0, 0);
  };
  arm(limbs.armR, 1); arm(limbs.armL, -1);
  // 다리 — 짧은 허벅지 · 정강이 감개 · 넓은 발과 발톱
  const leg = (L, sx) => {
    L.position.set(sx * 0.12, 0.4, 0.04);
    K.seg(L, [0, 0, 0], [0, -0.18, -0.02], 0.075, 0.06, SKIN, 6);
    K.band(L, 0.065, 0.13, WRAP, 0, -0.26, -0.02, 6);
    K.seg(L, [0, -0.18, -0.02], [0, -0.36, 0.0], 0.058, 0.05, SKIN_D, 6);
    K.ico(L, 0.08, SKIN, 0, -0.37, -0.06, 1.0, 0.42, 1.5, 0);   // 발
    for (let i = 0; i < 3; i++) K.cone(L, 0.013, 0.045, CLAW, 3, (i - 1) * 0.04, -0.39, -0.18, -Math.PI / 2, 0, 0);
  };
  leg(limbs.legR, 1); leg(limbs.legL, -1);

  // 무기 — 손에 쥔 자리(-0.42)에서 앞(+y = 앞)으로. 이 빠진 녹슨 칼(끝이 넓은 식칼 꼴)
  W.position.set(0, -0.42, -0.01);
  if (isRanged) {
    K.seg(W, [0, -0.35, 0], [0, 0.75, 0], 0.025, 0.03, GRIP, 5);
    K.ico(W, 0.07, TOOTH, 0, 0.8, 0, 1, 1.1, 1, 0);                 // 지팡이 끝 해골
    const ORB = K.mat(0x66ccff, 'glow'); ORB.emissiveIntensity = 0.9;
    K.ico(W, 0.06, ORB, 0, 0.92, 0, 1, 1, 1, 0);
    for (let i = 0; i < 3; i++) K.seg(W, [0, 0.72, 0], [Math.cos(i * 2.1) * 0.07, 0.95, Math.sin(i * 2.1) * 0.07], 0.012, 0.006, GRIP, 3);
  } else {
    K.seg(W, [0, -0.06, 0], [0, 0.12, 0], 0.025, 0.025, GRIP, 5);
    K.box(W, 0.12, 0.03, 0.05, IRON, 0, 0.13, 0, 0, 0, 0);
    const bl = isBoss
      ? [[-0.04, 0.14], [0.05, 0.14], [0.11, 0.42], [0.15, 0.7], [0.08, 0.66], [0.1, 0.74], [0.02, 0.78], [-0.05, 0.72], [-0.07, 0.5], [-0.05, 0.3]]
      : [[-0.035, 0.14], [0.04, 0.14], [0.08, 0.36], [0.1, 0.56], [0.06, 0.53], [0.05, 0.6], [-0.02, 0.62], [-0.05, 0.5], [-0.045, 0.3]];
    K.plate(W, bl, 0.025, IRON, 0, 0, 0);

  if (isBoss) {

      const x = Math.sin(a) * r, z = Math.cos(a) * r * 0.85 + 0.05;
      const out = [Math.sin(a), 0, Math.cos(a)];
      K.seg(bodyGrp, [x * 0.8, 0.44, z * 0.8], [x + out[0] * 0.14, 0.36 + (i % 2) * 0.06, z + out[2] * 0.14], 0.07, 0.01, i % 2 ? FUR : FUR_D, 4);
    }
    K.ico(bodyGrp, 0.05, TOOTH, 0, 0.3, -0.23, 1, 1.1, 0.8, 0);
    K.band(bodyGrp, 0.215, 0.09, LEA_D, 0, 0.02, 0, 9);
    K.cyl(bodyGrp, 0.06, 0.06, 0.02, IRON, 8, 0, 0.02, -0.21, Math.PI / 2, 0, 0);
    for (let i = 0; i < 6; i++) { const a = -1.2 + i * 0.48; K.ico(bodyGrp, 0.014, IRON, Math.sin(a) * 0.22, 0.02, -Math.cos(a) * 0.2, 1, 1, 1, 0); }
  } else if (isRanged) {
    // 주술사 — 해진 어깨 망토
    K.plate(bodyGrp, [[-0.26, 0], [0.26, 0], [0.28, -0.35], [0.15, -0.42], [0.04, -0.36], [-0.08, -0.44], [-0.2, -0.36], [-0.28, -0.3]], 0.03, ROBE, 0, 0.47, 0.17, -0.25, 0, 0);
    [-1, 1].forEach(sx => K.ico(bodyGrp, 0.11, ROBE_D, sx * 0.2, 0.42, 0.04, 1.1, 0.6, 1.1, 0));
  }
}

// ---------- 스켈레톤 ----------
function a1Skeleton(P) {
  const { K, bodyGrp, headGrp, limbs, W, isBoss, isRanged } = P;
  const BONE = K.mat(0x8c7c58, 'skin'), BONE_D = K.mat(0x6a5c40, 'skin'), BONE_L = K.mat(0x9c8c64, 'skin');
  const HOLE = K.mat(0x0c0806);
  const IRON = K.mat(0x4a4844, 'metal'), IRON_D = K.mat(0x34322e, 'metal'), RUST = K.mat(0x4e2e1e, 'metal');
  const MAIL = K.mat(0x3a3a38, 'cloth'), RED = K.mat(0x5a1414, 'cloth'), LEA = K.mat(0x3a2414), GRIP = K.mat(0x2a1a10);
  const GOLD = K.mat(0x8a6a1e, 'metal');
  const EYE = K.mat(0xff2a1a, 'glow'); EYE.emissiveIntensity = 1.4;
  const ROBE = K.mat(0x142a52, 'cloth'), ROBE_D = K.mat(0x0e1e3e, 'cloth');

  // 골반 · 등뼈 · 갈비뼈(앞이 트인 활 넷) · 복장뼈
  bodyGrp.position.set(0, 0.5, 0.02);
  K.ico(bodyGrp, 0.12, BONE, 0, -0.02, 0, 1.45, 0.7, 0.9, 1);
  for (let i = 0; i < 4; i++) K.cyl(bodyGrp, 0.04, 0.04, 0.05, BONE_D, 6, 0, 0.05 + i * 0.055, 0.05);
  const rg = new THREE.Group(); rg.position.set(0, 0.3, 0.0); rg.rotation.x = 0.12; bodyGrp.add(rg);
  for (let i = 0; i < 4; i++) {
    const r = 0.19 - Math.abs(i - 1.2) * 0.025;
    const t = K.put(rg, new THREE.Mesh(new THREE.TorusGeometry(r, 0.022, 4, 10, Math.PI * 1.55), i % 2 ? BONE : BONE_L), 0, 0.1 - i * 0.075, 0, Math.PI / 2, 0, Math.PI * 0.725 - Math.PI / 2);
    t.scale.set(1.15, 0.9, 1);
  }
  K.box(rg, 0.05, 0.24, 0.04, BONE_L, 0, -0.02, -0.17, -0.12, 0, 0);
  // 해진 사슬 갑옷 — 등·옆구리(앞은 갈비뼈가 드러난다) + 술
  const mg = new THREE.Group(); mg.position.set(0, 0.32, 0.01); bodyGrp.add(mg);
  K.put(mg, new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.3, 10, 1, true, Math.PI + 0.85, Math.PI * 2 - 1.7), MAIL), 0, 0, 0).scale.set(1.2, 1, 1);
  for (let i = 0; i < 8; i++) { const a = Math.PI + 1.0 + i * ((Math.PI * 2 - 2.0) / 7); K.cone(mg, 0.035, 0.07 + (i % 3) * 0.035, MAIL, 3, Math.sin(a) * 0.27, -0.18 - (i % 2) * 0.02, Math.cos(a) * 0.24, Math.PI, 0, 0); }
  // 허리 — 가죽 띠 + 앞에 늘어진 바랜 붉은 천
  K.band(bodyGrp, 0.17, 0.05, LEA, 0, 0.04, 0, 8);
  K.cyl(bodyGrp, 0.035, 0.035, 0.02, RUST, 6, -0.1, 0.04, -0.16, Math.PI / 2, 0, 0);
  K.plate(bodyGrp, [[-0.1, 0], [0.1, 0], [0.11, -0.2], [0.05, -0.27], [0.01, -0.21], [-0.05, -0.3], [-0.1, -0.22]], 0.02, RED, 0.02, 0.02, -0.16, 0.08, 0, 0);
  K.plate(bodyGrp, [[-0.12, 0], [0.12, 0], [0.1, -0.16], [0.03, -0.22], [-0.04, -0.16], [-0.11, -0.2]], 0.02, RED, 0, 0.02, 0.14, -0.1, 0, 0);

  // 머리 — 해골 · 검은 눈구멍 속 붉은 눈동자 · 벌린 턱 · 녹슨 반투구
  headGrp.position.set(0, 0.92, -0.04);
  K.ico(headGrp, 0.22, BONE_L, 0, 0.03, 0.02, 1.0, 1.0, 1.05, 1, 0.008);
  K.box(headGrp, 0.2, 0.1, 0.16, BONE, 0, -0.1, -0.06, 0, 0, 0);          // 광대·윗니 자리
  const jaw = K.box(headGrp, 0.18, 0.05, 0.16, BONE_D, 0, -0.2, -0.05, 0.25, 0, 0);
  [-1, 1].forEach(sx => {
    K.box(headGrp, 0.085, 0.075, 0.03, HOLE, sx * 0.075, -0.0, -0.195, 0, 0, sx * -0.15);
    K.box(headGrp, 0.03, 0.03, 0.02, EYE, sx * 0.075, -0.005, -0.205, 0, 0, 0);
  });
  K.cone(headGrp, 0.025, 0.05, HOLE, 3, 0, -0.07, -0.205, 0, 0, Math.PI);
  K.box(headGrp, 0.15, 0.03, 0.02, HOLE, 0, -0.145, -0.14, 0, 0, 0);
  for (let i = 0; i < 5; i++) K.box(headGrp, 0.018, 0.035, 0.015, BONE_L, -0.06 + i * 0.03, -0.13, -0.148, 0, 0, 0);
  if (isBoss) {
    // 금관(뾰족한 봉우리 · 붉은 보석) · 털 깃
    K.band(headGrp, 0.2, 0.08, GOLD, 0, 0.17, 0.02, 10);
    for (let i = 0; i < 5; i++) { const a = -Math.PI * 0.5 + i * (Math.PI * 2 / 5); K.cone(headGrp, 0.04, 0.13, GOLD, 4, Math.sin(a) * 0.19, 0.27, Math.cos(a) * 0.19 + 0.02, 0, 0, 0); }
    K.box(headGrp, 0.04, 0.04, 0.02, K.mat(0xc01818, 'glow'), 0, 0.17, -0.18, 0, 0, Math.PI / 4);
  } else if (isRanged) {
    K.ico(headGrp, 0.27, ROBE, 0, 0.06, 0.05, 0.98, 0.98, 1.06, 1, 0.01);
    K.cone(headGrp, 0.15, 0.26, ROBE_D, 5, 0, 0.26, 0.2, -0.9, 0, 0);
  } else {
    // 녹슨 반투구 + 챙
    K.put(headGrp, new THREE.Mesh(new THREE.SphereGeometry(0.245, 9, 4, 0, Math.PI * 2, 0, Math.PI / 2), IRON_D), 0, 0.06, 0.02).scale.set(1, 0.85, 1.05);
    K.cyl(headGrp, 0.28, 0.28, 0.025, RUST, 10, 0, 0.06, 0.02);
  }

  // 팔 — 위팔뼈 · 팔꿈치 마디 · 아래팔 · 손목 쇠고리 · 손가락
  const arm = (L, sx) => {
    L.position.set(sx * 0.3, 0.76, 0.02);
    K.ico(L, 0.06, BONE_L, 0, 0, 0, 1, 1, 1, 0);
    K.seg(L, [0, 0, 0], [0, -0.2, 0.01], 0.028, 0.024, BONE, 5);
    K.ico(L, 0.04, BONE_L, 0, -0.21, 0.01, 1, 1, 1, 0);
    K.seg(L, [0, -0.21, 0.01], [0, -0.38, -0.01], 0.024, 0.03, BONE, 5);
    K.band(L, 0.04, 0.05, RUST, 0, -0.33, -0.005, 6);
    K.ico(L, 0.045, BONE_L, 0, -0.41, -0.01, 1, 0.8, 1.1, 0);
    for (let i = 0; i < 3; i++) K.seg(L, [(i - 1) * 0.022, -0.43, -0.03], [(i - 1) * 0.025, -0.48, -0.05], 0.009, 0.007, BONE, 3);
  };
  arm(limbs.armR, 1); arm(limbs.armL, -1);
  // 어깨 갑옷 — 오른쪽(무기 쪽) 하나
  K.ico(limbs.armR, 0.11, IRON, 0.01, 0.02, 0, 1.1, 0.75, 1.15, 1);
  K.band(limbs.armR, 0.1, 0.03, RUST, 0.01, -0.03, 0, 8);
  // 다리 — 넙다리뼈 · 무릎 · 정강이 · 발목 쇠고리 · 납작한 발
  const leg = (L, sx) => {
    L.position.set(sx * 0.12, 0.44, 0.03);
    K.ico(L, 0.05, BONE_L, 0, 0, 0, 1, 1, 1, 0);
    K.seg(L, [0, 0, 0], [0, -0.2, -0.01], 0.034, 0.028, BONE, 5);
    K.ico(L, 0.048, BONE_L, 0, -0.21, -0.015, 1, 1, 1, 0);
    K.seg(L, [0, -0.21, -0.01], [0, -0.4, 0.0], 0.028, 0.024, BONE, 5);
    K.band(L, 0.04, 0.05, RUST, 0, -0.36, 0, 6);
    K.box(L, 0.08, 0.04, 0.17, BONE_D, 0, -0.42, -0.05, 0, 0, 0);
    for (let i = 0; i < 3; i++) K.box(L, 0.02, 0.025, 0.05, BONE_L, (i - 1) * 0.027, -0.425, -0.15, 0, 0, 0);
  };
  leg(limbs.legR, 1); leg(limbs.legL, -1);

  // 무기
  W.position.set(0, -0.41, -0.01);
  if (isRanged) {
    K.seg(W, [0, -0.35, 0], [0, 0.8, 0], 0.022, 0.026, GRIP, 5);
    K.ico(W, 0.06, BONE_L, 0, 0.83, 0, 1, 1.1, 1, 0);
    const ORB = K.mat(0x66ccff, 'glow'); ORB.emissiveIntensity = 0.9;
    K.ico(W, 0.055, ORB, 0, 0.94, 0, 1, 1, 1, 0);
  } else if (isBoss) {
    // 거대한 넙다리뼈 곤봉 — 끝 두 마디에 가시
    K.seg(W, [0, -0.05, 0], [0, 0.85, 0], 0.07, 0.09, BONE, 6);
    [-1, 1].forEach(sx => K.ico(W, 0.13, BONE_L, sx * 0.08, 0.92, 0, 1, 0.9, 0.95, 1, 0.01));
    K.ico(W, 0.1, BONE, 0, -0.08, 0, 1.1, 0.8, 1, 0);
    for (let i = 0; i < 6; i++) { const a = i * 1.05; K.cone(W, 0.025, 0.1, BONE_L, 4, Math.cos(a) * 0.15, 0.82 + (i % 2) * 0.1, Math.sin(a) * 0.12, Math.sin(a) * 1.4, 0, -Math.cos(a) * 1.4); }
  } else {
    // 이 빠진 녹슨 곧은 검
    K.seg(W, [0, -0.07, 0], [0, 0.11, 0], 0.022, 0.022, GRIP, 5);
    K.ico(W, 0.03, IRON_D, 0, -0.08, 0, 1, 1, 1, 0);
    K.box(W, 0.17, 0.03, 0.045, IRON_D, 0, 0.12, 0, 0, 0, 0);
    K.plate(W, [[-0.04, 0.13], [0.04, 0.13], [0.04, 0.62], [0.025, 0.66], [0.035, 0.7], [0.0, 0.8], [-0.04, 0.7], [-0.04, 0.45], [-0.028, 0.42], [-0.04, 0.38]], 0.02, IRON, 0, 0, 0);
    K.plate(W, [[-0.012, 0.15], [0.012, 0.15], [0.006, 0.66], [-0.006, 0.66]], 0.024, RUST, 0, 0, 0.002);
  }

  if (isBoss) {
    // 털 깃 · 흉갑 · 붉은 망토 · 금 띠 버클
    const FUR = K.mat(0x7a7268), FUR_D = K.mat(0x55504a);
    for (let i = 0; i < 13; i++) {
      const a = -Math.PI * 0.6 + i * (Math.PI * 1.2 / 12), r = 0.23;
      const x = Math.sin(a) * r, z = Math.cos(a) * r * 0.85 + 0.05;
      K.seg(bodyGrp, [x * 0.8, 0.46, z * 0.8], [x + Math.sin(a) * 0.12, 0.4 + (i % 2) * 0.07, z + Math.cos(a) * 0.12], 0.07, 0.012, i % 2 ? FUR : FUR_D, 4);
    }
    K.ico(rg, 0.21, IRON, 0, 0.02, -0.05, 1.25, 1.0, 0.7, 1);
    [limbs.armR, limbs.armL].forEach(L => { K.ico(L, 0.13, IRON_D, 0, 0.02, 0, 1.15, 0.75, 1.15, 1); K.band(L, 0.12, 0.035, GOLD, 0, -0.04, 0, 8); });
    K.box(rg, 0.06, 0.16, 0.02, GOLD, 0, 0.02, -0.17, 0, 0, Math.PI / 4);
    K.plate(bodyGrp, [[-0.26, 0], [0.26, 0], [0.3, -0.45], [0.18, -0.52], [0.06, -0.46], [-0.06, -0.55], [-0.18, -0.48], [-0.3, -0.44]], 0.02, K.mat(0x4a0e14, 'cloth'), 0, 0.46, 0.2, -0.12, 0, 0);
    K.cyl(bodyGrp, 0.05, 0.05, 0.02, GOLD, 8, 0, 0.04, -0.17, Math.PI / 2, 0, 0);
  } else if (isRanged) {
    K.put(bodyGrp, new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.55, 9, 1, true), ROBE), 0, 0.1, 0.02).scale.set(1.1, 1, 1);
    for (let i = 0; i < 8; i++) { const a = i * 0.785; K.cone(bodyGrp, 0.04, 0.08, ROBE_D, 3, Math.sin(a) * 0.32, -0.2, Math.cos(a) * 0.3, Math.PI, 0, 0); }
  }
}

// ---------- 오크 ----------
function a1Orc(P) {
  const { K, bodyGrp, headGrp, limbs, W, isBoss, isRanged } = P;
  const SKIN = K.mat(0x34521e, 'skin'), SKIN_D = K.mat(0x243a16, 'skin'), SKIN_L = K.mat(0x40602a, 'skin');
  const PAINT = K.mat(0x6a1a12, 'skin'), TUSK = K.mat(0x9c8c66, 'skin'), HAIR = K.mat(0x14100c);
  const LEA = K.mat(0x3a2414), LEA_D = K.mat(0x26170c), KILT = K.mat(0x4e3018, 'cloth');
  const IRON = K.mat(0x4a4844, 'metal'), IRON_D = K.mat(0x302e2a, 'metal'), STEEL = K.mat(0x6a6862, 'metal'), RUST = K.mat(0x4e2e1e, 'metal');
  const WOOD = K.mat(0x3a2414), RED = K.mat(0x5a1410, 'cloth'), BONE = K.mat(0x9c8c66);
  const EYE = K.mat(0xff3a1a, 'glow'); EYE.emissiveIntensity = 1.3;
  const ROBE = K.mat(0x142a52, 'cloth'), ROBE_D = K.mat(0x0e1e3e, 'cloth');

  // 몸통 — 떡 벌어진 가슴 · 승모근 · 배
  bodyGrp.position.set(0, 0.6, 0.02);
  K.ico(bodyGrp, 0.3, SKIN, 0, 0.32, 0.02, 1.45, 1.0, 0.95, 1, 0.012).rotation.x = 0.15;
  [-1, 1].forEach(sx => K.ico(bodyGrp, 0.16, SKIN_L, sx * 0.14, 0.36, -0.17, 1.1, 0.8, 0.6, 1));   // 가슴 근육
  K.ico(bodyGrp, 0.22, SKIN_D, 0, 0.08, -0.02, 1.25, 0.9, 0.95, 1);
  K.ico(bodyGrp, 0.2, SKIN_D, 0, 0.56, 0.08, 1.7, 0.55, 0.9, 1);                                  // 승모근
  // 전투 칠 — 가슴·배의 붉은 줄
  [[-0.2, 0.42, -0.24, 0.5], [-0.12, 0.2, -0.26, 0.4], [0.24, 0.15, -0.2, -0.4]].forEach(([x, y, z, r]) => K.box(bodyGrp, 0.14, 0.025, 0.02, PAINT, x, y, z, 0.2, 0, r));
  // 비스듬한 가죽 멜빵 + 쇠고리
  K.box(bodyGrp, 0.08, 0.66, 0.04, LEA, 0.02, 0.3, -0.27, 0.12, 0, -0.75);
  K.box(bodyGrp, 0.08, 0.6, 0.04, LEA_D, 0.02, 0.3, 0.29, -0.1, 0, 0.75);
  K.put(bodyGrp, new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.015, 4, 8), IRON), -0.14, 0.46, -0.28, 0.1, 0, 0);
  // 넓은 허리띠 + 쇠 버클 · 해진 가죽 치마
  K.band(bodyGrp, 0.3, 0.1, LEA_D, 0, -0.04, 0, 10).scale.set(1.15, 1, 1);
  K.box(bodyGrp, 0.12, 0.09, 0.03, IRON, 0, -0.04, -0.32, 0, 0, 0);
  K.box(bodyGrp, 0.06, 0.05, 0.035, IRON_D, 0, -0.04, -0.325, 0, 0, 0);
  K.plate(bodyGrp, [[-0.17, 0], [0.17, 0], [0.18, -0.24], [0.1, -0.32], [0.03, -0.25], [-0.05, -0.33], [-0.13, -0.26], [-0.18, -0.22]], 0.025, KILT, 0, -0.08, -0.3, 0.1, 0, 0);
  K.plate(bodyGrp, [[-0.25, 0], [0.25, 0], [0.26, -0.22], [0.12, -0.3], [0.0, -0.23], [-0.13, -0.3], [-0.26, -0.22]], 0.025, KILT, 0, -0.08, 0.26, -0.12, 0, 0);
  [-1, 1].forEach(sx => K.plate(bodyGrp, [[-0.12, 0], [0.12, 0], [0.11, -0.2], [0.02, -0.26], [-0.08, -0.2]], 0.025, LEA, sx * 0.32, -0.08, 0, 0, sx * Math.PI / 2, sx * 0.12));

  // 머리 — 굵은 눈썹 · 내민 아래턱과 엄니 · 붉은 눈 · 뾰족한 귀 · 상투
  headGrp.position.set(0, 1.18, -0.12);
  K.ico(headGrp, 0.22, SKIN, 0, 0.03, 0.02, 1.08, 1.0, 1.0, 1, 0.01);
  K.box(headGrp, 0.3, 0.07, 0.1, SKIN_D, 0, 0.06, -0.17, 0.25, 0, 0);                           // 눈썹뼈
  K.box(headGrp, 0.3, 0.14, 0.2, SKIN_L, 0, -0.12, -0.1, -0.1, 0, 0);                            // 아래턱
  K.ico(headGrp, 0.06, SKIN_L, 0, -0.02, -0.21, 1.2, 0.8, 0.9, 0);                               // 코
  [-1, 1].forEach(sx => {
    K.box(headGrp, 0.06, 0.035, 0.02, EYE, sx * 0.08, 0.0, -0.205, 0, 0, sx * 0.25);
    K.cone(headGrp, 0.035, 0.13, TUSK, 4, sx * 0.1, -0.03, -0.21, -0.25, 0, sx * -0.15);         // 엄니(아래턱에서 위로)
    K.cone(headGrp, 0.045, 0.16, SKIN, 3, sx * 0.24, 0.04, 0.03, 0, 0, sx * -1.3);                // 귀
    K.box(headGrp, 0.03, 0.12, 0.02, PAINT, sx * 0.13, -0.06, -0.2, 0, 0, sx * 0.2);
  });
  K.box(headGrp, 0.14, 0.025, 0.02, K.mat(0x140806), 0, -0.1, -0.205, 0, 0, 0);
  if (isBoss) {
    // 뿔 달린 검은 쇠 투구 · 얼굴 가리개
    K.ico(headGrp, 0.25, IRON_D, 0, 0.08, 0.02, 1.08, 0.85, 1.05, 1);
    K.box(headGrp, 0.05, 0.16, 0.05, IRON, 0, 0.02, -0.22, 0, 0, 0);
    [-1, 1].forEach(sx => {
      K.seg(headGrp, [sx * 0.2, 0.14, 0.02], [sx * 0.36, 0.26, 0.0], 0.06, 0.045, BONE, 5);
      K.seg(headGrp, [sx * 0.36, 0.26, 0.0], [sx * 0.38, 0.46, -0.04], 0.045, 0.008, BONE, 5);
    });
  } else if (isRanged) {
    K.ico(headGrp, 0.27, ROBE, 0, 0.08, 0.05, 1.05, 0.98, 1.08, 1, 0.01);
    K.cone(headGrp, 0.15, 0.26, ROBE_D, 5, 0, 0.28, 0.2, -0.9, 0, 0);
  } else {
    K.ico(headGrp, 0.08, HAIR, 0, 0.22, 0.06, 1.0, 1.3, 1.0, 0);
    K.band(headGrp, 0.045, 0.04, RED, 0, 0.3, 0.07, 6);
    K.seg(headGrp, [0, 0.31, 0.07], [0.02, 0.36, 0.2], 0.04, 0.02, HAIR, 5);
    K.seg(headGrp, [0.02, 0.36, 0.2], [0.0, 0.22, 0.3], 0.02, 0.01, HAIR, 4);
  }

  // 팔 — 굵은 어깨 · 위팔 · 팔뚝 · 쇠·가죽 팔목 보호대 · 큰 주먹
  const arm = (L, sx) => {
    L.position.set(sx * 0.46, 0.92, 0.04);
    K.ico(L, 0.15, SKIN, 0, -0.02, 0, 1.0, 1.0, 1.0, 1);
    K.seg(L, [0, -0.04, 0], [0, -0.28, 0.0], 0.11, 0.1, SKIN, 7);
    K.seg(L, [0, -0.28, 0.0], [0, -0.5, -0.02], 0.1, 0.11, SKIN_L, 7);
    K.band(L, 0.115, 0.14, LEA, 0, -0.43, -0.015, 8);
    K.band(L, 0.12, 0.05, IRON, 0, -0.43, -0.015, 8);
    K.ico(L, 0.11, SKIN_D, 0, -0.58, -0.03, 1.0, 0.9, 1.05, 1);
  };
  arm(limbs.armR, 1); arm(limbs.armL, -1);
  // 왼어깨 가시 견갑(보스는 양쪽)
  const pauld = (L, sx) => {
    K.ico(L, 0.2, IRON_D, 0, 0.04, 0, 1.15, 0.7, 1.15, 1);
    K.band(L, 0.21, 0.04, RUST, 0, -0.02, 0, 9);
