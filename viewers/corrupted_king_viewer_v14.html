<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>부패한 왕 뷰어 v14</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 페이지가 스크롤될 여지를 아예 없앤다.
     예전에는 body가 100dvh인데 캔버스가 100vh였다. 모바일에서 100vh는 '주소창이 숨은 상태'의
     큰 높이라 캔버스가 body보다 커지고, 그 상태에서 버튼에 포커스가 가면 브라우저가 그 버튼을
     보이게 하려고 문서를 스크롤한다(overflow:hidden도 이 스크롤은 못 막는다).
     그러면 캔버스가 위로 밀려 캐릭터 윗부분만 보인다 — 아랫줄 버튼에서만 나던 증상의 정체다. */
  html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#070a06; font-family: sans-serif; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  /* touch-action:manipulation — 버튼을 연달아 누를 때 더블탭 확대로 잡히는 것을 막는다.
     확대되면 화면이 탭한 지점(=아래쪽) 기준으로 잘려 역시 캐릭터 위쪽만 보인다. */
  .btn { pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
         background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#e0c070; color:#f5e6c0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; text-align:right; line-height:1.5; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:34px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="roarBtn">포효</button>
  <button class="btn" id="slashBtn">베기</button>
  <button class="btn" id="guardBtn">방패 방어</button>
  <button class="btn" id="actBtn">스튜디오</button>
  <button class="btn" id="shadowBtn">그림자: 켬</button>
  <button class="btn" id="gridBtn">그리드</button>
  <button class="btn" id="resetBtn">게임 시점</button>
</div>
<div id="ver"></div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
// ============================================================
//  부패한 왕 — 90층 보스(3막).
//  렌더 환경 — 게임 index.html에서 그대로 옮겨온 것. 구울 뷰어와 같은 파일을 복사한 것이다.
//  값 하나라도 바꾸면 뷰어에서 본 것과 게임에 넣은 결과가 달라진다.
//  옮겨온 것: 저해상도 버퍼 크기 · 톤매핑 · 조명 셰이더 청크(?dspec/?dlight/?drough/?spec) ·
//            노멀 패스(피부 표식 포함) · 블룸 · 포스트 셰이더 전문 · 픽셀 스냅 · 막별 환경 · 조명 리그
// ============================================================
const canvas = document.getElementById('app');

// 실제로 보이는 영역 크기. 모바일 인앱 뷰어·주소창 때문에 window.innerHeight 가 눈에 보이는
// 높이보다 클 수 있는데, 그대로 쓰면 캔버스 아래쪽이 화면 밖으로 나가고 화면 한가운데 맞춰 둔
// 캐릭터가 위로 치우쳐 보인다. visualViewport 가 있으면 그쪽이 진짜 보이는 크기다.
function viewW() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.width : window.innerWidth)); }
function viewH() { const v = window.visualViewport; return Math.max(1, Math.round(v ? v.height : window.innerHeight)); }
// 어떤 경로로든 문서가 스크롤되면 즉시 되돌린다(포커스 이동·인앱 뷰어 제스처 등).
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });

// ---------- 플래그 (게임과 같은 이름·같은 기본값). 쓰는 곳보다 위에 둘 것 — TDZ ----------
const PX_MODE = !/[?&]px=0/.test(location.search);   // 픽셀아트 렌더(기본 켜짐)
const BLOB_ON = !/[?&]blob=0/.test(location.search); // 발밑 블롭 그림자
const BLOB_STEPS = (() => { const m = /[?&]blobsteps=([0-9]+)/.exec(location.search); return m ? parseInt(m[1], 10) : 3; })();
const VIEWER_VERSION = 'v14';

// ===== 깊이 기반 조명 조절(?dspec / ?dlight) — 게임과 동일 =====
// 램프 구간(20~33)은 게임의 실측값이다. 게임 카메라가 플레이어에서 25.4 떨어져 있어서
// 화면에 보이는 것이 전부 이 구간에 들어온다 — 그래서 이 뷰어도 카메라 거리를 25.4로 맞춘다.
// 거리를 줄이면 램프 바깥으로 나가 이 효과가 통째로 사라지고, 게임과 다른 밝기가 나온다.
let dSpecStr = 2.0, dLightStr = 0.6, dNear = 20.0, dFar = 33.0;
{
  const num = (re) => { const m = re.exec(location.search); return m ? parseFloat(m[1]) : null; };
  const a = num(/[?&]dspec=([0-9.]+)/);  if (a !== null) dSpecStr = a;
  const b = num(/[?&]dlight=([0-9.]+)/); if (b !== null) dLightStr = b;
  const c = num(/[?&]dnear=([0-9.]+)/);  if (c !== null) dNear = c;
  const d = num(/[?&]dfar=([0-9.]+)/);   if (d !== null) dFar = d;
}
function _depthLitChunk() {
  if (!(dSpecStr > 0.001 || dLightStr > 0.001)) return '';
  const n = dNear.toFixed(1), f = Math.max(dNear + 0.1, dFar).toFixed(1);
  const s = dSpecStr.toFixed(3), l = dLightStr.toFixed(3);
  return '\n' + [
    'float _dz = -vViewPosition.z;',
    'float _dt = smoothstep(' + n + ', ' + f + ', _dz);',
    'float _dks = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.6), _dt);',
    'reflectedLight.directSpecular *= _dks;',
    'reflectedLight.indirectSpecular *= _dks;',
    'float _dkl = mix(1.0 + ' + l + ' * 0.35, max(0.0, 1.0 - ' + l + '), _dt);',
    'reflectedLight.directDiffuse *= _dkl;'
  ].join('\n');
}
// ===== 러프니스 기반 하이라이트 세기(?drough) — 게임과 동일 =====
let dRoughStr = 1.2, dRoughLo = 0.40, dRoughHi = 0.95;
{
  const m = /[?&]drough=([0-9.]+)/.exec(location.search);
  if (m) dRoughStr = parseFloat(m[1]);
  const lo = /[?&]droughlo=([0-9.]+)/.exec(location.search); if (lo) dRoughLo = parseFloat(lo[1]);
  const hi = /[?&]droughhi=([0-9.]+)/.exec(location.search); if (hi) dRoughHi = parseFloat(hi[1]);
}
function _roughSpecChunk() {
  if (!(dRoughStr > 0.001)) return '';
  const s = dRoughStr.toFixed(3);
  const lo = dRoughLo.toFixed(2), hi = Math.max(dRoughLo + 0.01, dRoughHi).toFixed(2);
  return '\n' + [
    '#ifdef STANDARD',
    'float _rg = smoothstep(' + lo + ', ' + hi + ', clamp(roughnessFactor, 0.0, 1.0));',
    'float _kr = mix(1.0 + ' + s + ', max(0.0, 1.0 - ' + s + ' * 0.5), _rg);',
    'reflectedLight.directSpecular *= _kr;',
    'reflectedLight.indirectSpecular *= _kr;',
    '#endif'
  ].join('\n');
}
// ===== 하이라이트 전체 밝기(?spec) — 게임과 동일 =====
let dSpecGain = 0.85;
{ const m = /[?&]spec=([0-9.]+)/.exec(location.search); if (m) dSpecGain = parseFloat(m[1]); }
function _specGainChunk() {
  if (Math.abs(dSpecGain - 1.0) < 0.001) return '';
  const g = dSpecGain.toFixed(3);
  return '\n' + ['reflectedLight.directSpecular *= ' + g + ';', 'reflectedLight.indirectSpecular *= ' + g + ';'].join('\n');
}
// 조합 순서도 게임과 같다: 기본 → 러프니스 → 깊이 → 전체 밝기.
// 반드시 머티리얼을 하나라도 만들기 전에 갈아끼워야 한다 — three의 프로그램 캐시 키에는
// 청크 내용이 안 들어가서, 나중에 바꾸면 예전 프로그램이 그대로 재사용된다.
{
  const _toonBaseChunk = THREE.ShaderChunk.lights_fragment_end;
  const _roughCode = _roughSpecChunk(), _depthCode = _depthLitChunk(), _gainCode = _specGainChunk();
  if (_roughCode || _depthCode || _gainCode) {
    THREE.ShaderChunk.lights_fragment_end = _toonBaseChunk + _roughCode + _depthCode + _gainCode;
  }
}

// ---------- 저해상도 버퍼(게임 computeLowRes 그대로) ----------
const PIXEL_SCALE = 2;
// 게임과 같은 값·같은 플래그. 작을수록 픽셀이 커진다(720 기준 360=배율 2, 288=2.5, 240=3).
// v739~v740 에서 게임이 360 → 288 로 올렸다. 여기가 어긋나면 '1.0× = 게임 실제 픽셀 크기'가 거짓말이 된다.
const PX_FIXED_H = parseInt((location.search.match(/[?&]pxh=(\d+)/) || [])[1], 10) || 320;
function computeLowRes(w, h) {
  if (PX_MODE) {
    const lh = PX_FIXED_H;
    return [Math.max(64, Math.round(lh * (w / Math.max(1, h)))), lh];
  }
  return [Math.max(320, Math.floor(w / PIXEL_SCALE)), Math.max(240, Math.floor(h / PIXEL_SCALE))];
}
const _lr0 = computeLowRes(viewW(), viewH());
let lowResW = _lr0[0], lowResH = _lr0[1];

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(viewW(), viewH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PX_MODE ? THREE.BasicShadowMap : THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;

const rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const rtNormal = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rtNormal.texture.generateMipmaps = false;
rtNormal.stencilBuffer = false;
const normalMaterial = new THREE.MeshNormalMaterial();
// 피부 표식용. 노멀 버퍼에 순수 빨강을 찍어 두면 포스트 셰이더가 모서리 하이라이트에서 뺀다.
const SKIN_TAG_LAYER = 1;
const skinTagMaterial = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }',
});

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x05070c) },
    uStrength: { value: 1.0 },
    uSat: { value: 1.14 },
    uCon: { value: 1.07 },
    uSplit: { value: new THREE.Vector3(0.045, 0.012, -0.05) },
    uVig: { value: 0.5 },
    uFocusY: { value: 0.52 },
    uFocusW: { value: 0.18 },
    uBlurMax: { value: 1.5 },
    uTiltOn: { value: PX_MODE ? 0.0 : 1.0 },
    tBloom: { value: null },
    uBloomStr: { value: 0.85 },
    uAerialColor: { value: new THREE.Color(0x1a2416) },
    uAerialStr: { value: 0.45 },
    uAerialDesat: { value: 0.7 },
    uAerialNear: { value: 0.5 },
    uAerialFar: { value: 0.8 },
    uShadowColor: { value: new THREE.Color(0x203a2c) },
    uShadowStr: { value: 0.42 },
    uShadowThresh: { value: 0.42 },
    uShadowSteps: { value: 0.0 },
    uNear: { value: 0.1 },
    uFar: { value: 200 },
    uPx: { value: PX_MODE ? 1.0 : 0.0 },
    uPxThresh: { value: 0.10 },
    uPxThreshK: { value: 0.035 },
    uPxDark: { value: 0.55 },
    tNormal: { value: rtNormal.texture },
    uSubpixel: { value: new THREE.Vector2(0, 0) },
    uPxNormalStr: { value: 0.30 },
    uPxNormalBias: { value: new THREE.Vector3(1, 1, 1) },
    uQuant: { value: 32.0 },
    uDither: { value: 0.9 },
    uQuantGamma: { value: 2.2 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  // 게임 quadMat 프래그먼트 셰이더 그대로. 구름 그림자(uCloud*)만 뺐다 —
  // 던전·쉼터에서는 게임도 uCloudStr=0 으로 통째로 건너뛰므로 결과가 같다.
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uSat;
    uniform float uCon;
    uniform vec3 uSplit;
    uniform float uVig;
    uniform float uFocusY;
    uniform float uFocusW;
    uniform float uBlurMax;
    uniform float uTiltOn;
    uniform sampler2D tBloom;
    uniform float uBloomStr;
    uniform vec3 uAerialColor;
    uniform float uAerialStr;
    uniform float uAerialDesat;
    uniform float uAerialNear;
    uniform float uAerialFar;
    uniform vec3 uShadowColor;
    uniform float uShadowStr;
    uniform float uShadowThresh;
    uniform float uShadowSteps;
    uniform float uNear;
    uniform float uFar;
    uniform float uPx;
    uniform float uPxThresh;
    uniform float uPxThreshK;
    uniform float uPxDark;
    uniform float uQuant;
    uniform float uDither;
    uniform float uQuantGamma;
    uniform sampler2D tNormal;
    uniform vec2 uSubpixel;
    uniform float uPxNormalStr;
    uniform vec3 uPxNormalBias;
    varying vec2 vUv;
    vec3 nrmAt(vec2 o) { return texture2D(tNormal, vUv + uSubpixel + o * uTexel).rgb * 2.0 - 1.0; }
    bool isSkinTag(vec3 n) { return n.r > 0.7 && n.g < -0.7 && n.b < -0.7; }
    bool isVegTag(vec3 n) { return n.g > 0.7 && n.r < -0.7 && n.b < -0.7; }
    float outlineAt() { return texture2D(tNormal, vUv + uSubpixel).a; }
    float nEdge(vec2 o, float dep, vec3 n, float dNb) {
      vec3 m = nrmAt(o);
      if (isSkinTag(m) || isVegTag(m)) return 0.0;
      float depthDiff = dNb - dep;
      float normalDiff = dot(n - m, uPxNormalBias);
      float normalInd = clamp(smoothstep(-0.01, 0.01, normalDiff), 0.0, 1.0);
      float depthInd = clamp(sign(depthDiff * 0.25 + 0.0025), 0.0, 1.0);
      return distance(n, m) * depthInd * normalInd;
    }
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec2 uv = vUv + uSubpixel;
      vec4 col = texture2D(tColor, uv);
      float fdy = abs(vUv.y - uFocusY);
      float blur = smoothstep(uFocusW, uFocusW + 0.28, fdy) * uTiltOn;
      if (blur > 0.003) {
        vec2 br = uTexel * (blur * uBlurMax);
        vec3 acc = col.rgb * 0.25;
        acc += texture2D(tColor, uv + vec2( br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x,  br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2(-br.x, -br.y)).rgb * 0.125;
        acc += texture2D(tColor, uv + vec2( br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(-br.x * 1.8, 0.0)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0,  br.y * 1.8)).rgb * 0.0625;
        acc += texture2D(tColor, uv + vec2(0.0, -br.y * 1.8)).rgb * 0.0625;
        col.rgb = acc;
      }
      float c  = linearizeDepth(texture2D(tDepth, uv).x);
      float l = linearizeDepth(texture2D(tDepth, uv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, uv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, uv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, uv + vec2(0.0, -uTexel.y)).x);
      vec3 graded;
      if (uPx > 0.5) {
        float d = clamp(l - c, 0.0, 1.0) + clamp(r - c, 0.0, 1.0)
                + clamp(u - c, 0.0, 1.0) + clamp(dn - c, 0.0, 1.0);
        float t = uPxThresh + c * uPxThreshK;
        float dei = floor(smoothstep(t, t * 1.65, d) * 2.0) / 2.0;
        dei *= uStrength * (1.0 - blur * 0.85);
        dei *= step(0.5, outlineAt());
        float nei = 0.0;
        if (uPxNormalStr > 0.001) {
          vec3 n = nrmAt(vec2(0.0));
          if (!isSkinTag(n) && !isVegTag(n)) {
            nei += nEdge(vec2( 0.0, -1.0), c, n, dn);
            nei += nEdge(vec2( 0.0,  1.0), c, n, u);
            nei += nEdge(vec2(-1.0,  0.0), c, n, l);
            nei += nEdge(vec2( 1.0,  0.0), c, n, r);
            nei = step(0.1, nei);
            float lumIn = dot(col.rgb, vec3(0.299, 0.587, 0.114));
            nei *= smoothstep(0.04, 0.22, lumIn);
          }
        }
        float k = dei > 0.0 ? (1.0 - uPxDark * clamp(dei, 0.0, 1.0))
                            : (1.0 + uPxNormalStr * nei);
        graded = col.rgb * k;
      } else {
        float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
        float thresh = 0.25 + c * 0.05;
        float line = smoothstep(thresh, thresh * 1.65, edge) * uStrength;
        line *= (1.0 - blur * 0.85);
        graded = mix(col.rgb, uOutline, clamp(line, 0.0, 1.0));
      }
      float lum = dot(graded, vec3(0.299, 0.587, 0.114));

// 맥동은 **CPU 에서 정점을 갱신**한다. 다른 방법 둘은 이 파이프라인에서 못 쓴다:
//  · 그룹째 스케일 — 원점에서 떨어진 핵이 제자리에서 부푸는 대신 원점 쪽으로 미끄러진다.
//  · 정점 셰이더 — 색 패스만 흔들리고 노멀·그림자 패스는 제자리라 외곽선이 형상과 어긋난다.
// 정점이 132개뿐이라 CPU 갱신 비용은 무시할 수 있다.
const glowMesh = (() => {
  const geos = [], ctrs = [];
  glowNodes.forEach((g) => {
    const gg = g.geometry.clone();
    gg.translate(g.position.x, g.position.y, g.position.z);
    geos.push(gg); ctrs.push(g.position.clone());
    bloomGrp.remove(g);
  });
  const geo = mergeGeos(geos);
  const pos = geo.attributes.position;
  const base = new Float32Array(pos.array);     // 원래 정점 위치
  const ctr = new Float32Array(pos.count * 3);  // 그 정점이 속한 핵의 중심
  const ph = new Float32Array(pos.count);       // 핵마다 다른 위상(예전의 인덱스 i)
  let off = 0;
  geos.forEach((gg, i) => {
    const n = gg.attributes.position.count;
    for (let k = 0; k < n; k++) {
      ctr[(off + k) * 3] = ctrs[i].x; ctr[(off + k) * 3 + 1] = ctrs[i].y; ctr[(off + k) * 3 + 2] = ctrs[i].z;
      ph[off + k] = i;
    }
    off += n;
  });
  const m = sh(new THREE.Mesh(geo, glowMat));
  m.userData.pulse = { base, ctr, ph, pos };
  bloomGrp.add(m);
  return m;
})();
// t 를 주면 그 시점의 맥동을, null 이면 기준 형태(배율 1)를 만든다.
function setGlowPulse(t) {
  const u = glowMesh.userData.pulse, p = u.pos, a = p.array;
  for (let k = 0; k < p.count; k++) {
    const s = (t === null) ? 1 : 1 + Math.sin(t * 2.4 + u.ph[k]) * 0.10;
    a[k * 3]     = u.ctr[k * 3]     + (u.base[k * 3]     - u.ctr[k * 3])     * s;
    a[k * 3 + 1] = u.ctr[k * 3 + 1] + (u.base[k * 3 + 1] - u.ctr[k * 3 + 1]) * s;
    a[k * 3 + 2] = u.ctr[k * 3 + 2] + (u.base[k * 3 + 2] - u.ctr[k * 3 + 2]) * s;
  }
  p.needsUpdate = true;
}

function kiteGeometry(hw, top, bot, depth) {
  const sp = new THREE.Shape();
  sp.moveTo(0, top);
  sp.bezierCurveTo(hw * 0.90, top, hw * 1.00, top * 0.42, hw * 0.97, top * 0.10);
  sp.bezierCurveTo(hw * 0.93, bot * 0.32, hw * 0.54, bot * 0.70, 0, bot);
  sp.bezierCurveTo(-hw * 0.54, bot * 0.70, -hw * 0.93, bot * 0.32, -hw * 0.97, top * 0.10);
  sp.bezierCurveTo(-hw * 1.00, top * 0.42, -hw * 0.90, top, 0, top);
  const g = new THREE.ExtrudeGeometry(sp, {
    depth: depth, bevelEnabled: true, bevelThickness: depth * 0.4,
    bevelSize: 0.04, bevelSegments: 1, curveSegments: 5
  });
  g.translate(0, 0, -depth / 2);
  return g;
}

let dragging = false, lastX = 0, lastY = 0, pinchD = 0, pinching = false;
const ZOOM_MIN = 1.0, ZOOM_MAX = 12.0;   // 1.0 = 게임에서 실제로 보이는 픽셀 크기
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.01;
  camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.01));
  lastX = e.clientX; lastY = e.clientY; updateCam();
});
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * Math.exp(-e.deltaY * 0.0015)));
  applyAdaptiveFOV(); updateVer();
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) { dragging = true; pinching = false; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  else if (e.touches.length === 2) { pinching = true; dragging = false; pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinching && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camZoom * (d / Math.max(1, pinchD))));
    pinchD = d; applyAdaptiveFOV(); updateVer();
  } else if (dragging && e.touches.length === 1) {
    const t = e.touches[0];
    camYaw -= (t.clientX - lastX) * 0.01;
    camPitch = Math.max(-1.2, Math.min(1.4, camPitch + (t.clientY - lastY) * 0.01));
    lastX = t.clientX; lastY = t.clientY; updateCam();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => { if (e.touches.length === 0) { dragging = false; pinching = false; } }, { passive: false });

document.getElementById('walkBtn').addEventListener('click', e => { walking = !walking; e.target.classList.toggle('on', walking); });
document.getElementById('roarBtn').addEventListener('click', e => { roaring = !roaring; e.target.classList.toggle('on', roaring); if (!roaring) roarPhase = 0; });
document.getElementById('slashBtn').addEventListener('click', () => { if (slashPhase < 0) slashPhase = 0; });
document.getElementById('guardBtn').addEventListener('click', e => { guarding = !guarding; e.target.classList.toggle('on', guarding); });
// 게임은 몬스터 그림자를 끄고 블롭으로 대신한다(성능). 스튜디오에서는 형태가 읽히도록 켠다.
function applyShadowMode(on) {
  studioShadow = on;
  for (const o of _shadowCasters) o.castShadow = on;
  kingObj.traverse(o => { if (o.isMesh && o !== disc && o.material !== blobMatShared) o.castShadow = on; });
  const el = document.getElementById('shadowBtn');
  el.textContent = '그림자: ' + (on ? '켬' : '끔');
  el.classList.toggle('on', on);
}
document.getElementById('actBtn').addEventListener('click', e => {
  actIdx = (actIdx + 1) % ACTS.length; applyAct(actIdx); e.target.textContent = ACTS[actIdx].name;
  applyShadowMode(!!ACTS[actIdx].studio);   // 막으로 넘어가면 게임과 같이 그림자를 끈다
  updateVer();
});
document.getElementById('shadowBtn').addEventListener('click', () => applyShadowMode(!studioShadow));
document.getElementById('gridBtn').addEventListener('click', e => { gridGroup.visible = !gridGroup.visible; e.target.classList.toggle('on', gridGroup.visible); });
document.getElementById('resetBtn').addEventListener('click', () => {
  camZoom = 3.2; camYaw = GAME_YAW; camPitch = GAME_PITCH; applyAdaptiveFOV(); updateCam(); updateVer();
});

function onResize() {
  applyAdaptiveFOV();
  renderer.setSize(viewW(), viewH());
  const lr = computeLowRes(viewW(), viewH());
  lowResW = lr[0]; lowResH = lr[1];
  rt.setSize(lowResW, lowResH);
  // r128의 setSize는 depthTexture를 안 줄인다 — 손으로 맞추지 않으면 리사이즈 후 외곽선이 깨진다.
  rt.depthTexture.image.width = lowResW; rt.depthTexture.image.height = lowResH; rt.depthTexture.needsUpdate = true;
  rtNormal.setSize(lowResW, lowResH);
  bloomW = Math.max(160, Math.floor(lowResW / 2)); bloomH = Math.max(120, Math.floor(lowResH / 2));
  rtBloom.setSize(bloomW, bloomH);
  bloomMat.uniforms.uTexel.value.set(1 / bloomW, 1 / bloomH);
  quadMat.uniforms.uTexel.value.set(1 / lowResW, 1 / lowResH);
  updateCam();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  // 어떤 이유로든 확대되어 화면이 잘려 보이면(더블탭 확대 등) 다시 맞춘다.
  window.visualViewport.addEventListener('scroll', onResize);
}

if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
  document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대축소';
}
applyShadowMode(true);   // 시작은 스튜디오 모드 — 형태를 보라고 그림자를 켠 채로 연다
updateVer();

const clock = new THREE.Clock();
const lerp = (o, k, tgt, sp, dt) => { o[k] += (tgt - o[k]) * Math.min(1, dt * sp); };

// 기본 자세
const REST = {
  rArmX: 0.10, rArmZ: 0.22, rElbX: -0.30,
  lArmX: 0.30, lArmZ: -0.22, lElbX: 1.15
};

function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (autoSpin) { camYaw += dt * 0.32; updateCam(); }

  // 상시: 호흡 · 오염원 맥동 · 눈빛 흔들림
  const breath = Math.sin(t * 0.9);
  torsoGrp.scale.set(1 + breath * 0.012, 1 + breath * 0.008, 1 + breath * 0.014);
  const pulse = 1.1 + Math.sin(t * 2.2) * 0.5 + Math.sin(t * 0.7) * 0.25;
  glowMat.emissiveIntensity = Math.max(0.42, (pulse + 0.9) * 0.386);   // 배수 0.386 = 0.81/2.1
  crackMat.emissiveIntensity = Math.max(0.11, (0.8 + Math.sin(t * 1.7) * 0.4) * 0.325);
  bloomLight.intensity = 0.6 + Math.max(0, pulse) * 0.35;
  eyeMat.emissiveIntensity = 0.29 + Math.sin(t * 2.6) * 0.08;
  setGlowPulse(t);

  // 이동: 무겁게 성큼성큼
  if (walking) walkPhase += dt * 2.6;
  const ws = Math.sin(walkPhase);
  if (walking) {
    lerp(legR.hipGrp.rotation, 'x', -ws * 0.52, 10, dt);
    lerp(legL.hipGrp.rotation, 'x', ws * 0.52, 10, dt);
    lerp(legR.kneeGrp.rotation, 'x', Math.max(0, ws) * 0.62, 10, dt);
    lerp(legL.kneeGrp.rotation, 'x', Math.max(0, -ws) * 0.62, 10, dt);
    lerp(legR.footGrp.rotation, 'x', ws * 0.20, 9, dt);
    lerp(legL.footGrp.rotation, 'x', -ws * 0.20, 9, dt);
    bodyGrp.position.y = Math.abs(Math.sin(walkPhase * 2)) * 0.05;
    lerp(torsoGrp.rotation, 'y', ws * 0.10, 7, dt);
    lerp(clothGrp.rotation, 'x', -ws * 0.16, 6, dt);
    if (slashPhase < 0) lerp(armR.armGrp.rotation, 'x', REST.rArmX + ws * 0.32, 8, dt);
    if (!guarding) lerp(armL.armGrp.rotation, 'x', REST.lArmX - ws * 0.32, 8, dt);
  } else {
    lerp(legR.hipGrp.rotation, 'x', 0, 8, dt); lerp(legL.hipGrp.rotation, 'x', 0, 8, dt);
    lerp(legR.kneeGrp.rotation, 'x', 0, 8, dt); lerp(legL.kneeGrp.rotation, 'x', 0, 8, dt);
    lerp(legR.footGrp.rotation, 'x', 0, 8, dt); lerp(legL.footGrp.rotation, 'x', 0, 8, dt);
    lerp(bodyGrp.position, 'y', breath * 0.008, 8, dt);
    lerp(clothGrp.rotation, 'x', Math.sin(t * 0.6) * 0.02, 5, dt);
    if (!roaring) lerp(torsoGrp.rotation, 'y', Math.sin(t * 0.45) * 0.03, 5, dt);
    if (slashPhase < 0) lerp(armR.armGrp.rotation, 'x', REST.rArmX, 7, dt);
    if (!guarding) lerp(armL.armGrp.rotation, 'x', REST.lArmX, 7, dt);
  }

  // 방패 방어: 왼팔을 들어 몸 앞을 가림
  if (guarding) {
    lerp(armL.armGrp.rotation, 'x', 0.80, 8, dt);
    lerp(armL.armGrp.rotation, 'z', -0.06, 8, dt);
    lerp(armL.elbowGrp.rotation, 'x', 0.86, 8, dt);
  } else {
    lerp(armL.armGrp.rotation, 'z', REST.lArmZ, 6, dt);
    lerp(armL.elbowGrp.rotation, 'x', REST.lElbX, 6, dt);
  }

  // 베기: 검을 머리 위로 들었다가 대각선으로 내려벤다
  if (slashPhase >= 0) {
    slashPhase += dt;
    if (slashPhase < 0.65) {                    // 들어올림
      const w = slashPhase / 0.65;
      lerp(armR.armGrp.rotation, 'x', REST.rArmX - 2.05 * w, 9, dt);
      lerp(armR.armGrp.rotation, 'z', REST.rArmZ + 0.72 * w, 9, dt);
      lerp(armR.elbowGrp.rotation, 'x', -1.5 * w, 9, dt);
      lerp(torsoGrp.rotation, 'y', -0.28 * w, 8, dt);
    } else if (slashPhase < 0.95) {             // 내려베기
      lerp(armR.armGrp.rotation, 'x', 0.95, 30, dt);
      lerp(armR.armGrp.rotation, 'z', -0.06, 26, dt);
      lerp(armR.elbowGrp.rotation, 'x', -0.12, 30, dt);
      lerp(torsoGrp.rotation, 'y', 0.34, 26, dt);
      lerp(torsoGrp.rotation, 'x', 0.16, 22, dt);
    } else if (slashPhase < 1.75) {             // 여운
      lerp(armR.armGrp.rotation, 'x', REST.rArmX, 5, dt);
      lerp(armR.armGrp.rotation, 'z', REST.rArmZ, 5, dt);
      lerp(armR.elbowGrp.rotation, 'x', REST.rElbX, 5, dt);
      lerp(torsoGrp.rotation, 'y', 0, 5, dt);
      lerp(torsoGrp.rotation, 'x', 0, 5, dt);
    } else { slashPhase = -1; }
  } else {
    lerp(armR.armGrp.rotation, 'z', REST.rArmZ, 6, dt);
    lerp(armR.elbowGrp.rotation, 'x', REST.rElbX, 6, dt);
    if (!roaring) lerp(torsoGrp.rotation, 'x', 0, 6, dt);
  }

  // 포효: 고개를 젖히고 양팔을 벌린 채 오염원이 폭주
  if (roaring) {
    roarPhase += dt;
    const cyc = roarPhase % 3.0;
    if (cyc < 0.45) {
      const w = cyc / 0.45;
      lerp(headGrp.rotation, 'x', -0.12 * w, 8, dt);
      lerp(torsoGrp.rotation, 'x', 0.10 * w, 8, dt);
    } else if (cyc < 2.2) {
      lerp(headGrp.rotation, 'x', 0.42, 9, dt);
      lerp(torsoGrp.rotation, 'x', -0.16, 8, dt);
      torsoGrp.rotation.z = Math.sin(t * 30) * 0.012;
      if (slashPhase < 0) { lerp(armR.armGrp.rotation, 'z', 0.78, 7, dt); }
      if (!guarding) { lerp(armL.armGrp.rotation, 'z', -0.78, 7, dt); }
      glowMat.emissiveIntensity = 1.00;   // 포효 때도 같은 배수를 유지한다
      bloomLight.intensity = 1.6;
      eyeMat.emissiveIntensity = 0.72;
      crackMat.emissiveIntensity = 0.62;
    } else {
      lerp(headGrp.rotation, 'x', 0, 6, dt);
      lerp(torsoGrp.rotation, 'x', 0, 6, dt);
      torsoGrp.rotation.z = 0;
    }
  } else {
    lerp(headGrp.rotation, 'x', Math.sin(t * 0.5) * 0.02, 5, dt);
    lerp(headGrp.rotation, 'y', Math.sin(t * 0.33) * 0.05, 4, dt);
    torsoGrp.rotation.z = 0;
  }

  // 게임과 같은 렌더 경로: 픽셀 스냅 → 저해상도 색·깊이 → 노멀 패스(피부 표식) → 블룸 → 합성
  renderWithPost(scene);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
