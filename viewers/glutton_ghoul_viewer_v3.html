<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>거대 구울(폭식 구울) 뷰어 v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; height:100dvh; overflow:hidden; background:#11131a; font-family: sans-serif; overscroll-behavior:none; }
  #app { width:100vw; height:100vh; display:block; touch-action: none; }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px; pointer-events:none; }
  .btn { pointer-events:auto; background:rgba(20,24,34,0.85); color:#e2e8f0; border:1px solid #4a5568; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:active { background:#2d3748; }
  .btn.on { border-color:#d7a0b0; color:#f5d8e0; }
  #ver { position:fixed; right:10px; top:10px; color:#718096; font-size:11px; }
  #hint { position:fixed; left:0; right:0; top:12px; text-align:center; color:#a0aec0; font-size:12px; }
  @media (max-width: 520px) {
    .ui { gap:6px; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
    .btn { padding:8px 10px; font-size:12px; border-radius:6px; }
    #hint { font-size:11px; top:30px; }
    #ver { font-size:10px; top:8px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hint">드래그: 회전 · 휠/핀치: 확대축소</div>
<div class="ui">
  <button class="btn" id="spinBtn">자동회전: 켬</button>
  <button class="btn" id="walkBtn">이동</button>
  <button class="btn" id="roarBtn">포효</button>
  <button class="btn" id="slamBtn">내려찍기</button>
  <button class="btn" id="devourBtn">삼키기</button>
  <button class="btn" id="spewBtn">위액 뿜기</button>
  <button class="btn" id="p2Btn">2페이즈</button>
  <button class="btn" id="bgBtn">배경 전환</button>
  <button class="btn" id="gridBtn">그리드</button>
  <button class="btn" id="resetBtn">시점 리셋</button>
</div>
<div id="ver">glutton_ghoul_viewer v3</div>

<!-- 게임 index.html에 동봉된 것과 같은 three.js r128. CDN을 쓰면 여기서 렌더 검증을 못 하고,
     게임과 버전이 어긋나면 뷰어에서 맞춘 모양이 게임에서 달라진다. -->
<script src="three.r128.min.js"></script>
<script>
const canvas = document.getElementById('app');
// === 게임과 동일한 렌더 파이프라인: 저해상도 픽셀화 + 깊이 기반 검은 외곽선 ===
const PIXEL_SCALE = 3;
// 저해상도 버퍼는 반드시 '화면과 같은 가로세로 비율'이어야 한다.
// (가로 320 / 세로 240 으로 각각 하한을 두면 세로 화면에서 4:3 버퍼가 만들어져
//  화면에 늘려 붙일 때 픽셀이 세로로 늘어나고 모델이 찌그러져 보인다)
function calcLowRes() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const lh = Math.min(600, Math.max(240, Math.floor(h / PIXEL_SCALE)));
  return [Math.max(1, Math.round(lh * (w / h))), lh];
}
let [lowResW, lowResH] = calcLowRes();

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;

let rt = new THREE.WebGLRenderTarget(lowResW, lowResH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
rt.depthTexture = new THREE.DepthTexture(lowResW, lowResH);
rt.depthTexture.format = THREE.DepthFormat;
rt.depthTexture.type = THREE.UnsignedIntType;

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    uTexel: { value: new THREE.Vector2(1 / lowResW, 1 / lowResH) },
    uOutline: { value: new THREE.Color(0x06080a) },
    uStrength: { value: 1.0 },
    uNear: { value: 0.1 },
    uFar: { value: 30 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform vec2 uTexel;
    uniform vec3 uOutline;
    uniform float uStrength;
    uniform float uNear;
    uniform float uFar;
    varying vec2 vUv;
    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    void main() {
      vec4 col = texture2D(tColor, vUv);
      float c  = linearizeDepth(texture2D(tDepth, vUv).x);
      float l = linearizeDepth(texture2D(tDepth, vUv + vec2(-uTexel.x, 0.0)).x);
      float r = linearizeDepth(texture2D(tDepth, vUv + vec2( uTexel.x, 0.0)).x);
      float u = linearizeDepth(texture2D(tDepth, vUv + vec2(0.0,  uTexel.y)).x);
      float dn= linearizeDepth(texture2D(tDepth, vUv + vec2(0.0, -uTexel.y)).x);
      float edge = abs(c - l) + abs(c - r) + abs(c - u) + abs(c - dn);
      float thresh = 0.05 + c * 0.04;
      float line = smoothstep(thresh, thresh * 2.2, edge) * uStrength;
      gl_FragColor = vec4(mix(col.rgb, uOutline, clamp(line, 0.0, 1.0)), 1.0);
    }
  `,
  depthTest: false, depthWrite: false
});
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat));

const scene = new THREE.Scene();
const bgColors = [0x11101a, 0x1a1620, 0x0e1014, 0x272430];
let bgIdx = 0; scene.background = new THREE.Color(bgColors[bgIdx]);
scene.fog = new THREE.Fog(bgColors[bgIdx], 12, 30);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 30);
// 모델 전체(폭 4.4 / 높이 3.9)를 가로·세로 어느 쪽으로도 자르지 않는 거리 계산
const FIT_W = 5.6, FIT_H = 6.4;
function fitDistance() {
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  return Math.min(17, Math.max(4.5, Math.max((FIT_H / 2) / Math.tan(vFov / 2), (FIT_W / 2) / Math.tan(hFov / 2))));
}
// 모델 정면은 로컬 -z 이고 ghoulObj 를 π 돌려 놓으므로 월드 정면은 +z 다.
// 여기에 +π 를 더하면 카메라가 -z 쪽에 서서 등을 비춘다(예전 값이 그랬다) — 배와 입이 보이도록 0.5 로 둔다.
const CAM_YAW0 = 0.5, CAM_PITCH0 = 0.06;
let camDist = fitDistance(), camYaw = CAM_YAW0, camPitch = CAM_PITCH0;
const target = new THREE.Vector3(0, 1.7, 0);
function updateCam() {
  // 세로 화면에서는 카메라가 멀어지므로 안개가 모델을 배경색으로 덮어버린다.
  // 안개 범위를 카메라 거리에 맞춰 항상 모델 뒤쪽에 오도록 조정
  scene.fog.near = camDist * 1.15; scene.fog.far = camDist * 2.8;
  camera.position.set(
    target.x + camDist * Math.cos(camPitch) * Math.sin(camYaw),
    target.y + camDist * Math.sin(camPitch),
    target.z + camDist * Math.cos(camPitch) * Math.cos(camYaw)
  );
  camera.lookAt(target);
}
updateCam();

// 조명: 원화의 파스텔 톤(부드러운 상단광 + 차가운 림) 을 던전 톤에 맞게
scene.add(new THREE.AmbientLight(0x6b6070, 0.72));
const key = new THREE.DirectionalLight(0xfff0e2, 1.15); key.position.set(-4, 10, -5);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 26;
key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 4.5; key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0008; scene.add(key);
const rim = new THREE.DirectionalLight(0x6f86c0, 0.6); rim.position.set(5, 3, 5); scene.add(rim);
const under = new THREE.PointLight(0xb07a86, 0.45, 8, 2); under.position.set(0, 0.3, -1.0); scene.add(under);

// ===== 게임과 동일한 머티리얼/헬퍼 =====
function getLowPolyMat(colorHex, isMetal = false) {
  return new THREE.MeshStandardMaterial({ color: colorHex, flatShading: true, roughness: isMetal ? 0.7 : 0.94, metalness: isMetal ? 0.25 : 0.0 });
}
// 결정적 난수(같은 형태 재현)
let _seed = 20260730;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function jitterGeometry(geometry, amount) {
  const pos = geometry.attributes.position;
  const offsets = new Map();
  const key = (x, y, z) => x.toFixed(3) + ',' + y.toFixed(3) + ',' + z.toFixed(3);
  for (let i = 0; i < pos.count; i++) {
    const k = key(pos.getX(i), pos.getY(i), pos.getZ(i));
    let off = offsets.get(k);
    if (!off) { off = [(rnd() - 0.5) * amount, (rnd() - 0.5) * amount, (rnd() - 0.5) * amount]; offsets.set(k, off); }
    pos.setXYZ(i, pos.getX(i) + off[0], pos.getY(i) + off[1], pos.getZ(i) + off[2]);
  }
  geometry.computeVertexNormals(); return geometry;
}
function sh(o) { o.castShadow = true; o.receiveShadow = true; return o; }

// ===== 거대 구울 팔레트 =====
// 원화 그라데이션: 발밑 청회색 → 자주 → 상부 분홍 → 머리 꼭대기 밝은 분홍
const bandCols = [0x69707f, 0x79798d, 0x8a7d97, 0x9c7f9a, 0xb0839c, 0xc98aa4, 0xe097aa, 0xffb0bc];
const bandMats = bandCols.map(c => getLowPolyMat(c));
const H_LO = 0.1, H_HI = 3.3;
function fleshMat(y, vary = 1) {
  let t = (y - H_LO) / (H_HI - H_LO); t = Math.max(0, Math.min(1, t));
  let i = Math.round(t * (bandMats.length - 1)) + Math.round((rnd() - 0.5) * 2 * vary);
  i = Math.max(0, Math.min(bandMats.length - 1, i));
  return bandMats[i];
}
const bellyMat  = getLowPolyMat(0xf6dfa2);   // 팽팽한 크림색 배
const bellyLit  = getLowPolyMat(0xfff0c4);   // 배 하이라이트
const bellyDk   = getLowPolyMat(0xd2b476);   // 배 음영/주름
const bellyGrn  = getLowPolyMat(0xc4c088);   // 배 아래 변색(누런 초록빛)
const mouthMat  = getLowPolyMat(0x7a2634);   // 입속
const gumMat    = getLowPolyMat(0xa84552);   // 잇몸
const tongueMat = getLowPolyMat(0xc86b78);   // 혀
const teethMat  = getLowPolyMat(0xd9c076);   // 누런 이빨
const clawMat   = getLowPolyMat(0x555c69);   // 발톱/손톱
const spikeMat  = getLowPolyMat(0x35333f);   // 검은 가시
const sludgeMat = getLowPolyMat(0x8e8592);   // 바닥 찌꺼기
const soreMat   = new THREE.MeshStandardMaterial({ color: 0xd9606f, emissive: 0xc03048, emissiveIntensity: 0.28, roughness: 0.6, flatShading: true });
const eyeMat    = new THREE.MeshStandardMaterial({ color: 0xffdc8a, emissive: 0xffa020, emissiveIntensity: 1.2, roughness: 0.4 });
const droolMat  = new THREE.MeshStandardMaterial({ color: 0xe6dcc0, transparent: true, opacity: 0.55, roughness: 0.3, flatShading: true });
const bileMat   = new THREE.MeshStandardMaterial({ color: 0xa9c24a, emissive: 0x6d8f22, emissiveIntensity: 0.75, roughness: 0.45, flatShading: true });   // 위액
const bilePool  = new THREE.MeshStandardMaterial({ color: 0x8aa838, emissive: 0x5c7c16, emissiveIntensity: 0.55, roughness: 0.6, flatShading: true, transparent: true, opacity: 0.92 });
const mawInner  = new THREE.MeshStandardMaterial({ color: 0x6e1f2c, emissive: 0x8a1020, emissiveIntensity: 0.35, roughness: 0.6, flatShading: true });   // 배 속
const gutMat    = getLowPolyMat(0x4e1f29);   // 이빨 사이로 비치는 어두운 뱃속
const fangMat   = getLowPolyMat(0xf2ecd8);   // 배를 감싼 상아빛 이빨
const fangDk    = getLowPolyMat(0xd6cdb0);

const ghoulObj = new THREE.Group(); ghoulObj.rotation.y = Math.PI; scene.add(ghoulObj);
const bodyGrp = new THREE.Group(); ghoulObj.add(bodyGrp);

// ===== 살덩이 헬퍼 =====
// 울룩불룩한 종양 혹 하나
function lump(r, mat, detail) {
  const m = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail === undefined ? 0 : detail), mat));
  jitterGeometry(m.geometry, r * 0.30);
  return m;
}
// 타원체 표면을 종양 혹으로 뒤덮음(원화의 컬리플라워 살덩이 질감)
function tumorShell(parent, o) {
  const out = [];
  const n = o.count;
  for (let i = 0; i < n; i++) {
    const k = i + 0.5;
    const phi = Math.acos(1 - 2 * k / n);
    const th = Math.PI * (1 + Math.sqrt(5)) * k;
    const ux = Math.sin(phi) * Math.cos(th), uy = Math.cos(phi), uz = Math.sin(phi) * Math.sin(th);
    const jr = 0.90 + rnd() * 0.18;
    const x = o.cx + ux * o.rx * jr, y = o.cy + uy * o.ry * jr, z = o.cz + uz * o.rz * jr;
    if (o.skip && o.skip(x, y, z)) continue;
    const r = o.rMin + rnd() * (o.rMax - o.rMin);
    const m = lump(r, o.mat || fleshMat((o.yBase || 0) + y), rnd() > 0.72 ? 1 : 0);
    m.position.set(x, y, z);
    m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
    m.scale.set(1 + rnd() * 0.35, 0.8 + rnd() * 0.4, 1 + rnd() * 0.35);
    m.userData.bs = m.scale.clone();
    parent.add(m); out.push(m);
  }
  return out;
}
// 가는 균열/정맥 라인
function addSeam(parent, from, to, w, mat) {
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
  const len = a.distanceTo(b);
  const seg = sh(new THREE.Mesh(new THREE.BoxGeometry(w, len, w * 0.8), mat));
  seg.position.copy(a).add(b).multiplyScalar(0.5);
  seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  parent.add(seg);
}
// 뾰족한 가시(어깨/등)
function addSpike(parent, x, y, z, h, rx, rz) {
  const s = sh(new THREE.Mesh(new THREE.ConeGeometry(h * 0.22, h, 4), spikeMat));
  s.position.set(x, y, z); s.rotation.set(rx, rnd() * 3, rz); parent.add(s); return s;
}

// ============================================================
//  거대 구울(폭식 구울) — 원화 기준
//  · 몸 전체가 종양처럼 뭉친 살덩이, 아래는 청회색 → 위로 갈수록 분홍
//  · 정면 중앙에 알처럼 팽팽한 거대 크림색 배
//  · 머리는 어깨에 파묻힌 채 누런 이빨의 거대한 입을 쩍 벌림(침 흘림)
//  · 굵은 팔이 바닥까지 늘어지고 발톱이 땅에 닿음
//  · 짧고 굵은 다리는 배에 가려 거의 보이지 않음
//  정면은 -z 방향
// ============================================================

// 배 부피(이 안쪽에는 살덩이를 배치하지 않음)
const BELLY_C = { x: 0, y: 1.38, z: -0.52 };
function inBelly(x, y, z) {
  const a = (x - BELLY_C.x) / 0.86, b = (y - BELLY_C.y) / 0.86, c = (z - BELLY_C.z) / 0.80;
  return a * a + b * b + c * c < 1.0;
}
// 얼굴 앞(입) 공간 — 살덩이가 얼굴을 덮지 않도록 비움
function inFace(x, y, z) {
  const a = x / 0.74, b = (y - 2.84) / 0.64, c = (z + 0.66) / 0.80;
  return a * a + b * b + c * c < 1.0;
}
// 팔이 늘어질 통로 — 몸통 옆구리를 비워 팔이 실루엣에서 분리되게
function inArmLane(x, y, z) { return Math.abs(x) > 0.98 && y < 2.15; }
const skipAll = (x, y, z) => inBelly(x, y, z) || inFace(x, y, z) || inArmLane(x, y, z);

// ---------- 몸통 코어(살덩이 속을 메우는 덩어리) ----------
const torsoGrp = new THREE.Group(); bodyGrp.add(torsoGrp);
const core = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.92, 2), bandMats[3]));
core.scale.set(0.95, 1.25, 0.82); core.position.set(0, 1.55, 0.10); jitterGeometry(core.geometry, 0.07); torsoGrp.add(core);
const coreLow = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.80, 1), bandMats[1]));
coreLow.scale.set(1.0, 0.72, 0.9); coreLow.position.set(0, 0.78, 0.10); jitterGeometry(coreLow.geometry, 0.07); torsoGrp.add(coreLow);

// ---------- 몸통 전체를 뒤덮는 종양 살덩이(아래 청회색 → 위 분홍) ----------
const bodyLumps = [];
// 엉덩이·허리(넓게 퍼진 하단)
bodyLumps.push(...tumorShell(torsoGrp, {
  cx: 0, cy: 0.80, cz: 0.10, rx: 0.92, ry: 0.52, rz: 0.80,
  count: 46, rMin: 0.20, rMax: 0.34, skip: (x, y, z) => skipAll(x, y, z) || y < 0.26
}));
// 몸통 중단
bodyLumps.push(...tumorShell(torsoGrp, {
  cx: 0, cy: 1.55, cz: 0.10, rx: 0.90, ry: 0.58, rz: 0.78,
  count: 46, rMin: 0.19, rMax: 0.33, skip: skipAll
}));
// 어깨(가장 넓은 부분)
bodyLumps.push(...tumorShell(torsoGrp, {
  cx: 0, cy: 2.26, cz: 0.08, rx: 1.00, ry: 0.54, rz: 0.76,
  count: 52, rMin: 0.19, rMax: 0.32, skip: skipAll
}));
// 어깨 위 봉우리(머리 양옆으로 솟은 분홍 살덩이)
[-1, 1].forEach(s => {
  bodyLumps.push(...tumorShell(torsoGrp, {
    cx: s * 0.64, cy: 2.80, cz: 0.12, rx: 0.36, ry: 0.30, rz: 0.36,
    count: 18, rMin: 0.17, rMax: 0.28, skip: inFace
  }));
});
// 가슴(입 아래 ~ 배 위 사이의 분홍 살 띠)
bodyLumps.push(...tumorShell(torsoGrp, {
  cx: 0, cy: 2.22, cz: -0.54, rx: 0.62, ry: 0.28, rz: 0.30,
  count: 16, rMin: 0.17, rMax: 0.27, skip: inFace
}));
// 등 상단 혹(뒤로 부풀어 오른 살)
bodyLumps.push(...tumorShell(torsoGrp, {
  cx: 0, cy: 2.10, cz: 0.66, rx: 0.60, ry: 0.44, rz: 0.26,
  count: 18, rMin: 0.18, rMax: 0.30
}));

// 감염 정맥/발진
addSeam(torsoGrp, [-0.70, 2.05, 0.45], [-0.90, 1.45, 0.34], 0.024, bandMats[2]);
addSeam(torsoGrp, [0.68, 2.10, 0.48], [0.88, 1.52, 0.36], 0.024, bandMats[2]);
[[-0.88, 1.90, 0.20], [0.90, 1.66, 0.24], [-0.52, 2.92, 0.30], [0.58, 2.86, 0.28], [0, 2.24, 0.82]].forEach(p => {

//  1페이즈: 좌우 이빨이 가운데서 지그재그로 맞물려 배를 덮는다
//  2페이즈: 이빨과 뱃가죽이 한 짝씩 통째로 바깥·앞으로 열리며 뱃속이 드러난다

// 표면을 타고 도는 칼날형 이빨 조각(방향 = 길이축, 표면 법선 = 두께축)
function blade(parent, from, to, w0, w1, thick, mat, org) {
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
  const dir = b.clone().sub(a); const len = dir.length(); dir.normalize();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const nrm = mid.clone().sub(org).normalize();
  const xA = new THREE.Vector3().crossVectors(dir, nrm).normalize();
  const zA = new THREE.Vector3().crossVectors(xA, dir).normalize();
  const g = new THREE.CylinderGeometry(1, 1, len, 5);
  const pos = g.attributes.position;                    // 위쪽은 w1, 아래쪽은 w0 로 테이퍼
  for (let i = 0; i < pos.count; i++) {
    const yy = pos.getY(i), f = (yy + len / 2) / len;
    const w = w0 + (w1 - w0) * f;
    pos.setXYZ(i, pos.getX(i) * w, yy, pos.getZ(i) * w * (thick / w0));
  }
  jitterGeometry(g, w0 * 0.12);
  const m = sh(new THREE.Mesh(g, mat));
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, dir, zA));
  m.position.copy(mid);
  parent.add(m); return m;
}
const CAGE_PIVOT = { x: 0.62, y: BELLY_C.y, z: BELLY_C.z + 0.34 };
const FANG_ROWS = 9;
function makeCageHalf(sgn) {
  const g = new THREE.Group();
  g.position.set(sgn * CAGE_PIVOT.x, CAGE_PIVOT.y, CAGE_PIVOT.z);
  bellyGrp.add(g);
  const org = new THREE.Vector3(BELLY_MID.x - sgn * CAGE_PIVOT.x, 0, BELLY_MID.z - CAGE_PIVOT.z);
  // 이빨 뒤를 받치는 어두운 뱃가죽(이빨 사이로 이것만 비친다)
  const skin = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.72, 1), gutMat));
  skin.scale.set(0.60, 1.02, 0.55);
  skin.position.set(-sgn * 0.32, 0, -0.26);
  jitterGeometry(skin.geometry, 0.05); g.add(skin);
  for (let r = 0; r < FANG_ROWS; r++) {
    // 좌우를 반 칸씩 어긋나게 놓아 가운데서 지그재그로 맞물리게 한다
    const u = (r + (sgn > 0 ? 0.26 : 0.74)) / FANG_ROWS;
    const y = 2.06 - u * 1.48;                       // 위 2.06 → 아래 0.58
    const k = Math.sin(Math.PI * (0.13 + 0.74 * u)); // 배 단면(가운데가 가장 두껍다)
    const hw = 0.30 + 0.56 * k;
    const zf = -0.44 - 0.66 * k;                     // 뱃가죽보다 앞
    // 갈비뼈처럼 가운데가 앞으로 불룩하게 휘도록 두 마디로 나눠 붙인다
    const W = 0.102 + 0.060 * k, TH = 0.068;
    const P = (x, yy, z) => [x - sgn * CAGE_PIVOT.x, yy - CAGE_PIVOT.y, z - CAGE_PIVOT.z];
    const base = P(sgn * hw * 1.06, y, -0.14);
    const midP = P(sgn * hw * 0.42, y - 0.02, zf - 0.06);
    const tipP = P(-sgn * (0.13 + 0.06 * k), y - 0.07 * k, zf + 0.26);
    const mat = r % 2 ? fangMat : fangDk;
    blade(g, base, midP, W, W * 0.88, TH, mat, org);
    blade(g, midP, tipP, W * 0.88, 0.014, TH, mat, org);
    // 이빨 뿌리를 덮는 뼈판
    const root = lump(0.11 + 0.05 * k, fangDk, 0);
    root.scale.set(0.75, 1.35, 0.9);
    root.position.set(base[0], base[1], base[2] + 0.05); g.add(root);
  }
  // 옆구리를 따라 흐르는 뼈 줄기(이빨 뿌리를 잇는다)
  const spine = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.06, 1.60, 6), fangDk));
  spine.position.set(sgn * (0.84 - CAGE_PIVOT.x), 0, -0.14 - CAGE_PIVOT.z);
  spine.rotation.z = -sgn * 0.10; jitterGeometry(spine.geometry, 0.03); g.add(spine);
  return g;
}

function mergeGeos(geos) {
  const list = geos.map(g => (g.index ? g.toNonIndexed() : g));

    mawTongue.rotation.x = Math.sin(t * 1.7) * 0.12;
  }

  // 포효: 머리를 뒤로 젖히고 입을 쩍 벌려 부르르 떪
  if (roaring) {
    roarPhase += dt;
    const cyc = roarPhase % 2.8;
    if (cyc < 0.5) {
      const w = cyc / 0.5;
      lerp(headGrp.rotation, 'x', -0.12 * w, 8, dt);
      lerp(jawGrp.rotation, 'x', JAW_IDLE - 0.12 * w, 8, dt);
    } else if (cyc < 2.1) {
      lerp(headGrp.rotation, 'x', 0.32, 8, dt);
      lerp(jawGrp.rotation, 'x', JAW_ROAR, 9, dt);
      bodyGrp.rotation.z = Math.sin(t * 32) * 0.016;
      eyeMat.emissiveIntensity = 2.3;
      soreMat.emissiveIntensity = 0.8;
      tongue.position.z = -0.40; tongue.rotation.x = -0.35;
      lerp(armR.armGrp.rotation, 'z', 0.42, 6, dt); lerp(armL.armGrp.rotation, 'z', -0.42, 6, dt);
    } else {
      lerp(headGrp.rotation, 'x', 0, 6, dt);
      lerp(jawGrp.rotation, 'x', JAW_IDLE, 6, dt);
      lerp(armR.armGrp.rotation, 'z', 0.20, 5, dt); lerp(armL.armGrp.rotation, 'z', -0.20, 5, dt);
      bodyGrp.rotation.z = 0;
    }
  } else if (devourPhase < 0 && spewPhase < 0) {
    lerp(headGrp.rotation, 'x', 0, 6, dt);
    if (slamPhase < 0) lerp(jawGrp.rotation, 'x', JAW_IDLE + Math.sin(t * 1.1) * 0.06, 6, dt);
    lerp(tongue.position, 'z', -0.34 + Math.sin(t * 0.9) * 0.02, 6, dt);
    lerp(tongue.rotation, 'x', 0, 6, dt);
    if (slamPhase < 0 && !walking) { lerp(armR.armGrp.rotation, 'z', 0.20, 5, dt); lerp(armL.armGrp.rotation, 'z', -0.20, 5, dt); }
  }

  // 1) 저해상도 RT 렌더 → 2) 외곽선 셰이더 출력
  renderer.clear();
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);
  requestAnimationFrame(animate);
}
animate();
</script>
